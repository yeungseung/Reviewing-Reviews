claims_and_evidence:
  core_claim: "수용자는 상대방이 자신을 조작하거나 설득하려는 '의도'를 감지하는 순간 설득 지식(PKM)을 활성화하여 메시지를 해체하고 방어 태세를 갖추며, 조작적 전술에 대해 강한 냉소와 거부를 표출한다."
  verbatim_quotes:
    - original: "When a persuasion attempt is recognized as such, consumers draw on their persuasion knowledge to cope with the attempt and often discount or resist the message."
      translation: "설득 시도가 그러한 것으로 인식될 때, 소비자는 그 시도에 대처하기 위해 자신의 설득 지식을 활용하며, 종종 메시지를 폄하하거나 저항한다."
      citation_location: "p.1, Abstract"

story_application:
  application_idea: "신파나 억지 감정 착취(Unearned Emotion)를 완전히 배제하고, 관객이 '작가가 나를 울리려/감동시키려 작정했구나'라고 눈치채지 못하도록 팩트와 사건의 객관적 축적을 통해 감정이 저절로 차오르게 연출함 (Understatement / Show, Don't Tell)."
  narrative_stage: "Act 3 Climax & Resolution"
  emotional_mechanics:
    trigger: "자연스러운 인과적 귀결"
    build_up: "감정을 강요하지 않는 담담한 사건 묘사"
    peak: "관객 스스로 터뜨리는 내면적 오열/감동"
    release: "진정성(Authenticity)과 깊은 신뢰 형성"
  failure_modes: "슬픈 장면에 과도한 슬로우 모션과 애절한 현악기를 쏟아부어 관객의 PKM을 자극하면 즉각 조롱거리로 전락함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "관객의 비판적 지적 수준이 높은 롱폼 콘텐츠일수록 엄격히 적용됨"
