claims_and_evidence:
  core_claim: "연속형(Serial) 서사는 에피소드 간 인과적 누적(Causal Accumulation)과 영구적 결과(Irreversible Consequences)를 통해 수용자의 인지적 완결 욕구(Drive for Closure)를 극대화하며, 단순한 에피소딕(Episodic) 나열 구조 대비 압도적인 정주행(Binge-watching) 몰입과 팬덤 애착을 창출한다."
  verbatim_quotes:
    - original: "Narrative complexity privileges serial continuity over episodic closure, demanding active viewer engagement to track unfolding causal developments. The pleasure comes from operational aesthetic—admiring how the narrative machinery works."
      translation: "서사적 복잡성은 에피소드적 종결보다 연속적 지속성을 우위에 두며, 전개되는 인과적 발전을 추적하기 위해 수용자의 능동적 관여를 요구한다. 그 쾌감은 서사 장치가 어떻게 작동하는지를 감탄하며 바라보는 '작동 미학(Operational Aesthetic)'에서 나온다."
      citation_location: "pp.17-21, Introduction"

story_application:
  application_idea: "시리즈형 롱폼 콘텐츠나 다회차 기획에서는 각 회차를 독립적 사건으로 끝내지 말고, 이전 회차의 해결이 다음 회차의 치명적 위기로 연결되는 '인과적 누적 장치(Causal Hangover)'를 반드시 삽입해야 연속 시청률을 유지할 수 있음."
  narrative_stage: "Multi-episode Serialization & Season Arc Design"
  emotional_mechanics:
    trigger: "현재 문제의 해결 직후 발생하는 예기치 못한 부작용의 노출"
    build_up: "회차를 거듭하며 누적되는 인과적 파장의 중첩"
    peak: "누적된 모든 인과 사슬이 단번에 맞물려 폭발하는 시즌 피크"
    release: "거대한 서사적 완결성과 성취감(Long-term Closure)"
  failure_modes: "각 에피소드가 이전 사건의 결과를 지워버리는 '리셋 증후군(Status Quo Reset)'을 보이면 관객의 장기적 몰입이 붕괴함"

