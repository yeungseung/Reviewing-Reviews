id: SRC-1996-366
author: Joseph R. Priester & Richard E. Petty
year: 1996
title: 'The gradual threshold model of ambivalence: Relating the positive and negative bases of attitudes to subjective ambivalence'
venue: Journal of Personality and Social Psychology
tier: 1
citation_count: 1420
url: https://doi.org/10.1037/0022-3514.71.3.431
key_contribution: 객관적/잠재적 양가감정(Potential Ambivalence: 상반된 평가 요소의 존재)과 주관적 양가감정(Subjective/Felt Ambivalence: 내적 갈등과 긴장감)을 명확히 구분하고, 대립되는 평가가 일정 역치(Threshold)를 넘어설 때 비로소 주관적 갈등이 폭발하며 체계적 정보 처리와 인지적 숙고(Deliberation)가 점화됨을 '점진적 역치 모델(Gradual Threshold Model)'로 실증.
relevance: 서사에서 단순한 흑백 논리를 넘어 인물과 관객이 깊은 내적 갈등과 지적 숙고에 빠지도록 만드는 양가감정 임계 역치 설계(TAC)의 핵심 학술 토대.
themes:
- '#41 Theme 1'
