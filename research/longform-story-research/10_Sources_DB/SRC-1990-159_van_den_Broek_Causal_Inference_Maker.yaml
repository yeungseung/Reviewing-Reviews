claims_and_evidence:
  core_claim: "수용자의 인과 추론 엔진(Causal Inference Maker, CIM)은 고정된 지식 검색기가 아니라, 매 순간 네 가지 추론 기준(필요성, 충분성, 시간적 선행성, 물리적/심리적 개연성)을 검증하는 '재귀적 질문-응답 순환기(Recursive Question-Answer Loop)'이다. 수용자는 현재 사건의 인과적 설명(Backward Causal Answer)을 찾는 즉시, 작업 기억 내에서 '그렇다면 다음에는 무슨 일이 일어날 것인가?(Forward Consequence Question)'를 강박적으로 투사한다. 점진적 정보 공개(Progressive Disclosure)는 이 순환기를 과열이나 마비 없이 최적 회전 속도로 유지하는 핵심 기술이다."
  verbatim_quotes:
    - original: "Comprehension is an active search for causal coherence... As soon as a backward causal inference provides an answer to the current state, the reader immediately projects forward inferences that generate new questions and expectations."
      translation: "이해는 인과적 일관성을 향한 능동적 탐색이다... 후방 인과 추론이 현재 상태에 대한 해답을 제공하는 즉시, 독자는 즉시 새로운 질문과 기대를 생성하는 전방 추론을 투사한다."
      citation_location: "The Psychology of Learning and Motivation, Vol. 25, p. 175-182"

story_application:
  application_idea: "롱폼 스토리의 '점진적 정보 공개(Progressive Disclosure)와 전방 추론 투사(Forward Projection)' 공식. 질문에 대한 해답을 한꺼번에 전부 털어놓으면 관객의 전방 추론 엔진이 즉시 꺼져버림(Dopamine Flatline). 따라서 해답의 50%만 공개하고, 나머지 50%는 새로운 더 큰 질문의 씨앗(Seed)으로 전환하여 관객이 '그렇다면 다음은?'을 스스로 질문하게 만드는 서사적 페이싱 기법."
  narrative_stage: "Scene Transition & Progressive Information Pacing"
  emotional_mechanics:
    trigger: "현재 상황에 대한 인과적 의문 발생(Backward Inquiry)"
    build_up: "단서 확인을 통한 인과적 해답 획득(Causal Explanation)"
    peak: "해답의 획득과 동시에 뇌내에서 폭발하는 전방 예측 질문(Forward Inference)"
    release: "새로운 질문을 향해 추진력을 얻는 인지적 유창성"
  failure_modes: "모든 정보를 한 번에 다 설명해버려 전방 추론 질문이 전무해지는 '설명 폭탄(Exposition Dump)으로 인한 서사 사망'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "후방 해답이 독자의 상식 및 선행 복선과 인과적 타당성(Causal Plausibility)을 유지해야 함"
