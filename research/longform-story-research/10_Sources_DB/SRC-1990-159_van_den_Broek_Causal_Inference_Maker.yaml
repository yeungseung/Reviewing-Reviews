    target_population: "서사 수용자의 실시간 인과 추론 및 작업 기억 표상 생성 체계"
    relationship_type: "Causal and Dynamic Process Model"
    effect_size: "CIM 모델 기반의 인과적 질문 해결-생성 루프가 수용자의 텍스트 일관성 이해도 r = .82 예측"
