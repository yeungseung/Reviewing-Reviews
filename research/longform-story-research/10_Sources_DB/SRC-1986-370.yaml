id: SRC-1986-370
author: Philip E. Tetlock
year: 1986
title: 'A value pluralism model of ideological reasoning'
venue: Journal of Personality and Social Psychology
tier: 1
citation_count: 1540
url: https://doi.org/10.1037/0022-3514.50.4.819
key_contribution: 가치 다원주의 모델(Value Pluralism Model)을 제창하여, 인간이 단일한 선악 대립이 아니라 본질적으로 상충되는 두 핵심 가치(예: 자유 vs 평등, 안보 vs 인권) 사이의 딜레마에 직면할 때 통합적 복합 사고(Integrative Complexity: 다각적 관점 인식 및 가치 간 절충 탐색)가 최고조에 달함을 실증.
relevance: 서사에서 악당과의 단순한 물리적 대립을 넘어, 정당한 두 가치의 충돌을 통해 관객의 지적 고뇌와 입체적 몰입을 유도하는 가치 충돌 엔진(VCE-v3)의 이론적 준거.
themes:
- '#41 Theme 2'
