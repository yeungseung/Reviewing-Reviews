key_contribution: 일치-연합 모델(CAM-MM) 체계화. 배경음악, 음성 내레이션, 시각 영상 간의 다중감각 통합(Cross-modal Integration) 동역학 규명. 음악과 영상의 정서적 일치는 서사 몰입과 장기 기억을 강화하지만, 고밀도 정보 전달 구간에서 배경음악의 볼륨이나 리듬이 음성 내레이션과 충돌할 경우 작업기억의 음운 루프(Phonological Loop)에 인지적 간섭을 일으켜 정보 이해도가 42% 파괴됨을 입증.
relevance: 정서적 배경음악과 정보 내레이션, 시각 데이터가 충돌하지 않도록 조율하는 시청각 다중감각 통합 아키텍처의 이론적 토대.
