key_contribution: 위험 지각(Perception of Risk)의 심리적 패러다임을 확립. 공포(Dread)와 미지(Unknown)의 요인이 결합될 때 대중이 위험을 비이성적으로 과대평가하거나 미디어의 과장 보도에 환멸을 느낌을 규명.
relevance: 시청자의 개인적 위험(Personal Risk)을 인위적으로 부풀려 위기감을 조장하는 서사 기법의 윤리적 붕괴와 신뢰성 실추를 비판하는 핵심 실증.
