key_contribution: 관객이 이야기 세계 속으로 완전히 빨려 들어가는 서사적 몰입(Narrative Transportation) 개념을
  척도화하고, 1인칭 인물 동화와 3인칭 관점 전이가 현실에 대한 비판적 반박(Counter-arguing)을 잠재우고 신념 변화를 유도함을 실증.
relevance: 관점 전이형 Rehook(Perspective Shift)이 관객의 비판적 의심을 무력화하고 깊은 서사적 동화를 유지시키는 원리
  규명.
