claims_and_evidence:
  core_claim: "반복적인 상호작용(Repeated Game)이 보장된 환경에서, 첫 회에 상대방을 속여 단기 이익을 취하는 배신(Defection/Clickbait) 전략은 즉각적인 상대방의 보복(Retaliation: 구독 취소, 알고리즘 이탈)을 부르며 장기 기대 수익(Long-term Value, LTV)을 파멸시킨다. 영구적인 성공을 보장하는 유일한 전략은 '명확하고 정직하며(Clear & Nice), 도발 시에만 처벌하고(Provocable), 사과 시 용서하는(Forgiving)' 호혜적 협력(Tit-for-Tat)뿐이다."
  verbatim_quotes:
    - original: "The foundation of cooperation is not really trust, but the durability of the relationship... When the shadow of the future is sufficiently long, cooperation emerges as the dominant strategy. Cheating brings a quick payoff but guarantees future retaliation."
      translation: "협력의 토대는 신뢰 그 자체가 아니라 관계의 지속성이다... 미래의 그림자가 충분히 길 때, 협력은 지배적인 전략으로 부상한다. 속임수는 빠른 보상을 가져오지만 미래의 보복을 보장할 뿐이다."
      citation_location: "Basic Books, p. 124, 126"

story_application:
  application_idea: "크리에이터-시청자 간의 '반복 노출 신뢰 모델(Repeated Exposure Trust Engine)'. 유튜브나 장편 시리즈에서 단 한 번이라도 클릭베이트 낚시(Defection)를 감행하면, 관객은 다음 노출 시 즉각적인 보복(영상 클릭 거부, 알고리즘 다운보트)을 감행함. 오프닝의 정직한 약속과 확실한 보상(Cooperation)만이 수용자의 평생 가치(Audience LTV)와 채널 지속성을 보장함."
  narrative_stage: "Overall Series Franchise & Creator Branding"
  emotional_mechanics:
    trigger: "창작자의 정직한 신호(Honest Signal) 수신"
    build_up: "약속이 매번 지켜지는 반복된 경험의 누적"
    peak: "창작자의 이름 자체가 보증 수표가 되는 브랜드 신뢰 완성"
    release: "의심 없는 몰입과 지속적인 다음 에피소드 소비"
  failure_modes: "단기 조회수 10만을 위해 평생의 브랜드 신뢰 100만을 날려버리는 클릭베이트의 유혹"

