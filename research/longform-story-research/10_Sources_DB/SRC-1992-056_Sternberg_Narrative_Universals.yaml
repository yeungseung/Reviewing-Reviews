claims_and_evidence:
  core_claim: "모든 서사적 긴장과 관심은 담화 시간(Discourse time)과 사건 시간(Story time) 사이의 시차 조작에서 발생하며, 이는 정확히 세 가지 보편적 긴장 양식(Three Narrative Universals)으로 수렴된다: ① 서스펜스(Suspense - 미래 결과에 대한 불확실성), ② 호기심(Curiosity - 과거/원인 정보의 공백 해소 갈망), ③ 서프라이즈(Surprise - 사전 가설과 어긋나는 충격적 진실의 출현)."
  verbatim_quotes:
    - original: "Narrative interest is generated by the interplay of three universals: suspense, curiosity, and surprise, each arising from a distinct temporal gap between fabula and sjuzhet."
      translation: "서사적 흥미는 세 가지 보편적 요소인 서스펜스, 호기심, 서프라이즈의 상호작용에서 생성되며, 각각은 파불라(사건)와 시제(담화) 사이의 독특한 시간적 간극에서 비롯된다."
      citation_location: "pp. 463-468"

story_application:
  application_idea: "긴장 엔진을 설계할 때 v2의 6종 엔진을 나열하기에 앞서, 수용자의 시간적 지향성(과거의 비밀을 묻는가[Curiosity], 미래의 파국/성공을 기다리는가[Suspense], 현재의 예측이 빗나갔는가[Surprise])을 상위 메타 축으로 규정해야 함."
  narrative_stage: "Macro-architecture of Narrative Tension"
  emotional_mechanics:
    trigger: "정보의 시간적 비대칭(시간 역전, 정보 은폐, 단서 선행 제시)"
    build_up: "과거 원인 규명 또는 미래 결과 대기 상태의 지속"
    peak: "사건 시간과 담화 시간의 일치 및 전모의 순간"
    release: "인지적 봉합(Closure) 및 서사적 카타르시스"
  failure_modes: "시간적 긴장의 세 축(과거/미래/현재)이 무질서하게 섞여 관객이 자신이 무엇을 궁금해하는지 모르게 되는 인지적 피로"

verification_status:
