key_contribution: 딥페이크 및 합성 미디어가 시청자의 기만, 불확실성, 미디어 신뢰에 미치는 영향 실증. 고지되지 않은 합성 영상은 시청자에게 직접적인 속임수로 작동할 뿐만 아니라, '거짓말쟁이의 배당금(Liar's Dividend)'을 격발하여 실제 진실한 아카이브 영상까지 조작된 것으로 의심하게 만드는 만연한 인지적 냉소를 유발함을 규명. 합성 미디어의 투명한 라벨링과 출처 고지(Disclosure)의 절대적 필요성 입증.
relevance: AI 생성 영상과 실제 사료를 혼합할 때 원본성을 보증하는 포렌식 워터마크(LDC-F)와 투명한 고지 표준을 수립하는 핵심 학술 토대.
