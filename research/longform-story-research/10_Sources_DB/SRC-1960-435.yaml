id: SRC-1960-435
author: Daniel E. Berlyne
year: 1960
title: 'Conflict, Arousal, and Curiosity'
venue: McGraw-Hill
tier: 1
citation_count: 10800
url: https://doi.org/10.1037/11164-000
key_contribution: 인식론적 호기심(Epistemic Curiosity) 이론을 정초. 감각적 각성과 구별되는 지적 호기심은 개념적 갈등(Conceptual Conflict), 불일치, 모순에 의해 촉발되며, '질문-탐구-해답(Question-Investigation-Answer)'의 인지적 탐색 과정을 통해 갈등이 해소될 때 강력한 지적 보상과 학습이 일어남을 실증.
relevance: 과학, 역사, 지식 다큐멘터리 등 정보형 콘텐츠에서 질문-탐구-해답 단위로 마이크로 블록을 구성할 때 관객의 주의와 인지적 쾌감을 극대화하는 이론적 초석.
themes:
