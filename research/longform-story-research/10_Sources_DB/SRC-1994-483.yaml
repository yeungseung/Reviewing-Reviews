id: SRC-1994-483
author: Arthur C. Graesser, Murray Singer, & Tom Trabasso
year: 1994
title: 'Constructing Inferences During Narrative Text Comprehension'
venue: Psychological Review, 101(3), 371-395
tier: 1
citation_count: 5120
url: https://doi.org/10.1037/0033-295X.101.3.371
key_contribution: '구성주의 서사 추론 이론(Constructionist Theory of Inference) 정립. 독자는 서사를 읽는 동안 사건의 원인과 결과를 잇는 인과적 설명 추론(Causal Explanation Inferences)을 능동적으로 생성하며, 선행 셋업(Setup)과 결과(Payoff) 사이의 인과적 정합성이 충족될 때 깊은 인지적 만족감과 카타르시스를 느낌을 실증. 셋업 없는 결말(데우스 엑스 마키나)에 직면할 때 뇌가 심각한 조작감과 불쾌감을 인지함을 규명.'
relevance: 셋업-페이오프 인과성이 관객의 능동적 인지 구성과 정당한 감정(Earned Emotion)에 미치는 인지심리학적 메커니즘 제공.
themes:
  - '#50 Theme 3'
