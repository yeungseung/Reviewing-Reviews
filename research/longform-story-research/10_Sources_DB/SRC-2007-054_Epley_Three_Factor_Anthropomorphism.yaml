claims_and_evidence:
  core_claim: "의인화(Anthropomorphism)는 인간이 비인간 존재를 설명할 때 인간 중심 지식(Elicited Agent Knowledge)을 가장 쉽게 떠올리고, 불확실한 환경을 이해·통제하려는 욕구(Effectance Motivation)와 사회적 유대 욕구(Sociality Motivation)에서 비롯되지만, 비인격적 자연 대상을 목적론적 존재로 오독하게 만드는 근본적 원천이 된다."
  verbatim_quotes:
    - original: "Anthropomorphism entails attributing humanlike characteristics, motivations, intentions, or emotions to nonhuman agents. It is driven by the accessibility of anthropocentric knowledge and the motivation to make sense of and control one's environment."
      translation: "의인화는 비인간 행위자에게 인간다운 특성, 동기, 의도, 감정을 부여하는 것을 수반한다. 이는 인간 중심적 지식의 접근 가능성과 환경을 이해하고 통제하려는 동기에 의해 촉발된다."
      citation_location: "pp.864-866"

story_application:
  application_idea: "의인화는 비인물 대상을 대중에게 즉각적으로 친숙하게 만드는 초기 입문용 사다리로 유용하지만, 심화 설명 단계에서는 목적론적 왜곡(바이러스가 의도를 가졌다는 착각)을 벗겨내고 기계적/확률적 메커니즘으로 반드시 전환해야 함."
  narrative_stage: "Metaphor Scaffolding to Mechanistic Shift"
  emotional_mechanics:
    trigger: "낯선 비인간 객체에 친숙한 인간적 특성 부여 (초기 호기심)"
    build_up: "의인화된 비유를 통한 진입 장벽 완화"
    peak: "의인화의 한계를 깨고 자연의 진짜 비인격적 물리 법칙을 발견"
    release: "인간 중심적 사고의 탈피와 진정한 과학적 경이감"
  failure_modes: "의인화를 은유가 아닌 실재로 오도하면 대중을 비과학적 목적론과 미신으로 퇴행시킴"

