claims_and_evidence:
  core_claim: "알프레드 히치콕의 '식탁 밑의 폭탄(The Bomb Under the Table)' 공식에 따르면, 단순한 놀라움(Mystery/Surprise: 아무 예고 없이 갑자기 폭탄이 터지는 15초의 자극)과 서스펜스(Suspense: 식탁 밑에 폭탄이 있고 1시 정각에 터진다는 사실을 관객에게 미리 알리고 시계를 보여주는 15분의 숨 막히는 긴장)는 차원이 다르다. 카운트다운(Countdown Engine)은 시간의 흐름(Imminence)과 돌이킬 수 없는 파멸(Irreversible Catastrophe)의 시계를 관객의 망막에 동기화시킴으로써, 평범한 일상의 대화조차 극도의 신경학적 고문이자 서스펜스로 변모시킨다. 따라서 오프닝에서 명확한 마감 시한(Deadline)과 째깍거리는 시계를 제시하는 것은 관객의 각성과 주의를 물리적으로 구속하는 가장 확실한 시간적 공학이다."
  verbatim_quotes:
    - original: "There is a distinct difference between 'suspense' and 'surprise'... In the case of suspense, the bomb is under the table and the public knows it, probably because they have seen the anarchist place it there. The public is aware the bomb is going to explode at one o'clock and there is a clock in the decor... In the first case we have given the public fifteen seconds of surprise at the moment of the explosion. In the second case we have provided them with fifteen minutes of suspense."
      translation: "'서스펜스'와 '서프라이즈' 사이에는 뚜렷한 차이가 있습니다... 서스펜스의 경우, 폭탄은 식탁 밑에 있고 관객은 그것을 알고 있습니다. 아마도 무정부주의자가 그것을 그곳에 놓아두는 것을 보았기 때문일 것입니다. 관객은 폭탄이 1시에 폭발할 것임을 알고 있고 세트장에는 시계가 걸려 있습니다... 첫 번째 경우 우리는 관객에게 폭발 순간 단 15초의 놀라움을 주었을 뿐이지만, 두 번째 경우 우리는 그들에게 15분 동안의 서스펜스를 제공한 것입니다."
      citation_location: "pp. 72-73"

story_application:
  application_idea: "서사 오프닝에서 'Countdown Engine'을 장착하여 '앞으로 48시간 뒤 댐이 붕괴한다' 혹은 '이 비행기의 산소는 45분 뒤 바닥난다'는 시간적 마감 시한(Deadline)을 첫 10초에 박아 넣음. 화면 상단에 흐르는 시간의 째깍거림은 관객으로 하여금 인물들의 사소한 지체나 갈등조차 손에 땀을 쥐며 지켜보게 만드는 절대적 서스펜스 생성기가 됨."
  narrative_stage: "Countdown Opening, Ticking Clock Hook, Imminence Suspense Mechanics"
  emotional_mechanics:
    trigger: "돌이킬 수 없는 시한폭탄/마감 시한(Deadline)의 명시적 선언"
    build_up: "흐르는 시간과 남아있는 거대한 장애물 간의 처절한 격차 목격"
    peak: "시간이 0초로 수렴함에 따라 심박수와 생리적 각성(Arousal)의 최고조 도달"
    release: "마지막 1초의 아슬아슬한 임계점 탈출 또는 파멸의 불가피한 목도"
    resonance: "시간이라는 절대적 한계 앞에서 인간의 의지가 발휘한 숭고함 체감"
  failure_modes: "시간 제한을 걸어놓고 인물들이 한가롭게 딴짓을 하거나 마감 시한을 고무줄처럼 늘려버려 관객의 시간적 긴장감을 파괴하는 룰 위반"

