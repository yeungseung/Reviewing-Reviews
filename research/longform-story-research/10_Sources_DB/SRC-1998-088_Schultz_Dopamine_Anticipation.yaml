claims_and_evidence:
  core_claim: "도파민 신경망의 예측 신호와 기대감 축적(Anticipation Buildup): 중뇌 도파민 뉴런은 보상이 실제로 주어지는 순간보다, '보상이나 사건을 예고하는 조건 자극(Cue)이 등장한 직후 결과가 나타나기까지의 대기 구간(Anticipatory Delay Period)'에서 가장 격렬하고 지속적으로 발화한다. 서사의 저점과 멈춤(Pause)은 뇌가 쉬는 무자극 구간이 아니라, 도파민 뉴런이 결과를 갈망하며 신경 긴장을 최대로 장전하는 능동적 기대 구간이다."
  verbatim_quotes:
    - original: "Dopamine neurons phasically respond to reward-predicting stimuli rather than to the rewards themselves once learning has occurred... The anticipatory activity between cue and reward reflects the biological state of sustained attention and motivated readiness."
      translation: "도파민 뉴런은 일단 학습이 일어나고 나면 보상 자체보다는 보상을 예측하는 자극에 위상적으로 반응한다... 단서와 보상 사이의 예기적 활동은 지속된 주의와 동기화된 준비 상태라는 생물학적 상태를 반영한다."
      citation_location: "pp. 1-12"

story_application:
  application_idea: "기대감 장전으로서의 정적(Pause): 위협의 징후(예: 째깍거리는 시계, 바스락거리는 소리)를 던진 후 결과를 즉시 보여주지 말고, 15~30초간의 침묵과 저점 밸리를 배치하라. 이 지연 시간 동안 관객의 중뇌 도파민 회로는 폭발적으로 발화하며, 뒤따르는 사건의 파괴력을 수용할 수 있도록 신경계를 최고 긴장 상태로 장전함."
  narrative_stage: "Anticipatory Pause & Pre-Jump-Scare Valley"
  emotional_mechanics:
    trigger: "임박한 위협이나 보상을 예고하는 미세 단서(Cue) 투입"
    build_up: "결과 지연과 침묵 속에서 폭발하는 중뇌 도파민 지속 발화(Anticipation)"
    peak: "예측되었던 사건의 격렬한 돌출(피크)"
    release: "도파민 예측 오차 해소 및 카타르시스 방출"
  failure_modes: "단서 던지자마자 0.1초 만에 사건을 터뜨려 도파민 장전 시간을 없애거나(조기 폭발), 너무 오래 끌어(5분 이상) 기대가 지루함으로 변질되는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "스릴러, 호러, 미스터리, 스포츠 등 결과 지연을 다루는 모든 롱폼 서사"
