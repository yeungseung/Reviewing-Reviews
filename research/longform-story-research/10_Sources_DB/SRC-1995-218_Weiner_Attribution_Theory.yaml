bibliographic_info:
  title: 'Judgments of responsibility: A foundation for a theory of social conduct'
  authors:
  - Weiner, Bernard (University of California, Los Angeles)
  institution: University of California, Los Angeles & Guilford Press
  published_date: '1995-03-01'
  source_url: https://doi.org/10.1037/0033-295X.92.4.548
  source_type: Academic Research Monograph (Guilford Press, ISBN 978-0898628432)
credibility_assessment:
  credibility_tier: Tier 1 Social Psychology & Attribution Theory Monument
  methodology:
    study_type: Theoretical Attribution Model Formulation & Cross-Situational Experimental Meta-Evaluation
    sample_size: 다년간의 귀인-정서-행동 실험군 50+ 연구 및 법적/도덕적 책임 판단 사례 분석
    target_population: 타인의 행동과 사건의 결과를 관찰하고 도덕적 감정을 형성하는 인간 판단 주체
    relationship_type: Causal Cognitive Appraisal (Causal Attribution of Controllability & Intent -> Moral Responsibility -> Anger vs Sympathy)
    effect_size: 피해나 위기의 원인이 '가해자의 통제 가능성(Controllability)'과 '의도성(Intentionality)'에 기인한다는 구체적 증거가 확보될 때 분노(Anger)의 강도가 비약적으로 폭증하며, 처벌 동기가 3배 이상 강화됨 (5,500+ 피인용 기념비적 고전)
    replicated: Universally Replicated across social psychology, legal studies, and communications
    limitations: 사회적 귀인과 도덕 행동 모델 중심이나 서사적 갈등에서 '책임 증거를 통한 분노 격발'에 1:1 완벽하게 적용됨
claims_and_evidence:
  core_claim: 인간의 분노(Anger)는 단순히 나쁜 결과(비극)를 목격했다고 해서 저절로 솟구치지 않는다. 분노는 피해의 원인이 가해자 내부의 '통제 가능한 선택(Controllable)'이었으며 '피할 수 있었던 고의(Avoidable Negligence)'였다는 인과적 '책임의 증거(Proof of Responsibility)'가 확인될 때 비로소 도덕적 폭발을 일으킨다. 반대로 원인이 통제 불가능한 자연재해나 불운이라는 증거가 나오면 분노는 연민(Sympathy)이나 슬픔으로 치환된다. 즉, 구체적 증거는 감정의 강도뿐만 아니라 감정의 질적 종류(분노 vs 연민) 자체를 결정한다.
  verbatim_quotes:
  - original: Anger is elicited when a negative outcome is attributed to a cause that is personally controllable by another person. The judgment of responsibility mediates between causal beliefs and affective reactions: without the evidence of controllability, anger does not emerge; with it, anger and retribution are intensely provoked.
    translation: 분노는 부정적인 결과가 다른 사람에 의해 개인적으로 통제 가능한 원인에 기인한다고 귀인될 때 유발된다. 책임에 대한 판단은 인과적 신념과 정서적 반응 사이를 매개한다. 통제 가능성에 대한 증거가 없으면 분노는 출현하지 않으며, 그 증거가 있을 때 분노와 응징 동기는 강렬하게 촉발된다.
    citation_location: Chapter 1 & 2, pp. 12-16
story_application:
  application_idea: 롱폼 스토리의 '책임 증거 격발 (Proof-of-Responsibility Ignition) 공식'. 사회적 비극이나 악인의 범죄를 고발할 때, 단순히 피해자의 슬픔만 전시하지 않고 "가해자가 사전에 위험을 완벽히 알고 있었으며, 비용 절감을 위해 고의로 안전장치를 해제했다"는 내부 문서, 이메일, 회의록(Controllability Evidence)을 결정적 순간에 폭로하여, 관객의 막연한 슬픔을 폭발적인 '도덕적 분노와 정의 구현의 열망'으로 전환시킴.
  narrative_stage: Climax Indictment, Moral Outrage & Smoking Gun Exposure
  emotional_mechanics:
    trigger: 막연한 사고나 재난으로 인한 무력한 슬픔과 탄식
    build_up: 사고가 우연이 아니었다는 내부 고발자의 은밀한 정황 포착
    peak: 가해자의 고의적 은폐를 입증하는 스모킹 건(내부 회의록 증거)의 전격 공개
    release: '막을 수 있었던 인재였다'는 책임의 확증과 함께 폭발하는 전율적 도덕적 분노
  failure_modes: 책임의 구체적 증거 없이 감정적으로 "나쁜 놈이다"라고만 목소리를 높여 관객의 공감을 얻지 못하고 억지 선동으로 전락하는 실패
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 탐사보도, 범죄 실화, 사회 고발 르포, 기업 비리, 역사적 참사 등 정의와 처벌을 다루는 모든 내러티브
