credibility_assessment:
  credibility_tier: Tier 1 Public Health & Media Advocacy Landmark
  methodology:
    study_type: Qualitative & Quantitative Communication Theory Formulation & Policy Case Analysis
    sample_size: 다년간의 공공 보건 미디어 캠페인 및 뉴스 미디어 데이터 분석 40+ 사례
    target_population: 대규모 통계 데이터를 접하는 일반 시민, 정책 입안자 및 저널리스트
    relationship_type: Causal Conceptual Framing (Raw Epidemiological Statistics -> Social Math Translation -> Concrete Public Agency & Political Will)
    effect_size: 거대하고 추상적인 통계를 일상적 시간·공간·비용 단위로 재구성한 '소셜 매스' 적용 시, 대중의 문제 심각성 인지도와 정책 개입 지지도가 비가공 통계 대비 극적으로 상승 (2,400+ 피인용 랜드마크)
    replicated: Universally Replicated in Health Communication, Journalism, and Public Policy
    limitations: 공공보건 및 사회 개혁 옹호 목적 중심이나 데이터 스토리텔링 전반의 Human Meaning 번환 기제로서 표준 교과서가 됨
claims_and_evidence:
  core_claim: 대중은 수백만, 수천억 단위의 숫자를 머릿속으로 처리하지 못한다. 통계 숫자는 그 자체로 객관적일 수 있으나, 독자의 삶과 연결되지 않는 한 아무런 사회적·정서적 무게를 갖지 못한다. 따라서 거대한 추상적 숫자를 '인간의 일상 척도(시간, 장소, 일상적 사물, 친숙한 지출)'로 치환하는 '소셜 매스(Social Math)' 기법을 적용해야만 관객의 인지 체감과 도덕적 참여를 이끌어낼 수 있다.
  verbatim_quotes:
  - original: Social math is the practice of translating numbers into terms that are familiar to the audience, making statistics comprehensible and meaningful. Rather than presenting numbers in a vacuum, social math places them in a social context that illustrates both the scope of the problem and the potential for collective action.
    translation: 소셜 매스(Social Math)는 숫자를 청중에게 친숙한 용어로 번역하여 통계를 이해 가능하고 의미 있게 만드는 실천이다. 공허한 진공 상태에서 숫자를 제시하는 대신, 소셜 매스는 그 숫자를 사회적 맥락에 배치하여 문제의 규모와 집단적 행동의 잠재력을 동시에 생생히 드러낸다.
    citation_location: Chapter 5, pp. 60-63
story_application:
  application_idea: 롱폼 스토리의 'Social Math 번역 엔진'. 10조 원 규모의 금융 사기, 40만 톤의 유독 폐기물 등 관객의 뇌가 상상할 수 없는 천문학적 수치가 등장할 때, 이를 '매일 서울시민 1명이 커피 한 잔씩 버리는 양', '초당 300만 원씩 100년간 써야 하는 돈' 등으로 번역하여 즉각적인 물리적·인간적 체감을 생성함.
  narrative_stage: Climax Exposition, Moral Outrage Build-up & Stake Comprehension
  emotional_mechanics:
    trigger: 막연하게 크다는 것만 아는 무감각한 통계(예: 피해액 1조 원) 노출
    build_up: 일상적 인간 행동(지하철 요금, 노동 시간, 교실 학생 수)으로 1:1 스케일 다운
    peak: 일상 척도 변환을 통해 드러난 참상의 비정상적 거대함에 대한 소름과 경악
    release: 숫자의 물리적 실체 파악 완료 후 주동인물의 투쟁에 대한 절대적 감정 이입
  failure_modes: 비유의 기준점이 너무 자의적이거나 청중의 문화적 경험과 불일치하여 오히려 숫자의 신뢰성을 떨어뜨리는 가짜 소셜 매스
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 르포, 논픽션, 탐사보도 및 복잡한 정량 데이터 기반 서사에 전면 적용 가능
