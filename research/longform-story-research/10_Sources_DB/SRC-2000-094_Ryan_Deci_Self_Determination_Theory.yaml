claims_and_evidence:
  core_claim: "자기결정이론(SDT)의 3대 기본 심리적 욕구와 서사의 내적 엔진: 인간에게는 생물학적 생존 욕구뿐 아니라 심리적 생존과 성장을 위한 필수 영양소(Psychological Nutrients)로서 '자율성(Autonomy: 자신의 삶을 스스로 통제하고 선택한다는 느낌)', '유능성(Competence: 환경과 상호작용하며 효능감을 느끼고 성장한다는 느낌)', '관계성(Relatedness: 타인과 유대감을 맺고 소속되어 배려받고 배려한다는 느낌)'이라는 3대 기본 심리 욕구가 존재한다. 이 세 가지 욕구가 지속적으로 박탈되거나 위협받을 때 인간은 극심한 정신적 고통, 무기력, 소외, 자기방어적 적대감을 경험한다. 서사에서 인물이 겪는 실존적 위기와 감정적 몰입은 대부분 이 세 가지 욕구 중 하나 이상의 치명적 박탈에서 점화되며, 욕구의 회복 과정이 이야기의 감정적 카타르시스를 결정한다."
  verbatim_quotes:
    - original: "Basic psychological needs for autonomy, competence, and relatedness... are essential nutrients for psychological growth, integrity, and well-being. Thwarting of these needs leads directly to diminished vitality, self-fragmentation, and acute emotional distress."
      translation: "자율성, 유능성, 관계성에 대한 기본 심리적 욕구는... 심리적 성장, 온전성, 웰빙을 위한 필수 영양소이다. 이 욕구들이 좌절되면 활력 저하, 자아의 분열, 극심한 정서적 고통으로 직결된다."
      citation_location: "pp. 68-70"

story_application:
  application_idea: "3대 기본 심리 욕구 결핍 매트릭스(SDT Need-Thwarting Engine): 스토리 1막에서 주인공의 결핍과 위기를 설정할 때 단순한 물리적 위기(돈 부족, 사고 등)를 넘어 '자율성 박탈(가스라이팅, 감금, 강제 노역)', '유능성 붕괴(사기 실패, 치명적 과오로 인한 자격 상실)', '관계성 단절(추방, 배신, 외톨이)'이라는 3대 내적 심리 축 중 어디가 파괴되었는지 명확히 핀포인트하여 관객의 거울 뉴런과 본능적 공감을 즉각 활성화함."
  narrative_stage: "Act 1 Character Wound, Act 2 Testing, Act 3 Self-Actualization"
  emotional_mechanics:
    trigger: "자율성·유능성·관계성 중 핵심 욕구의 급작스러운 외부적/내부적 박탈"
    build_up: "욕구를 회복하려 발버둥 치나 환경적 압박으로 결핍이 극대화되는 고통의 심화"
    peak: "외부의 보상(돈, 지위)이 아닌 자신의 온전한 자율성과 진정한 유대감을 위해 위험을 감수하는 결단"
    release: "진정한 자기결정성(Self-Determination)의 회복과 함께 분출되는 깊은 정서적 해방감"
  failure_modes: "주인공이 외적 성공(부, 권력)만 얻고 내적 3대 욕구(특히 관계성과 자율성)는 여전히 파탄 난 상태인데 감동적인 결말인 것처럼 포장하는 공허한 해피엔딩"

