key_contribution: 인지서사학적 사건성(Eventfulness)과 세계 붕괴(World-disruption) 이론. 국소적 전환점(Turning Point)이 새로운 잠재적 경로를 개방하는 과정이라면, 거시적 피크(Climax/Peak)는 복합적으로 분기하던 모든 가능성 공간(Possibility Space)이 인물의 결단에 의해 하나의 비가역적 결과로 급격히 붕괴·수렴되는 결정적 상태 전이임을 규명.
relevance: 전환점(Turning Point)과 진정한 피크(Peak)의 서사 인지론적 본질적 차이 정립.
