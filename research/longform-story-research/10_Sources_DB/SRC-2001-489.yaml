key_contribution: '부정성 편향(Negativity Bias) 및 부정성 지배성 이론 정립. 인간의 뇌는 진화론적으로 긍정적 보상보다 위험, 실패, 손실 정보에 훨씬 더 강력하고 지속적인 인지적 각인을 남김을 실증. 서사에서 비극적 결말이나 실패를 통해 전달되는 경고(Warning/Lesson)와 행동 결정 규칙(Decision Rule)이 장기 기억과 행동 수정에 가장 강력한 페이오프로 작동함을 규명.'
relevance: 9대 페이오프 유형 중 Warning/Lesson 및 Decision Rule(경고 및 실천적 행동 결정 규칙)의 인지심리학적 근거.
