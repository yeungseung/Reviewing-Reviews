bibliographic_info:
  title: 'Where Mathematics Comes From: How the Embodied Mind Brings Mathematics into Being'
  authors:
  - Lakoff, George (University of California, Berkeley)
  - Núñez, Rafael E. (University of California, San Diego)
  institution: UC Berkeley & UC San Diego
  published_date: '2000-08-01'
  source_url: https://doi.org/10.5860/choice.38-5085
  source_type: Academic Research Monograph (Basic Books, ISBN 978-0465037711)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Linguistics & Embodied Cognition Landmark
  methodology:
    study_type: Cognitive Semantic Analysis & Conceptual Metaphor Modeling of Mathematical Thought
    sample_size: 산술, 대수, 미적분학, 집합론 등 수학 전 분야의 인지 메타포 체계적 분해 분석
    target_population: 수학적 개념 및 수량 체계를 처리하고 이해하는 인간의 두뇌와 신체 인지 체계
    relationship_type: Foundational Cognitive Mechanism (Sensorimotor Experience & Spatial Grounding -> Grounding Metaphors -> Abstract Quantitative Comprehension)
    effect_size: 모든 추상적 수량과 수학적 연산은 신체적 감각운동(Sensorimotor) 경험에 기반한 '기저 은유(Grounding Metaphor, 예: 수량은 크기, 산술은 사물 수집)'에 의해 개념화됨을 입증 (3,700+ 피인용 기념비적 저작)
    replicated: Universally Replicated in Cognitive Linguistics and Embodied Cognition Research
    limitations: 수학 철학 및 인지언어학 모노그래프이나 수치의 인간 척도 변환 원리를 신경생리학적·인지적으로 완벽히 뒷받침함
claims_and_evidence:
  core_claim: 인간의 마음은 순수한 추상적 기호나 거대한 숫자를 진공 상태에서 직접 처리할 수 없다. 인간의 수 감각은 '물리적 사물 모으기', '경로를 따라 이동하기', '그릇에 물 채우기' 같은 신체적·감각운동적 경험(Sensorimotor Experience)에서 파생된 '기저 은유(Grounding Metaphors)'에 전적으로 정박(Grounded)되어 있다. 따라서 인간 척도를 벗어난 거대 통계나 미세 수치는 신체적 감각운동 경험과 다시 연결(Re-grounding)해 주지 않는 한, 뇌에서 인지적 공백과 정서적 마비(Psychic Numbing)를 초래한다.
  verbatim_quotes:
  - original: Human mathematics is not disembodied, abstract, and transcendent; it is grounded in our bodily experience, our everyday perceptual and motor capacities, and the metaphors arising from them. Abstract numbers become meaningful to the human brain only when mapped onto sensorimotor schemas such as object manipulation and physical motion along a path.
    translation: 인간의 수학은 육체를 벗어난 추상적이고 초월적인 것이 아니다. 그것은 우리의 신체적 경험, 일상적인 지각 및 운동 능력, 그리고 이들로부터 생겨나는 은유에 깊이 정박되어 있다. 추상적인 숫자는 사물 조작이나 경로를 따라 이동하는 신체 운동 같은 감각운동 도식에 사상될 때에만 비로소 인간의 뇌에 의미 있는 것으로 다가온다.
    citation_location: Introduction & Chapter 1, pp. 1-8
story_application:
  application_idea: 롱폼 스토리의 '감각운동 정박(Sensorimotor Grounding) 서사 기법'. 스토리텔러가 정량적 데이터(거리, 부피, 시간, 금액 등)를 묘사할 때 독자의 감각 기관(시각, 촉각, 이동 감각, 무게감)을 자극하는 물리적 신체 행동으로 치환함. 예컨대 "지구와 달 사이의 거리 38만 km"를 "빛의 속도로 1.3초, 또는 자동차로 멈추지 않고 5개월을 밟아야 닿는 거리"로 신체 이동 감각과 결합함.
  narrative_stage: Sensory Immersion & Physical Scale Rendering
  emotional_mechanics:
    trigger: 비현실적인 추상적 측정 단위(톤, 헥타르, 마이크로그램)로 인한 인지적 이탈
    build_up: 인간의 팔 힘, 보폭, 숨결, 심장 박동 등 감각운동 경험으로의 정박
    peak: 숫자가 살과 피를 가진 물리적 압력이나 무게로 몸에 와닿는 체감의 충격
    release: 숫자가 내 몸의 현실로 들어오면서 사건에 대한 본능적 몰입 형성
  failure_modes: 신체적 정박이 결여된 건조한 숫자 나열로 인해 독자의 감각운동 뇌 영역을 전혀 자극하지 못하는 무기력한 서사
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 르포, 과학, 다큐멘터리, 역사 등 물리적 규모와 양적 변화를 묘사하는 모든 서사물에 적용
