url: https://doi.org/10.1007/s11098-007-9092-2
key_contribution: "에로테틱 서사 모델(Erotetic Model) 기반의 서사 종결성(Narrative Closure)과 정서적 포만감(Affective Satiety) 체계화. 서사가 제기한 핵심 질문(Presiding Macro-Questions)들이 엔딩에서 체계적으로 답변될 때 발생하는 인지적 완결성과 카타르시스적 감정 수렴의 구조를 철학적·인지적으로 규명."
relevance: "엔딩 중심 구조화(Ending-Driven Structure) 및 감정적 복선(Emotional Foreshadowing)이 어떻게 주제적 일관성을 확보하고 관객에게 완결된 정서적 만족을 제공하는지에 대한 이론적 근거."
themes:
  - "#52 Theme 2"
