key_contribution: 극적 서사의 기본 분자 단위인 'Scene & Sequel' 구조론을 창시. 서사는 외적 행동 단위인 Scene(Goal-Conflict-Disaster)과 내적 반응 단위인 Sequel(Reaction-Dilemma-Decision)의 상호 교대와 순환을 통해 끝없는 추진력을 얻음을 체계화.
relevance: 6단계 마이크로 스토리 블록(상황-문제-행동-의미-감정변화-다음질문)이 고전적 Scene-Sequel 구조를 현대 인지과학적 관점에서 융합·발전시킨 정당한 서사 분자 단위임을 입증하는 결정적 작법 이론.
