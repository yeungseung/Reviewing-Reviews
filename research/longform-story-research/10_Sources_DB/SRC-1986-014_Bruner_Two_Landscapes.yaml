claims_and_evidence:
  core_claim: "서사는 외부의 물리적 사건과 행위를 다루는 '행위의 풍경(Landscape of Action)'과, 인물의 내면적 감정·신념·의미를 다루는 '의식의 풍경(Landscape of Consciousness)'이라는 두 가지 층위가 동시에 엮여 전개될 때 비로소 완성됨."
  verbatim_quotes:
    - original: "Narrative must construct two landscapes simultaneously. One is the landscape of action, where the constituents are the arguments of action: agent, intention or goal, situation, instrument... The other is the landscape of consciousness: what those involved in the action know, think, or feel, or do not know, think, or feel."
      translation: "서사는 두 개의 풍경을 동시에 구성해야 한다. 하나는 행위의 구성요소인 행위자, 의도나 목표, 상황, 도구들이 있는 '행위의 풍경'이다... 다른 하나는 그 행위에 연루된 사람들이 알거나 생각하거나 느끼는 것, 혹은 알지 못하고 생각하지 못하고 느끼지 못하는 것들로 이루어진 '의식의 풍경'이다."
      citation_location: "Chapter 2, p.14"

story_application:
  application_idea: "대본을 쓸 때 '주인공이 무엇을 했는가(행위의 풍경 = Story)'만 쓰지 말고, 그 순간 '주인공이 무엇을 느끼고 어떤 가치 판단을 내리고 있는가(의식의 풍경 = Emotion & Meaning)'를 한 줄씩 교차 배치하라."
  narrative_stage: "Dual-landscape Scriptwriting"
  emotional_mechanics:
    trigger: "외부 사건의 발생 (행위의 풍경)"
    build_up: "사건에 대한 인물의 내적 반응 (의식의 풍경)"
    peak: "두 풍경이 정면 충돌하는 딜레마"
    release: "새로운 실존적 자각으로의 통합"
  failure_modes: "행위의 풍경만 있으면 '무미건조한 사건 일지', 의식의 풍경만 있으면 '지루한 내면 독백'으로 전락"

