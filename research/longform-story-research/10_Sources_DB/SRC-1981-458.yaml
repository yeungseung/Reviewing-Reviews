key_contribution: 역사적 사실 서사화에서의 플롯화(Emplotment) 이론 정립. 연대기적 사실(Chronicle)에 거시적 서사 구조(로맨스, 비극, 희극, 풍자)를 부여할 때 발생하는 이데올로기적 의미 부여와 인지적 구조화의 필연적 한계 및 윤리적 왜곡 위험 규명.
