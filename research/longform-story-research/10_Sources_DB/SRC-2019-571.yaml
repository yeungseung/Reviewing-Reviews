id: SRC-2019-571
author: Vittorio Gallese & Michele Guerra
year: 2019
title: 'The Empathic Screen: Cinema and Neuroscience'
venue: Oxford University Press, Oxford, pp. 85-142
tier: 1
citation_count: 180
url: https://doi.org/10.1093/oso/9780198797449.001.0001
key_contribution: 거울 신경망(Mirror Neurons)과 체화된 시뮬레이션(Embodied Simulation) 이론을 영상 편집학과 결합. 인물의 슬픔, 애도, 친밀감과 같은 내면적 고통은 관객의 운동 및 전운동 피질, 뇌섬엽(Insula)이 인물의 미세 표정 근육과 호흡에 공명할 수 있는 충분한 지속 시간(최소 6~10초 이상의 롱테이크)이 주어질 때 비로소 진정한 정서적 전이(Affective Empathy)로 완성됨을 뇌영상 및 시각 인지 실험으로 실증. 빠른 컷 전환은 이 체화된 공명 과정을 조기 절단(Abortion)하여 감정을 값싼 멜로드라마로 격하시킴을 증명.
relevance: 슬픔과 친밀감 등 깊은 정서 형성을 위해 왜 빠른 컷을 피하고 롱테이크 체류 시간을 부여해야 하는지에 대한 신경인지학적 근거.
themes:
