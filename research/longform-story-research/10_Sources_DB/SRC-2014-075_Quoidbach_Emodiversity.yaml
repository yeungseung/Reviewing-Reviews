claims_and_evidence:
  core_claim: "감정 다양성(Emodiversity)의 가치: 생태계의 건강이 단일 종의 번성이 아니라 다양한 생물종의 균형(생물다양성)에 의존하듯, 인간의 정서적 안녕과 인지적 탄력성은 특정 감정(단순 행복/쾌락)의 단일 강도가 아니라 경험하는 정서의 '다채로움(Richness)'과 '균형(Evenness)'에 결정적으로 비례한다. 단일 감정의 지속적 노출은 뇌의 감각 적응(Sensory Adaptation)과 정서 둔감화(Desensitization)를 유발하여 경험의 질을 급락시키는 반면, 다양한 긍정/부정 정서의 교차는 뇌의 인지적 활성을 다채롭게 유지시킨다."
  verbatim_quotes:
    - original: "Emodiversity—the variety and relative abundance of the emotions people experience—is an independent predictor of mental and physical health... Just as biodiversity strengthens an ecological system, experiencing a rich and balanced variety of emotions prevents any single emotion from dominating and exhausting the psychological system."
      translation: "감정 다양성(개인이 경험하는 감정의 다양성과 상대적 풍부함)은 신체 및 정신 건강의 독립적 예측 변인이다... 생물다양성이 생태계를 강화하듯, 풍부하고 균형 잡힌 다양한 감정을 경험하는 것은 단일 감정이 심리 시스템을 지배하고 고갈시키는 것을 방지한다."
      citation_location: "pp. 2057-2060"

story_application:
  application_idea: "롱폼 스토리에서 관객의 몰입을 2시간 이상 유지하려면, 하나의 감정(예: 공포, 슬픔, 액션 긴장)의 강도만 무한히 높여서는 안 됨. 공포 → 안도 → 웃음 → 분노 → 슬픔 → 도덕적 찬사로 이어지는 '감정 다양성 지수(Emodiversity Index)'를 의도적으로 높게 설계해야 함. 감정의 색채가 전환될 때마다 관객의 뇌는 감각 적응에서 깨어나 새로운 몰입 에너지를 충전함."
  narrative_stage: "Macro Narrative Architecture (Emotional Variety Across Acts)"
  emotional_mechanics:
    trigger: "새로운 상황적 평가 차원의 도입을 통한 감정 색채 전환"
    build_up: "다양한 정서(호기심, 유머, 긴장, 연민)의 다채로운 교차 배치"
    peak: "복합 정서의 융합을 통한 고차원적 카타르시스"
    release: "다채로운 경험의 완결을 통한 충만한 서사적 만족감"
  failure_modes: "2시간 내내 비명만 지르게 하거나 2시간 내내 슬픈 울림만 강요하여 관객의 신경계를 탈진(Desensitization)시키는 단색조(Monochromatic) 실패"

