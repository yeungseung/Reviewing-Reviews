claims_and_evidence:
  core_claim: "인간은 현재 느끼고 있는 기분/정서 상태와 일치하는(Congruent) 정보를 더 신속하게 인출하고 더 깊이 처리하며, 정서적 불일치(Incongruence)는 인지적 처리 지연과 이탈을 초래한다."
  verbatim_quotes:
    - original: "People attend to and learn more about events that match their emotional state... an emotion serves as an interpretive filter for ongoing events."
      translation: "사람들은 자신의 감정 상태와 일치하는 사건에 더 주의를 기울이고 더 많이 학습한다... 감정은 진행 중인 사건을 해석하는 인지적 필터 역할을 한다."
      citation_location: "p.129, Abstract"

story_application:
  application_idea: "서사의 씬 연출 시 배경음악, 조명, 색감(Emotion Track)을 사건의 정서적 본질(Story Track)과 완벽하게 정렬시켜 관객의 정보 처리 유창성을 극대화함. 대위법(Counterpoint)은 철저히 계산된 의도적 충격 장치로만 제한 사용."
  narrative_stage: "Scene-level Micro Arc Design"
  emotional_mechanics:
    trigger: "씬의 지배적 톤 설정"
    build_up: "음향과 비주얼을 통한 정서적 프라이밍"
    peak: "사건과 톤의 완전한 일치에서 오는 카타르시스"
    release: "매끄러운 씬 전환"
  failure_modes: "비극적 사건에 어설픈 유머를 섞거나(Tonal Whiplash) 경쾌한 장면에 억지 신파 음악을 깔면 몰입이 즉각 산산조각 남"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "상업 대중 서사에서 톤의 일관성은 시청 유지의 핵심 규범임"
