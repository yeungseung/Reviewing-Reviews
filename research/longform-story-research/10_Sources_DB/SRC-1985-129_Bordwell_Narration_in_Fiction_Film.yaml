claims_and_evidence:
  core_claim: "관객은 영화를 볼 때 수동적인 자극 수용자가 아니라, 주어지는 플롯(Syuzhet) 정보를 바탕으로 머릿속에서 실제 사건의 연대기적 인과 사슬(Fabula)을 능동적으로 구축하는 인지적 가설 생성자(Cognitive Hypothesis Maker)이다. 서사의 오프닝(콜드 오픈 등)은 관객에게 '어떤 인과적 가설을 세워야 하는가'를 지시하는 최초의 프레임(Priming Frame) 역할을 수행한다. 콜드 오픈(Cold Open)이나 티저(Teaser)는 이야기의 '전달 형식(Dramaturgical Format)'일 뿐이며, 그 내부에서 실제로 관객의 가설 생성 엔진을 구동하는 핵심 동력은 '정보 지연(Delayed Exposition)'과 '미결된 갈등/변칙성(Unresolved Anomaly/Conflict)'이다. 따라서 오프닝의 형식적 분류(콜드 오픈, 인물 소개 등)와 내적 서사 엔진(7대 엔진)을 혼동해서는 안 된다."
  verbatim_quotes:
    - original: "The viewer comes to a film equipped with schemata derived from real-world experience and from other narrative texts... Narration shapes perception by controlling the range and depth of story information. The opening sequence establishes the terms of the spectator's hypothesis-forming activity, determining whether attention is guided by curiosity about the past, suspense about the future, or surprise in the present."
      translation: "관객은 현실 경험과 다른 서사 텍스트에서 얻은 도식(스키마)을 장착하고 영화에 다가온다... 서술(Narration)은 이야기 정보의 범위와 깊이를 통제함으로써 지각을 형성한다. 오프닝 시퀀스는 관객의 가설 형성 활동의 조건을 확립하며, 주의가 과거에 대한 호기심, 미래에 대한 서스펜스, 혹은 현재의 놀라움 중 무엇에 의해 유도될지를 결정한다."
      citation_location: "pp. 48-52"

story_application:
  application_idea: "서사 오프닝을 기획할 때 '콜드 오픈(Cold Open)'이라는 방송 연출 형식에 매몰되지 말고, 그 껍질 안에서 관객의 뇌에 어떤 '인과적 가설'을 세우게 만들 것인지를 7대 엔진(결과 선제시, 모순, 시한폭탄 등)으로 명확히 설계해야 함. 콜드 오픈의 길이보다 중요한 것은 그 오프닝이 관객에게 던진 '핵심 가설 질문(Core Hypothesis Question)'의 선명도임."
  narrative_stage: "Cold Open Structural Architecture, Fabula Construction & Syuzhet Priming"
  emotional_mechanics:
    trigger: "콜드 오픈 속에서 던져지는 인과적 불일치 단서 목격"
    build_up: "관객 머릿속에서 다중 가설(Multiple Hypotheses)의 능동적 경합 발생"
    peak: "타이틀 시퀀스로 전환되며 '가설을 확인하고 싶다'는 강한 호기심 동기화"
    release: "본문 전개 속에서 불완전한 가설들이 하나의 확고한 스토리라인으로 수렴"
    resonance: "관객 스스로 능동적 추론을 완결지었을 때의 지적 성취감"
  failure_modes: "콜드 오픈이라는 형식만 흉내 내어 멋진 장면을 넣었으나, 관객 머릿속에 아무런 인과적 가설도 만들지 못해 타이틀이 뜨는 순간 잊혀지는 형식주의 오류"

