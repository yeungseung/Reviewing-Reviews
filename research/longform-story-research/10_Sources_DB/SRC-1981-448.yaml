key_contribution: 대화주의(Dialogism), 다성성(Polyphony), 이언어성(Heteroglossia) 이론을 정립. 서사는 단일한 화자의 탐구와 해답으로 환원되지 않으며, 복수의 독립적인 이념적 관점과 목소리가 동등한 자격으로 충돌하는 변증법적 대립(Argument-Counterargument) 구조를 통해 심층적 진실이 드러남을 규명.
