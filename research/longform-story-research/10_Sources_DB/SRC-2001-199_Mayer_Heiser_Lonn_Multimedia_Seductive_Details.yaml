source_id: SRC-2001-199
created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'Cognitive constraints on multimedia learning: When presenting more material results in less understanding'
  authors:
  - Mayer, Richard E. (University of California, Santa Barbara)
  - Heiser, Julie K. (University of California, Santa Barbara)
  - Lonn, Steve (University of California, Santa Barbara)
  institution: University of California, Santa Barbara (UCSB)
  published_date: '2001-03-01'
  source_url: https://doi.org/10.1037/0022-0663.93.1.187
  source_type: Peer-reviewed Journal (Journal of Educational Psychology, 93(1), 187-198)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Psychology & Multimedia Science
  methodology:
    study_type: Factorial Experimental Multimedia Learning Study
    sample_size: 156 (College students across multiple experiment conditions)
    target_population: 영상, 내레이션, 애니메이션 복합 미디어 수용자
    relationship_type: Causal (Seductive Multimedia Details -> Extraneous Cognitive Overload & Transfer Deficit)
    effect_size: '응집성 효과(Coherence Effect): 흥미로운 곁가지 영상/사운드/세부를 배제한 간결한 콘텐츠를 수용한 집단이 문제해결 전이 과제에서 d = 0.80 수준의 압도적 우위를 달성'
    replicated: Universally Replicated (멀티미디어 인지학습 이론의 최고 권위 연구, 1,000+ 피인용)
    limitations: 교육용 설명 애니메이션 기반 실험으로, 예술 영화의 정서적 여백 연출과는 맥락적 구분이 필요함
claims_and_evidence:
  core_claim: 멀티미디어 서사 환경에서 '더 많은 정보'를 제공하는 것은 종종 '더 적은 이해'를 낳는다(Less is More). 시청자의 눈길을 끌기 위해 본질적 인과와 무관한 재미있는 비디오 클립, 배경 잡음, 자극적 일화(Seductive Details)를 추가하면 작업기억의 한계로 인해 외재적 인지부하(Extraneous Load)가 폭증하며, 핵심 인과 사슬의 통합과 심층 기억 전이가 심각하게 마비된다.
  verbatim_quotes:
  - original: Adding interesting but unessential material to a multimedia presentation can overload working memory and detract from learning. Students who received concise presentations generated over 70% more creative solutions to transfer problems than those who received seductive details (effect size d = 0.80).
    translation: 멀티미디어 프레젠테이션에 흥미롭지만 불필요한 자료를 덧붙이는 것은 작업기억을 과부하시키고 학습을 훼손할 수 있다. 간결한 프레젠테이션을 받은 학습자들은 매혹적 세부사항을 받은 학습자들보다 전이 문제에서 70% 이상 더 많은 창의적 해결책을 생성했다 (효과크기 d = 0.80).
    citation_location: pp. 187-192
story_application:
  application_idea: 영상 및 오디오 롱폼 스토리의 '응집성 린터(Coherence Linter)'. 유튜브 다큐멘터리, 영상 롱폼 제작 시 재미를 돋운답시고 삽입하는 밈 컷, 엉뚱한 B-roll, 엽기적 단신들을 어떻게 걸러내야 하는지 판정하는 절대적 컷 편집 기준.
  narrative_stage: Post-production, Video Editing & Sound Design Pruning
  emotional_mechanics:
    trigger: 시청자 주의를 끌기 위한 무분별한 시각적/청각적 양념 투입 유혹
    build_up: 불필요한 자극으로 인한 시청자의 작업기억 병목 및 인지적 피로 누적
    peak: 핵심 플롯과 질문의 상실로 인한 시청 중단 및 이탈
    release: 군더더기 양념의 외과적 절제를 통한 인과적 명료성 복원
  failure_modes: 지루함을 달랜다는 핑계로 곁가지 밈이나 효과음을 도배하여 콘텐츠의 지적 품격을 떨어뜨리고 핵심 주제를 증발시키는 연출
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 지식형 다큐, 팩트 기반 롱폼 콘텐츠, 논증형 영상물에 강력히 적용됨
