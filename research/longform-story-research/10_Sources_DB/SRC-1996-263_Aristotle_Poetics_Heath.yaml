key_findings:
  - "비극적 플롯의 핵심 역학으로서 페리페테이아(Peripeteia, 행위의 역전)와 아나그노리시스(Anagnorisis, 무지에서 앎으로의 발견)의 정초."
  - "페리페테이아는 단순한 행운의 반전이 아니라, 인물의 의도된 행동이 필연적·개연적 인과율에 의해 정반대의 결과를 낳는 사건의 전환으로 정의됨."
  - "아나그노리시스는 인물의 정체나 관계, 숨겨진 진실에 대한 무지에서 인지로의 전환이며, 페리페테이아와 아나그노리시스가 결합될 때 최고의 연민과 공포(카타르시스)가 유발됨."
core_claims:
  - "진정한 반전(Peripeteia)은 단순한 서프라이즈가 아니라, 행위의 방향이 인과적으로 그 반대로 뒤집히는 필연적 사건이다."
  - "발견(Anagnorisis)과 역전(Peripeteia)의 동시 결합이 서사의 인지적·정서적 충격을 극대화한다."
keywords:
  - peripeteia
  - anagnorisis
  - reversal
  - revelation
  - catharsis
  - poetics
