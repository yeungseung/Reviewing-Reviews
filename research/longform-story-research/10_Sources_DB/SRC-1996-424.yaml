key_contribution: 영화 및 서사 수용에서의 감정 이론(Affect Structure)을 정립. 서사 경험은 지속적인 사건의 연속뿐만 아니라 감정의 내면화와 인지적 평가(Appraisal)가 일어나는 '정서적·미학적 정지 구간(Aesthetic & Emotional Pauses)'이 필수적으로 수반되어야 관객의 깊은 공감과 서사적 만족이 완성됨을 규명.
relevance: 슬로우 번(Slow-burn) 서사 및 상태 변화 사이에 배치되는 '정서·미학적 정지 구간'이 단순한 지루함이 아닌 필수적 인지 흡수 버퍼임을 증명하는 핵심 근거.
