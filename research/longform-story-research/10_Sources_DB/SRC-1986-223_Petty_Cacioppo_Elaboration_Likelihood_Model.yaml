credibility_assessment:
  credibility_tier: Tier 1 Social Psychology & Communication Theory Monument
  methodology:
    study_type: Dual-Process Cognitive Persuasion Theory Formulation & Meta-Empirical Synthesis
    sample_size: 다년간의 설득, 태도 변화, 인지 정교화 실험 100+ 연구 종합
    target_population: 설득적 메시지와 데이터를 처리하는 인간 인지 주체
    relationship_type: Foundational Dual-Route Framework (Elaboration Likelihood: Central Route via Evidence vs Peripheral Route via Emotion/Cues)
    effect_size: 높은 동기와 인지 역량 하에서 중심 경로(Central Route)를 통해 처리된 증거는 지속적이고 저항력 있는 태도 변화를 형성하는 반면, 낮은 동기 하에서는 주변 경로(Peripheral Route)의 감정적 단서가 초기 설득을 주도함을 입증 (14,000+ 피인용 기념비적 거작)
    replicated: Universally Replicated across all social science and communication disciplines
    limitations: 설득 이론 전반을 포괄하나 Evidence-First(중심 경로)와 Emotion-First(주변 경로)의 장르별 분기 기준에 완벽히 부합함
claims_and_evidence:
  core_claim: 설득은 두 가지 상이한 인지 경로를 통해 일어난다. 증거 우선 시퀀싱(Evidence-First: Evidence ➔ Consequence ➔ Emotion)은 독자의 '중심 경로(Central Route)'를 자극하여 논리적 정교화를 거친 매우 견고하고 장기 지속적인 신념을 구축한다(학술, 교육, 과학, 법정 서사에 최적). 반면 감정 우선 시퀀싱(Emotion-First: Emotion ➔ Evidence ➔ Meaning)은 초기 관여도가 낮은 독자의 '주변 경로(Peripheral Route)'를 즉각적으로 사로잡아 동기를 부여한 뒤 중심 경로로 전환시킨다(대중 옹호, 르포에 최적). 두 시퀀싱은 우열의 문제가 아니라 독자의 사전 동기와 장르에 따른 전략적 선택의 문제다.
  verbatim_quotes:
  - original: Under high elaboration likelihood, attitudes are formed or changed through the central route involving diligent consideration of issue-relevant arguments and evidence... Under low elaboration likelihood, persuasion occurs via the peripheral route, relying on positive or negative affective cues. Attitudes formed via the central route are more persistent, resistant to counterpersuasion, and predictive of behavior.
    translation: 정교화 가능성이 높을 때 태도는 이슈 관련 논거와 증거에 대한 성실한 숙고를 수반하는 중심 경로를 통해 형성되거나 변화한다... 정교화 가능성이 낮을 때 설득은 긍정적 또는 부정적 정서 단서에 의존하는 주변 경로를 통해 일어난다. 중심 경로를 통해 형성된 태도는 더 지속적이고, 반대 설득에 저항력이 있으며, 행동을 더 잘 예측한다.
    citation_location: pp. 123-126
story_application:
  application_idea: 롱폼 스토리의 'ELM 듀얼 시퀀싱 분기 공식 (Dual-Route Sequencing Matrix)'. 1) 교육, 과학 다큐, 법정물처럼 독자의 지적 호기심과 사전 관여도가 높은 장르에서는 'Evidence ➔ Consequence ➔ Emotion' 순서로 전개하여 반박 불가능한 지적 권위를 구축함. 2) 사회 고발, 인권 옹호, 대중 르포처럼 독자의 초기 관여도가 낮은 장르에서는 'Emotion ➔ Evidence ➔ Meaning' 순서로 전개하여 감정적 훅으로 중심 경로를 강제 개방함.
  narrative_stage: Macro Narrative Architecture & Genre Routing
  emotional_mechanics:
    trigger: 장르와 타깃 독자의 지적 상태에 맞춘 최적의 진입로 선택
    build_up: [중심 경로: 팩트의 엄밀함] 또는 [주변 경로: 감정의 절박함]의 완벽한 축적
    peak: 증거와 감정이 인간적 귀결(Consequence)에서 교차하는 전율의 순간
    release: 지적 논리와 정서적 울림이 하나로 융합되어 영속적인 신념 형성
  failure_modes: 학술/탐구형 독자에게 신파를 들이대어 경박하게 보이거나, 대중 독자에게 건조한 통계 논문식으로 들이대어 초반 이탈을 부르는 시퀀싱 미스매치
