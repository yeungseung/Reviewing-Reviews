claims_and_evidence:
  core_claim: "경이감(Awe)은 자아의 통상적 준거 틀을 압도하는 '광대성 인지(Perceived Vastness)'와 기존 정신적 스키마를 수정·확장해야 하는 '스키마 조절의 필요성(Need for Accommodation)'이라는 두 인지적 평가의 결합에서 발생하며, 인간 주인공 없이도 최고조의 감정적 몰입과 경탄을 낳는다."
  verbatim_quotes:
    - original: "Two appraisals are central to awe: the perception of vastness, and the struggle for accommodation. Awe involves an inability to assimilate experience into current mental structures, demanding that schemas be reorganized."
      translation: "경이감의 중심에는 두 가지 평가가 있다: 광대성의 지각과 조절을 위한 분투. 경이감은 현재의 정신 구조 안으로 경험을 동화시키지 못하는 무능력을 수반하며, 스키마의 전면적 재구성을 요구한다."
      citation_location: "pp.303-306"

story_application:
  application_idea: "천문학, 양자역학, 지질학, 거시경제 등 비인물형 서사에서는 인간의 사적 감정 대신 '심오한 시간/공간의 광대성(Deep Time / Cosmic Scale)'과 '기존 상식을 완전히 파괴하는 스키마 조절'을 전면에 내세워 지적 숭고미(Awe)를 설계해야 함."
  narrative_stage: "Cosmic/Scientific Climax & Sublime Resolution"
  emotional_mechanics:
    trigger: "인간 척도를 아득히 초월하는 거대한 시공간/현상의 제시"
    build_up: "기존의 작은 자아(Small Self)와 낡은 상식의 무력화"
    peak: "우주와 자연의 경이로운 인과 법칙에 대한 자각"
    release: "지적 겸허함과 존재에 대한 깊은 경외감(Awe & Elevation)"
  failure_modes: "광대성에 대한 충분한 설명이나 시각적 압도감 없이 단순 수치(몇 억 광년)만 나열하면 지루한 백과사전으로 전락함"

verification_status:
  status: "Strong Support"
