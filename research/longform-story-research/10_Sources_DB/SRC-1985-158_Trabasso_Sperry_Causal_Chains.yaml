claims_and_evidence:
  core_claim: "인간의 기억과 이해 체계는 사건들을 단순한 시간순(Chronological) 목록으로 저장하지 않고, 앞 사건이 뒷 사건의 원인이 되는 '인과 사슬(Causal Chains)' 네트워크로 부호화한다. 특히 한 사건의 결과(Answer/Outcome)가 다음 사건의 원인이나 전제 조건(Cause/New Question)으로 직접 기능하는 연쇄 구조(Answer ➔ New Question)를 가질 때, 수용자는 서사의 인과적 필연성을 인지하고 극단적인 인지적 몰입과 기억 파지력을 발휘한다."
  verbatim_quotes:
    - original: "Events in a narrative are judged important and remembered well to the extent that they lie on a causal chain... An event that answers an antecedent question while simultaneously causing the next conflict forms the backbone of story comprehension."
      translation: "서사 내의 사건들은 인과 사슬 상에 놓여 있는 정도에 따라 중요하게 평가되고 잘 기억된다... 선행 질문에 답하면서 동시에 다음 갈등을 유발하는 사건이 서사 이해의 중추를 형성한다."
      citation_location: "Journal of Memory and Language, Vol. 24, p. 595-601"

story_application:
  application_idea: "롱폼 서사의 '인과적 호기심 연쇄(Causal Curiosity Chain)' 설계 공식. 질문을 기계적으로 누적하는 대신, '질문 A ➔ 해답 A 발견 ➔ 그러나 그 해답 A가 예상치 못한 새로운 질문 B를 유발(예: 시체 발견 ➔ 독살 확인 ➔ 그러나 그 독극물은 피해자 본인이 처방받은 것? 왜?)'하는 계단식 연쇄를 구축하여 관객의 인과 추론 엔진을 폭발시킴."
  narrative_stage: "Scene-to-Scene Causal Chaining & Micro-loop Transition"
  emotional_mechanics:
    trigger: "선행 질문에 대한 명쾌한 해답 도출(Answer Closure)"
    build_up: "도출된 해답 속에 내포된 기이한 모순이나 새로운 정보 격차 발견"
    peak: "해답이 곧바로 더 위험하고 불가해한 다음 질문으로 변모하는 순간"
    release: "인과 사슬이 단단히 연결되어 있다는 인지적 통제감 및 서스펜스 획득"
  failure_modes: "해답이 다음 질문과 아무런 인과적 필연성 없이 단절되어 단순 옴니버스 퀘스트처럼 느껴지는 '작위적 단절'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "해답 A가 질문 B의 논리적 전제 조건(Logical Precondition)으로 기능해야 함"
