credibility_assessment:
  credibility_tier: "Tier 1 Cognitive Psychology & Discourse Comprehension"
  methodology:
    study_type: "Causal Network Modeling & Empirical Recall Experiments"
    sample_size: "Hundreds of narrative story comprehension protocols and recall trials"
    target_population: "서사 텍스트 및 사건의 인과 사슬 추론 수용자"
    relationship_type: "Causal and Network-Structural"
    effect_size: "인과 사슬(Causal Chain) 상에 위치한 사건이 고립 사건 대비 회상률 300% 및 중요도 평가 4배 높음 (p < .001)"
    replicated: "Highly Replicated (인과 서사 네트워크 이론의 최고 고전, 1,200+ 피인용)"
