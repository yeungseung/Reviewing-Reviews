id: SRC-1889-482
author: Anton Chekhov
year: 1889
title: 'Letters on the Short Story, the Drama, and Other Literary Topics (Chekhov''s Gun Principle)'
venue: 'Letters of Anton Chekhov (ed. L. S. Friedland, 1924, Boni and Liveright)'
tier: 1
citation_count: 5600
url: https://archive.org/details/lettersonshorts00chekuoft
key_contribution: '체호프의 총(Chekhov''s Gun) 원리 정립. 극적 경제성과 인과적 필연성 규명. "1막에 벽에 총이 걸려 있다면, 다음 막에서 그 총은 반드시 발사되어야 한다. 쏠 생각이 없다면 총을 걸어두지 말라." 서사에 등장하는 모든 주요 셋업(복선)은 피크 순간의 페이오프와 인과적으로 결합되어야 하며, 회수되지 않는 잉여 복선은 관객의 인지적 신뢰를 파괴함을 선언.'
relevance: 셋업과 페이오프의 엄밀한 인과적 결합 및 공짜 감정(Unearned Emotion) 배제의 원조 이론적 토대.
themes:
