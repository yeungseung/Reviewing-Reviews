id: SRC-2012-588
author: Danielle C. Polage
year: 2012
title: 'Making up History: False Memories of Fake News Stories'
venue: "Europe's Journal of Psychology, 8(2), pp. 245-268"
tier: 1
citation_count: 160
url: https://doi.org/10.5964/ejop.v8i2.456
key_contribution: 가짜 뉴스 및 시각 자료 결합이 역사적 사실 기억 왜곡에 미치는 효과 실증. 시각적 사진이나 B-roll이 결합된 가짜 뉴스를 접한 피험자의 64%가 사후 검사에서 해당 허구 사건을 '실제 역사에서 일어난 사실'로 오인 회상하며, 스톡 B-roll 속의 무관한 인물을 실제 사건의 가해자나 피해자로 잘못 귀인(Misattribution)함을 입증.
relevance: 맥락 없는 상업용 스톡 B-roll의 무분별한 사용이 초래하는 역사 왜곡과 오귀인 참사를 방어하기 위한 학술적 근거.
themes:
- '#59 Theme 2'
