key_contribution: "서사의 핵심 결말 원리인 '의외이지만 불가피한(Unexpected yet Inevitable)' 인과성 및 반전(Peripeteia)과 인지(Anagnorisis) 이론 정립. 결말의 해소는 외적 우연이 아니라 개연적이거나 필연적인 사건의 연쇄에서 도출되어야 함을 최초로 규명."
