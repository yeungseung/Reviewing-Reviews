claims_and_evidence:
  core_claim: "서사는 관객에게 정보를 일방적으로 전달하는 수동적 과정이 아니라, 시제(Syuzhet, 플롯)가 스토리(Fabula)의 핵심 정보를 의도적으로 지연(Retardation)시키고 간극(Gaps)을 배치함으로써 관객의 적극적 인지 가설(Inferences and Hypotheses)을 강제하는 '오픈 루프 게임'이다. 서사는 거대한 전역 의문(Global Mystery) 아래 시퀀스와 씬 단위의 국소적 정보 격차(Micro-gaps)를 지속적으로 교차 배치하여 관객의 인지적 주의를 종결(Closure)까지 견인한다."
  verbatim_quotes:
    - original: "Narration is the process by which the film's syuzhet and style interact in the course of cueing and channeling the spectator's construction of the fabula... The syuzhet creates curiosity gaps, delays information, and triggers ongoing hypothesis-testing at every scene transition."
      translation: "서술이란 영화의 시제(플롯)와 스타일이 상호작용하여 관객의 파불라(스토리) 구성을 유도하고 경로를 설정하는 과정이다... 시제는 호기심 간극을 생성하고, 정보를 지연시키며, 매 씬의 전환마다 끊임없는 가설 검증을 유발한다."
      citation_location: "University of Wisconsin Press, p. 48-53, 160"

story_application:
  application_idea: "롱폼 스토리의 '플롯 지연(Syuzhet Retardation)과 마이크로 간극(Micro-gaps)' 설계 지침. 거대 질문(Big Question)을 단번에 답하지 않고 중간에 시퀀스 단위의 장애물과 씬 단위의 지연 전술(Delay tactics)을 배치하여, 관객이 뇌내에서 끊임없이 '다음 씬에서 무엇이 밝혀질 것인가?'라는 가설을 세우도록 유도함."
  narrative_stage: "Syuzhet Structuring & Scene Hook Articulation"
  emotional_mechanics:
    trigger: "파불라 정보의 부분적 은폐 및 호기심 간극(Curiosity Gap) 생성"
    build_up: "씬 전환마다 시제의 의도적 지연(Retardation)과 하위 질문 투입"
    peak: "누적된 인지 가설들이 격돌하는 시퀀스 클라이맥스"
    release: "지연되었던 파불라 정보의 전격 공개 및 가설 확증"
  failure_modes: "지연의 이유가 합당하지 않고 단순 장난질일 때 발생하는 '인위적 정보 은폐(Cheap Mystery)에 대한 관객의 반발'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "지연된 정보가 결말에서 논리적 파불라로 온전히 재구성(Fair-play reconstruction)되어야 함"
