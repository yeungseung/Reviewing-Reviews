claims_and_evidence:
  core_claim: "가치 전환(Value Shift), 부정의 부정(Negation of the Negation), 그리고 다층적 스테이크 에스컬레이션: 이야기는 정적인 상태의 나열이 아니라 '인간 가치의 전하(+에서 -로, 혹은 -에서 +로)의 지속적 전환'이다. 진정한 서사의 깊이는 단순한 반대 가치(Contrary: 삶 vs 죽음, 사랑 vs 무관심)를 넘어 '부정의 부정(Negation of the Negation: 죽음보다 비참한 지옥 같은 삶, 사랑의 가면을 쓴 증오)'이라는 극한의 어둠까지 인물이 밀려날 때 완성된다. 또한 스테이크는 단일 차원(예: 순수 금전)에 머무르면 빠르게 진부해지며, 개인적 차원(신체·생존) ➔ 대인/사회적 차원(가족·평판) ➔ 실존/도덕적 차원(영혼·존엄·자유)으로 다층화되어 복합 충돌(Mixed Stakes)할 때 관객의 인지적 몰입과 카타르시스가 극대화된다."
  verbatim_quotes:
    - original: "A story cannot progress merely by repeating the same level of conflict... To construct an escalating narrative, the writer must press the story to the limits of human experience, moving from the positive, through the contrary and contradictory, to the Negation of the Negation... Stakes must compound across physical, social, and spiritual dimensions."
      translation: "이야기는 단순히 동일한 수준의 갈등을 반복하는 것만으로는 진전될 수 없다... 에스컬레이션되는 서사를 구성하기 위해 작가는 이야기를 긍정에서 출발하여 모순과 대립을 거쳐 '부정의 부정'에 이르는 인간 경험의 한계까지 밀어붙여야 한다... 스테이크는 물리적, 사회적, 영적 차원을 넘나들며 복합되어야 한다."
      citation_location: "pp. 317-325, 335-342"

story_application:
  application_idea: "3차원 스테이크 복합 매트릭스(3D Stakes Compounding Engine): 1막의 사건은 단순한 물리적 위기(예: 해고, 빚, 사고)로 출발하더라도, 2막 중반으로 갈수록 그것이 대인 관계적 위기(가족의 해체, 신뢰의 배신)로 번지고, 클라이맥스에서는 인물의 실존적 영혼과 도덕적 정체성(자신이 비열한 인간으로 살 것인가, 파멸하더라도 존엄을 지킬 것인가)이 걸린 궁극의 스테이크로 에스컬레이션되도록 설계함."
  narrative_stage: "Act 1 Inciting Incident (Physical), Act 2 Midpoint (Social/Relational), Act 3 Climax (Moral/Existential)"
  emotional_mechanics:
    trigger: "물리적·경제적 차원의 외적 위협 발생"
    build_up: "문제를 해결하려는 시도가 관계적 파탄과 사회적 평판의 붕괴로 전이"
    peak: "자신의 핵심 도덕적 정체성을 팔아넘겨야만 살아남을 수 있는 '부정의 부정'의 극한 시험"
    release: "타협을 거부하고 더 숭고한 인간 가치를 위해 대가를 치름으로써 진정한 카타르시스 도달"
  failure_modes: "런닝타임 내내 '돈 10억을 벌 것인가 말 것인가'라는 단일 차원 물질적 스테이크만 반복하여 관객을 지치게 만드는 평면적 서사"

