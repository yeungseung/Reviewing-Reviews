id: SRC-2004-282
title: "Balance as Bias: Global Warming and the US Prestige Press"
authors:
  - "Maxwell T. Boykoff"
  - "Jules M. Boykoff"
year: 2004
type: academic_primary
tier: 1
publication: "Global Environmental Change"
volume: "14"
issue: "2"
pages: "125-136"
doi: "10.1016/j.gloenvcha.2003.10.001"
citation_count: 3200
key_findings:
  - "저널리즘의 전통적 '기계적 중립(Norm of Balance)'이 대중에게 심각한 정보 왜곡을 초래하는 '편향으로서의 균형(Balance as Bias)' 메커니즘 규명."
  - "과학계 99%의 확립된 기후 변화 합의와 1%의 회의론자 주장을 동등한 50:50 비중으로 병기함으로써, 미디어가 대중에게 '아직 학계에 치열한 논쟁이 진행 중'이라는 거짓 등가성(False Equivalence) 착시를 주입함을 실증."
  - "정보형 서사에서 소수의 이단적 가설을 무리하게 다수설과 대등한 반전으로 포장할 때 발생하는 '가짜 다수 반전(False Majority Reversal)'의 위험성을 입증."
core_claims:
  - "증거의 무게가 압도적으로 비대칭인 사안에서 기계적 중립을 취하는 것은 객관성이 아니라 진실의 왜곡이다."
  - "거짓 등가성(False Equivalence)에 기반한 반전은 저널리즘적 공신력을 파괴하는 대표적 오용이다."
keywords:
  - balance as bias
  - false equivalence
  - media framing
  - journalistic norms
  - majority reversal misuse
