key_findings:
  - "구조주의 서사학의 기념비적 저작: 추리 서사와 픽션에서의 이중 서사 구조(The story of the crime vs The story of the investigation) 정립."
  - "서사적 변형(Narrative Transformations)의 문법 체계화: 상태, 술어, 의도, 결과, 그리고 무엇보다 인물의 정체성(Identity)과 숨겨진 동기(Motive)의 전환."
  - "탐정 서사뿐 아니라 모든 정보형 지식 서사에서 '과거에 일어난 숨겨진 진실'과 '현재 화자가 발견해 나가는 탐색 과정' 사이의 시간적·인식론적 엇갈림이 반전의 원동력임을 증명."
core_claims:
  - "서사는 두 가지 시간과 두 가지 이야기(사건 자체와 수사/발견의 이야기)의 엇갈림 속에서 의미를 창출한다."
  - "정체성 반전(Identity Reversal)과 동기 반전(Motive Reversal)은 사건의 파불라(Fabula)를 근본적으로 재구성하는 핵심 서사 변형소이다."
keywords:
