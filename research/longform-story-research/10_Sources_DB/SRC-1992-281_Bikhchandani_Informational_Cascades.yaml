id: SRC-1992-281
title: "A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades"
authors:
  - "Sushil Bikhchandani"
  - "David Hirshleifer"
  - "Ivo Welch"
year: 1992
type: academic_primary
tier: 1
publication: "Journal of Political Economy"
volume: "100"
issue: "5"
pages: "992-1026"
doi: "10.1086/261849"
citation_count: 8500
key_findings:
  - "정보 폭포(Informational Cascades) 이론 정립: 합리적 개인들이 타인의 행동을 관찰하며 자신의 사적 신호를 무시하고 다수를 모방할 때, 거대한 집단적 합의(Social Proof)가 형성됨."
  - "정보 폭포는 겉보기에 거대하고 견고해 보이지만, 실제로는 극도로 취약(Fragile)하여 단 하나의 신뢰할 수 있는 새로운 공적 정보나 이단적 사실에 의해 순식간에 역전(Collapse/Reversal)됨."
  - "서사에서 대중과 전문가 집단의 통념이 한순간에 붕괴되는 '다수 반전(Majority Reversal)'의 수리경제학적 및 사회심리학적 작동 기제 실증."
core_claims:
  - "사회적 다수의 믿음은 깊은 확신이 아니라 순차적 모방에 의한 취약한 정보 폭포일 수 있다."
  - "다수 반전(Majority Reversal)은 허위 합의의 베일을 벗겨내어 관객에게 순응을 깨부수는 지적 해방감(Epistemic Autonomy)을 선사한다."
keywords:
  - informational cascades
  - social proof
  - herd behavior
  - majority reversal
  - fragility of consensus
