key_contribution: 인지과학의 스크립트 이론(Script Theory)을 창시. 인간은 반복적 상황과 절차를 '스크립트'라는 지식 구조로 표상하여 예측하고 인지 처리를 최적화하며, 친숙한 스크립트가 안정적으로 전개되다가 결정적 순간에 발생하는 '스크립트 위반(Script Breach/Violation)'에 의해 강한 인지적 각성과 호기심이 유발됨을 입증.
relevance: 수사극·의학 드라마 등 절차적 서사(Procedural Narrative)의 반복 구조가 주는 인지적 안정감과, 그 안에서 지루함을 파괴하는 결정적 상태 변화 변주의 설계 메커니즘을 설명하는 결정적 이론.
themes:
