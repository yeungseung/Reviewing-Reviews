id: SRC-1999-374
author: Daniel J. O'Keefe
year: 1999
title: 'How to handle opposing arguments in persuasive messages: A meta-analytic review of the effects of ''sidedness'' of message'
venue: Communication Yearbook
tier: 1
citation_count: 890
url: https://doi.org/10.1080/23808985.1999.11678963
key_contribution: 단면 메시지(One-sided)와 양면 메시지(Two-sided)의 설득력 및 화자 신뢰도에 대한 대규모 메타분석 수행. 반대편 주장을 정직하게 제시하고 타당하게 논박하는 '반론형 양면 메시지(Two-sided refutational message)'가 화자의 공정성과 공신력(Credibility)을 극대화하며 일방적 주장보다 유의미하게 뛰어난 설득 효과를 발휘함을 실증.
relevance: 팩추얼 롱폼 및 논쟁적 서사에서 화자가 비판자들의 반론을 정면으로 다루어 시청자의 절대적 신뢰를 확보하는 반론형 양면 메시지 프로토콜(RTM-P)의 이론적 토대.
themes:
- '#41 Theme 3'
