id: SRC-2002-586
author: Kimberley A. Wade, Maryanne Garry, J. Don Read, & D. Stephen Lindsay
year: 2002
title: 'A Picture Is Worth a Thousand Lies: Using False Photographs to Create False Childhood Memories'
venue: Psychonomic Bulletin & Review, 9(3), pp. 597-603
tier: 1
citation_count: 780
url: https://doi.org/10.3758/BF03196318
key_contribution: 시각적 이미지 조작이 인간의 자서전적 기억에 미치는 파괴적 영향의 실험적 실증. 합성된 가짜 열기구 사진을 3회 제시한 것만으로도 성인 피험자의 50%가 실제로 겪지 않은 사건에 대해 생생하고 구체적인 허위 기억(False Memory)을 형성하고 확신함을 입증. 텍스트보다 시각적 이미지가 뇌의 비판적 출처 감시를 무력화하고 실재성 편향(Visual Truth Bias)을 강력하게 유발함을 규명.
relevance: 영상 속 연출된 재연 화면이나 스톡 B-roll이 관객의 장기 기억을 영구 왜곡하므로 시각적 출처 고지(VTS-4)가 필수적임을 뒷받침하는 핵심 원전.
themes:
- '#59 Theme 2'
