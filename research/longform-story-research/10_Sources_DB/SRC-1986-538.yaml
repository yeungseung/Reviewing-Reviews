key_contribution: "이중 부호화 이론(Dual Coding Theory, DCT)의 기념비적 원전. 인간의 인지 시스템은 언어적 시스템(Logogens)과 비언어적·시각적 시스템(Imagens)의 독립적이지만 상호 연결된 두 가지 하위 체계로 구성되어 있음을 규명. 시각과 청각이 의미적으로 완벽히 정렬될 때 부호화 시너지가 발생함을 실증."
relevance: "서사에서 내레이션 음성과 화면 이미지가 일치할 때 단일 양식 대비 정보 기억 회상률이 2배 이상 증가하는 신경학적 근거를 제공하는 핵심 이론."
