claims_and_evidence:
  core_claim: "대립 과정 이론(Opponent-Process Theory): 정서 시스템은 항상성(Homeostasis)을 유지하려 한다. 특정 정서 자극이 반복되면, 최초의 1차 정서 반응(A-process: 예, 공포, 분노, 쾌락)은 생리적 내성(Tolerance)과 습관화로 인해 점점 약화된다. 반면 신체가 균형을 맞추기 위해 자동으로 발동시키는 반대 방향의 2차 대립 반응(B-process: 예, 안도, 무기력, 갈망)은 시간이 지남에 따라 점차 강화되고 느리게 소멸한다. 따라서 동일한 감정의 강도만 지속적으로 올리는 서사는 '한계 효용 체감(Diminishing Returns)'에 직면하며, 결국 관객은 1차 감정에 둔감해지고 지루함이나 정서적 피로에 빠지게 된다."
  verbatim_quotes:
    - original: "With repeated presentations of the emotional stimulus, the primary affective response habituates, growing weaker, while the opposing secondary response grows stronger and decays more slowly... The organism inevitably adapts, demanding ever greater stimulus intensity to achieve the same affective peak."
      translation: "정서적 자극이 반복 제시됨에 따라 1차 정서 반응은 습관화되어 약해지는 반면, 대립하는 2차 반응은 더 강해지고 더 느리게 소멸한다... 유기체는 필연적으로 적응하며, 동일한 정서적 피크를 얻기 위해 훨씬 더 강한 자극 강도를 요구하게 된다."
      citation_location: "pp. 119-125"

story_application:
  application_idea: "단일 감정 에스컬레이션의 함정 탈출법: 동일한 종류의 위기(예: 칼을 든 살인마의 추격)를 3번 이상 반복하면 관객의 공포는 둔감화됨. 자극의 물리적 크기(데시벨, 유혈)만 올리면 B-process(피로, 헛웃음)가 A-process를 압도함. 단일 감정 서사(호러/스릴러)가 몰입을 유지하려면, 자극의 강도가 아니라 '인지적 평가(Appraisal: 위협의 성격 변화, 탈출 경로의 인과적 단절, 심리적 편집증)'를 참신하게 변주(Novelty)해야 함."
  narrative_stage: "Act 2 Repetitive Tension Escalation & Pacing Management"
  emotional_mechanics:
    trigger: "동일한 정서 자극의 반복 제시"
    build_up: "1차 반응(A-process)의 생리적 내성 발생 및 정서 둔감화"
    peak: "자극 강도를 올려도 정서 반응이 증가하지 않는 포화 상태(Ceiling Effect)"
    release: "새로운 인지적 차원의 개입을 통한 항상성 리셋"
  failure_modes: "폭력과 비명의 데시벨만 계속 올려 관객을 무감각과 실소(Ridicule)로 몰아넣는 B급 슬래셔의 실패"

