claims_and_evidence:
  core_claim: "관찰자가 타인의 고통이나 처지를 '관점 채택(Perspective-Taking)'을 통해 내면적으로 조망할 때 발생하는 '공감적 염려(Empathic Concern)'는 단순한 자극적 흥분(Personal Distress)과 질적으로 다르다. 단순 충돌이나 위협은 관찰자에게 회피하고 싶은 스트레스를 주지만, 한 인간의 취약성과 인간적 순간(Human Moment)에 대한 공감은 인물에 대한 지속적이고 헌신적인 정서적 투자(Emotional Investment)를 낳는다. 따라서 공감 선행(Empathy-First)은 서사의 장기적인 도덕적 지지와 애착을 구축하는 절대적 기반이다."
  verbatim_quotes:
    - original: "Adopting the perspective of another person in need produces empathic concern... This other-oriented emotion is distinct from personal distress. While personal distress motivates egoistic escape, empathic concern evokes altruistic motivation directed toward the welfare of the other."
      translation: "궁지에 처한 타인의 관점을 채택하는 것은 공감적 염려를 생성한다... 이 타인 지향적 정서는 개인적 고통(불안/스트레스)과 명백히 구분된다. 개인적 고통이 이기적인 회피(도망/이탈)를 동기화하는 반면, 공감적 염려는 타인의 안녕을 향한 이타적 동기를 유발한다."
      citation_location: "pp. 74-88"

story_application:
  application_idea: "서사 오프닝에서 총격이나 폭발보다 인물의 사소한 결핍과 따스한 인간적 유대(Human Moment)를 먼저 보여주어야 하는 이유는, 관객에게 인물의 안녕을 걱정하는 '공감적 염려'의 뿌리를 내려주기 위함임. 공감의 닻이 내려진 후 닥쳐오는 갈등은 관객에게 10배 이상의 파괴적인 정서적 서스펜스를 유발함."
  narrative_stage: "Character Introduction, Empathy-First Opening & Emotional Investment"
  emotional_mechanics:
    trigger: "인물의 연약함(Vulnerability)과 진솔한 인간적 행동 목격"
    build_up: "관점 채택을 통한 주인공과의 정서적 애착 및 공감적 염려 형성"
    peak: "해당 인물에게 닥치는 위협을 마치 내 가족의 위기처럼 체감"
    release: "인물의 시련 극복에 따른 깊은 정서적 안도와 감동"
  failure_modes: "인물에 대한 공감 형성 없이 자극적인 갈등만 난사하여 관객이 인물의 생사에 무감각해지는 오류"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "드라마, 멜로, 성장물, 휴먼 다큐 등 인물 중심 서사에 핵심 적용"
