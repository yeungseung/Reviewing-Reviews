key_contribution: 과학 혁명과 패러다임 전환(Paradigm Shift) 이론 확립. 정상 과학(Normal Science) 체계 내에서 설명되지 않는 변칙(Anomaly)의 누적으로 인한 위기와, 이를 돌파하는 새로운 패러다임의 창발 분석. 과학 및 탐구형 롱폼에서 피크가 인위적 갈등이나 액션이 아니라 '기존 인식 틀의 전복과 새로운 실재의 발견(Discovery Peak)'에서 정점을 형성함을 규명.
relevance: 과학·발견 및 탐구 서사에서 피크가 선택(Choice)이 아닌 발견(Discovery)으로 작동하는 메커니즘의 학술적 토대.
