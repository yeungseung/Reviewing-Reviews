bibliographic_info:
  title: "Negative emotion enhances memory accuracy for central features while decreasing accuracy for peripheral details"
  authors:
    - "Kensinger, Elizabeth A. (Boston College)"
  institution: "Boston College"
  published_date: "2007-08-01"
  source_url: "https://doi.org/10.1111/j.1467-8721.2007.00507.x"
  source_type: "Peer-reviewed Journal"

credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "fMRI Neuroimaging & Behavioral Experiments"
    sample_size: 156
    target_population: "건강한 성인 피험자"
    relationship_type: "Causal"
    replicated: "Replicated (Consistent with Easterbrook Cue Utilization)"
    limitations: "실험실 내 사진/단어 자극 기반으로 장편 복합 영상 서사에서의 맥락적 상호작용은 추가 분석 필요"

claims_and_evidence:
  core_claim: "정서적 자극(특히 부정적 정서/위기)은 편도체-해마 축을 활성화하여 사건의 핵심적 세부사항(Central features)에 대한 기억 정확도를 극대화하지만, 주변적 맥락(Peripheral details)에 대한 기억은 차단하고 감퇴시킨다."
  verbatim_quotes:
    - original: "Negative emotion often enhances the accuracy of memory for intrinsic, central features of an event, but at the cost of memory for peripheral details."
      translation: "부정적 정서는 종종 사건의 본질적이고 중심적인 특징에 대한 기억 정확도를 높이지만, 주변 세부사항에 대한 기억을 희생시킨다."
      citation_location: "p.213, Introduction"

story_application:
  application_idea: "시청자에게 반드시 기억시켜야 할 핵심 정보(결정적 복선, 살인 흉기, 사건의 진원지)는 강렬한 정서적 긴장 구간에 배치하고, 사소한 배경 정보는 정서가 가라앉은 구간에 배치하여 주의 왜곡을 통제함."
  narrative_stage: "Plot Turning Points & Climax"
  emotional_mechanics:
    trigger: "위기 상황 및 위협 신호"
    build_up: "주의의 터널화(Tunnel Vision)"
    peak: "중심 단서의 시각적·정서적 각인"
    release: "핵심 단서를 바탕으로 한 후속 추론"
  failure_modes: "정서적 피크 구간에 복잡하고 사소한 설명적 대사를 쏟아부으면 관객은 이를 단 1%도 기억하지 못함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "중심 세부사항과 주변 세부사항 간의 시각적·서사적 경계가 명확해야 함"
