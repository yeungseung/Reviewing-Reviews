key_contribution: 시각적 지각이 물리적 수동 수용이 아니라 능동적이고 고차원적인 지적 사고(Thinking) 행위임을 입증. 시각 형상이
  기호(Sign), 픽처(Picture), 상징(Symbol)의 3대 추상화 층위로 기능하며, 인간 뇌가 형태적 긴장(Perceptual Forces)과
  대비를 통해 추상 개념을 직관적으로 파악함을 시각 심리학적으로 규명.
relevance: 화면 기능 8종 중 SYMBOL, EMOTION, CONTRAST가 시각적 사고를 유발하고 관객 스스로 서브텍스트와 의미를 재구성하게
  만드는 지각적 메커니즘의 학술적 근거.
