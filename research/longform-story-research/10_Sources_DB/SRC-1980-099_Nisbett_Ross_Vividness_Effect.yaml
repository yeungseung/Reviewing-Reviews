claims_and_evidence:
  core_claim: "생생함 효과(Vividness Effect)와 감정적 사례의 대표성 왜곡 위험: 정서적으로 흥미롭고, 구체적이며, 감각을 자극하는 생생한 정보(Vivid Information)는 논리적 타당성이나 객관적 통계(Pallid Information)보다 인간의 인지와 기억에 불균형적으로 강력한 영향을 미친다. 서사 창작이나 저널리즘에서 감정적 충격을 극대화하기 위해 극단적이고 자극적인 단일 피해자 사례(Emotional Anecdote)만을 편향적으로 부각할 경우, 관객은 기저율(Base-rate)을 무시하고 전체 시스템을 왜곡하여 인식하게 된다. 특히 나중에 그 극적인 감정 사례가 전체를 대표하지 않는 조작이거나 예외적 돌연변이였음이 드러날 때 관객의 배신감과 신뢰도 붕괴(Backlash)는 서사 전체를 파괴한다."
  verbatim_quotes:
    - original: "Information is vivid to the degree that it is emotionally interesting, concrete and image-producing, and proximate in sensory, temporal, or spatial ways... Vivid information is far more likely to be stored, remembered, and retrieved, and thus exerts a disproportionate impact on judgments compared to pallid statistical data."
      translation: "정보는 정서적으로 흥미롭고, 구체적이며 심상을 생성하고, 감각적·시간적·공간적으로 인접할수록 생생하다... 생생한 정보는 밋밋한 통계 데이터에 비해 저장되고 기억되며 인출될 가능성이 훨씬 높아 판단에 불균형적인 영향을 미친다."
      citation_location: "pp. 43-46, 56-61"

story_application:
  application_idea: "감정적 생생함과 시스템적 대표성의 균형(Vividness-Representativeness Parity): 롱폼 탐사 서사나 다큐멘터리, 사회 고발 드라마를 기획할 때, 단 하나의 눈물겨운 비극 사례에만 의존하지 말고, 그 사례가 전체 구조적 모순을 정당하게 대변하는 인과적 고리를 함께 증명해야 함. 그래야만 감정적 분노가 일회성 동정으로 휘발되지 않고 시스템을 변화시키는 성숙한 지적·정서적 울림으로 승화됨."
  narrative_stage: "Investigative Journalism, Social Drama Case Selection, Documentaries"
  emotional_mechanics:
    trigger: "가슴을 울리는 구체적인 개인의 피해 사례 제시(생생함 확보)"
    build_up: "그 비극이 단지 개인의 불운이 아니라 사회 시스템의 구조적 필연임을 인과적으로 폭로"
    peak: "개인의 아픔과 사회적 진실이 결합하며 도덕적 분노와 지적 각성의 동시 폭발"
    release: "단순한 눈물을 넘어 시스템적 변화를 향한 실천적 통찰과 지속적 공감 획득"
  failure_modes: "통계적 사실을 무시하고 오직 시청률과 눈물을 위해 극단적인 가짜 피해자 사례를 만들어내어 서사의 공신력을 영구히 파괴하는 감정 착취(Emotional Exploitation)"

