claims_and_evidence:
  core_claim: "흥분 전이 이론(Excitation Transfer Theory): 교감신경계의 생리적 각성(Arousal: 심박수 증가, 혈압 상승, 근육 긴장)은 인지적 평가의 변화보다 훨씬 느리게 소멸한다. 따라서 선행 사건(Build-up)에서 축적된 '잔여 각성(Residual Arousal)'은 완전히 가라앉기 전에 등장하는 후속 사건(Peak)의 정서적 경험에 합산(Summation)되어, 후속 감정(분노, 기쁨, 안도, 성적 흥분)의 강도를 극적으로 증폭시킨다. 극단적 긴장 후 위기가 해소될 때 발생하는 안도감과 카타르시스는 앞선 빌드업에서 축적된 막대한 각성 에너지가 긍정적 안도로 전환된 생리적 쾌감이다."
  verbatim_quotes:
    - original: "Residual excitation from an immediately preceding emotional state will combine with the excitation produced by a subsequent stimulus, intensifying the subjective emotional experience of the subsequent event beyond what would have occurred in isolation."
      translation: "직전 정서 상태에서 남겨진 잔여 각성은 후속 자극에 의해 생성된 각성과 결합하여, 후속 사건의 주관적 정서 경험을 단독으로 발생했을 때보다 극적으로 강화한다."
      citation_location: "pp. 215-220"

story_application:
  application_idea: "클라이맥스 피크(Peak)의 폭발력은 사건 자체의 화려함이 아니라 직전 10~20분간 관객의 교감신경계를 얼마나 점진적으로 에스컬레이션(Build-up)시켜 잔여 각성을 축적해 두었는가에 결정됨. 빌드업 없이 터지는 반전이나 액션은 각성 합산이 없어 밋밋하며, 긴장이 정점에 달했을 때 단 0.1초 만에 해소(Release)를 던져줄 때 관객은 거대한 생리적 카타르시스를 경험함."
  narrative_stage: "Act 2 Escalation -> Climax Peak -> Act 3 Release / Resolution"
  emotional_mechanics:
    trigger: "초기 긴장 요소 및 장애물 진입"
    build_up: "탈출 옵션 축소와 시간 압박을 통한 교감신경 잔여 각성의 계단식 누적"
    peak: "축적된 잔여 각성이 단일 초점 사건에 100% 합산되는 감정 폭발"
    release: "위협 해소와 부교감신경 활성화를 통한 폭발적 안도감(Euphoric Relief)"
  failure_modes: "빌드업 도중 긴장을 너무 일찍 풀어버려 각성이 리셋되거나(조기 방출), 반대로 휴식 없이 각성만 지속시켜 관객을 탈진(Desensitization)시키는 실패"

