credibility_assessment:
  credibility_tier: "Tier 1 Psycholinguistics & Discourse Processing"
  methodology:
    study_type: "Controlled Eye-Tracking & Self-Paced Reading Reaction Time Experiments"
    sample_size: "Multiple experimental cohorts (N=160+ university readers)"
    target_population: "서사 및 설명 텍스트 독자 일반"
    relationship_type: "Causal Linguistic Signaling & Cognitive Processing Speed"
    effect_size: "인과/대조 연결어(because, therefore, but) 명시 시 절 간 독해 지연 시간 32% 단축, 텍스트 핵심 명제 회상률 40% 증가"
    replicated: "Highly Replicated (담화 표지 및 인과 결속 이론의 핵심 논문, 850+ 피인용)"
    limitations: "문장/문단 단위 독해 실험 중심이나 극작 및 시나리오 씬 전환 접속 구조에 직접 투영됨"

claims_and_evidence:
  core_claim: "텍스트나 대본에서 문장과 사건을 결속시키는 담화 표지(Connectives: because, therefore, but)는 단순한 문법적 장식이 아니라, 독자의 뇌에 '두 명제 사이의 논리적 관계를 어떻게 처리할 것인가'를 사전 지시하는 '인지적 교통 신호(Cognitive Traffic Signal)'이다. 인과 관계 표지(Because/Therefore)는 후행 사건을 선행 사건의 필연적 귀결로 즉각 통합시키며, 단순 첨가(And) 대비 독해 처리 시간을 32% 단축하고 상황 모델(Situation Model)의 통합성을 극대화한다."
  verbatim_quotes:
    - original: "Linguistic markers of coherence relations, such as connectives, function as cognitive processing instructions... Causal connectives immediately facilitate the integration of clauses into a coherent mental representation, reducing processing effort and enhancing recall."
      translation: "연결어와 같은 결속 관계의 언어적 표지들은 인지적 처리 지시어로 기능한다... 인과 연결어는 절들을 일관된 멘탈 표상으로 통합하는 것을 즉각 촉진하여, 처리 노력을 줄이고 회상을 향상시킨다."
      citation_location: "Discourse Processes, Vol. 30, Issue 1, pp. 37-41"

story_application:
  application_idea: "대본 비트 및 시퀀스 전환의 'WHY ➔ THEREFORE 인지 신호기 공식'. 씬과 비트를 단순히 나열(And)하지 않고, 사건과 인물의 행동을 '왜냐하면(WHY/BECAUSE)'과 '그러므로(THEREFORE)'의 명확한 인과 표지로 결속시킴. 대사나 지문에서 인물의 결단이 직전 사건의 '이유'에서 출발하여 '필연적 행동'으로 연결되도록 지시하여 관객의 인지 부하를 0으로 만들고 극적 추진력을 폭발시킴."
  narrative_stage: "Scene-to-Scene & Dialogue Logic Architecture"
  emotional_mechanics:
    trigger: "선행 위기 및 동기 발생 (WHY)"
    build_up: "인물의 내적 당위성 확립 (BECAUSE)"
    peak: "논리적 인과에 의한 불가피한 행동 결단 (THEREFORE)"
    release: "인과적 필연성에 의한 납득과 다음 위기로의 매끄러운 전이"
  failure_modes: "이유 없는 우연이나 '그리고(And then)'식 무의미한 나열로 인해 관객이 '왜 저러지?'라며 인지적 혼란에 빠지는 현상"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "대사로 모든 것을 말로 설명하는 설명조(Exposition)가 아니라 행동과 상황의 인과성으로 체화되어야 함"
