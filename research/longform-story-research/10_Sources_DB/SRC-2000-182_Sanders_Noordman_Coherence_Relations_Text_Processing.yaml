  title: "The role of coherence relations and their linguistic markers in text processing"
  authors:
    - "Sanders, Ted J. M. (Utrecht University)"
    - "Noordman, Leo G. M. (Tilburg University)"
  institution: "Utrecht University"
  published_date: "2000-07-01"
  source_url: "https://doi.org/10.1207/S15326950DP3001_03"
