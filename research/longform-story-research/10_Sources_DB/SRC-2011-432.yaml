id: SRC-2011-432
author: Teresa M. Amabile & Steven J. Kramer
year: 2011
title: 'The Power of Small Wins'
venue: Harvard Business Review
tier: 1
citation_count: 1150
url: https://hbr.org/2011/05/the-power-of-small-wins
key_contribution: 진전 원리(The Progress Principle)와 작은 승리(Small Wins)의 심리학적 위력을 규명. 인간의 내재적 동기와 몰입은 먼 미래의 거대 보상보다 일상 속에서 작지만 분명하게 체감되는 '국소적 진전(Micro Progress)'과 '작은 승리'에 의해 가장 지속적으로 유지됨을 실증.
relevance: 마이크로 스토리 블록마다 배치되는 '마이크로 페이오프(Micro Payoff)'와 진전 체감(Progress Perception)이 관객의 이탈을 방어하고 롱폼을 끝까지 완주하게 만드는 원동력임을 증명하는 핵심 근거.
themes:
