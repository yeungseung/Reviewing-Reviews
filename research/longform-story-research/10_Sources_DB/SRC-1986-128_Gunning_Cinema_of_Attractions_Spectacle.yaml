claims_and_evidence:
  core_claim: "영화 서사학에서 '매혹의 영화(Cinema of Attractions)'는 관객을 이야기의 인과 사슬(Narrative Absorption)에 몰입시키는 것이 아니라, 순수한 시각적 스펙터클과 감각적 충격(Exhibitionist Confrontation)을 통해 관객의 주의를 직접 노획한다. 따라서 오프닝에서 펼쳐지는 '감각적 스펙터클(Sensory Spectacle: 거대한 폭발, 우주적 풍경, 초호화 미장센)'은 독자적인 '인과적 서사 엔진(Narrative Engine)'이 아니라, 관객의 시청각을 마비시키는 '감각적 형식/텍스처(Sensory Form/Surface)'의 층위에 해당한다. 스펙터클 단독으로는 장기적인 인과 호기심을 유지할 수 없으며, 반드시 7대 서사 엔진(갈등, 이상징후, 시한 등)과 결합해야만 지속 가능한 서사 몰입으로 전환된다."
  verbatim_quotes:
    - original: "The cinema of attractions directly solicits spectator attention, offering a exhibitionist confrontation rather than an enrapturing diegetic absorption... It is a cinema that displays its visibility, willing to rupture a self-enclosed fictional world for a chance to challenge or astound the viewer."
      translation: "매혹의 영화는 관객의 주의를 직접적으로 갈구하며, 이야기 세계로의 황홀한 내적 몰입 대신 외향적 과시의 대면을 제공한다... 그것은 자신의 가시성을 대놓고 전시하는 영화이며, 관객에게 도전하거나 그들을 경탄하게 만들 기회를 위해 완결된 허구적 세계를 기꺼이 파열시킨다."
      citation_location: "pp. 64-66"

story_application:
  application_idea: "오프닝에서 시각적 CG나 거대한 스케일의 풍경(Sensory Spectacle)으로 시작할 때, 창작자는 그것이 서사 엔진의 대체물이 아님을 명확히 인지해야 함. 거대한 스펙터클은 첫 5초의 시각적 주의를 잡는 껍질(Form)일 뿐이며, 그 직후 즉각적으로 7대 인과 엔진(예: 스펙터클 속에 숨은 Anomaly나 Conflict, 또는 시한폭탄 Countdown)을 장착해야만 시각적 피로에 의한 이탈을 방지할 수 있음."
  narrative_stage: "Sensory Spectacle Opening, Visual Hook vs Narrative Causality Layering"
  emotional_mechanics:
    trigger: "압도적인 시청각적 스펙터클과 감각적 경이감 전시"
    build_up: "감각적 충격에서 '대체 왜 이런 일이 일어나는가?'라는 인과적 의문으로 시선 전이"
    peak: "스펙터클의 표면을 뚫고 터져 나오는 7대 서사 엔진과의 결합 목격"
    release: "단순한 눈요기에서 진정한 스토리 몰입으로의 안착"
    resonance: "감각적 미학과 서사적 인과가 하나로 융합된 완벽한 예술적 체험"
  failure_modes: "인과적 엔진 없이 10분 동안 의미 없는 CG 폭발과 풍경만 보여주어 관객을 시각적 피로와 지루함에 빠뜨리는 오류 (마이클 베이식 트랩)"

