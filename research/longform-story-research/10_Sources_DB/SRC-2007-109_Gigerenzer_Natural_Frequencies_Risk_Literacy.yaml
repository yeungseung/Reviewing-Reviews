claims_and_evidence:
  core_claim: "자연 빈도(Natural Frequencies)와 개인 선택 비용의 투명성: 인간의 뇌는 '상대 위험도 30% 감소'나 '조건부 확률 0.08' 같은 복잡한 수학적 비율을 본능적으로 처리하지 못하며 심각한 인지적 착각(Cognitive Illusion)에 빠진다. 그러나 이를 '1,000명의 사람 중 10명이 이 약을 먹으면 3명이 살아난다'는 구체적인 **자연 빈도(Natural Frequencies)**와 '한 사람이 겪는 1회의 부작용 비용'으로 다운스케일링하는 순간, 평범한 일반인뿐 아니라 의사들의 정답률과 이해도가 15%에서 85%로 수직 상승한다. 서사에서 국가 정책, 전염병 위험, 첨단 과학의 확률을 설명할 때 '몇 퍼센트의 확률' 대신 **'우리 동네 100명 중 5명이 겪는 일'**, **'이 선택을 할 때 당신이 매달 포기해야 하는 10만 원의 비용'**이라는 자연 빈도와 개인 선택 비용으로 제시해야만 관객의 뇌에서 의사결정의 무게감이 선명하게 체감된다."
  verbatim_quotes:
    - original: "Information framed in terms of conditional probabilities or relative risk produces cognitive illusions and systematic misunderstandings... When information is translated into natural frequencies—raw counts of individuals—the human mind can compute risks transparently and effortlessly."
      translation: "조건부 확률이나 상대적 위험으로 프레이밍된 정보는 인지적 착각과 체계적인 오해를 낳는다... 정보가 '자연 빈도(개인들의 실제 숫자 카운트)'로 번역될 때, 인간의 마음은 투명하고 힘들이지 않고 위험을 계산할 수 있다."
      citation_location: "pp. 53-56, 68-72"

story_application:
  application_idea: "확률의 자연 빈도화 및 기회비용 육화(Natural Frequency & Opportunity Cost): 의학 스릴러나 정치물에서 '치사율 4%'라는 추상적 대사 대신, '내일 아침 우리 학교 교실에 앉아 있는 25명의 아이 중 정확히 1명이 관 속에 들어간다'는 자연 빈도 대사로 변환함. 거대한 정부 예산 낭비를 말할 때는 '국방비 10조 원 삭감' 대신 '내 아이가 다니는 초등학교의 급식실이 폐쇄되는 비용'으로 직결시킴."
  narrative_stage: "Act 1 Problem Articulation, Act 2 Dilemma Setup, Climax Stakes Escalation"
  emotional_mechanics:
    trigger: "난해한 정책이나 의학적 위험의 발생"
    build_up: "추상적 수치가 100명 단위의 동네 사람들과 1인칭 가계 비용으로 변환"
    peak: "피할 수 없는 1인의 선택과 비극적 확률의 직면"
    release: "투명해진 진실을 바탕으로 한 단호한 저항과 결단"
  failure_modes: "백분율과 소수점 수치를 남발하여 관객이 '그래서 내 삶에 무슨 상관인가'라며 머리로만 계산하다가 흥미를 잃는 오류"

