id: SRC-2017-368
author: Naomi B. Rothman, Michael G. Pratt, Laura Rees, & Timothy J. Vogus
year: 2017
title: 'Understanding the dual nature of ambivalence: Why and when ambivalence shapes cognitive and behavioral outcomes'
venue: Academy of Management Annals
tier: 1
citation_count: 510
url: https://doi.org/10.5465/annals.2014.0066
key_contribution: 양가감정의 이중적 본성(Dual Nature)과 인지적 유연성(Cognitive Flexibility) 메커니즘 체계화. 양가감정이 일방적인 확증 편향(Confirmation Bias)을 타파하고, 타인의 복합적 동기를 입체적으로 읽어내는 관점 채택(Perspective-Taking)과 맥락적 사고(Contextual Thinking)를 촉진함을 실증. 동시에 결정 지연(Decisional Conflict)을 초래하는 경계 조건을 통합 분석.
relevance: 서사 속 인물이 흑백 논리에서 벗어나 복합적인 진실을 꿰뚫어보는 입체적 각성 및 다각도 인지 유연성을 구현하는 이론적 토대.
