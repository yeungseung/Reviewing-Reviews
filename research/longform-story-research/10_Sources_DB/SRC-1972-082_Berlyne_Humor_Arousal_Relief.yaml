claims_and_evidence:
  core_claim: "유머의 각성-톱니 메커니즘(Arousal-Jag Theory): 서사적 긴장과 위협으로 인해 생리적 각성이 과도하게 치솟았을 때, 인지적 불일치(Incongruity)를 담은 유머 자극이 개입하면 각성이 일시적으로 정점을 찍은 뒤 불일치가 해소되는 순간 급격히 온건한 기저선으로 수직 낙하(Arousal Jag)한다. 이 급격한 각성 하강 과정에서 뇌는 강렬한 쾌감과 안도감(Pleasurable Relief)을 느끼며 과부하된 신경 긴장을 안전하게 배출한다."
  verbatim_quotes:
    - original: "In the arousal-jag mechanism, arousal is driven up beyond the optimum level and then suddenly brought back down to the moderate, pleasurable range... humor serves as a biological release valve for pent-up arousal."
      translation: "각성-톱니 메커니즘에서 각성은 최적 수준 너머로 밀려 올라갔다가 갑작스럽게 온건하고 유쾌한 범위로 다시 내려온다... 유머는 축적된 각성을 위한 생물학적 방출 밸브로 기능한다."
      citation_location: "pp. 43-60"

story_application:
  application_idea: "코믹 릴리프의 정밀 연출: 긴장 피크 직후 인물의 사소한 허당끼나 상황적 아이러니(Arousal-Jag)를 투입하여 관객의 신체 긴장을 해제하고 안도감을 선사함. 단, 유머는 메인 플롯의 생존 위협 자체를 희화화해서는 안 되며(배소스 위험), 인물의 태도나 주변 소품의 엉뚱함에서 발생해야 긴장의 닻을 유지한 채 신경 피로만 리셋할 수 있음."
  narrative_stage: "Post-Crisis Respite / Comic Relief Beat"
  emotional_mechanics:
    trigger: "긴장 피크 직후 인지적 불일치를 발생시키는 유머러스한 행동/대사"
    build_up: "치솟은 서스펜스 각성의 포화"
    peak: "유머의 반전에 의한 순간적 각성 상승"
    release: "불일치 해소 및 웃음을 통한 생리적 각성의 급강하(Arousal Jag)와 안도감 방출"
  failure_modes: "서스펜스 빌드업 도중에 성급한 농담으로 긴장을 조기 방출(Premature Deflation)시키거나, 비극의 무게를 파괴하는 톤 파괴(Bathos) 실패"

verification_status:
