key_contribution: "제한 용량 매개 메시지 처리 모델(LC4MP) 정립. 미디어 수용자의 인지 자원 할당(부호화, 저장, 인출) 역학을 실증. 감정적 각성과 정보 밀도가 지속적으로 불균형할 때 자극 피로(Sensational Fatigue) 또는 인지 과부하가 발생함을 규명."
relevance: "정보 분석 구간과 감정 자극 구간의 주기적 교대 페이싱이 인지 자원의 재분배와 생리적 각성 회복(Arousal Recovery)을 가능하게 하여 장기 리텐션을 극대화한다는 실증 토대."
themes:
