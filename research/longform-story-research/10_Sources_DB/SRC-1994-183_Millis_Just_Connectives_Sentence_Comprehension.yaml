  methodology:
    study_type: "Controlled Word-by-Word Reading Time Tracking & Memory Probe Recognition"
    sample_size: "Multiple experimental cohorts (N=144 across 4 reading experiments)"
    target_population: "서사적 담화 독자 일반"
    relationship_type: "Causal Chunking & Working Memory Efficiency"
    effect_size: "인과 연결어(because) 존재 시 절 간 표상 병합 속도 45% 가속, 작업기억 인출 오류율 55% 감소"
