claims_and_evidence:
  core_claim: "인간의 '기억하는 자아(Remembering Self)'는 경험의 지속 시간(Duration)을 무시(Duration Neglect)하며, 가장 강렬했던 순간(Peak)과 마지막 순간(End)의 감정 평균치에 의해 전체 경험의 가치를 소급 판정함."
  verbatim_quotes:
    - original: "Retrospective evaluations of experiences are largely determined by the peak and the end of the episode, with little or no weight given to its duration."
      translation: "경험에 대한 소급적 평가는 에피소드의 지속 시간에 거의 또는 전혀 가중치를 두지 않고, 절정(Peak)과 결말(End)에 의해 크게 결정된다."
      citation_location: "p.401, Abstract"

story_application:
  application_idea: "롱폼 콘텐츠 기획 시 중반부 완성도에만 매달리지 말고, 관객의 뇌리에 각인될 '단 하나의 압도적 피크(Emotional Climax)'와 '여운을 남기는 완벽한 엔딩(Resonant End)'에 기획 자원의 60%를 쏟아부어라. 결말이 완벽하면 중간의 사소한 늘어짐은 관객의 기억에서 자동 소거된다."
  narrative_stage: "Climax and Resolution (End)"
  emotional_mechanics:
    trigger: "압도적 클라이맥스의 폭발"
    build_up: "중반부의 인과적 축적"
    peak: "감정의 최고 정점 (Peak)"
    release: "가치 있는 교훈이나 감동적 여운으로 마감되는 결말 (End)"
  failure_modes: "용두사미: 중반까지 아무리 훌륭해도 결말이 허무하면 관객의 기억 속에서 작품 전체가 망작으로 낙인찍힘"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "완주를 전제로 한 사후 평가 및 재시청/추천 의도"
