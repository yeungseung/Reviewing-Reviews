claims_and_evidence:
  core_claim: "인간의 정보 교환 방식은 메시지 자체에 모든 정보가 명시되어야 하는 '저맥락 문화(Low-Context Culture: 미국, 서유럽 등)'와, 메시지 자체보다는 배경 맥락과 관계적 정서가 공유되어야 이해가 완성되는 '고맥락 문화(High-Context Culture: 한국, 일본, 동아시아 등)'로 근본적으로 양분된다. 서사 오프닝에서도 저맥락 수용자는 0초에 직접적인 충돌(Conflict)이나 가시적 이상징후(Anomaly)를 던져주는 직접적 오프닝에 높은 호응을 보이는 반면, 고맥락 수용자는 인물의 관계성, 사회적 분위기, 인간적 유대(Human Moment)라는 배경 맥락(Context)이 결여된 날것의 갈등을 '천박한 폭력'이나 '무맥락 소음'으로 거부하는 경향이 뚜렷하다. 따라서 오프닝 엔진의 선택은 문화적 맥락 수용도에 최적화되어야 한다."
  verbatim_quotes:
    - original: "A high-context (HC) communication or message is one in which most of the information is already in the person, while very little is in the coded, explicit, transmitted part of the message. A low-context (LC) communication is just the opposite; i.e., the mass of the information is vested in the explicit code."
      translation: "고맥락(HC) 커뮤니케이션이나 메시지는 대부분의 정보가 이미 수신자 내면에 존재하며, 부호화되어 명시적으로 전달되는 메시지 부분에는 극히 적은 정보만 들어있는 경우를 말한다. 저맥락(LC) 커뮤니케이션은 그 정반대로서, 대부분의 정보가 명시적인 코드 자체에 부여되어 있다."
      citation_location: "p. 91"

story_application:
  application_idea: "글로벌 타깃 서사 및 로컬 서사 기획 시 오프닝 엔진의 맥락 요구량을 조절함. 저맥락 서구 시장을 겨냥할 때는 명시적 인과 질문을 던지는 Conflict, Countdown, Result First를 전면에 세우고, 고맥락 동양 시장이나 프리미엄 롱폼 드라마에서는 인물의 처지와 관계적 온도를 보여주는 Human Moment나 Contradiction을 결합하여 맥락 결핍에 따른 관객의 반발을 방어함."
  narrative_stage: "Opening Engine Cross-Cultural Adaptation, Context-Dependency Calibration"
  emotional_mechanics:
    trigger: "문화권의 맥락 기대치에 부합하는 정교한 오프닝 자극 투척"
    build_up: "저맥락 관객에게는 명시적 질문을, 고맥락 관객에게는 관계적 분위기를 프라이밍"
    peak: "문화적 거부감 없는 자연스러운 서사 몰입과 인지적 락인"
    release: "문화적 스키마와 완벽히 동기화된 인과 전개 수용"
    resonance: "보편적이면서도 문화적 결을 살린 명품 서사로서의 평가 획득"
  failure_modes: "고맥락 문화권에서 아무런 사전 관계 설명 없이 첫 장면부터 잔혹한 칼부림이나 난해한 살인을 던져 관객에게 혐오감과 불쾌감을 안기는 문화적 톤 파괴 오류"

