claims_and_evidence:
  core_claim: "생생한 정보(Vivid information)가 차분하고 창백한 통계 정보(Pallid information)보다 태도 변화나 설득을 항상 더 크게 유발한다는 직관적 통념은 실증적으로 입증되지 않았다. 주의(Attention)가 통제된 조건에서 생생함은 즉각적 설득보다 '기억 가용성(Memory Availability)'과 '심상 형성(Mental Imagery)'에 지대한 영향을 미치며, 핵심 주장과 무관한 주변적 세부사항이 생생할 경우 오히려 주의를 분산시켜 설득을 저해한다."
  verbatim_quotes:
    - original: "The vividness effect has been widely accepted in social psychology... However, a review of the empirical literature reveals that vividness has weak and inconsistent effects on persuasion when attention is held constant. The primary effects of vividness appear to be on memory and cognitive availability rather than immediate attitude change."
      translation: "생생함 효과는 사회심리학에서 널리 수용되어 왔다... 그러나 실증 문헌들을 검토한 결과, 주의가 일정하게 통제될 때 생생함이 설득에 미치는 영향은 미약하고 일관되지 않은 것으로 드러났다. 생생함의 주된 효과는 즉각적인 태도 변화보다는 기억과 인지적 가용성에 미치는 것으로 나타난다."
      citation_location: "pp. 155-156"

story_application:
  application_idea: "서사에서 구체적이고 생생한 감각 묘사는 '관객의 즉각적 동의나 감정적 강요'를 위해 남용되어서는 안 되며, 장기적 기억 회상과 인지적 가용성(Availability)을 점화하는 닻(Anchor)으로 작동해야 함. 핵심 주제와 무관한 곁가지 묘사의 과도한 생생함은 서사의 주제 의식을 희석시키는 독이 됨."
  narrative_stage: "Scene Architecture & Diagnostic Detail Selection"
  emotional_mechanics:
    trigger: "감각적으로 선명하고 구체적인 단서의 제시"
    build_up: "심상 형성을 통한 기억 인코딩 강화"
    peak: "사건 회상 시 해당 디테일을 매개로 한 인과적 맥락의 즉각적 재활성화"
    release: "불필요한 감정 과잉이나 주의 분산 없이 핵심 메시지에 안착"
  failure_modes: "주제와 무관한 잔인성, 선정성, 화려한 미사여구만 생생하게 강조하여 관객이 핵심 갈등을 놓치는 '생생함 주의 분산(Vividness Distraction)' 유발"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "생생함 효과는 메시지/사건의 핵심 인과 축과 정렬될 때만 정서적 기억과 설득을 강화하며, 주변적일 때는 주의 분산 효과로 반전됨"
