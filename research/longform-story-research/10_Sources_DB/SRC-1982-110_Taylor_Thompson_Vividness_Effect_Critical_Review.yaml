  methodology:
    study_type: "Systematic Meta-Synthesis & Critical Review"
    sample_size: "Dozens of experimental studies synthesized"
    target_population: "Human subjects across laboratory persuasion and social cognition studies"
    relationship_type: "Causal / Boundary Definition"
