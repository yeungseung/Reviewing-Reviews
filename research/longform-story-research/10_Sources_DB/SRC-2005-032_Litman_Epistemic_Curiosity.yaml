claims_and_evidence:
  core_claim: "지적 호기심(Epistemic Curiosity)은 즐거운 탐색을 지향하는 흥미형(I-Type)과, 알지 못함에서 오는 인지적 결핍과 긴장을 해소하려는 결핍형(D-Type)으로 양분되며, 결핍형 호기심은 강력한 서사적 긴장감(Intellectual Drama)을 유발한다."
  verbatim_quotes:
    - original: "Deprivation-type curiosity (D-type) reflects a feeling of deprivation that arises from lacking information... it functions like a drive state to reduce the unpleasant uncertainty of an epistemic gap."
      translation: "결핍형 호기심(D-Type)은 정보 부족에서 발생하는 결핍감을 반영하며... 지적 공백의 불쾌한 불확실성을 줄이려는 충동 상태로 기능한다."
      citation_location: "p.161, Abstract & Model"

story_application:
  application_idea: "고전적 캐릭터 플롯이 없는 강연, 철학 에세이, 사설형 콘텐츠에서, 관객에게 풀리지 않는 도덕적 딜레마나 모순(Paradox)을 던져 D-Type 결핍형 호기심을 유발함으로써 서사적 긴장감(Intellectual Drama)을 창출함."
  narrative_stage: "Act 1 Hook & Core Dilemma"
  emotional_mechanics:
    trigger: "모순된 가치관이나 설명 불가능한 현상의 제시"
    build_up: "결핍형 호기심(D-Type EC)으로 인한 긴장과 몰입"
    peak: "사고실험의 충돌과 통찰"
    release: "지적 의문 해소 및 에우다이모니아적 충만감"
  failure_modes: "지적 결핍을 자극하지 않고 단순한 상식만 나열하면 흥미형(I-Type)의 가벼운 관심조차 얻지 못하고 이탈함"

