key_findings:
  - "서사 해석학의 최고 고전: 시간성과 서사의 상호 구성성 규명."
  - "3단계 미메시스(Mimesis I: 선이해, Mimesis II: 플롯 구성, Mimesis III: 재서술/수용)와 '불일치의 일치(Discordant Concordance, concordance discordante)' 모델 제시."
  - "플롯화(Emplotment, muthos)는 이질적인 사건들, 의외의 사고, 모순적 결과를 하나의 통일된 시간적 전체로 통합하며, 결말 시점에서 과거의 모든 사건들을 새로운 의미와 가치(Value Reversal, Time Reversal)로 소급 재조명함."
core_claims:
  - "시간은 서사적으로 명명될 때 비로소 인간적 시간이 되며, 서사는 시간의 이질적 사건들을 '불일치의 일치'로 종합한다."
  - "시간 반전(Time Reversal)과 가치 반전(Value Reversal)은 파편화된 사건들을 하나의 성숙한 세계관으로 통합하는 해석학적 원리이다."
keywords:
  - time and narrative
  - emplotment
  - discordant concordance
  - hermeneutics
  - time reversal
  - value reversal
