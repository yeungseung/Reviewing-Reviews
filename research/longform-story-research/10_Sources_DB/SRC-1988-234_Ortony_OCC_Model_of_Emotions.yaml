bibliographic_info:
  title: The cognitive structure of emotions
  authors:
  - Ortony, Andrew (University of Illinois at Urbana-Champaign)
  - Clore, Gerald L. (University of Illinois at Urbana-Champaign)
  - Collins, Allan (BBN Laboratories)
  institution: University of Illinois at Urbana-Champaign
  published_date: '1988-07-29'
  source_url: https://doi.org/10.1017/CBO9780511571299
  source_type: Academic Book / Theoretical Monument (Cambridge University Press)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Science & Affective Computing Supreme Monument
  methodology:
    study_type: Computational Cognitive Appraisal Theory Formulation (The OCC Model of Emotions)
    sample_size: 인간 정서 어휘, 인지 평가 차원 및 사건 지각 심리학 전반 종합 모델링
    target_population: 사건의 결과를 기대하고 경험하는 인간 인지 시스템 및 인공지능 에이전트
    relationship_type: Exact Structural Cognitive Architecture (Prospect-based Emotions: Hope vs Fear, and Confirmation Dynamics: Relief vs Disappointment)
    effect_size: 인간의 감정이 사건의 바람직함(Desirability)과 결과의 발생 가능성(Likelihood)에 대한 인지적 평가(Appraisal)에 의해 생성됨을 정립. 특히 '결과에 대한 예상(Prospect)'에서 희망(Hope)과 공포(Fear)가 발생하고, 결과 실현 여부에 따라 안도(Relief), 실망(Disappointment), 만족(Satisfaction), 공포 확인(Fears-confirmed)으로 전이되는 수리적 감정 분류 체계 확립 (10,000+ 피인용 불멸의 고전)
    replicated: Universally Replicated and established as the industry standard model in affective computing, cognitive psychology, and game narrative AI
    limitations: 규칙 기반 인지 평가 중심이나 서사 수용 시 관객의 기대 감정 흐름을 분석하는 가장 정밀한 프레임워크 제공
claims_and_evidence:
  core_claim: 감정은 무작위적인 신체 반응이 아니라 상황에 대한 고차원 인지적 평가(Appraisal)의 구조화된 산물이다(OCC 모델). 특히 미래 사건의 결과를 시뮬레이션할 때 인간은 '예상 기반 정서(Prospect-based Emotions)'를 경험한다. 바람직한 미래 결과에 대한 기대는 '희망(Hope)'을 낳고, 바람직하지 않은 미래 결과에 대한 우려는 '공포(Fear)'를 낳는다. 이후 실제 결과가 도래했을 때, 희망이 실현되면 '만족(Satisfaction)', 희망이 좌절되면 '실망(Disappointment)'이 발생하며, 공포가 빗나가면 '안도(Relief)', 공포가 적중하면 '두려움의 확인(Fears-confirmed)'으로 전이된다. 스토리의 서스펜스와 감정선은 이 6대 예상 기반 정서의 확률적 진폭을 조율하는 인지 공학에 의해 창출된다.
  verbatim_quotes:
  - original: Prospect-based emotions are triggered by anticipation of desirable or undesirable events: hope arises from anticipating a desirable event, whereas fear arises from anticipating an undesirable one... When the outcome occurs, hope transitions to satisfaction or disappointment, and fear transitions to relief or fears-confirmed.
    translation: 예상 기반 정서는 바람직하거나 바람직하지 않은 사건의 기대에 의해 유발된다. 희망은 바람직한 사건을 예상할 때 발생하고, 공포는 바람직하지 않은 사건을 예상할 때 발생한다... 결과가 실현될 때 희망은 만족이나 실망으로 전이되고, 공포는 안도나 공포 확인으로 전이된다.
    citation_location: pp. 109-112
story_application:
  application_idea: 롱폼 스토리의 'OCC 예상 감정 진폭 매트릭스 (OCC Prospect Emotion Matrix)'. 스토리텔러는 단순히 슬프거나 기쁜 사건을 던지는 것이 아니라, 사건 발생 전 관객 머릿속에 '바람직한 결과(희망)'와 '파멸적 결과(공포)'의 확률적 줄다리기를 먼저 걸어야 함. 희망 80% 상태에서 터지는 '실망'은 비극적 충격을 극대화하고, 공포 90%의 절체절명 순간에 터지는 '안도'는 영혼을 뒤흔드는 카타르시스를 선사함.
  narrative_stage: Plot Pacing, Suspense Building, Emotional Flow & Climactic Relief
  emotional_mechanics:
    trigger: 명확한 목표와 위협이 병존하는 상황에서 가동되는 희망과 공포의 동시 예측
    build_up: 파멸의 확률(공포)이 90%까지 상승하며 조여오는 교감신경계 긴장감
    peak: 실제 결과가 드러나는 0.1초의 전환점
    release: 최악의 공포가 극적으로 비껴가며 터져 나오는 안도(Relief)와 전율
  failure_modes: 아무런 결과 예측도 형성되지 않은 상태에서 뜬금없이 사건이 터져 관객이 감정적 예열(Prospect)을 전혀 거치지 못하는 정서적 단절(Cold Surprise)
verification_status:
