bibliographic_info:
  title: 'Arousal-biased competition in perception and memory'
  authors:
  - Mather, Mara (University of Southern California)
  - Sutherland, Matthew R. (University of Southern California)
  institution: University of Southern California
  published_date: '2011-02-01'
  source_url: https://doi.org/10.1017/S0140525X1000068X
  source_type: Peer-reviewed Journal (Behavioral and Brain Sciences, 34(1), 1-16)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Neuroscience Landmark
  methodology:
    study_type: Neurocognitive Theory Synthesis & Meta-Analysis of fMRI/Behavioral Studies
    sample_size: 수백 건의 각성-기억 신경과학 및 안구 추적 실험 종합
    target_population: 감정적 자극 하에서 지각 및 기억 처리를 수행하는 인간 두뇌 인지 시스템
    relationship_type: Foundational Neurocognitive Mechanism (Arousal-Biased Competition, ABC Theory: Locus Coeruleus-Norepinephrine -> High-Priority Winner-Take-All)
    effect_size: 정서적 각성(Arousal)은 우선순위가 높은 핵심 목표/중심 정보의 지각 민감도와 장기 파지를 극적으로 향상시키는 반면, 저우선순위 주변 정보는 능동적으로 억제함 (1,200+ 피인용 랜드마크)
    replicated: Universally Replicated in Cognitive Neuroscience and Memory Studies
    limitations: 실험실 지각 및 기억 과제 중심이나 서사의 감정선과 핵심 증거 전달에 1:1 완벽하게 적용됨
claims_and_evidence:
  core_claim: 정서적 각성(Emotional Arousal)은 단순히 모든 기억을 무차별적으로 강화하거나 저하시키지 않는다. 각성은 뇌의 자원 경쟁을 '승자독식(Winner-Take-All)' 방식으로 재편하는 '각성 편향 경쟁(Arousal-Biased Competition: ABC)'을 유발한다. 즉, 각성 상태에서 독자의 뇌는 서사적으로 가장 중요한 '핵심 증거(High-Priority Evidence)'에 주의를 극단적으로 집중시켜 장기기억으로 응고화(Consolidation)하는 반면, 중요도가 떨어지는 주변 세부 정보(Low-Priority Details)는 철저히 배제하고 억제한다.
  verbatim_quotes:
  - original: Arousal enhances processing of high-priority information while impairing processing of low-priority information. Under arousal, competition for representation is biased even further toward high-priority stimuli, both in perception and in memory consolidation.
    translation: 각성은 우선순위가 높은 정보의 처리를 강화하는 반면, 우선순위가 낮은 정보의 처리는 저해한다. 각성 하에서 표상을 차지하기 위한 경쟁은 지각과 기억 응고화 모두에서 우선순위가 높은 자극 쪽으로 더욱 편향된다.
    citation_location: pp. 1-3
story_application:
  application_idea: 롱폼 스토리의 'ABC 증거 각인 프로토콜 (Arousal-Biased Evidence Imprinting)'. 서사의 핵심적인 복선, 살인 흉기, 결정적 회계 장부, 비밀 계약서 등 관객이 절대로 잊어서는 안 되는 '핵심 증거(High-Priority Evidence)'를 제시할 때, 먼저 인물의 극적 위기나 서스펜스(Arousal)를 정점까지 끌어올린 후 그 순간 한가운데에 증거를 단독으로 노출하여 관객의 뇌에 영구 각인시킴.
  narrative_stage: Crisis Climax, Evidence Revelation & Suspense Build-up
  emotional_mechanics:
    trigger: 다가오는 파멸이나 위협으로 인한 관객의 심박수 상승 및 정서적 각성
    build_up: 모든 감각적 노이즈가 제거되고 시야가 좁아지는 터널 비전(Tunnel Vision) 형성
    peak: 각성의 최고조에서 핵심 증거가 번개처럼 드러나는 순간의 충격
    release: 핵심 증거가 뇌에 완벽히 응고화되며 형성되는 강력한 서사적 쾌감
  failure_modes: 아무런 긴장감이나 정서적 각성이 없는 밋밋한 설명 구간에 핵심 증거를 던져 독자가 그냥 흘려보내게 만드는 연출 실패
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 미스터리, 스릴러, 탐사 저널리즘, 법정물, 역사 다큐멘터리 등 핵심 증거가 기억되어야 하는 모든 서사
