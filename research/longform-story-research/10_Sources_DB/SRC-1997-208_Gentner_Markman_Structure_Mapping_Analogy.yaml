bibliographic_info:
  title: 'Structure mapping in analogy and similarity'
  authors:
  - Gentner, Dedre (Northwestern University)
  - Markman, Arthur B. (Columbia University)
  institution: Northwestern University & Columbia University
  published_date: '1997-01-01'
  source_url: https://doi.org/10.1037/0003-066X.52.1.45
  source_type: Peer-reviewed Journal (American Psychologist, 52(1), 45-56)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Science & Analogy Landmark
  methodology:
    study_type: Theoretical Synthesis & Experimental Cognitive Science Meta-Evaluation
    sample_size: 다중 유추 및 유사성 판단 실험 20+ 연구 종합 (수천 명의 피험자 데이터 기반)
    target_population: 유추와 비유를 통해 새로운 지식과 추상적 개념을 학습하는 인간 인지 주체
    relationship_type: Causal Structural Alignment (Base Domain Structure -> 1-to-1 Mapping -> Target Domain Inference Transfer)
    effect_size: 구조적 사상(Structure-Mapping)이 체계적일 때(Systematicity Principle), 표면적 특징만 유사한 경우보다 유추에 의한 추론 정확도와 기억 전이율이 70% 이상 높음 (3,100+ 피인용 기념비적 논문)
    replicated: Universally Replicated in Cognitive Science and Educational Psychology
    limitations: 인지 과학 일반 유추 이론이나 수치·규모 유추(Scale Analogy)의 왜곡 방지 및 정확성 검증에 완벽히 적용됨
claims_and_evidence:
  core_claim: 유추(Analogy)는 단순히 겉모습이 비슷한 사물을 맞바꾸는 것이 아니라, 친숙한 기저 영역(Base Domain)의 관계 체계를 낯설고 추상적인 목표 영역(Target Domain)에 '1대1 정렬(Structural Alignment)'시키는 고차원적 인지 과정이다. 숫자의 인간 척도 비유(Human-Scale Analogy)가 성공하려면 관계적 구조(Structure)가 완벽히 보존되어야 하며, 만약 표면적 유사성에만 매달려 스케일의 인과 관계나 비율을 왜곡하면(Scale Distortion), 인지 시스템은 치명적인 오개념과 잘못된 판단(False Inferences)을 초래한다.
  verbatim_quotes:
  - original: Analogy is the mapping of knowledge from one domain (the base) into another (the target), which conveys that a system of relations known to hold in the base also holds in the target. Aligning the two representations depends on structural consistency: one-to-one correspondence and parallel connectivity. When structural alignment is violated, analogies mislead rather than illuminate.
    translation: 유추는 한 영역(기저)의 지식을 다른 영역(목표)으로 사상하는 것으로, 기저 영역에 성립하는 것으로 알려진 관계 체계가 목표 영역에서도 성립함을 전달한다. 두 표상을 정렬하는 것은 구조적 일관성(1대1 대응과 병렬 연결성)에 달려 있다. 이러한 구조적 정렬이 훼손될 때, 비유는 대상을 조명하기보다 오히려 오도하게 된다.
    citation_location: pp. 45-47
story_application:
  application_idea: 롱폼 스토리의 '정밀 구조 사상 유추(Precision Structural Analogy) 설계'. 천문학적 수치나 복잡한 과학/금융 통계를 비유로 치환할 때, 자극적인 표면 비유(예: "원자핵은 축구장 한가운데 놓인 모래알")를 마구 쓰지 않고, 1) 1대1 크기 비율 보존, 2) 시간·공간적 인과 관계 보존, 3) 스케일 왜곡 방지 필터를 적용하여 독자의 지적 신뢰를 지키는 정교한 유추 기법.
  narrative_stage: Deep Concept Delivery & Explanatory Narrative
  emotional_mechanics:
    trigger: 이해 불가능한 거대 수치나 미세 수치(나노 입자, 국방 예산)에 직면한 관객의 좌절
    build_up: 완벽하게 비례가 일치하는 친숙한 기저 영역(내 몸, 우리 집, 1분의 시간)의 구조 정렬
    peak: 복잡한 수치 관계가 하나의 일상적 풍경으로 투명하게 변환되는 '아하(Aha!) 모먼트'
    release: 지적 이해의 희열 및 서사적 팩트에 대한 완전한 신뢰감 확보
  failure_modes: 숫자의 극적 효과만을 노리고 비율이 왜곡된 엉터리 비유를 사용하여 전문가나 날카로운 독자에게 지적 환멸을 안기고 서사의 신뢰도를 붕괴시키는 스케일 왜곡의 함정
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 과학 서사, 경제·금융 다큐멘터리, 탐사 저널리즘 등 복잡한 수치 스케일을 다루는 모든 롱폼 장르
