  url: https://doi.org/10.4135/9781452243382
  key_contribution: 시각적 설득의 3대 특성(지표성 Indexicality, 도상성 Iconicity, 통사적 비결정성 Syntactic
    Indeterminacy) 규명. 이미지는 언어와 달리 명시적 명제 형식을 띠지 않기 때문에 시청자의 의식적 비판 검증을 우회하여 무의식적
    신뢰와 감정을 조작하기 쉽다는 시각적 조작 위험(Visual Manipulation)을 체계화.
