- id: SRC-1987-290
  author: Nancy Kanwisher
  year: 1987
  title: 'Repetition Blindness: Type Recognition Without Token Individuation'
  venue: Cognition
  tier: 1
  citation_count: 850
  url: https://doi.org/10.1016/0010-0277(87)90016-3
  key_contribution: 동일하거나 유사한 자극이 짧은 시간 간격으로 반복될 때 두 번째 자극의 인지적 처리가 누락되는 반복 맹목(Repetition
    Blindness)의 신경심리학적 메커니즘을 규명하여, 언어적 수사나 자극적 톤의 단순 반복이 관객에게 인식되지 않고 흘러가는 인지적 둔마
    현상을 입증.
  relevance: 가짜 Rehook이 자극적 형용사나 톤을 반복할 때 시청자의 뇌에서 발생하는 인지적 불감증과 정보 처리 누락을 설명하는 핵심
    이론.
  themes:
  - '#34 Theme 2'
- id: SRC-1960-291
  author: Daniel E. Berlyne
  year: 1960
  title: Conflict, Arousal, and Curiosity
  venue: McGraw-Hill
  tier: 1
  citation_count: 7800
  url: https://psycnet.apa.org/record/1961-03206-000
  key_contribution: 표면적 감각 자극에 반응하는 지각적 호기심(Perceptual Curiosity)과 지식의 불일치 및 개념적 갈등에서
    비롯되는 인식론적 호기심(Epistemic Curiosity)을 구분하고, 의미론적 신기성(Semantic Novelty)만이 지속적인 탐색
    행동과 높은 인지적 각성을 유지함을 정초.
  relevance: 언어만 과격해지는 표면적 훅과 인과·지식 상태를 갱신하는 실질적 Rehook의 인지적 차이를 설명하는 심리학적 기초.
  themes:
  - '#34 Theme 2'
- id: SRC-1975-292
  author: H. Paul Grice
  year: 1975
  title: Logic and Conversation
  venue: 'Syntax and Semantics, Vol. 3: Speech Acts (Academic Press)'
  tier: 1
  citation_count: 42000
  url: https://www.ucl.ac.uk/ls/studypacks/Grice-Logic.pdf
  key_contribution: 화자와 청자 간의 대화 협력 원칙(Cooperative Principle)과 4대 대화 격률(양·질·관계·태도)을
    정립하여, 약속된 정보가 제공되지 않거나 과장된 언어적 낚시가 화용론적 계약 위반(Breach of Pragmatic Contract)과 청자의
    냉소적 불신을 초래함을 규명.
  relevance: 가짜 Rehook이 시청자에게 약속한 정보 갱신을 이행하지 않을 때 발생하는 서사적 신뢰 붕괴(Narrative Contract
    Breach)를 규명하는 화용론적 기초.
  themes:
  - '#34 Theme 2'
- id: SRC-1970-293
  author: Philip M. Groves & Richard F. Thompson
  year: 1970
  title: 'Habituation: A Dual-Process Theory'
  venue: Psychological Review
  tier: 1
  citation_count: 2900
  url: https://doi.org/10.1037/h0029810
  key_contribution: 반복되는 자극에 대한 신경 반응의 점진적 감쇠를 설명하는 습관화(Habituation)와 배경 각성에 따른 감작(Sensitization)의
    신경학적 이중 과정 모델을 제시하여, 실질적 상태 변화 없는 단순 자극 강화(Empty Escalation)가 왜 필연적으로 신경 둔마와 흥미
    상실로 귀결되는지를 규명.
  relevance: 목소리 톤이나 BGM만 키우고 내용 변화가 없는 가짜 에스컬레이션이 시청자를 피로하게 만드는 신경생리학적 원리 설명.
  themes:
  - '#34 Theme 2'
- id: SRC-1995-294
  author: Rolf A. Zwaan, Mark C. Langston & Arthur C. Graesser
  year: 1995
  title: 'The Construction of Situation Models in Language Comprehension: An Event-Indexing
    Model'
  venue: Psychological Science
  tier: 1
  citation_count: 1550
  url: https://doi.org/10.1111/j.1467-9280.1995.tb00513.x
  key_contribution: 서사 이해 과정에서 관객이 시간(Time), 공간(Space), 인과(Causality), 행위 주체(Protagonist),
    의도/목표(Intentionality)의 5개 차원을 모니터링하며 상황 모델을 갱신한다는 사건 색인 모델(Event-Indexing Model)을
    수립하여, Rehook 유형(시간 이동, 원인 전환, 주체 교체 등)의 인지적 갱신 메커니즘을 이론적으로 정초.
  relevance: Rehook의 10대 유형이 인간의 5차원 상황 모델 중 어떤 차원을 집중적으로 리셋하는지 설명하는 핵심 모델.
  themes:
  - '#35 Theme 1'
- id: SRC-2007-295
  author: Deborah A. Small, George Loewenstein & Paul Slovic
  year: 2007
  title: 'Sympathy and Callousness: The Impact of Deliberative Thought on Donations
    to Identifiable vs. Statistical Victims'
  venue: Journal of Marketing Research
  tier: 1
  citation_count: 2250
  url: https://doi.org/10.1509/jmkr.44.2.207
  key_contribution: 대규모 통계 데이터(Statistical Data)는 냉철한 계산적 사고를 유도하여 공감을 반감시키는 반면, 단
    한 명의 구체적 개인(Identifiable Victim)은 즉각적인 정서적 몰입과 행동을 격발함을 실증하여, 데이터형 Rehook과 인간
    사례형 Rehook의 교차 배치의 필수성을 입증.
  relevance: 거시적 데이터 분석과 미시적 인물 드라마를 결합하는 Human-Data Alternation Rehook의 학술적 근거.
  themes:
  - '#35 Theme 1'
- id: SRC-2001-296
  author: Jonathan Haidt
  year: 2001
  title: 'The Emotional Dog and Its Rational Tail: A Social Intuitionist Approach
    to Moral Judgment'
  venue: Psychological Review
  tier: 1
  citation_count: 18200
  url: https://doi.org/10.1037/0033-295X.108.4.814
  key_contribution: 도덕적 판단은 느린 이성적 추론이 아니라 즉각적인 직관적 정서 반응(Intuitive Response)에 의해
    결정됨을 규명한 사회적 직관주의 모델(Social Intuitionist Model)을 제시하여, 가치 충돌(Value Conflict) 및
    새로운 희생자형 Rehook이 시청자의 감정적 몰입과 도덕적 관여도를 급증시키는 원리를 설명.
  relevance: 정의 vs 생존, 효율 vs 윤리 등 도덕적 가치 딜레마를 활용한 Rehook이 관객의 정서적 판돈을 폭발시키는 원리 제공.
  themes:
  - '#35 Theme 1'
- id: SRC-1994-297
  author: Arthur C. Graesser & Natalie K. Person
  year: 1994
  title: Question Asking During Tutoring
  venue: American Educational Research Journal
  tier: 1
  citation_count: 1250
  url: https://doi.org/10.3102/00028312031001104
  key_contribution: '단순 사실 확인 질문(Shallow Questions)과 인과 관계, 목적, 결과를 파고드는 심층 추론 질문(Deep-reasoning
    Questions: Why, How, What-if)을 분류하고, 심층 질문만이 학습자의 인지적 불일치를 해소하기 위한 고도의 탐색적 인지
    처리를 촉발함을 실증.'
  relevance: 단순 수사적 질문이 아닌 심층 추론 질문(Deep Question Rehook)이 시청자의 시청 이유를 재창출하는 메커니즘
    규명.
  themes:
  - '#35 Theme 1'
- id: SRC-1998-298
  author: John Sweller, Jeroen J. G. van Merriënboer & Fred G. W. C. Paas
  year: 1998
  title: Cognitive Architecture and Instructional Design
  venue: Educational Psychology Review
  tier: 1
  citation_count: 13500
  url: https://doi.org/10.1023/A:1022193728205
  key_contribution: 인간 인지 구조에서 작업기억의 한계와 스키마 형성 메커니즘을 규명하고 본질적(Intrinsic), 외재적(Extraneous),
    관련(Germane) 인지 부하 모델을 정립하여, 롱폼 서사에서 Rehook의 유형 전환이 불필요한 외재적 부하를 초래하지 않고 유의미한 이해를
    증진시키는 설계 원리를 제공.
  relevance: Rehook의 잦은 포맷/유형 전환이 관객의 작업기억을 마비시키는 역효과 방지 및 최적 전환 간격 설계의 핵심 이론.
  themes:
  - '#35 Theme 2'
- id: SRC-2002-299
  author: Richard E. Mayer
  year: 2002
  title: Cognitive Theory of Multimedia Learning
  venue: The Psychology of Learning and Motivation (Academic Press)
  tier: 1
  citation_count: 8200
  url: https://doi.org/10.1016/S0079-7421(02)80005-6
  key_contribution: 시각과 청각의 독립된 이중 채널(Dual-channel) 처리 및 능동적 정보 조직화 모델을 수립하여, 텍스트·음성·시각
    자료 등 감각 양식(Modality)의 다양한 변환이 단일 감각 포화(Sensory Overload)를 방지하고 이해도를 극대화함을 실증.
  relevance: Rehook 전환부에서 시각적 데이터, 오디오 녹취, 인물 사료 등 정보 양식의 다변화가 주의력을 갱신하는 멀티미디어 원리
    제공.
  themes:
  - '#35 Theme 2'
- id: SRC-2010-300
  author: Yaacov Trope & Nira Liberman
  year: 2010
  title: Construal-Level Theory of Psychological Distance
  venue: Psychological Review
  tier: 1
  citation_count: 7600
  url: https://doi.org/10.1037/a0018963
  key_contribution: 시간, 공간, 사회적 거리, 가상성에 따른 심리적 거리(Psychological Distance)와 고수준(추상적/본질적)
    및 저수준(구체적/맥락적) 해석 수준 이론(CLT)을 정립하여, 미시적 현장 디테일과 거시적 역사 스케일 간의 전환(Scale Shift)이
    인지적 통찰과 서사적 무게감을 창출하는 메커니즘을 규명.
  relevance: 초 단위의 인물 액션과 수십 년 단위의 거시적 구조를 Rehook을 통해 오가는 스케일 시프트의 심리학적 근거.
  themes:
  - '#35 Theme 2'
- id: SRC-2000-301
  author: Melanie C. Green & Timothy C. Brock
  year: 2000
  title: The Role of Transportation in the Persuasiveness of Public Narratives
  venue: Journal of Personality and Social Psychology
  tier: 1
