    인물 행위와 표정의 심리적 모티베이션(Psychological causality & reaction), 시각적 모티프(Visual motifs)를
    통한 복선과 서스펜스(Anticipation/Foreshadowing)의 형식적 결합 원리 체계화.
  relevance: 화면 기능 8종 중 CONTEXT, HUMAN, ANTICIPATION이 숏의 연쇄와 프레임 구성을 통해 관객의 서사적 인과
    추론을 유도하는 영상 문법의 기초 제공.
