    외시적 정보(Denotation, 맥락·증거)와 공시적 의미(Connotation, 감정·상징)를 동시에 품는 다의성(Polysemy)을 분석하고,
    텍스트 캡션이 시각의 복수 기능 중 핵심 의미를 고정하는 원리 체계화.
