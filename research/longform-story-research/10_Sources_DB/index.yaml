  key_contribution: '미디어 사례화 이론(Exemplification Theory) 정립. 극단적이고 생생한 시각적 사례(Exemplars,
    예: 피 흘리는 피해자, 불타는 건물)가 통계적 기저율(Base-rate Information)보다 시청자의 위험 지각과 사회적 판단을 압도적으로
    왜곡(Vividness Bias)함을 일련의 통제 실험으로 실증.'
