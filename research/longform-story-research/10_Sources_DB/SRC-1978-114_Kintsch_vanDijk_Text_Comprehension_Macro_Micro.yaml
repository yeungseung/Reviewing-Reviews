claims_and_evidence:
  core_claim: "담화 및 서사 이해는 국소적 명제들로 구성된 '미시 구조(Micro-structure)'와 전체 텍스트의 주제적 골격을 이루는 '거시 구조(Macro-structure)'의 상호작용으로 이루어진다. 거시 구조(Macro-rules: 삭제, 일반화, 구성)는 장기 기억에 저장되는 핵심 요점(Gist)을 형성하며, 미시 구조는 현장감과 생생한 디테일을 제공한다. 미시적 디테일이 거시 구조에 제때 통합되지 못하면 인지 부하로 인해 망각되며, 거시 구조만 있고 미시 디테일이 없으면 건조한 요약문에 그쳐 장기 정서 기억으로 전환되지 않는다."
  verbatim_quotes:
    - original: "Text comprehension operates simultaneously at the micro-level of individual propositions and the macro-level of global coherence. Macrostructures organize and reduce complex micro-information into memorable semantic kernels... Without micro-details, macrostructures remain sterile schemata; without macrostructures, micro-details collapse into incoherence."
      translation: "텍스트 이해는 개별 명제들의 미시 수준과 전역적 일관성의 거시 수준에서 동시에 작동한다. 거시 구조는 복잡한 미시 정보를 기억 가능한 의미적 핵심으로 조직화하고 축약한다... 미시적 디테일이 없으면 거시 구조는 메마른 도식으로 남고, 거시 구조가 없으면 미시적 디테일은 무질서 속으로 붕괴한다."
      citation_location: "pp. 363-366"

story_application:
  application_idea: "롱폼 서사에서 미시적 디테일(인물의 표정, 방 안의 사물)과 거시적 스케일(시대적 배경, 국가적 위기)은 분리된 것이 아니라 정교한 교대 구조를 이루어야 함. '미시 디테일(감정적 닻) ➔ 거시 구조(의미적 지도) ➔ 미시 해결(카타르시스)'의 샌드위치 구조가 인간 인지 시스템의 장기 기억과 공감을 극대화함."
  narrative_stage: "Scene-to-Sequence Pacing & Macro-Micro Alternation"
  emotional_mechanics:
    trigger: "구체적 인물의 미시적 행동 및 갈등으로 호기심 점화"
    build_up: "거시적 배경 및 거대 통계의 개입을 통한 사건의 역사적·사회적 무게감 획득"
    peak: "거시적 구조의 압력이 미시적 인물의 선택에 정면 충돌하는 순간"
    release: "거시적 문제 속에서 미시적 인물의 운명이 매듭지어지는 해소"
  failure_modes: "미시적 잡담만 늘어놓아 '이 이야기가 왜 중요한가(So What?)'를 놓치거나, 거시적 설명만 늘어놓아 '누구의 이야기인가'를 잃어버리는 불균형"

