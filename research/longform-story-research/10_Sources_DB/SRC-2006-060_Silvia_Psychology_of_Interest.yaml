claims_and_evidence:
  core_claim: "흥미(Interest)와 지속적 긴장감은 두 가지 인지적 평가의 상호작용으로 발생한다: ① 신기함/복잡성 평가(Novelty-Complexity Appraisal: 자극이 새롭고 복잡한가?), ② 대처 잠재력/이해 가능성 평가(Coping Potential / Comprehensibility: 내가 이를 이해하고 인지적으로 감당할 수 있는가?). 갈등이나 긴장이 너무 단순하면 지루함(Boredom)을 낳고, 메인 닻 없이 지나치게 복잡하면 혼란(Confusion)과 불안을 낳아 수용자를 이탈시킨다."
  verbatim_quotes:
    - original: "Interest is an emotion with a two-check appraisal structure: evaluating an event as novel-complex and evaluating one's ability to understand the complex event. Without comprehensibility, complexity creates confusion rather than interest."
      translation: "흥미는 2단계 평가 구조를 지닌 정서이다: 사건을 새롭고 복잡하다고 평가하는 것과 그 복잡한 사건을 이해할 수 있는 자신의 능력을 평가하는 것이다. 이해 가능성이 없다면 복잡성은 흥미가 아닌 혼란을 낳는다."
      citation_location: "pp. 53-58"

story_application:
  application_idea: "메인 엔진 1개를 확실히 고정하는 것은 관객에게 '이해 가능성(Comprehensibility)의 인지적 발판'을 제공하는 행위임. 메인 엔진이 확고할 때에만 관객은 다중 갈등(Multiple conflicts)의 복잡성을 흥미(Interest)로 즐길 수 있으며, 메인 엔진이 흔들리면 즉각 혼란과 시청 포기로 이어짐."
  narrative_stage: "Cognitive Load Management & Engagement Optimization"
  emotional_mechanics:
    trigger: "복잡하고 매력적인 다중 갈등(Novelty-Complexity)"
    build_up: "메인 엔진이라는 인지적 닻을 통한 안정적 인과 추적"
    peak: "복잡성이 하나의 명쾌한 중심 진실로 수렴되는 정점"
    release: "지적 정복감과 깊은 이해에서 오는 쾌감"
  failure_modes: "메인 닻 없이 복잡성만 극대화하여 관객을 인지 과부하와 혼란에 빠뜨리는 실패"

