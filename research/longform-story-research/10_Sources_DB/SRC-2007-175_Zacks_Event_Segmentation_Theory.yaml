claims_and_evidence:
  core_claim: "인간의 뇌는 연속적인 감각 입력을 의미 있는 '사건(Events)' 단위로 자동 분절하는 '사건 분절 이론(Event Segmentation Theory: EST)'에 따라 작동한다. 작업기억 내의 '사건 모델(Event Model)'은 인물의 인과적 목표와 행동을 지속적으로 시뮬레이션하며 다음 순간을 예측한다. 서사에서 인과적 연결고리(Causal Spine)가 견고할 때, 뇌는 사건 경계(Event Boundary: 씬 전환, 챕터 전환)마다 직전 사건의 결과를 부호화(Encoding)하고 새로운 사건 모델을 매끄럽게 갱신한다. 반면 인과성이 결여된 무작위 정보 나열은 예측 오류(Prediction Error)를 폭발시켜 사건 모델을 붕괴시키고 수용자를 인지적 혼란에 빠뜨린다."
  verbatim_quotes:
    - original: "Perceivers segment continuous activity into discrete events as a side effect of maintaining a working memory model of the current situation... Event boundaries occur when the event model fails to predict incoming information, leading to an update of the model. Causal coherence provides the structural glue that allows successful prediction and stable boundary processing."
      translation: "지각자는 현재 상황에 대한 작업기억 모델을 유지하는 것의 부수 효과로서 연속적인 활동을 분절된 사건들로 분절한다... 사건 경계는 사건 모델이 유입되는 정보를 예측하는 데 실패할 때 발생하며, 이는 모델의 갱신으로 이어진다. 인과적 일관성은 성공적인 예측과 안정적인 경계 처리를 가능하게 하는 구조적 접착제를 제공한다."
      citation_location: "Psychological Bulletin, Vol. 133, No. 2, pp. 273-278"

story_application:
  application_idea: "씬/챕터 전환에서의 '사건 모델 갱신 앵커링(Event Boundary Anchoring)'. 챕터나 씬이 바뀔 때 관객의 뇌는 무의식적으로 '방금 무슨 일이 끝났고, 그 일 때문에 지금 무엇이 시작되는가?'라는 인과적 경계를 긋는다. 이때 직전 씬의 인과적 결과를 새 씬의 첫 10초 안에 명확한 인과 앵커(Causal Anchor)로 제시해주면, 관객의 뇌는 에너지를 낭비하지 않고 즉시 몰입 상태를 유지할 수 있음."
  narrative_stage: "Scene Transitions, Chapter Breaks & Act Boundaries"
  emotional_mechanics:
    trigger: "씬/챕터 종결에 따른 사건 경계 도달"
    build_up: "뇌의 사건 모델 갱신 및 예측 가동 (인지적 일시 정지)"
    peak: "새 씬 도입부에서 직전 사건의 인과적 파동 확인 (Prediction Match)"
    release: "매끄러운 사건 모델 갱신 완료 및 안정적 서사 몰입 지속"
  failure_modes: "씬이 바뀌었을 때 앞선 사건과의 인과관계를 알 수 없어 관객이 '내가 뭘 보고 있는 거지?'라며 당황하는 '사건 경계 붕괴(Boundary Disruption)'"

