id: SRC-2003-544
author: Paul Ekman
year: 2003
title: "Emotions Revealed: Recognizing Faces and Feelings to Improve Communication and Emotional Life"
venue: "Times Books / Henry Holt and Company, New York"
tier: 1
citation_count: 4600
url: https://www.paulekman.com/resources/emotions-revealed/
key_contribution: "보편적 감정 표정 및 미세 표정(Micro-expressions) 분석 체계화. 인간의 얼굴 근육 움직임과 정서 반응(FACS) 연구를 통해, 타인의 진실한 고통과 감정 반응 샷(Reaction Shot)이 관객의 거울 신경망을 점화하여 강력한 공감적 정서 전이(Empathic Transfer)를 촉발함을 실증."
relevance: "인물 다큐, 에세이, 스토리텔링 장르에서 왜 사건의 팩트보다 인물의 미세한 표정 반응 샷(Human Reaction)이 핵심적인 시각 갱신 요소인지 규명하는 뇌신경학적 근거."
themes:
