claims_and_evidence:
  core_claim: "메타 정서(Meta-Emotion)와 감정 다양성의 서사 만족도 기제: 관객은 미디어를 소비할 때 1차 감정(Primary Emotion: 슬픔, 분노, 공포, 기쁨)을 느끼는 데 그치지 않고, 자신이 그 감정을 느끼고 있다는 사실 자체를 인지적으로 평가하는 '2차 메타 감정(Meta-Emotion: 감정에 대한 감정/성찰)'을 작동시킨다. 서사가 단순한 쾌락(단일 재미)을 넘어 슬픔, 도덕적 고뇌, 연민, 긴장 등 다채로운 감정의 스펙트럼을 제공할 때, 수용자는 '자신의 인간적 감수성과 통찰이 확장되었다'는 높은 수준의 메타 평가를 내리며, 이는 단순 오락(Enjoyment)을 초월한 깊은 서사적 감상(Appreciation)과 장기적 기억 각인을 형성한다."
  verbatim_quotes:
    - original: "Meta-emotions are thoughts and feelings about one's own emotional reactions... Experiencing diverse, even negative emotions in media use stimulates reflective processes, transforming raw emotional arousal into a deeply gratifying and meaningful experience of appreciation."
      translation: "메타 정서는 자신의 정서 반응에 대한 생각과 느낌이다... 미디어 이용에서 다양하고 심지어 부정적인 감정들을 경험하는 것은 성찰적 과정을 자극하여, 원초적 정서 각성을 깊이 만족스럽고 의미 있는 감상 경험으로 변환시킨다."
      citation_location: "pp. 7-12"

story_application:
  application_idea: "서사의 품질은 '얼마나 강렬하게 웃겼는가/울렸는가'가 아니라, '관객에게 얼마나 다양한 인간적 감정의 파동(Meta-emotional Spectrum)을 선사했는가'로 측정됨. 긴장 속에 피어나는 유머, 분노 속에 스며드는 연민, 절망 속의 실낱같은 희망 등 이종(異種) 감정들의 유기적 교차는 관객으로 하여금 자신의 감정을 성찰하게 만들고, '인생을 담은 명작'이라는 인지적 평가를 내리게 함."
  narrative_stage: "Overall Story Orchestration & Multi-tone Calibration"
  emotional_mechanics:
    trigger: "예상치 못한 정서적 톤 전환(예: 슬픔 속의 따뜻한 유머)"
    build_up: "1차 정서 경험에 대한 2차 인지적 성찰(메타 평가)의 점화"
    peak: "자신의 정서적 확장을 실감하는 심미적 감동(Appreciation)"
    release: "지적·정서적 성숙과 깊은 만족감의 잔향"
  failure_modes: "톤이 무의미하게 난잡하게 튀어 서사의 일관성(Coherence)을 파괴하거나, 1차 정서만 자극적으로 착취하는 싸구려 자극 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "드라마, 문학 소설, 영화, 프리미엄 다큐멘터리 등 깊은 서사적 만족을 지향하는 롱폼에 적용"
