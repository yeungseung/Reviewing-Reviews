credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Theoretical Modeling & Empirical Media Reception Psychology"
    sample_size: "Systematic synthesis and empirical validation across diverse narrative media genres"
    target_population: "Media audiences experiencing diverse negative and positive emotions"
    relationship_type: "Causal & Structural (Primary Negative/Diverse Emotions -> Secondary Meta-Appraisal -> Deep Narrative Engagement & Appreciation)"
    replicated: "Highly Replicated (The landmark foundational framework explaining how multi-emotional media experiences yield profound satisfaction, 350+ citations)"
