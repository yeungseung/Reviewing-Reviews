credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Multidimensional Scaling & Empirical Emotion Experiment"
    sample_size: "Detailed multidimensional rating of past emotional experiences across 15 distinct emotions"
    target_population: "Human emotion differentiators"
    relationship_type: "Causal & Structural (6 Appraisal Dimensions -> Emotion Discrimination)"
    replicated: "Highly Replicated (The canonical 6-dimensional appraisal model of discrete emotions, 3,500+ citations)"
    limitations: "실험 심리학 모델이나 서사 설계자가 각 감정을 조율하는 6개 다이얼(Dial)로 직접 활용 가능"

claims_and_evidence:
  core_claim: "인간의 15가지 주요 감정은 6가지 기본 인지 평가 차원의 수학적 조합으로 완전히 구분된다: ① 유쾌성(Pleasantness), ② 확실성(Certainty), ③ 주의 집중도(Attentional Activity), ④ 통제 소재(Control: 자신/타인/상황), ⑤ 예상되는 노력(Anticipated Effort), ⑥ 책임/비난 귀인(Responsibility/Blame). 예를 들어 분노는 [타인 통제 + 타인 책임], 죄책감은 [자기 통제 + 자기 책임], 슬픔은 [상황 통제 + 돌이킬 수 없음], 불안은 [낮은 확실성 + 높은 예상 노력]이라는 정밀한 차원 매트릭스로 규정된다."
  verbatim_quotes:
    - original: "A small number of appraisal dimensions—pleasantness, certainty, attentional activity, control, anticipated effort, and responsibility—is sufficient to differentiate the emotional experience across a wide array of discrete emotions."
      translation: "유쾌성, 확실성, 주의 활동, 통제, 예상 노력, 책임이라는 적은 수의 평가 차원만으로도 광범위한 이산 감정 전반에 걸친 정서적 경험을 구별하기에 충분하다."
      citation_location: "pp. 813-818"

story_application:
  application_idea: "서사 설계 시 감정을 조율하는 '6대 인지 다이얼(6 Cognitive Dials)' 매트릭스 도입: 작가는 분노를 만들고 싶을 때 '타인 책임 다이얼'을 최대로 돌리고, 불안을 만들고 싶을 때 '불확실성 다이얼'을 최대로 돌리는 방식으로 대본 지문과 사건 정황을 정밀 제어할 수 있음."
  narrative_stage: "Emotional Dials & Scene Situation Calibration"
  emotional_mechanics:
    trigger: "6대 차원 변수의 비대칭적 자극"
    build_up: "뇌의 다차원 평가 좌표가 특정 정서 구역으로 수렴"
    peak: "해당 차원 조합에 부합하는 순수 감정의 발화"
    release: "평가 차원의 완화 및 정서적 안정"
  failure_modes: "평가 차원이 상충하여(예: 타인 탓인지 내 탓인지 모호함) 관객이 어떤 감정을 느껴야 할지 헷갈려 하는 혼란"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "드라마, 스릴러, 비극, 멜로 등 감정선의 정밀 조율이 필요한 모든 씬에 적용"
