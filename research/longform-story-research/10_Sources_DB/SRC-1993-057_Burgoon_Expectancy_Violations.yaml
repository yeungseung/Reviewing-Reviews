bibliographic_info:
  title: "Interpersonal expectations, expectancy violations, and emotional communication"
  authors:
    - "Burgoon, Judee K. (University of Arizona)"
  institution: "University of Arizona"
  published_date: "1993-06-01"
  source_url: "https://doi.org/10.1177/0261927X93121003"
  source_type: "Peer-reviewed Journal (Journal of Language and Social Psychology)"

credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Communication Theory & Experimental Social Psychology"
    sample_size: "Multi-study laboratory and interaction experiments"
    target_population: "Human communicators across varied social contexts"
    relationship_type: "Causal (Expectancy Violation -> Arousal Spikes -> Cognitive Appraisal)"
    replicated: "Highly Replicated (Expectancy Violations Theory (EVT), 3,000+ citations)"
    limitations: "대인 커뮤니케이션 중심 연구이나 미디어 콘텐츠의 기대 위반 및 부조화 각성에 동일하게 작용"

claims_and_evidence:
  core_claim: "인간은 규범, 맥락, 사전 경험을 바탕으로 안정적인 기대 체계(Expectancies)를 구축한다. 이 기대가 급격히 위반(Violation)될 때 생리적·인지적 각성(Orienting Reflex / Arousal)이 폭발하며, 수용자는 주의를 집중하여 위반의 원인과 의미를 평가(Appraisal)하는 강렬한 서사적 해석 작업에 돌입한다."
  verbatim_quotes:
    - original: "Violations of expectations trigger physiological arousal and orienting responses, prompting immediate appraisal of the violation and the violator."
      translation: "기대의 위반은 생리적 각성과 정향 반응을 촉발하여, 위반 행위와 행위자에 대한 즉각적인 인지적 평가를 유도한다."
      citation_location: "pp. 31-35"

story_application:
  application_idea: "Expectation vs Reality 엔진의 핵심은 단순한 반전이 아니라, 견고하고 합리적인 기대(안정된 가설)를 관객의 마음에 먼저 형성시킨 후, 이를 정면으로 깨부수는 충격적 현실 데이터를 들이밀어 인지적 각성을 폭발시키는 대비 구조로 집필해야 함."
  narrative_stage: "Act 1 Hook & Midpoint Paradigm Shift"
  emotional_mechanics:
    trigger: "당연하다고 여겨지던 예측과 규범의 산산조각"
    build_up: "인지적 부조화(Dissonance)와 이유를 파악하려는 필사적 재평가"
    peak: "기존 가설로는 설명 불가능함을 인정하고 새로운 현실을 직시하는 순간"
    release: "새로운 패러다임 수립 및 인지적 적응"
  failure_modes: "사전 기대가 충분히 형성되지 않은 상태에서 일어나는 위반은 관객에게 어떠한 충격이나 각성도 주지 못함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "반전 드라마, 팩트체크 콘텐츠, 고정관념 타파형 역사/과학 롱폼에 필수적"
