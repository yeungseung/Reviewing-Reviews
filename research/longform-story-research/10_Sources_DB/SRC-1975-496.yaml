key_contribution: "서사적 계약(Narrative Contract) 및 문학적 역능(Literary Competence) 이론 정립. 텍스트가 오프닝에서 던진 약속과 질문은 독자와의 암묵적 신뢰 계약이며, 결말에서 이 계약이 충실히 결제(Fulfillment)되어야 비로소 서사의 의미적 완결성이 성립함을 규명."
relevance: "서사 오프닝의 약속(Promise)과 결말 페이오프(Payoff) 간의 계약 이행(Contract Fulfillment) 및 서사적 신뢰 거버넌스의 구조주의적 근거."
