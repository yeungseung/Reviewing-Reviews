id: SRC-1995-385
author: Thomas Gilovich & Victoria Husted Medvec
year: 1995
title: 'The temporal pattern to the experience of regret'
venue: Psychological Review
tier: 1
citation_count: 1340
url: https://doi.org/10.1037/0033-295X.102.2.379
key_contribution: 후회의 시간적 패턴(Temporal Pattern of Regret)을 규명. 단기적으로는 자신이 저지른 실수(Action)에 대한 고통이 크지만, 시간이 흐를수록 시도하지 않았던 선택(Inaction: 고백하지 못한 사랑, 도전하지 못한 꿈)에 대한 회한이 압도적으로 깊어짐을 실증.
relevance: 주인공의 실수와 미련을 통해 관객 자신의 인생 분기점을 돌아보게 하고 사후가정적 치유를 선사하는 시간적 후회 거울 카타르시스(TMR-C)의 이론적 토대.
themes:
- '#42 Theme 2'
