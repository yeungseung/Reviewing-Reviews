id: SRC-2002-537
author: David Bordwell
year: 2002
title: "Intensified continuity: Visual style in contemporary American film"
venue: "Film Quarterly, 55(3), 16-28"
tier: 1
citation_count: 1450
url: https://doi.org/10.1525/fq.2002.55.3.16
key_contribution: "현대 영상 스타일의 '강화된 연속성(Intensified Continuity)' 미학 분석. 평균 숏 길이(ASL)의 급격한 단축, 빠른 커팅 속에서도 서사적 명료성과 공간적 정위(Spatial Orientation)를 유지하기 위한 4대 시각 문법(빠른 컷, 얕은 심도, 랙 포커스, 앵커링)의 작동 원리와 남용 시의 폐해를 규명."
relevance: "롱폼 영상에서 시각적 역동성을 유지하면서도 관객의 서사적 몰입과 시각적 방향 감각을 해치지 않는 '연속성 거버넌스(Continuity Governance)'의 영화 미학적 표준 제공."
themes:
  - "#55 Theme 1"
