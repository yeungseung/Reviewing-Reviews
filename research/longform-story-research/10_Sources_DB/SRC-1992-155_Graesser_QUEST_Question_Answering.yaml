claims_and_evidence:
  core_claim: "서사를 수용할 때 독자나 관객의 뇌는 수동적인 정보 수용기가 아니라, 끊임없이 'Why(동기 및 원인)', 'How(행동 수단)', 'What-if(결과 및 대안)' 질문을 능동적으로 생성하는 '질문-응답(Question-Answering) 추론 엔진'이다. 국소적 의문(Local Questions: How, What)에 대한 명쾌한 답변은 고립된 정보로 끝나지 않고, 상위 인과 네트워크(Causal Network)의 노드를 타고 올라가 궁극적으로 전역 거대 질문(Global Question: Why, Outcome)을 점진적으로 해소(Convergence)한다."
  verbatim_quotes:
    - original: "The QUEST model demonstrates that answers to local, subordinate questions feed into the causal network that resolves superordinate why-questions. Narrative comprehension is an active quest for causal convergence."
      translation: "QUEST 모델은 국소적인 하위 질문에 대한 답변이 상위의 왜(Why) 질문을 해결하는 인과 네트워크로 유입됨을 보여준다. 서사 이해는 인과적 수렴을 향한 능동적인 탐색(Quest)이다."
      citation_location: "Cognitive Psychology, Vol. 24, p. 173-178"

story_application:
  application_idea: "국소 해답(Local Answer)이 전역 질문(Global Question)을 진전시키는 'QUEST 인과 수렴 공식'. 씬 단위에서 작은 미스터리가 풀렸을 때, 그 해답이 단순한 잡상식으로 흩어지지 않고 '아, 그래서 살인범이 그 시각에 그곳에 있었구나!'처럼 상위 거대 미스터리의 결정적 단서(노드)로 자동 연결되도록 인과 네트워크를 직조해야 함."
  narrative_stage: "Scene-to-Sequence Causal Networking & Micro-closure payoff"
  emotional_mechanics:
    trigger: "국소적 행동에 대한 즉각적 의문(How/What-happened?)"
    build_up: "하위 단서의 발견과 마이크로 루프 해소"
    peak: "국소적 해답이 상위 거대 인과 네트워크와 '딸깍' 들어맞는 순간의 유레카(Aha!) 반응"
    release: "전체 사건의 진실에 한 걸음 다가섰다는 인지적 유창성 확보"
  failure_modes: "하위 씬의 질문을 기껏 해결했으나 상위 플롯과 아무런 인과적 관련이 없는 '맥거핀의 낭비 및 서사적 헛발질'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "하위 해답이 상위 인과 네트워크의 전제 조건(Precondition)이나 원인(Cause)으로 기능해야 함"
