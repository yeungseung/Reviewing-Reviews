credibility_assessment:
  credibility_tier: "Tier 1 Cognitive Science & Computational Discourse Psychology"
  methodology:
    study_type: "Computational Modeling & Empirical Laboratory Experiments"
    sample_size: "Hundreds of discourse comprehension protocols & question-answering sessions"
    target_population: "서사 텍스트 및 대화 이해 시 질문 생성 및 인과 추론 인지 체계"
    relationship_type: "Causal and Hierarchical Computational Model"
    effect_size: "QUEST 모델 예측도와 인간 피험자의 인과 질문 생성/답변 수렴도 r = .75~.85 일치"
