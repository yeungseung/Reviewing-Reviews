key_contribution: 디지털 사이버스페이스에서의 상호작용적 서사(Interactive Narrative)와 참여형 스토리텔링 이론 체계화. 다중 분기형(Forking paths), 하이퍼텍스트, 가상공간 체험에서 고정된 선형적 거시 구조의 해체와, 사용자 에이전시(Agency) 및 침잠(Immersion)을 보장하는 거시적 다형 서사(Multiform Narrative)의 구조적 가능성 및 한계 규명.
relevance: 게임, 인터랙티브 롱폼, 다중 선택 분기형 콘텐츠에서 단일 9단계 구조가 무력화되는 기술적·인지적 경계 규정.
