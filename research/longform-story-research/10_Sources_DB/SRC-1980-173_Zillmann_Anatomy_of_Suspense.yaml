    sample_size: "Decades of psychophysiological arousal tracking during dramatic suspense exposure"
    target_population: "드라마, 영화, 미스터리 서사 수용자 일반"
    relationship_type: "Causal and Dynamic Temporal Cadence"
    effect_size: "서스펜스 해소 지연이 적정 주기(Resolution Cadence)를 초과할 경우 불쾌감/시청 이탈율 2.5배 증가, 적정 주기 회수 시 흥분 전이(Excitation Transfer)로 인한 쾌감 300% 증폭"
    replicated: "Highly Replicated (미디어 심리학 및 서스펜스 이론의 고전적 기념비적 저작, 1,400+ 피인용)"
    limitations: "TV 및 영화 시청 환경 실험 중심이나 장편 소설 및 디지털 롱폼 서사에 동일하게 적용됨"

claims_and_evidence:
  core_claim: "서스펜스는 호의적인 등장인물에게 닥칠 파국적 결과에 대한 우려와 높은 주관적 불확실성에서 기인하는 고도의 교감신경계 각성(Sympathetic Arousal) 상태이다. 서스펜스는 필연적으로 일정한 '답변 주기(Answer Cadence / Resolution Cadence)'를 요구한다. 서스펜스 질문이 제기된 후 적절한 시점 안에 부분적 혹은 완전한 해소(Resolution)가 제공되지 않고 무한정 긴장만 연장되면, 교감신경계 각성이 쾌감(Suspense Pleasure)에서 고통 및 혐오(Distress & Aversion)로 전락하여 관객은 정서 보호를 위해 시청을 중단(Disengagement)한다. 반면 적절한 리듬으로 작은 해답들을 제공하면 잔여 각성이 해소의 안도감과 결합하는 '흥분 전이(Excitation Transfer)'가 일어나 폭발적인 쾌감과 재호기심(Renewed Curiosity)을 창출한다."
  verbatim_quotes:
    - original: "Suspense is an acute affective state characterized by sympathetic arousal... If the resolution of suspenseful uncertainty is unduly delayed, the emotional experience shifts from anticipated gratification to acute distress, prompting the audience to withdraw. A well-timed cadence of partial resolutions harnesses excitation transfer, converting residual arousal into intense euphoric relief."
      translation: "서스펜스는 교감신경계 각성을 특징으로 하는 급성 정동 상태이다... 서스펜스적 불확실성의 해소가 부당하게 지연되면, 감정적 경험은 기대된 만족에서 급성 고통으로 전환되어 관객의 이탈을 유발한다. 잘 조율된 부분적 해소 주기는 흥분 전이를 활용하여 잔여 각성을 강렬한 희열과 안도감으로 전환시킨다."
      citation_location: "The Entertainment Functions of Television, Chapter 6, pp. 133-145"

story_application:
  application_idea: "서스펜스 질문의 '답변 주기(Answer Cadence)와 긴장-해소 펄스 공식'. 씬이나 시퀀스마다 질문을 던진 후 방치하지 않고, 3~5분 단위의 '국소 긴장 ➔ 부분 해답 ➔ 안도감 ➔ 더 큰 후속 질문 투사'의 맥박(Cadence)을 유지함. 거대한 메인 질문(누가 진범인가?)을 품고 가더라도 매 시퀀스마다 국소적 질문(저 캐비닛 뒤에 숨은 자는 누구인가? 알리바이가 깨졌는가?)을 즉시 해소해 흥분 전이(Excitation Transfer)의 쾌감을 공급함으로써 관객의 피로도를 0으로 유지함."
  narrative_stage: "Scene-by-Scene Pacing & Tension-Resolution Waves"
  emotional_mechanics:
    trigger: "주인공 위협 및 불확실한 결과 제기 (교감신경 급상승)"
    build_up: "답변 지연 동안의 아슬아슬한 긴장 유지 (Arousal Peak)"
    peak: "해소 직전의 인지적 갈증 극대화"
    release: "부분 해소 제공 시 폭발하는 흥분 전이(Excitation Transfer) 안도감 및 다음 질문으로의 자연스러운 전이"
  failure_modes: "해답을 주지 않고 긴장만 쥐어짜다 관객을 지치게 만들어 감정적 불감증과 이탈을 초래하는 '끝없는 티징(Endless Teasing Fatigue)'"

