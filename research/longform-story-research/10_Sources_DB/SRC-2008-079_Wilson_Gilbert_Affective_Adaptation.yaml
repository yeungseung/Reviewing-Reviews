claims_and_evidence:
  core_claim: "정서 적응의 AREA 모델(Attention, Reaction, Explanation, Adaptation): 인간의 뇌는 정서적 항상성을 지키기 위한 '심리적 면역 체계(Psychological Immune System)'를 보유한다. 새로운 자극이 발생하면 ① 주의(Attention)를 기울이고, ② 정서적으로 반응(Reaction)하지만, 이내 사태의 원인을 ③ 인지적으로 설명하고 이해(Explanation / Sense-making)하려 한다. 사건이 설명되고 이해되는 순간, 자극의 정서적 힘은 급속도로 감쇄하며 ④ 정서 적응(Adaptation / Habituation)이 완료된다. 서사에서 동일한 비극이나 위협이 반복되거나 너무 일찍 설명되어 버리면, 뇌는 더 이상 주의를 할당하지 않고 급격한 감정 피로와 무감각에 빠진다."
  verbatim_quotes:
    - original: "Affective adaptation refers to the process whereby emotional responses attenuate as people make sense of positive or negative events... Once people explain an event, it loses its power to evoke intense affect, leading inevitably to emotional habituation."
      translation: "정서 적응은 사람들이 긍정적이거나 부정적인 사건을 이해하고 설명함에 따라 정서적 반응이 감쇄하는 과정을 의미한다... 사람들이 사건을 설명하고 이해하고 나면, 그 사건은 강렬한 정서를 유발하는 힘을 잃고 필연적으로 정서적 습관화로 이어진다."
      citation_location: "pp. 370-374"

story_application:
  application_idea: "감정 피로를 방지하려면, 뇌가 상황을 너무 일찍 '설명 완료(Explain away)'하지 못하도록 해야 함. 사건의 전말을 단번에 다 설명하지 말고(미스터리 유지), 위협의 작동 방식을 계속 갱신해야 관객의 정서 적응을 지연시킬 수 있음. 또한 이미 적응이 일어난 후에는 설명·유머·안정 구간을 두어 뇌의 심리적 면역계를 리셋해야 함."
  narrative_stage: "Act 2 Mid-section Fatigue Prevention & Mystery Pacing"
  emotional_mechanics:
    trigger: "반복 자극에 대한 뇌의 인지적 설명 완료(Sense-making)"
    build_up: "심리적 면역계 가동으로 인한 정서 반응의 급격한 감쇄"
    peak: "주의 할당 거부 및 감정 피로(Boredom/Numbing) 도달"
    release: "새로운 인지적 불일치 또는 리셋 구간을 통한 주의 재징발"
  failure_modes: "악역의 동기나 비밀을 초반에 너무 뻔하게 다 설명해 버린 뒤, 2시간 동안 똑같은 위기만 반복하여 관객을 하품하게 만드는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
