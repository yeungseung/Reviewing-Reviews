claims_and_evidence:
  core_claim: "소속 욕구 가설(The Need to Belong)과 배척의 원초적 공포: 인간은 최소한의 지속적이고 긍정적이며 의미 있는 대인 관계를 형성하고 유지하려는 강력하고 근본적이며 보편적인 충동을 지닌다. 진화론적으로 집단에서의 추방(Ostracism)은 곧 죽음을 의미했기 때문에, 인간의 뇌는 사회적 거부와 고립을 물리적 고통과 동일한 신경 회로(dACC: 전방 대상회)로 처리한다. 서사에서 인물이 겪는 배신, 가족으로부터의 버림받음, 공동체에서의 추방은 단순한 심리적 불편이 아니라 생물학적 생존이 위협받는 극단적인 정서적 스테이크(Emotional Stakes)를 창출한다."
  verbatim_quotes:
    - original: "Human beings are fundamentally and pervasively motivated by a need to belong, that is, by a strong desire to form and maintain enduring interpersonal attachments... Deprivation of stable, caring bonds produces profound pathologies in emotional stability and health."
      translation: "인간은 근본적으로 그리고 만연하게 소속 욕구, 즉 지속적인 대인 관계적 애착을 형성하고 유지하려는 강력한 열망에 의해 동기부여된다... 안정적이고 배려적인 유대의 결핍은 정서적 안정과 건강에 심각한 병리적 증상을 낳는다."
      citation_location: "pp. 497-502"

story_application:
  application_idea: "추방과 귀환의 원초적 아크(Ostracism-to-Belonging Arc): 관객을 주인공의 운명에 즉각 결속시키기 위해 1막에서 인물이 속한 공동체, 직장, 가족으로부터 억울하게 배척(Exclusion)당하는 상황을 연출함. 관객은 진화적 소속 본능에 의해 인물의 결핍에 즉각적으로 강력한 고통과 연민을 느끼며, 인물이 새로운 진정한 공동체('내 사람', 가족)를 찾거나 신뢰를 회복하는 순간 폭발적인 안도감과 정서적 카타르시스를 경험함."
  narrative_stage: "Act 1 Ostracism/Betrayal, Act 2 Wandering/Finding Allies, Act 3 Tribal Reconciliation"
  emotional_mechanics:
    trigger: "가장 신뢰했던 집단이나 혈육으로부터의 일방적 배척과 단절"
    build_up: "완전한 고립과 고독 속에서 살아남기 위한 처절한 발버둥"
    peak: "자신을 온전히 수용해 주는 새로운 유대 관계의 발견 혹은 목숨을 건 신뢰의 증명"
    release: "소속감과 상호 신뢰의 회복을 통한 심리적 치유와 정서적 평온"
  failure_modes: "인물이 집단에서 쫓겨났음에도 아무런 외로움이나 고통을 느끼지 않는 사이코패스적 묘사로 관객의 공감 연결 고리를 끊어버리는 오류"

