claims_and_evidence:
  core_claim: "인간의 인지는 추상적인 기호 조작이 아니라 감각-운동 시스템(Sensory-motor systems)과 신체 상태, 상황적 행위의 '양식적 시뮬레이션(Modal Simulation)'에 확고히 기반(Grounded)하고 있다. 수용자가 구체적인 물리적 상황, 신체적 동작, 감각적 디테일을 마주할 때, 뇌는 실제로 그 상황을 살아서 경험하는 것과 동일한 감각운동 피질과 거울 뉴런 회로를 재가동(Re-enactment)한다."
  verbatim_quotes:
    - original: "Grounded cognition reflects the assumption that cognition is typically grounded in multiple ways, including simulations, situated action, and bodily states... Comprehending narrative descriptions reenacts the multimodal perceptual and affective states experienced during the actual event."
      translation: "정초된 인지는 인지가 시뮬레이션, 상황화된 행위, 신체 상태를 포함한 다양한 방식으로 기반하고 있다는 가정을 반영한다... 서사적 묘사를 이해하는 것은 실제 사건 중에 경험했던 다중감각적 지각 및 정서 상태를 재연하는 것이다."
      citation_location: "pp. 617-622"

story_application:
  application_idea: "Show, Don't Tell 원칙의 뇌과학적 실체는 '감각-운동 뇌 시뮬레이션의 점화'임. '그는 불안했다(Tell)'가 아니라 '그는 마른침을 삼키며 손톱 거스러미를 피가 날 때까지 뜯었다(Show)'고 쓸 때, 시청자의 뇌 속 운동 피질과 도파민-노르에피네프린 회로가 실시간으로 재연되어 폭발적인 신체적 공감(Somatic Empathy)을 일으킴."
  narrative_stage: "Scene Detailing, Sensory Description & Objective Correlative"
  emotional_mechanics:
    trigger: "구체적 감각 단서(소리, 질감, 미세 신체 동작)의 투입"
    build_up: "관객 두뇌의 감각운동 피질 동조 및 신체 시뮬레이션"
    peak: "인물의 고통/기쁨이 관객 자신의 신경계에서 자발적으로 점화"
    release: "행위의 완결과 함께 신체적 긴장 이완"
  failure_modes: "추상적 형용사만 나열하여 관객의 뇌 시뮬레이터를 전혀 가동하지 못하는 건조한 서술"

