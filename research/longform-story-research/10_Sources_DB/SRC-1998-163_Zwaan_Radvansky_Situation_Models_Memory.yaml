claims_and_evidence:
  core_claim: "수용자는 이야기를 이해할 때 텍스트의 표면 문장을 기억하는 것이 아니라, 이야기 속 현실에 대한 다차원적 '상황 모델(Situation Model: 시간, 공간, 인물, 인과, 의도)'을 구축한다. 이 5개 차원 중 **'인과 차원(Causality)'은 상황 모델의 중심 기둥(Backbone)**이다. 인과적 연결 없이 단순한 주제 전환(Topic Shift)이나 비인과적 장면 전환이 일어나면, 뇌는 기존 상황 모델을 버리고 새로운 모델을 처음부터 다시 구축해야 하므로 막대한 '상황 모델 갱신 비용(Updating Cost)'이 발생하여 서사적 추진력(Narrative Momentum)이 붕괴한다."
  verbatim_quotes:
    - original: "Causality is the glue that holds the situation model together... When causal continuity is broken, readers must purge the current model and initiate a costly update process, producing noticeable reading latency and loss of narrative immersion."
      translation: "인과성은 상황 모델을 결속시키는 접착제이다... 인과적 연속성이 깨지면 독자는 현재 모델을 비우고 비용이 많이 드는 갱신 과정을 시작해야 하며, 이는 현저한 독해 지연과 서사적 몰입 상실을 초래한다."
      citation_location: "Psychological Bulletin, Vol. 123, p. 162-171"

story_application:
  application_idea: "롱폼 스토리의 '인과 연속성을 통한 상황 모델 보존(Situation Model Continuity)' 원칙. 챕터나 씬을 바꿀 때 시간이나 공간이 바뀌더라도(예: '3년 후', '파리의 다른 호텔'), '인과 차원'과 '주인공의 의도 차원'만은 선행 사건과 단단히 결속시켜 관객의 뇌가 상황 모델을 리셋하느라 겪는 인지 피로를 원천 방지함."
  narrative_stage: "Multi-scene Narrative Architecture & Situation Model Maintenance"
  emotional_mechanics:
    trigger: "새로운 시공간적 환경 진입"
    build_up: "선행 사건의 인과적 여파가 새 환경을 지배하고 있음을 확인"
    peak: "상황 모델 리셋 없이 즉각적으로 가속되는 서사 추진력"
    release: "안정적인 세계관 표상 위에서 펼쳐지는 고도의 추리 몰입"
  failure_modes: "인과성 없이 장소와 인물만 어지럽게 바뀌어 관객이 '여기가 어디고 저 사람은 왜 저러지?'라며 길을 잃는 '상황 모델 붕괴'"

