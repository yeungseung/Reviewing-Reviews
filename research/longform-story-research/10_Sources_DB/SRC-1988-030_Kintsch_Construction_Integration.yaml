claims_and_evidence:
  core_claim: "담화 이해는 표층 형태(Surface), 텍스트베이스(Textbase), 상황 모델(Situation Model)의 3단계로 구성되며, 정서적 관여와 사전 지식이 결합되지 않은 정보는 텍스트베이스 수준에서 급속히 소멸한다."
  verbatim_quotes:
    - original: "A textbase represents the meaning of a text... but the situation model integrates this textbase with the reader's prior knowledge, goals, and personal experience into a lasting mental representation."
      translation: "텍스트베이스는 텍스트의 표층적 의미를 나타내지만... 상황 모델은 이 텍스트베이스를 독자의 사전 지식, 목표, 개인적 경험과 통합하여 지속적인 심적 표상을 형성한다."
      citation_location: "p.163, Abstract & Introduction"

story_application:
  application_idea: "사건 중심 정보형 콘텐츠(STORY 편중)를 기획할 때 단순 팩트와 연표를 나열하는 텍스트베이스에 머물지 말고, 인물의 생존 위기와 가치 선택을 결합하여 관객의 상황 모델로 각인시킴."
  narrative_stage: "Information Architecture & Exposition"
  emotional_mechanics:
    trigger: "팩트의 단순 입력"
    build_up: "팩트가 지닌 인간적·사회적 의미의 부각"
    peak: "단순 팩트가 상황 모델로 전환되는 통찰의 순간"
    release: "지적 숙달감 및 장기 기억 정착"
  failure_modes: "정서와 의미의 연결고리 없이 사실 정보만 쏟아부으면 수용자는 수 분 내에 냉각 인지(Cold Cognition)와 지적 피로로 이탈함"

