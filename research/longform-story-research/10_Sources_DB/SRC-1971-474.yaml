id: SRC-1971-474
author: Dolf Zillmann
year: 1971
title: 'Excitation Transfer in Communication-Mediated Aggressive Behavior'
venue: Journal of Experimental Social Psychology, 7(4), 419-434
tier: 1
citation_count: 3120
url: https://doi.org/10.1016/0022-1031(71)90075-8
key_contribution: '각성 전이 이론(Excitation Transfer Theory) 정립. 이전 자극에 의해 활성화된 교감신경계 생리적 각성(긴장, 위협, 분노)은 즉시 소멸하지 않고 잔여 각성(Residual Arousal)으로 남아 후속 자극에 대한 감정적 반응(통쾌함, 카타르시스, 안도감, 기쁨)을 강력히 증폭시킴을 실험적으로 증명. 감정적 피크의 강도는 사전 긴장·위협의 누적 축적량에 정비례함을 규명.'
relevance: 긴장과 위협 축적 없는 카타르시스와 안도감의 불가능성 및 사전 생리적 각성 축적의 필수성을 설명하는 핵심 인지신경심리학적 근거.
