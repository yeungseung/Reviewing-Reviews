bibliographic_info:
  title: "Nonprobative photographs (or words) increase truthiness"
  authors:
    - "Newman, Eryn J. (Victoria University of Wellington)"
    - "Garry, Maryanne (Victoria University of Wellington)"
    - "Bernstein, Daniel M. (Kwantlen Polytechnic University)"
    - "Lindsay, D. Stephen (University of Victoria)"
  institution: "Victoria University of Wellington & University of Victoria"
  published_date: "2012-08-07"
  source_url: "https://doi.org/10.3758/s13423-012-0292-0"
  source_type: "Peer-reviewed Journal (Psychonomic Bulletin & Review, 19(5), 969-974)"

credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Experimental Cognitive Psychology"
    sample_size: "Series of experiments (N=200+)"
    target_population: "Adult subjects evaluating truth claims across varied general knowledge domains"
    relationship_type: "Causal & Perceptual Fluency Mapping"
    replicated: "Highly Replicated (400+ citations, foundational proof of the 'Truthiness' cognitive illusion)"
    limitations: "단순 진술문과 사진의 짝짓기 실험이나, 다큐멘터리 B-roll 및 영상 편집의 사실성 오도 현상을 완벽히 설명함"

claims_and_evidence:
  core_claim: "주장의 진위 여부를 전혀 입증하지 못하는 비증거적 사진(Nonprobative photographs: 예: 유명인의 일상 사진이나 사물의 단순 스틸컷)이나 생생한 감각적 묘사를 덧붙이는 것만으로도, 사람들은 거짓 주장을 '참(True)'으로 믿는 확률이 급증한다. 이를 '진실성 착각(Truthiness Effect)'이라 부르며, 원인은 사진이나 생생한 디테일이 인지적 유창성(Cognitive Fluency)과 심상 형성을 촉진하여 뇌가 '이해하기 쉬우므로 사실일 것'이라고 인지적으로 오판하기 때문이다."
  verbatim_quotes:
    - original: "People are more likely to believe that a claim is true when it is accompanied by a photograph, even when the photograph provides no actual evidence for the claim. This 'truthiness' effect occurs because photographs facilitate conceptual processing and mental imagery, inflating feelings of cognitive fluency that people mistake for truth."
      translation: "사람들은 어떤 주장이 사진과 함께 제시될 때, 설령 그 사진이 해당 주장에 대한 아무런 실질적 증거를 제공하지 않더라도 그것이 참이라고 믿을 가능성이 더 높다. 이러한 '진실성 착각(Truthiness)' 효과는 사진이 개념적 처리와 심상 형성을 촉진하여 사람들이 진실로 착각하는 인지적 유창성 감정을 부풀리기 때문에 발생한다."
      citation_location: "pp. 969-970"

story_application:
  application_idea: "다큐멘터리나 시사 영상에서 단순한 분위기 연출용 자료화면(Generic B-roll)이나 자극적인 재연(Reenactment) 장면을 삽입할 때, 관객은 이를 무의식적으로 '실제 사건의 확고한 증거'로 수용함. 창작자는 비증거적 시각 자료가 관객의 사실 판단을 오도하지 않도록, 자료화면의 출처와 성격을 투명하게 명시하는 시각적 라벨링(Visual Attribution)을 필수 적용해야 함."
  narrative_stage: "Visual Editing, B-roll Integration & Nonfiction Authenticity"
  emotional_mechanics:
    trigger: "주장과 함께 화면에 떠오르는 생생한 비증거적 사진 및 B-roll"
    build_up: "시각 심상 형성에 따른 인지적 유창성 급상승"
    peak: "검증되지 않은 주장을 직관적 진실(Truthiness)로 확신하는 인지적 착각"
    release: "투명한 출처 표기 및 증거적 맥락 제시를 통한 이성적 사실 확인"
  failure_modes: "주장의 진위를 입증하지 못하는 자극적인 스톡 영상과 무관한 재연을 남발하여 관객에게 거짓 확신을 심어주는 조작적 연출"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "영상 다큐멘터리, 유튜브 탐사 영상, 뉴스 그래픽 등 시각 자료를 병기하는 모든 미디어 콘텐츠에 적용"
