id: SRC-1975-478
author: Martin E. P. Seligman
year: 1975
title: 'Helplessness: On Depression, Development, and Death'
venue: W. H. Freeman
tier: 1
citation_count: 14200
url: https://psycnet.apa.org/record/1975-23654-000
key_contribution: '학습된 무기력(Learned Helplessness) 이론 정립. 통제 불가능한 혐오 자극(불공정, 고통, 억압)에 장시간 노출될 때 유기체는 상황을 통제하려는 시도를 포기하고 극단적인 수동성과 인지적 폐쇄 상태로 전락함을 규명. 서사에서 고통과 불공정의 축적이 해결의 희망 없이 인지 수용 한계선(고구마 한계선)을 초과할 때 관객이 공감을 차단하고 이탈하는 심리적 기제 설명.'
relevance: 빌드업 구간이 지나치게 길어질 때 발생하는 관객의 정서적 이탈 및 고구마 한계선(Frustration Limit)을 규명하는 핵심 심리학적 근거.
themes:
