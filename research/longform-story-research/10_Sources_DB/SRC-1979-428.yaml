key_contribution: 인지과학과 텍스트 언어학의 이야기 문법(Story Grammar) 모델을 정초. 서사 텍스트의 기본 에피소드는 [배경(Setting) ➔ 촉발 사건(Initiating Event) ➔ 내적 반응(Internal Response) ➔ 시도(Attempt) ➔ 직접적 결과(Consequence) ➔ 반응(Reaction)]의 6단계 위계 스키마로 구성됨을 실증.
relevance: 6단계 마이크로 스토리 블록(상황-문제-행동-의미-감정변화-다음질문)이 인간의 보편적 에피소드 인지 스키마와 인지심리학적으로 완벽히 합치됨을 입증하는 가장 강력한 실증 근거.
