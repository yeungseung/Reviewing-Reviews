id: SRC-2010-376
author: Brendan Nyhan & Jason Reifler
year: 2010
title: 'When corrections fail: The persistence of political misperceptions'
venue: Political Behavior
tier: 1
citation_count: 3580
url: https://doi.org/10.1007/s11109-010-9112-2
key_contribution: 수용자 양극화(Audience Polarization)와 역화 효과(Backfire Effect)의 실증적 발견. 이념적으로 강하게 정착된 신념을 가진 수용자에게 정면 반박이나 단순 팩트체크를 제시할 경우 동기화된 추론(Motivated Reasoning)이 발동하여 오히려 기존의 잘못된 신념을 더 확고히 방어함을 규명.
relevance: 논쟁적 서사에서 수용자의 정체성을 위협하지 않고 공통 가치로부터 접근하여 역화 효과를 회피하는 양극화 접종 서사 방어(PIN-D)의 학술적 토대.
themes:
- '#41 Theme 3'
