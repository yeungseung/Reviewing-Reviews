key_contribution: "기분 관리 이론(Mood Management Theory) 정립. 수용자는 불쾌한 정서 상태를 최소화하고 쾌적한 정서 상태를 극대화·유지하기 위해 무의식적으로 미디어를 선택하고 소비한다는 쾌락적 동기화(Hedonic Motivation) 메커니즘 규명."
relevance: "채널에서 부정적·불쾌한 감정 엔딩이 지속적으로 반복될 경우, 수용자는 자신의 기분을 방어하기 위해 해당 채널을 본능적으로 기피하고 차단하게 되는 미디어 선택 기제의 이론적 근거."
