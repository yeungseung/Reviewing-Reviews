credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Comprehensive Theoretical & Empirical Meta-Synthesis of Cognitive Social Psychology Experiments"
    sample_size: "Tens of thousands of participants across hundreds of behavioral and cognitive trials"
    target_population: "Human decision makers evaluating proximal vs distal temporal, spatial, social, and hypothetical events"
    relationship_type: "Causal / Cognitive Representation Shift (Psychological Distance -> Abstract/High-Level vs Concrete/Low-Level Construal)"
