claims_and_evidence:
  core_claim: "해석 수준 이론(Construal-Level Theory, CLT)과 휴먼 스케일 변환의 인지 혁명: 대상과의 심리적 거리(시간적, 공간적, 사회적, 가상적 거리)가 멀어질수록 인간 뇌는 대상을 고수준의 추상적·본질적 개념(High-level, abstract construal: 통계, 이데올로기, 시스템)으로 처리하며 정서적 생생함과 행동 의지를 잃어버린다. 반대로 심리적 거리를 가깝게 좁힐수록 뇌는 저수준의 구체적·맥락적·감각적 표상(Low-level, concrete construal: 한 사람의 얼굴, 당장 겪는 고통, 촉각과 냄새)으로 전환한다. 거대한 사회적·과학적 거대 담론을 '한 가족의 식탁, 하루 일당, 당장 내일 닥칠 결핍'이라는 휴먼 스케일(Human Scale)로 축소하여 렌즈를 맞추는 순간, 관객의 뇌는 즉각적이고 생생한 인지적 이해와 위험 지각(Risk Perception) 및 정서적 몰입을 발동시킨다."
  verbatim_quotes:
    - original: "Psychological distance changes people’s representations of events... Whereas high-level construals are abstract, schematic, and decontextualized representations that extract the gist from available information, low-level construals are concrete, detailed, and contextualized representations... Moving from distant to proximal perspectives shifts processing to specific, vivid details that trigger visceral affective reactions and immediate behavioral mobilization."
      translation: "심리적 거리는 사건에 대한 사람들의 표상을 변화시킨다... 고수준 해석이 이용 가능한 정보에서 요점만을 추출하는 추상적이고 도식적이며 맥락이 탈색된 표상인 반면, 저수준 해석은 구체적이고 상세하며 맥락화된 표상이다... 원거리에서 근거리 관점으로 이동하면 처리가 특정하고 생생한 디테일로 전환되어 본능적인 정서 반응과 즉각적인 행동 동원을 촉발한다."
      citation_location: "pp. 440-444, 452-455"

story_application:
  application_idea: "휴먼 스케일 줌인 렌즈(Human Scale Zoom-in Lens): 100조 원의 국가 부도나 기후 위기 같은 거대한 시스템적 재난을 다룰 때, 관객을 추상적인 통계나 정부 브리핑에 방치하지 않고, '오늘 저녁 아이의 분유값을 구하지 못해 눈물 흘리는 어머니'나 '기온 1도 상승으로 사과나무가 말라죽어 파산한 농부의 하루'라는 초근접 저수준 해석(Low-level construal)으로 카메라를 급격히 줌인하여 뇌의 즉각적 공감과 긴장감을 장악함."
  narrative_stage: "Act 1 Inciting Incident, Act 2 Complications, Midpoint Reality Check"
  emotional_mechanics:
    trigger: "거대한 추상적 위협의 발생 (고수준 개요)"
    build_up: "그 위협이 주인공 개인의 일상·신체·지갑에 미치는 구체적 영향으로 거리 단축"
    peak: "당장 손으로 만질 수 있는 사소하지만 치명적인 파괴의 순간 (극저수준 구체화)"
    release: "구체적 행동을 통한 실존적 해결과 거시적 위기의 극복"
  failure_modes: "지구 멸망만 반복해서 외치며 등장인물 개개인의 일상적 삶과 구체적 감각을 묘사하지 않아 관객이 인지적 거리감 속에 방관자로 머무는 오류"

