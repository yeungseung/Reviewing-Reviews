credibility_assessment:
  credibility_tier: Tier 1 Cognitive Psychology & Decision Science
  methodology:
    study_type: Comprehensive Theoretical Synthesis & Systematic Empirical Review (Fuzzy-Trace Theory Application)
    sample_size: Review of 200+ Empirical Studies on Numeracy and Risk
    target_population: 의료 및 위험 판단 결정을 내리는 대중과 전문가 집단
    relationship_type: Cognitive Structural Model (Fuzzy-Trace Gist Processing & Denominator Neglect)
    effect_size: '분모 무시(Denominator Neglect) 및 비율 편향(Ratio Bias): 분자(Numerator)의 절대 수치에 매몰되어 10/100(10%)을 100/10,000(1%)보다 덜 위험하다고 오판하는 인지적 왜곡 현상 규명 (1,400+ 피인용 랜드마크)'
    replicated: Universally Replicated (퍼지 추적 이론 및 위험 커뮤니케이션 표준)
    limitations: 의료 리스크 전달 중심이나 사회적 재난, 범죄 통계, 경제 위기 서사에 완벽히 일반화됨
claims_and_evidence:
  core_claim: 인간의 뇌는 정밀한 축어적 숫자(Verbatim numbers)를 기억하고 계산하는 데 극도로 취약하며, 오직 숫자가 주는 '핵심 요점(Gist: 크다/작다, 위험하다/안전하다)'에 의존하여 판단한다. 이 과정에서 발생하는 가장 치명적인 인지 오류가 '분모 무시(Denominator Neglect)'다. 수용자는 분모(전체 모수)를 망각한 채 분자(사건 발생 수)의 크기만을 보고 충격을 받거나 반대로 무감각해진다. 따라서 숫자를 전달할 때는 반드시 분모를 눈에 보이게 고정하고, 직관적인 본질적 의미(Gist)로 번역해 주어야 한다.
  verbatim_quotes:
  - original: People process numbers along a continuum from exact verbatim representations to vague, categorical gist representations. Denominator neglect occurs because individuals focus on the focal numerator and ignore the denominator. Decision making is improved not by adding more decimal precision, but by facilitating simple gist comprehension.
    translation: 사람들은 정확한 축어적 표상에서 모호하고 범주적인 요점(Gist) 표상에 이르는 연속선상에서 숫자를 처리한다. 분모 무시는 개인이 초점이 맞춰진 분자에만 집중하고 분모를 무시하기 때문에 발생한다. 의사결정은 소수점의 정밀함을 더함으로써가 아니라, 단순한 요점(Gist) 이해를 촉진함으로써 개선된다.
    citation_location: pp. 943-948
story_application:
  application_idea: 롱폼 스토리의 '분모 가시화 및 Gist 변환 공식'. 충격적인 사건 통계나 위험 수치를 전달할 때, 관객이 분모 무시의 함정에 빠져 공포에 질리거나 반대로 무관심해지지 않도록 "전체 1만 명 중 10명 vs 100명 중 10명"처럼 분모를 명확한 시각적 척도로 고정하고, "100명 중 1명이면 우리 동네 아파트 한 동에서 1명이 발생하는 셈입니다"라는 생활 밀착형 요점(Gist)으로 환산하는 연출 기법.
  narrative_stage: Risk Communication, Problem Scale Definition & Investigative Proof
  emotional_mechanics:
    trigger: 통계 숫자의 모호함으로 인한 혼란 또는 비현실적 공포
    build_up: 분모를 친숙한 집단 단위(예: 축구장 관중, 우리 학교 학생)로 명시
    peak: 분자와 분모의 실질적 비율이 주는 직관적 요점(Gist)의 포착
    release: 숫자의 왜곡 없는 객관적 사태 파악 및 합리적 감정 몰입
  failure_modes: 분모 없이 "올해 500명 사망!" 식의 공포 마케팅(Fear Mongering)을 펼치거나, 복잡한 확률 수식만 읊어 관객을 이탈시키는 오류
verification_status:
  status: Strong Support
  confidence_level: High
