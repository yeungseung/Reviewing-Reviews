claims_and_evidence:
  core_claim: "서사는 단일 평면이 아니라, 이야기 외부의 서술 층위(외디에제틱 Extradiegetic), 기본 이야기 층위(디에제틱 Diegetic), 이야기 속 인물이 말하는 중첩 액자 층위(메타디에제틱 Metadiegetic)로 위계화된 '중첩 서사(Nested Narrative)' 구조를 형성할 수 있다. 상위 층위는 하위 층위의 해석 프레임(Frame)을 규정하며, 층위 간의 정교한 전환(Metalepsis)은 수용자에게 다차원적인 미스터리와 서스펜스를 제공한다."
  verbatim_quotes:
    - original: "Any event a narrative recounts is at a diegetic level immediately higher than the level at which the narrating act producing this narrative is situated... The metanarrative is an embedded story that interprets or mirrors the primary frame."
      translation: "서사가 서술하는 모든 사건은 그 서사를 생산하는 서술 행위가 위치한 층위보다 즉각적으로 한 단계 더 높은 디에제시스 층위에 있다... 메타 서사는 1차 프레임을 해석하거나 반영하는 내포된(중첩된) 이야기이다."
      citation_location: "Cornell University Press, p. 228, 232"

story_application:
  application_idea: "롱폼 스토리의 다층 오픈 루프(Nested Open Loop) 구조화 원리. 외부 프레임(Big Loop: 주인공의 평생 미스터리) 속에 에피소드 액자(Chapter Loop: 특정 과거 사건의 규명), 그 안에 씬 대화 액자(Micro Loop: 특정 비밀의 캐묻기)를 러시아 인형(Matryoshka)처럼 중첩 배치함으로써, 관객이 서로 다른 시간 규모의 질문들을 위계적으로 흡수하게 만드는 아키텍처 설계."
  narrative_stage: "Act 1 Setup & Nested Sequence Organization"
  emotional_mechanics:
    trigger: "액자 서사의 개방(Frame Opening)"
    build_up: "내포된 내부 서사로의 깊은 몰입과 상위 프레임과의 복선 교차"
    peak: "내부 서사의 비밀이 풀리는 순간 상위 프레임의 거대 진실이 번쩍이는 연쇄 폭발"
    release: "액자의 순차적 닫힘(Frame Closure) 및 전체 서사의 구조적 완성"
  failure_modes: "액자가 너무 깊게 3~4중으로 들어가 관객이 '원래 바깥 이야기가 뭐였는지'를 잊어버리는 미로(Labyrinth) 증후군"

