bibliographic_info:
  title: 'A neural substrate of prediction and reward'
  authors:
  - Schultz, Wolfram (University of Fribourg)
  - Dayan, Peter (The Salk Institute)
  - Montague, P. Read (Baylor College of Medicine)
  institution: University of Fribourg & The Salk Institute
  published_date: '1997-03-14'
  source_url: https://doi.org/10.1126/science.275.5306.1593
  source_type: Peer-reviewed Journal (Science, 275(5306), 1593-1599)
credibility_assessment:
  credibility_tier: Tier 1 Computational Neuroscience Supreme Monument
  methodology:
    study_type: In Vivo Electrophysiological Single-Unit Neurorecording & Temporal Difference (TD) Reinforcement Learning Modeling
    sample_size: 영장류 중뇌 도파민 뉴런(흑질 치밀부 SNc, 복측 피개부 VTA) 단일 세포 전기생리학적 기록 및 수리 계산 검증
    target_population: 보상 조건화 및 예측 오차 학습을 수행하는 영장류 신경계
    relationship_type: Exact Mathematical Neurocoding (Dopaminergic Phasic Firing Encodes Reward Prediction Error: Actual - Predicted Reward)
    effect_size: 중뇌 도파민 뉴런은 보상 그 자체가 아니라 '보상 예측 오차(Reward Prediction Error, RPE = Reward Received - Reward Predicted)'를 밀리초 단위로 정확히 인코딩함을 입증. 1) 예측하지 못한 보상 ➔ 도파민 폭발(Positive RPE), 2) 완벽히 예측된 보상 ➔ 기저 발화 유지(Zero RPE), 3) 기대했던 보상의 누락 ➔ 도파민 발화 억제(Negative RPE) (13,000+ 피인용 불멸의 신경과학 고전)
    replicated: Universally Replicated across human fMRI, optogenetics, artificial intelligence reinforcement learning (RL), and narrative cognition
    limitations: 원초적 감각/음식 보상 실험에서 정립되었으나 고차원적 서사적 보상(지적 깨달음, 진실 발견, 도덕적 승리)의 신경생물학적 기초로 전면 인정됨
claims_and_evidence:
  core_claim: 인간의 뇌가 '재미'와 '몰입'을 느끼며 학습을 지속하게 만드는 신경전달물질인 도파민은 고정된 보상의 크기에서 나오는 것이 아니다. 도파민의 급격한 분비(Phasic Dopamine Burst)는 '기대치를 긍정적으로 초과하는 예측 오차(Positive Reward Prediction Error: RPE)'가 발생할 때만 점화된다. 서사에서 주인공이 관객이 예상한 그대로 승리하면 도파민 뉴런은 발화하지 않는다(Zero RPE = 밋밋함/지루함). 반면, 관객이 "절망적이다"라고 예상했던 순간 뜻밖의 기지와 숨겨진 복선으로 기막힌 역전승을 거둘 때, 실제 보상이 예측 보상을 압도하며 거대한 도파민 폭발(Positive RPE)이 발생하여 전율적인 쾌감을 각인시킨다.
  verbatim_quotes:
  - original: Dopamine neurons report an error in the prediction of reward... They emit a positive signal (burst of firing) when an unexpected reward occurs, no signal when a predicted reward occurs, and a negative signal (depression of firing) when an expected reward is omitted.
    translation: 도파민 뉴런은 보상 예측의 오차(Error in the Prediction of Reward)를 보고한다... 이들은 기대하지 않은 보상이 발생할 때 양의 신호(발화 폭발)를 방출하고, 예측된 보상이 발생할 때는 아무런 신호를 방출하지 않으며(기저 유지), 기대했던 보상이 누락될 때는 음의 신호(발화 억제)를 방출한다.
    citation_location: p. 1593
story_application:
  application_idea: 롱폼 스토리의 '도파민 보상 예측 오차(RPE) 연출 공식'. 관객에게 도파민성 카타르시스를 선사하려면 단순히 화려한 승리를 보여주는 것으로는 부족함. 승리 직전 관객의 주관적 기대치(Predicted Reward)를 의도적으로 바닥으로 떨어뜨려야 함(인물의 절체절명 위기 연출). 그 상태에서 사전에 깔아둔 복선을 활용해 기대치를 아득히 초과하는 기발한 승리(Actual Reward)를 전달하면, $\Delta \text{RPE} = (\text{Actual} - \text{Predicted}) \gg 0$ 공식에 의해 관객의 뇌에서 최대치의 도파민성 쾌감이 폭발함.
  narrative_stage: Climax Resolution, Underdog Victory, Payoff & Reversal
  emotional_mechanics:
    trigger: 상황의 악화로 관객의 성공 예측치(Predicted Reward)가 바닥으로 추락
    build_up: 불리한 조건 속에서도 포기하지 않는 인물의 필사적 저항
    peak: 숨겨진 복선이 번개처럼 맞물리며 전세를 뒤집는 결정적 한 수의 발동
    release: 기대치를 수백 퍼센트 초과하는 압도적 승리로 분출되는 도파민 폭발(Positive RPE)
  failure_modes: 아무런 난관도 없이 뻔하게 승리하여 도파민 세포가 침묵하는 무감각(Zero RPE), 혹은 잔뜩 기대하게 해놓고 허무하게 용두사미로 끝나버려 관객에게 우울과 분노를 안기는 도파민 억제(Negative RPE)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 웹소설 사이다, 영화 클라이맥스 카타르시스, 소년만화 역전극, 스포츠 다큐멘터리 등 모든 승패와 보상이 개입된 서사에 100% 적용
