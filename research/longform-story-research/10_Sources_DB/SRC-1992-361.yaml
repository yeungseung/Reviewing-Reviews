key_contribution: 상충하는 속성 간의 트레이드오프(Trade-off)에서 발생하는 인지적 갈등을 실증. 하나의 획득이 다른 소중한 가치의
  비가역적 상실을 동반할 때 인간은 불가피한 후회와 씁쓸한 수용의 복합 감정을 형성함을 규명.
relevance: 서사의 클라이맥스 직전에 승리의 대가로 치러진 비가역적 손실을 폭로(TDM)하여 값싼 승리를 깊은 비터스위트 카타르시스로 전환하는
  서사 장치.
