id: SRC-2007-572
author: Michelle N. Shiota, Dacher Keltner, & Amanda M. Mossman
year: 2007
title: 'The Nature of Awe: Elicitors, Appraisals, and a Physiological Aspect'
venue: Cognition & Emotion, 21(5), pp. 944-963
tier: 1
citation_count: 1950
url: https://doi.org/10.1080/02699930600923668
key_contribution: 경외감(Awe)과 숭고미의 인지 평가 및 자율신경계 반응 규명. 경외감은 광대한 시각적 지각(Perceived Vastness)과 기존 멘탈 모델의 인지적 수용(Need for Accommodation)을 강제하는 정서로서, 교감신경계 투쟁-도피 각성을 억제하고 미주신경계 부교감 톤(Vagal Tone)을 유발하여 전신을 압도하는 고요한 전율을 형성함. 이를 위해 시각적으로는 광대한 파노라마 롱샷(Extreme Wide Shot)과 최소 7~12초 이상의 압도적 체류 시간이 필수적이며, 분절된 고속 편집은 인지적 수용 과정을 즉각 파괴함을 생리심리학적으로 실증.
relevance: 경외감(Awe)과 숭고미 연출 시 왜 넓은 샷(Wide Shot)과 유장한 체류 시간이 필수적인지 규명하는 생리심리학적 토대.
themes:
