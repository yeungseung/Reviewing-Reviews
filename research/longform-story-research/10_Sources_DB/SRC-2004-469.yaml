id: SRC-2004-469
author: Arthur A. Raney
year: 2004
title: 'Expanding disposition theory: Media enjoyment and moral judgments'
venue: 'Communication Theory, 14(4), 348-373'
tier: 1
citation_count: 890
url: https://doi.org/10.1111/j.1468-2885.2004.tb00318.x
key_contribution: 미디어 향유와 도덕적 판단을 통합한 성향 이론(Disposition Theory)의 확장. 인물 드라마 및 사회 역사 서사에서 수용자의 정서적 몰입과 카타르시스가 인물의 도덕적 가치 평가(Moral Judgments)와 깊이 연동되어 있음을 규명. 인간관계(사랑/가족)와 사회적 야망/경력(Career) 사이의 갈등에서 인물이 내리는 결정적 선택이 시청자 공감의 정점(Peak)을 형성함을 실증.
relevance: 인물 전기 및 멜로드라마/사회 서사에서 피크가 관계와 경력의 선택(Relationship/Career Choice)으로 작동하는 메커니즘 제공.
themes:
  - '#49 Theme 2'
