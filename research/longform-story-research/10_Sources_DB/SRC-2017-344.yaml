id: SRC-2017-344
author: M. J. Crockett
year: 2017
title: Moral Outrage in the Digital Age
venue: Nature Human Behaviour
tier: 1
citation_count: 1100
url: https://doi.org/10.1038/s41562-017-0213-3
key_contribution: 디지털 미디어 환경에서 도덕적 분노(Moral Outrage)가 주의 환기(Salience), 평판 신호(Reputation
  Signaling), 보상 회로(Dopamine Anticipation)를 통해 강력한 시청자 개입을 촉발하지만, 과도한 노출 시 정서적 피로(Outrage
  Fatigue)와 양극화를 부름을 신경과학적으로 실증.
relevance: 도덕적 분노의 강력한 몰입력과 피로도 임계점 거버넌스의 신경과학적 근거.
