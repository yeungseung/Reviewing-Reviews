claims_and_evidence:
  core_claim: "인간은 혼란과 모호성을 피하고 명확한 답을 얻고자 하는 '인지적 종결 욕구(Need for Cognitive Closure)'를 지니며, 이는 빠른 판단에 매달리는 '포착(Seizing)'과 기존 판단을 고수하는 '고착(Freezing)'의 2단계 기제로 작동한다. 종결 욕구가 높은 상태에서는 미완성의 모호함이 지속될 때 심한 불쾌감과 이탈을 유발한다."
  verbatim_quotes:
    - original: "The need for cognitive closure refers to individuals' desire for a firm answer to a question and an aversion toward ambiguity... It manifests through the urgency tendency (seizing) to seize on early information, and the permanence tendency (freezing) to freeze on one's judgments."
      translation: "인지적 종결 욕구는 질문에 대한 확고한 답을 얻고자 하는 열망과 모호성에 대한 혐오를 뜻한다... 이는 초기 정보에 즉각 매달리려는 긴박성 경향(포착)과 자신의 판단을 동결하려는 영속성 경향(고착)을 통해 나타난다."
      citation_location: "Psychological Review, 103(2), p. 264-266"

story_application:
  application_idea: "피로한 현대 관객(High NFCC 상태)을 대상으로 한 롱폼 서사에서는, Hook에서 미완성의 모호성을 열어젖힐 때 반드시 '이 영상 끝에서 명쾌한 답과 질서를 보장한다'는 서사적 계약(Warranty)을 제시하여 모호성으로 인한 불쾌한 이탈을 방지함."
  narrative_stage: "Opening Hook Framing & Narrative Warranty"
  emotional_mechanics:
    trigger: "모호성과 미해결 상태의 제시"
    build_up: "종결 욕구 자극으로 인한 빠른 해결 기대"
    peak: "단서들이 하나로 수렴되며 종결 직전에 이르는 쾌감"
    release: "명쾌하고 반론의 여지 없는 확고한 종결(Firm Closure) 제공"
  failure_modes: "답을 끝내 주지 않거나 지나치게 난해한 열린 결말로 방치할 경우 대중 관객의 극단적 분노와 평점 테러를 부름"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
