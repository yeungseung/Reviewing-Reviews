id: SRC-1928-267
title: "Twenty Rules for Writing Detective Stories"
authors:
  - "S. S. Van Dine"
year: 1928
type: academic_primary
tier: 1
publication: "The American Magazine"
volume: "106"
issue: "3"
pages: "129-131"
citation_count: 1400
key_findings:
  - "미스터리 및 반전 서사의 20대 페어플레이(Fair Play) 규칙 정문화."
  - "독자는 주인공(탐정)과 완벽히 동등한 기회를 가져야 하며(Rule 1), 작가는 의도적으로 독자에게 거짓 단서를 제시해서는 안 됨(Rule 2)."
  - "단서의 공정한 노출(Fair Foreshadowing)과 적법한 정보 은폐(Misdirection)의 경계를 규정하여, 불공정한 반전(Unfair Twist)이 서사 계약을 파괴함을 경고."
core_claims:
  - "좋은 반전은 작가가 독자와 벌이는 정직한 지적 게임이며, 모든 단서는 사전에 독자에게 노출되어야 한다."
  - "우연이나 작가의 일방적 기만에 의한 반전은 서사의 자격을 상실한다."
keywords:
  - fair play
  - foreshadowing
  - detective rules
  - information concealment
  - fair twist
