title: "The polarizing impact of science literacy and numeracy on perceived climate change risks"
venue: "Nature Climate Change, 2(10), 732-735"
tier: 1
citation_count: 2150
url: https://doi.org/10.1038/nclimate1547
key_contribution: "문화적 인지 이론(Cultural Cognition Theory)에 기초한 과학 소통의 양극화 기제 실증. 과학 리터러시와 수치 분석력이 높은 개인일수록 자신의 문화적 정체성과 부합하는 방향으로 데이터를 편향되게 해석하며, 순수 팩트 중심의 일방적 설명은 정체성 방어 기제를 촉발함을 규명."
relevance: "과학 커뮤니케이션 및 탐사 다큐멘터리에서 관객의 신념 갱신을 이끌어내기 위해 '문화적 가치·공감 우선(Emotion/Value-first) ➔ 엄밀한 팩트 공급'의 50:50 균형 시퀀싱이 필수적임을 입증하는 결정적 학술 근거."
