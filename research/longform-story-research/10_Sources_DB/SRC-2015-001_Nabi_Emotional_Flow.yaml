claims_and_evidence:
  core_claim: "메시지 노출 과정에서 발생하는 감정의 전환(Emotional Shift)은 단일 감정 유지보다 내러티브 몰입(Transportation)을 유의미하게 증폭시키며 설득적 효과를 매개함."
  verbatim_quotes:
    - original: "Emotional flow—the evolution of the emotional experience during exposure to a message—can play a critical role in audience engagement and persuasive outcomes."
      translation: "메시지 노출 중 감정적 경험의 진화인 '정서적 흐름'은 청중의 관여도와 설득적 결과에 결정적인 역할을 할 수 있다."
      citation_location: "p.137, Abstract"

story_application:
  application_idea: "롱폼 도입부에서 불안이나 공포를 유발한 뒤, 중반부에서 인물의 노력으로 안도감과 희망으로 감정을 전환시켜 시청자의 몰입 지속을 극대화함."
  narrative_stage: "Act 1 Setup to Act 2 Rising Action"
  emotional_mechanics:
    trigger: "새로운 탈출구 또는 해결책의 등장"
    build_up: "극심한 긴장과 위기감의 선행 누적"
    peak: "위기 모면의 순간"
    release: "안도감(Relief)과 잔류 각성의 긍정적 전이"
  failure_modes: "위기의 고조 없이 안도감만 일찍 제시되면 긴장감이 풀려 시청 이탈 발생"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "전환되는 감정의 인과관계가 관객에게 납득 가능해야 함"
