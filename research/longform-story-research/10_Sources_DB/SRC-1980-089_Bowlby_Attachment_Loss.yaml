claims_and_evidence:
  core_claim: "상실과 슬픔의 4단계 애착 재구성(Attachment Reorganization): 인간은 중요한 애착 대상을 상실했을 때 [마비(Numbing) -> 갈망과 저항(Yearning and Searching) -> 혼란과 절망(Disorganization and Despair) -> 재조직화(Reorganization)]의 4단계를 필연적으로 통과한다. 인간 드라마(Human Drama) 서사는 주인공이 상실을 직면하고 절망의 심연을 통과해 세계와의 새로운 관계를 재조직화(Resolution)하는 과정을 통해 관객의 공감적 슬픔과 궁극적 정서 정화(Catharsis)를 이끌어낸다."
  verbatim_quotes:
    - original: "Only if he can tolerate the disorganization of his personality that loss precipitates, can he hope to reach a new reorganization that is more or less well adapted to his changed circumstances... Mourning is a painful and slow process of shedding old attachments and establishing new patterns."
      translation: "상실이 촉발하는 인격의 해체와 혼란을 견뎌낼 수 있어야만, 변화된 환경에 적응하는 새로운 재조직화에 도달할 수 있다... 애도는 낡은 애착을 털어내고 새로운 삶의 패턴을 확립해나가는 고통스럽고 느린 과정이다."
      citation_location: "pp. 18-23"

story_application:
  application_idea: "인간 드라마의 3박자 감정 아크 설계(Empathy -> Loss/Despair -> Resolution): 주인공의 소중한 대상(가족, 꿈, 정체성)에 대한 애착을 초반에 강하게 확립하여 공감(Empathy)을 유도하고, 중반에 돌이킬 수 없는 결손(Loss)을 부여해 갈망과 헛된 저항을 거쳐 완전한 절망의 저점(Despair)으로 떨어뜨린다. 결말에서는 기적적 회복이 아니라 고통 속에서 삶의 의미를 재발견하는 내적 재조직화(Resolution)를 제시해야 진짜 드라마적 카타르시스가 완성된다."
  narrative_stage: "Human Drama Emotional Arc (Establishment -> Bereavement/Yearning -> Valley of Despair -> Reorganization)"
  emotional_mechanics:
    trigger: "돌이킬 수 없는 소중한 애착 대상의 상실 및 결손 발생"
    build_up: "대상을 되찾으려는 처절한 저항(Yearning)과 현실 직면 후 찾아오는 붕괴와 슬픔(Disorganization)"
    peak: "도저히 되돌릴 수 없음을 뼈저리게 인정하는 비통한 참회와 절망의 바닥"
    release: "상실을 받아들이고 상처 입은 채로 앞으로 나아가는 성숙한 내적 재조직화(Resolution)"
  failure_modes: "슬픔의 저점과 해체 과정 없이 값싼 기적이나 즉각적 극복으로 넘어가 공감을 파괴하는 얄팍한 신파극 오류"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "휴먼 드라마, 가족극, 성장 서사, 비극 등 인간적 유대와 상실을 다루는 모든 내러티브"
