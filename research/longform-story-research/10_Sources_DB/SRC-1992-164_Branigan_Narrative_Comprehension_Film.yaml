claims_and_evidence:
  core_claim: "영화 관객은 스크린에 투사되는 숏과 씬의 연속을 단순히 수동 감상하지 않고, 인과적 도식(Causal Schemas)을 적용하여 사건 간의 인과적 결속(Causal Connections)을 끊임없이 재구성한다. 관객의 몰입을 유지하는 '서사 추진력(Narrative Momentum)'은 질문-답변의 인과 사슬이 씬 전환을 관통할 때 생성된다. 반면 비인과적 앤솔로지(Anthology)나 에피소드식 나열은 '주제적 일관성(Thematic Unity)'이나 '상징적 대위법'이라는 고도의 예술적 규약이 없는 한, 상업 롱폼에서 치명적인 서사적 감속(Narrative Deceleration)과 관객 이탈을 유발한다."
  verbatim_quotes:
    - original: "Narrative momentum depends on the spectator's forward projection of causal hypotheses... In episodic or anthology structures, momentum is lost unless a higher-order thematic or formal constraint bridges the discontinuous segments."
      translation: "서사 추진력은 관객의 인과적 가설에 대한 전방 투사에 의존한다... 에피소드식 또는 앤솔로지 구조에서는 상위 차원의 주제적 또는 형식적 제약이 불연속적인 분절들을 연결해주지 않는 한 모멘텀이 상실된다."
      citation_location: "Routledge, p. 112-118, 195"

story_application:
  application_idea: "앤솔로지/에피소드식 구성의 치명적 함정과 극복 기법. 옴니버스식 서사를 설계할 때 인과적 사슬이 끊어지면 관객의 주의가 리셋되므로, '동일한 메타 질문(Overarching Meta-Question)', '인물의 공통적 딜레마', 혹은 '동일한 물리적 매개체(예: 바통처럼 전달되는 돈가방)'를 통해 비인과적 단절을 보완하는 '의사 인과 브리징(Pseudo-Causal Bridging)'을 적용해야 함."
  narrative_stage: "Episodic vs Linear Plot Architecture & Narrative Momentum"
  emotional_mechanics:
    trigger: "인과적 가설 투사를 통한 모멘텀 형성"
    build_up: "씬 전환 속에서도 유지되는 일관된 인과적 동력"
    peak: "누적된 인과 사슬들이 최종 귀결점으로 질주하는 가속 구간"
    release: "인과적 필연성이 완성되는 순간의 지적 쾌감"
  failure_modes: "각 에피소드가 아무런 인과적/주제적 연결 없이 분절되어 옴니버스 단편 영화 3편을 억지로 붙여놓은 것처럼 느껴지는 '서사적 감속 및 이탈'"

