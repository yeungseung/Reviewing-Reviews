id: "SRC-1986-017"
title: "The Elaboration Likelihood Model of persuasion"
authors:
  - "Richard E. Petty"
  - "John T. Cacioppo"
year: 1986
publication: "Advances in Experimental Social Psychology, Vol. 19, 123-205"
doi_or_url: "https://doi.org/10.1016/S0065-2601(08)60214-2"
tier: "Tier 1 (Academic Landmark)"
credibility_score: 98

summary: |
  태도 변화와 설득의 이중 처리 모델(ELM).
  개인적 관련성(Personal Relevance)과 인지적 동기/능력에 따라 중심 경로(Central Route: 인지적 정교화와 의미 형성)와 주변 경로(Peripheral Route: 표면적 단서, 일시적 정서 반응)로 정보 처리가 분기됨을 실증.
  스토리텔링에서 'Personal Relevance'가 단순 시청을 넘어 깊은 정서적 공명과 가치관 수준의 의미화(Meaning-making)로 전환되는 핵심 트리거임을 규명함.

key_findings:
  - 개인적 관련성(Involvement/Relevance)이 높을수록 관객은 피상적 단서를 넘어 논증과 서사의 핵심 의미에 대해 '중심 경로(Central Route)'로 인지적 정교화(Elaboration)를 수행함.
  - 중심 경로를 통해 정교화된 서사 경험은 정서적 강도와 지속성이 훨씬 크며, 태도와 가치관의 장기적 변화를 유발함.
  - 개인적 관련성이 낮으면 관객은 '주변 경로(Peripheral Route)'에 머물러 자극적인 연출이나 단기 감정에만 반응하고 의미 형성에 이르지 못함.

