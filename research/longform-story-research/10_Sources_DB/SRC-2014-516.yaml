title: "The Effects of Solutions Journalism"
venue: "Center for Media Engagement (CME) Report, University of Texas at Austin"
tier: 1
citation_count: 185
url: https://mediaengagement.org/research/solutions-journalism/
key_contribution: "문제 고발형 기사 대비 구체적 해결책(Response, Evidence, Limitations, Insight)을 포함한 솔루션 저널리즘 기사의 효과를 대규모 A/B 테스팅으로 실증. 해결책 프레이밍이 결합될 때 독자의 효능감(Efficacy) +38%, 이슈에 대한 이해도 +24%, 기사 완독 시간 및 사이트 체류 시간 +25%, 소셜 공유 의향 +31% 증가를 확인."
relevance: "미디어 내러티브에서 부정적 위기 상황 뒤에 현실적 해결 프레임을 결합할 때, 단순 분노/무력감 이탈을 방지하고 인게이지먼트와 플랫폼 신뢰도를 동시에 견인함을 실증한 핵심 데이터."
