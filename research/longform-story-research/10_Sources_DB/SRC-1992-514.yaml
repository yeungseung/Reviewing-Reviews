id: SRC-1992-514
author: Kim Witte
year: 1992
title: "Putting the fear back into fear appeals: The extended parallel process model"
venue: "Communication Monographs, 59(4), 329-349"
tier: 1
citation_count: 5300
url: https://doi.org/10.1080/03637759209376276
key_contribution: "공포 관리 모델(EPPM, Extended Parallel Process Model)을 통해 위협(Threat)과 효능감(Efficacy: Self-efficacy + Response efficacy)의 상호작용을 정립. 위협 인지가 높더라도 효능감이 결여되면 방어적 회피·인지 왜곡(Fear Control)이 발생하며, 효능감이 위협을 초과할 때만 능동적 태도·행동 수용(Danger Control)이 일어남을 증명."
relevance: "부정적 정서(공포, 불안, 분노)로 시작하거나 전개된 내러티브가 관객의 인지적 이탈이나 회피로 끝나지 않고 건설적 만족으로 전환되기 위해 엔딩 구간에 반드시 구체적인 반응/자기 효능감이 결합되어야 한다는 핵심 이론적 토대."
themes:
  - "#53 Theme 2"
