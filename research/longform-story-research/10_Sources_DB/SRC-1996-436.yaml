id: SRC-1996-436
author: Richard E. Mayer, William Bove, Alexandra Bryman, Rebecca Mars, & Leda Tapangco
year: 1996
title: 'When less is more: Meaningful learning from visual and verbal summaries of science textbook lessons'
venue: Journal of Educational Psychology
tier: 1
citation_count: 1050
url: https://doi.org/10.1037/0022-0663.88.1.64
key_contribution: 멀티미디어 인지 학습 이론의 일관성 원칙(Coherence Principle)과 유혹적 세부사항 효과(Seductive Details Effect)를 실증. 정보 전달 시 주제와 직접 관련 없는 흥미 위주의 극적 이야기나 감정적 장치를 억지로 끼워 넣으면 오히려 학습자의 핵심 개념 이해와 문제 해결 전이 능력이 38% 저하됨을 입증.
relevance: 정보형 콘텐츠에서 억지스러운 스토리텔링을 배제하고 순수하고 명확한 설명(Explanation)이 더 우월한 경계 조건(Story Exemption Threshold)을 규명하는 결정적 실증 근거.
