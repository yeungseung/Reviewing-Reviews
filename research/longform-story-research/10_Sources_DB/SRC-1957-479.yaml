id: SRC-1957-479
author: Charles B. Ferster & B. F. Skinner
year: 1957
title: 'Schedules of Reinforcement'
venue: Appleton-Century-Crofts
tier: 1
citation_count: 9850
url: https://psycnet.apa.org/record/1958-00508-000
key_contribution: '강화 스케줄(Schedules of Reinforcement) 및 변동 비율(Variable Ratio) 보상 메커니즘 정립. 고정 보상보다 예측 불가능한 간헐적 보상이 행동의 소거 저항력(Resistance to Extinction)과 지속적 몰입을 극대화함을 실증. 긴 서사 축적 구간에서 최종 피크에 도달하기 전 관객의 주의를 유지하고 이탈을 방어하는 마이크로 페이오프(Micro-payoffs) 배치의 핵심 행동과학적 원리 제공.'
relevance: 롱폼 서사의 긴 축적 구간(Slow-burn)에서 간헐적 보상(소소한 승리, 단서 발견)을 통해 관객의 몰입을 유지하는 마이크로 페이오프 아키텍처의 이론적 토대.
themes:
  - '#50 Theme 2'
