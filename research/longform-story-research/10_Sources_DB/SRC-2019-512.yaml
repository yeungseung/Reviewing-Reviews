id: SRC-2019-512
author: Benjamin Toff & Ruth Palmer
year: 2019
title: "Explaining the Great Uncoupling: News Avoidance and Emotional Burnout"
venue: "Journalism Studies, 20(15), 2133-2152"
tier: 1
citation_count: 430
url: https://doi.org/10.1080/1461670X.2019.1677271
key_contribution: "미디어 회피(News Avoidance)와 정서적 탈진(Emotional Burnout)의 인과 메커니즘 실증. 희망이나 해결책 없이 절망과 분노만을 주입하는 부정적 콘텐츠에 지속 노출된 수용자가 겪는 자기방어적 언팔로우(Unfollow)와 채널 차단 행동을 질적·양적으로 규명."
relevance: "채널 차원에서 부정적 엔딩을 남발할 때 발생하는 구독자 이탈, 신뢰도 붕괴, 채널 피로(Fatigue) 현상의 실증 준거."
themes:
  - "#53 Theme 1"
