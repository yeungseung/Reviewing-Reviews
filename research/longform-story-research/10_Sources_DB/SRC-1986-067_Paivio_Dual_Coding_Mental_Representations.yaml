claims_and_evidence:
  core_claim: "인간의 인지 체계는 언어적 정보를 처리하는 '언어 시스템(Verbal System)'과 비언어적 감각 심상을 처리하는 '이미지 시스템(Nonverbal/Imagen System)'의 두 가지 독립적이지만 상호 연결된 부호화 경로(Dual Coding)를 지닌다. 구체적 사물과 감각적 디테일(Concrete Words)은 언어와 시각 심상 두 경로를 동시에 점화하여 단일 부호화되는 추상 개념(Abstract Words) 대비 기억 인코딩률과 인출 속도가 2배 이상 높고, 정서적 각성을 강력하게 유도한다."
  verbatim_quotes:
    - original: "Concrete language possesses a distinct cognitive advantage over abstract language because it accesses both verbal and nonverbal representational systems... Imagery is an effective mnemonic because it provides a second, nonverbal memory trace."
      translation: "구체적인 언어는 언어적 및 비언어적 표상 시스템 모두에 접근하기 때문에 추상적인 언어보다 뚜렷한 인지적 이점을 지닌다... 심상은 두 번째 비언어적 기억 흔적을 제공하기 때문에 효과적인 기억술이 된다."
      citation_location: "pp. 53-59"

story_application:
  application_idea: "스토리텔링에서 '전쟁의 비참함'과 같은 추상적 관념은 관객의 언어 시스템만을 미약하게 자극하지만, '진흙탕에 빠진 찢어진 어린이 운동화 한 짝'과 같은 구체적 감각 디테일은 이미지 시스템을 즉각 폭발시켜 관객의 뇌에 2중 기억 흔적(Dual Trace)과 깊은 정서적 상상을 새겨넣음."
  narrative_stage: "Sensory Detailing & Concreteness Optimization"
  emotional_mechanics:
    trigger: "구체적 감각 단서(시간, 공간, 물리적 사물)의 투입"
    build_up: "언어적 부호와 비언어적 시각 심상의 동시 활성화 (이중 부호화)"
    peak: "두뇌 속 생생한 가상현실 렌더링을 통한 정서적 공명"
    release: "강력하고 지워지지 않는 감정적 잔상 보존"
  failure_modes: "추상적 형용사나 통계 수치만 나열하여 이미지 시스템을 전혀 점화하지 못하는 건조한 묘사"

