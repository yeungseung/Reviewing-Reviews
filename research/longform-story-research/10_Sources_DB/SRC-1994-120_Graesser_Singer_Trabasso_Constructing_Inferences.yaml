claims_and_evidence:
  core_claim: "독자나 관객은 서사를 수용할 때 능동적인 '의미 탐구(Quest after Meaning)' 원칙에 따라 자동으로 인과적 추론을 생성한다. 특히 수용자는 사건을 마주할 때 '이 사건이 왜 일어났는가?'를 설명하는 인과적 선행 추론(Causal Antecedent Inferences)과 인물의 상위 목표 추론(Superordinate Goal Inferences)을 온라인(실시간)으로 구성한다. 만약 오프닝의 갈등이 행위자의 목표(누가 무엇을 원하는가)나 물리적 극성(누가 누구를 위협하는가)에 대한 최소한의 단서조차 제공하지 못하면 인과적 추론이 불가능해져 '인지적 결속성 붕괴(Coherence Breakdown)'가 일어나며 몰입이 중단된다."
  verbatim_quotes:
    - original: "Readers construct a coherent situation model according to the quest-after-meaning principle... They routinely and automatically generate causal antecedent inferences and superordinate goal inferences to explain why actions and events occur. If a text provides no coherent causal basis for an action, inferential processing stalls and comprehension breaks down."
      translation: "독자들은 의미 탐구 원칙에 따라 일관된 상황 모델을 구성한다... 그들은 행동과 사건이 왜 발생하는지 설명하기 위해 인과적 선행 추론과 상위 목표 추론을 일상적이고 자동적으로 생성한다. 만약 텍스트가 행동에 대한 일관된 인과적 근거를 제공하지 못하면 추론 처리가 지연되고 이해가 붕괴한다."
      citation_location: "pp. 371-373"

story_application:
  application_idea: "갈등 오프닝(Conflict Opening)을 구성할 때 '누가 왜 싸우는지'를 감추는 미스터리는 좋지만, '누가 누구를 공격하고 있으며 당장 무엇이 걸려 있는가'라는 '신체적/공간적 극성'까지 감추어서는 안 됨. 관객이 '왜(Why)'라는 질문을 품게 하려면, 최소한 '무엇이 벌어지고 있는가(What)'는 1초 만에 식별할 수 있는 최소 이해 가능성(Minimal Comprehensibility)이 보장되어야 함."
  narrative_stage: "Opening Scene Construction & Causal Inference Anchoring"
  emotional_mechanics:
    trigger: "명확한 물리적 충돌 및 위협 구도(공격자 vs 방어자)의 즉시 식별"
    build_up: "인물의 절박한 생존/도주 목표 파악과 동시에 '왜 이 지경이 되었는가'에 대한 선행 인과 추론 가동"
    peak: "해소되지 않은 인과적 정보 공백으로 인한 극심한 호기심 및 지적 긴장"
    release: "오프닝 직후 과거 맥락(과거 회상 또는 씬 전환)이 주어지며 인과 퍼즐의 첫 조각 결합"
  failure_modes: "모호한 용어와 혼란스러운 연출로 누가 왜 대립하는지조차 파악할 수 없어 관객을 인지적 피로에 빠뜨리는 '무맥락 소음 오프닝'"

