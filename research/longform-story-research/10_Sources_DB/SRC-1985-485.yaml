key_contribution: '인지서사학적 고전 영화 서사 체계 및 모티프 심기와 회수(Motif Planting and Payoff) 이론 정립. 영화의 모든 시각적·청각적 모티프는 인과적 사슬(Causal Chain) 속에 정밀하게 동기화되어야 하며, 선행 셋업 없이 우연이나 작위적 조작(Deus ex Machina)으로 감정을 유발하려는 시도는 관객에게 조작감 지각(Manipulation Perception)을 촉발하여 냉소를 유발함을 서사학적으로 규명.'
relevance: 셋업-페이오프 인과성이 만드는 정당하게 획득된 감정(Earned Emotion)과 작위적 감정 조작을 방어하는 서사학적 표준 체계.
