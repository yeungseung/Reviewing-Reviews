claims_and_evidence:
  core_claim: "인간 기본 가치의 원형 구조와 서사적 딜레마 축: 인간의 가치는 무작위적이거나 파편적인 선호의 집합이 아니라, 10대 보편적 기본 가치(권력, 성취, 쾌락, 자극, 자기주도, 보편주의, 자비, 순응, 전통, 안전)가 원형(Circular continuum)으로 배열된 심리적 구조를 지닌다. 이 가치들은 두 개의 직교하는 양극 차원 [자기초월(Self-Transcendence: 보편주의·자비) vs 자기향상(Self-Enhancement: 권력·성취)] 및 [변화개방(Openness to Change: 자기주도·자극) vs 보수/보존(Conservation: 안전·순응·전통)]으로 대립한다. 한 축의 가치를 추구하면 필연적으로 대립 축의 가치가 희생되는 심리적·행동적 상충(Trade-off)이 발생하며, 이는 서사에서 인물이 마주하는 불가역적 갈등과 도덕적 딜레마의 궁극적 원천이 된다."
  verbatim_quotes:
    - original: "Values are desirable trans-situational goals, varying in importance, that serve as guiding principles in the life of a person or other social entity... The circular structure represents a dynamic of conflict and congruence among values: pursuing self-enhancement values directly opposes the pursuit of self-transcendence values."
      translation: "가치는 중요도가 다양하며 개인이나 사회적 실체의 삶에서 지침 원리로 기능하는, 상황을 초월한 바람직한 목표이다... 원형 구조는 가치 간의 갈등과 일치 역학을 나타낸다. 자기향상 가치의 추구는 자기초월 가치의 추구와 직접적으로 대립한다."
      citation_location: "pp. 1-4, 15-18"

story_application:
  application_idea: "가치 충돌 기반의 입체적 딜레마(Value-Axis Conflict Engine): 이야기의 주인공에게 '선 vs 악'의 단순 대립이 아니라, 슈바르츠 원형 구조의 대립축(예: 가족과 부하를 살리려는 자비 vs 집단 규율을 지켜야 하는 순응/전통, 개인의 자율성/자기주도 vs 사회적 안전/보안)을 정면으로 충돌시킴으로써 관객의 뇌에 심오한 도덕적 서스펜스와 인지적 몰입을 유도함."
  narrative_stage: "Inciting Incident, Midpoint Dilemma, Climax Moral Choice"
  emotional_mechanics:
    trigger: "두 가지 정당한 인간 가치가 동시에 위협받는 상황 조성"
    build_up: "어느 한쪽을 선택하면 반대쪽 가치가 치명적으로 파괴되는 인과적 압박 강화"
    peak: "두 양극 가치 중 하나를 결단해야 하는 루비콘강 선택의 순간"
    release: "선택의 불가피한 대가를 치르며 도덕적·실존적 성장 혹은 비극적 카타르시스 획득"
  failure_modes: "주인공이 아무런 대가 없이 두 대립 가치를 모두 거저 얻는 '데우스 엑스 마키나 식 양다리 해결'은 가치의 무게(Stakes)를 증발시키고 유치한 판타지로 전락함"

