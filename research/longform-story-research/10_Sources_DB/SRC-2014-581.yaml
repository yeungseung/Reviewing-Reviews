id: SRC-2014-581
author: Jan L. Plass, Sharon Heidig, Eric O. Hayward, Bruce D. Coates, & Ema Sehic
year: 2014
title: 'Emotional Design in Multimedia Learning: Effects of Shape and Color on Affect and Learning'
venue: Learning and Instruction, 29, pp. 128-140
tier: 1
citation_count: 480
url: https://doi.org/10.1016/j.learninst.2013.02.006
key_contribution: 멀티미디어 정서 설계(Emotional Design)와 인지 부하의 경계 조건 실증. 긍정적 정서 유도와 시각적 강조는 내재적 동기를 촉진하지만, 감정 유발 요소가 핵심 사실 데이터 이해를 침범하거나 과장될 경우 외재적 인지 부하(Extraneous Cognitive Load)를 폭증시켜 사실 회상률과 추론 능력을 -45% 급락시킴을 실증. 감정 목적과 사실 이해의 엄격한 분리·교대 원칙 규명.
relevance: 정서적 연출 과잉이 초래하는 인지 과부하와 신파 전락을 방어하고 감정과 정보의 황금 균형을 설계하는 핵심 근거.
themes:
