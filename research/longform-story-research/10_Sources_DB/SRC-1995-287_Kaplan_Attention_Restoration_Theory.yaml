id: SRC-1995-287
title: "The Restorative Benefits of Nature: Toward an Integrative Framework"
authors:
  - "Stephen Kaplan"
year: 1995
type: academic_primary
tier: 1
publication: "Journal of Environmental Psychology"
volume: "15"
issue: "3"
pages: "169-182"
doi: "10.1016/0272-4944(95)90001-2"
citation_count: 12500
key_findings:
  - "주의 회복 이론(Attention Restoration Theory, ART) 정립: 인간의 '지향성 주의(Directed Attention)'는 자원이 한정되어 있어 장시간 지속 시 필연적으로 '지향성 주의 피로(Directed Attention Fatigue, DAF)'에 도달함."
  - "주의력 회복을 위해서는 무의식적 끌림(Involuntary Fascination), 새로운 영역으로의 탈출감(Being Away), 광대함(Extent), 호환성(Compatibility)이 필요함."
  - "롱폼 콘텐츠 시청 중 10~15분 주기로 찾아오는 주의 피로를 Rehook이 새로운 시청 이유와 매혹적 질문을 통해 어떻게 회복(Attentional Renewal)시키는지 인지심리학적 메커니즘 제공."
core_claims:
  - "지향성 주의는 소모성 자원이며 일정한 간격의 인지적 자극 전환을 통해서만 회복된다."
  - "Rehook은 단순한 언어적 과격함이 아니라 인지적 피로를 해소하고 자발적 매혹을 재점화하는 주의 회복 장치이다."
keywords:
  - attention restoration theory
  - directed attention fatigue
  - involuntary fascination
  - attentional renewal
  - cognitive replenishment
