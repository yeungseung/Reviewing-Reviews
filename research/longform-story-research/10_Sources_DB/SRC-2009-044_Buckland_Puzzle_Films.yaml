claims_and_evidence:
  core_claim: "비선형·단편적 서사는 인과성을 부정한 것이 아니라, 표현 순서(Syuzhet)를 의도적으로 헝클어뜨림으로써 관객이 능동적인 인지적 탐정이 되어 머릿속에서 원래의 시간순 인과 사슬(Fabula)을 재구성(Causal Reconstruction)하게 만드는 지적 유희이자 고도의 몰입 장치이다."
  verbatim_quotes:
    - original: "Puzzle films do not abandon narrative causality; rather, they complicate the spectator's process of fabula construction. The spectator derives intense cognitive pleasure from reordering fragmented syuzhet clues into a coherent causal chain."
      translation: "퍼즐 영화는 서사의 인과성을 포기하는 것이 아니라, 관객의 파불라(스토리) 구성 과정을 복잡하게 만든다. 관객은 파편화된 쉬제(플롯) 단서들을 하나의 일관된 인과 사슬로 재배열하는 과정에서 강렬한 인지적 쾌감을 얻는다."
      citation_location: "pp.1-6, Introduction"

story_application:
  application_idea: "비선형 서사를 설계할 때는 단순한 시간 섞기가 아니라, 관객이 풀 수 있는 인과적 단서(Temporal Anchor, Visual Motif)를 정교하게 심어두어 관객이 '아하!' 하며 인과 사슬을 완성할 수 있는 퍼즐의 해결 가능성(Solvability)을 보장해야 함."
  narrative_stage: "Nonlinear Structure & Plot Fragmentation"
  emotional_mechanics:
    trigger: "시간적·인과적 파편화로 인한 인지적 혼란과 호기심 유발"
    build_up: "장면마다 배치된 인과적 퍼즐 조각들의 수집과 가설 설정"
    peak: "마지막 열쇠가 맞춰지며 전체 인과 사슬이 단번에 조립되는 순간"
    release: "거대한 지적 쾌감(Epistemic Pleasure)과 재관람 욕구 폭발"
  failure_modes: "논리적 해답이 없는 무작위 파편화는 관객에게 배신감과 극심한 인지적 피로만을 남김"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "관객이 능동적 추론 의지를 지닌 지적 콘텐츠 및 장르 서사에서 유효"
