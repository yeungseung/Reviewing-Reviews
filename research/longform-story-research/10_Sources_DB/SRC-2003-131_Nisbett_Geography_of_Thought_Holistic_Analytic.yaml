claims_and_evidence:
  core_claim: "동양인(동아시아)과 서양인(서구)은 세상을 바라보고 주의를 기울이는 인지적 메커니즘 자체가 근본적으로 다르다. 서양인은 배경과 분리된 '중심 인물/물체(Salient Object)'와 그들 간의 '직접적 인과/갈등(Direct Conflict/Anomaly)'에 시선을 즉각 고정하는 '분석적 사고(Analytic Cognition)'를 지닌 반면, 동양인은 중심 인물뿐 아니라 '전체적인 배경 맥락과 인물 간의 조화 및 관계성(Holistic Field & Relational Context)'을 종합적으로 스캔하는 '종합적 사고(Holistic Cognition)'를 작동시킨다. 따라서 오프닝에서 중심 인물의 갈등만 난사하는 오프닝(Conflict/Countdown)은 분석적 서구 수용자에게는 즉각적 지향 반응을 유발하지만, 전체 관계와 분위기를 먼저 파악하려는 종합적 동양 수용자에게는 극심한 인지적 위화감과 피로를 부를 수 있다."
  verbatim_quotes:
    - original: "East Asians attend to the entire field, paying attention to relationships and context, and they understand and explain events by reference to the field... Westerners pay attention primarily to the focal object, categorizing it and explaining its behavior with reference to rules about the object's properties."
      translation: "동아시아인들은 전체 장(field)에 주의를 기울이며 관계와 맥락에 주목하고, 장과의 관계를 참조하여 사건을 이해하고 설명한다... 서양인들은 주로 초점 물체(focal object)에 주의를 기울이며, 그것을 범주화하고 물체의 속성에 관한 규칙을 참조하여 그 행동을 설명한다."
      citation_location: "pp. 82-84"

story_application:
  application_idea: "서사 오프닝의 시각적·서사적 텍스처 설계 시 인지 스타일을 반영함. 분석적 주의를 노리는 서구향 스릴러는 첫 씬부터 인물의 직접 충돌(Conflict)이나 시한폭탄(Countdown)을 초점 물체로 클로즈업하고, 동양권 수용자나 프리미엄 휴먼 서사에서는 인물이 처한 환경의 공기, 사회적 관계망, 미세한 표정(Human Moment/Context)을 와이드 샷으로 먼저 조망한 뒤 점진적으로 갈등을 압축하는 '기승전결(起承轉結)의 현대적 변용'을 적용함."
  narrative_stage: "Analytic vs Holistic Framing, Opening Visual Composition, Cultural Cognitive Adaptation"
  emotional_mechanics:
    trigger: "초점 인물의 강렬한 행위(서구) 또는 장 전체의 압도적인 분위기(동양) 포착"
    build_up: "분석적 수용자에게는 1:1 대결을, 종합적 수용자에게는 인물과 환경의 긴장 관계를 축적"
    peak: "문화적 인지 기대치에 완벽히 정합하는 서사적 클라이맥스 조우"
    release: "인지적 저항 없는 자연스러운 플롯 몰입 완결"
    resonance: "인간 본질에 대한 문화적 통찰과 심미적 만족감 동시 획득"
  failure_modes: "서구향으로 기획하면서 도입부에 지루한 배경 설명만 20분 늘어놓거나, 동양향으로 기획하면서 인물의 관계성이나 동기 없이 피비린내 나는 폭력만 쏟아부어 관객을 이탈시키는 매칭 오류"

