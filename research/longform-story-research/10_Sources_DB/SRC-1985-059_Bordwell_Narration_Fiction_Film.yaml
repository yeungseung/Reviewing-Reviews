claims_and_evidence:
  core_claim: "고전적 서사(Classical Narration)는 목표 지향적 인물(Goal-oriented protagonist)과 하나의 지배적인 인과 척추(Unifying Causal Spine / Master Line of Action)를 중심으로 조직된다. 관객은 이 중심 인과선을 기준으로 단서들을 하나의 일관된 스토리(Fabula)로 조립(Cognitive Assembly)하며, 복수의 서브플롯(예: 로맨스 라인 + 공적 임무 라인)은 반드시 이 주 척추에 종속되어 상호 교차될 때만 인지적 응집성(Coherence)을 보장한다."
  verbatim_quotes:
    - original: "Classical narration treats causality as the prime unifying principle... Typically, the plot consists of two lines of action, each with a goal, obstacle, and climax, but one line serves as the dominant spine organizing spectator comprehension."
      translation: "고전적 서사는 인과성을 주요한 통합 원리로 취급한다... 일반적으로 플롯은 각각 목표, 장애, 클라이맥스를 지닌 두 개의 행동선으로 구성되지만, 하나의 선이 관객의 이해를 조직하는 지배적인 척추로 기능한다."
      citation_location: "pp. 156-160"

story_application:
  application_idea: "복합 서사나 멀티 트랙 롱폼을 기획할 때 아무리 다양한 서브플롯이나 부차적 긴장(보조 엔진)이 존재하더라도, 관객의 인지적 스키마 조립을 돕는 단 하나의 지배적 'Main Engine'을 척추(Spine)로 확립해야 서사 붕괴를 방지할 수 있음."
  narrative_stage: "Master Narrative Spine & Subplot Integration"
  emotional_mechanics:
    trigger: "지배적 인과 척추(Main Engine)의 명확한 가시화"
    build_up: "보조 플롯이 메인 척추와 교차하며 복합 긴장 형성"
    peak: "서브플롯의 위기가 메인 척추의 클라이맥스를 강제하는 정점"
    release: "메인 질문과 서브플롯의 동시 인과적 봉합"
  failure_modes: "서브플롯이 메인 척추를 잠식하여 관객이 무엇이 중심 서사인지 잊어버리게 만드는 플롯 이탈"

