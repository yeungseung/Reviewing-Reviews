key_contribution: "열린 작품(The Open Work, Opera Aperta)과 구조적 양가성(Structural Ambivalence)의 미학적·인지적 이론 정립. 결말이 하나의 닫힌 정답으로 환원되지 않고 다의적 해석의 장으로 개방될 때, 수용자가 능동적 의미 생산자로 참여하여 작품의 예술적 지속성과 반추 효과를 극대화함을 규명."
relevance: "작가주의 예술극, 복합 드라마, 모던 서사에서 양가적 열린 결말(Open-ended Ambivalence)이 주는 미학적 포만감과 장기 기억 각인의 준거."
themes:
