id: SRC-1993-520
author: Kevin Lane Keller
year: 1993
title: "Conceptualizing, measuring, and managing customer-based brand equity"
venue: "Journal of Marketing, 57(1), 1-22"
tier: 1
citation_count: 28900
url: https://doi.org/10.1177/002224299305700101
key_contribution: "고객 기반 브랜드 자산(Customer-Based Brand Equity, CBBE) 모델 정립. 브랜드 지식 구조(Brand Knowledge)에서 감정적 연상(Brand Feelings & Associations)의 호의성, 강도, 독특성이 브랜드 충성도, 프리미엄 지불 의향, 반복 소비 습관을 결정함을 체계화."
relevance: "콘텐츠 채널이 하나의 미디어 브랜드로서 수용자에게 각인될 때, 엔딩에서 제공되는 정서적 가치가 누적되어 채널의 브랜드 자산과 장기 생애 가치(LTV)를 구축하거나 파괴하는 브랜딩적 토대."
themes:
