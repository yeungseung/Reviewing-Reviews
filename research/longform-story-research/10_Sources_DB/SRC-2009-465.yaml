key_contribution: 허구 서사의 인지심리학과 공감 시뮬레이션 모델. 외적 사건이 해결되는 '플롯 피크(Plot Peak)'와 인물의 핵심 관계·도덕적 정체성이 재편되는 '감정 피크(Emotional Peak)'의 분리 가능성을 실증하고, 거대한 시각적 폭발보다 은밀한 진실의 폭로(Revelation)가 관객의 뇌에서 더 강력한 정서적 피크를 격발함을 규명.
relevance: 감정 피크와 플롯 피크의 괴리 및 조화, 비밀 폭로 피크의 작동 메커니즘을 규명하는 심리학적 토대.
