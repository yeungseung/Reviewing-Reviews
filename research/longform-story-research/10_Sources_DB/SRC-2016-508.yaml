id: SRC-2016-508
author: Karen McIntyre & Kathryn E. Gibson
year: 2016
title: "Positive News: The Influence of Solution-Focused News on Emotion, Attitude and Efficacy"
venue: "Journalism & Mass Communication Quarterly, 93(4), 934-954"
tier: 1
citation_count: 280
url: https://doi.org/10.1177/1077699016654682
key_contribution: "건설적 저널리즘(Constructive Journalism) 및 해결 지향적 엔딩(Solution-Focused Framing)의 효과 실증. 문제와 비극만을 고발하고 끝내는 전통적 뉴스가 무력감과 분노 피로를 낳는 반면, 해결책과 행동 가능성으로 끝나는 서사는 관객의 자기 효능감(Self-Efficacy)과 긍정적 태도를 획기적으로 증진함을 증명."
relevance: "뉴스·시사·사회 다큐멘터리·교양 롱폼에서 폭로와 고발 이후 마지막 엔딩 구간을 효능감과 희망으로 수렴시켜야 하는 실증적 근거."
themes:
