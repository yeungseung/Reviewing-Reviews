key_contribution: "불쾌하고 고통스러운 경험(Dysphoric Experiences)의 공유가 내집단 정체성 융합(Identity Fusion)을 폭발시키는 사회심리학적 기제 실증. 고통스러운 사건과 비극적 결말이 집단의 공동 운명 의식을 형성할 때 극단적인 충성도와 헌신을 유발함을 증명."
relevance: "부정적 엔딩이 이탈을 낳는 대신 오히려 광신적 팬덤과 결속력을 강화하는 예외적 반례(Cult Loyalty & Moral Alignment)의 이론적 토대."
