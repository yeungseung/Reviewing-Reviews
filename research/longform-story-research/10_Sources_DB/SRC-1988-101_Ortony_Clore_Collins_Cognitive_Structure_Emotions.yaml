claims_and_evidence:
  core_claim: "OCC 감정 평가 모델과 목표 중요도(Goal Importance)에 따른 서스펜스 증폭 기제: 인간의 미래 예측 정서(Prospective Emotions: 희망, 공포, 서스펜스)는 사건의 발생 가능성(Uncertainty)뿐 아니라 그 사건이 자신의 핵심 목표에 미치는 '목표 중요도(Goal Importance)'와 '결과의 바람직함/바람직하지 않음(Desirability)'의 곱에 의해 결정된다. 목표의 중요도가 불분명하거나 낮으면 결과가 아무리 불확실해도 관객은 아무런 서스펜스(Suspense)나 두려움(Fear)을 느끼지 못한다. 반면, 스테이크 질문(Stake Question)을 통해 '목표 달성의 성공(희망)'과 '실패의 끔찍한 결과(공포)'가 명료하게 확립될 때, 관객의 뇌는 두 상반된 예측 감정 사이에서 극도의 긴장감(Suspense)을 산출한다."
  verbatim_quotes:
    - original: "Hope and Fear are prospect-based emotions, arising from the anticipation of desirable or undesirable events... The intensity of these emotions is centrally determined by the degree to which the event matters to the individual's goals (Goal Importance) and the subjective likelihood of the event occurring."
      translation: "희망과 공포는 미래 예측에 기반한 정서로서, 바람직하거나 바람직하지 않은 사건에 대한 기대에서 발생한다... 이러한 정서의 강도는 해당 사건이 개인의 목표에 얼마나 중요한지(목표 중요도)와 사건 발생의 주관적 가능성에 의해 핵심적으로 결정된다."
      citation_location: "pp. 19-23, 109-115"

story_application:
  application_idea: "목표 중요도 다이얼을 통한 서스펜스 캘리브레이션(Goal Importance Dial): 관객이 긴장하지 않는 이유는 위협이 작아서가 아니라, 그 목표가 주인공에게 '왜 목숨만큼 중요한지(Goal Importance)'가 명확히 인지되지 않았기 때문임. 2막 위기 직전에 주인공이 왜 이 목표를 절대 포기할 수 없는지 그 정당성과 절박함을 재확인(Re-anchoring)시킴으로써 서스펜스 게이지를 즉각 최대치로 끌어올림."
  narrative_stage: "Act 2 Midpoint Re-commitment & Pre-Climax Stakes Clarification"
  emotional_mechanics:
    trigger: "주인공의 최종 목표와 그에 걸린 파멸의 결과 명시(목표 중요도 극대화)"
    build_up: "성공과 실패의 가능성이 50:50으로 팽팽하게 맞서며 희망과 공포의 동시 급상승"
    peak: "사건의 결과가 판가름 나기 직전 서스펜스(Hope vs Fear)의 최고조 도달"
    release: "결과 확인에 따른 환희(Joy/Relief) 혹은 비극적 애도(Sorrow)"
  failure_modes: "주인공이 왜 그 일을 하는지 목표의 중요도가 흐리멍덩하여, 총격전이 벌어져도 관객이 '쟤네 왜 저러지?'라며 팝콘만 씹게 만드는 연출"

