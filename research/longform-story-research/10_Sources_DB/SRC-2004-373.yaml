url: https://doi.org/10.1016/j.gloenvcha.2003.10.001
key_contribution: '편향으로서의 기계적 균형(Balance as Bias)' 개념을 실증. 과학적 합의나 명백한 사실/윤리적 비대칭이 존재하는 이슈에서 기계적으로 양쪽 입장을 50:50으로 동등하게 병기할 때 오히려 대중을 오도하고 정보 왜곡과 신뢰 추락(False Equivalence)을 초래함을 규명.
relevance: 롱폼 서사에서 성숙한 양가성을 흉내 내다 명백한 악행이나 가해자에게 면죄부를 주며 관객의 분노와 냉소를 사는 억지 양비론을 차단하는 기계적 양비론 필터(FBF)의 핵심 학술 근거.
