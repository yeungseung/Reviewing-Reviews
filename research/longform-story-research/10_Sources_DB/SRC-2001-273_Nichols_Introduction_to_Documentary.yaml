key_findings:
  - "다큐멘터리 서사학의 6대 양식(설명형, 관찰형, 참여형, 반성형, 수행형, 시적) 및 넌픽션 수사학 체계 정립."
  - "다큐멘터리는 순수한 사실의 복제가 아니라, 증거의 배열과 관점의 조율을 통해 역사적 세계에 대한 '설득력 있는 주장(Argument about the Historical World)'을 구성하는 작업임을 규명."
  - "선정주의적 날조(Sensational Distortion) 없이도, 새로운 증거와 반론의 배치를 통해 관객이 믿어온 통념의 틀을 소급적으로 재구성하는 넌픽션 리프레이밍(Documentary Reframing)의 윤리적·미학적 기준 제시."
core_claims:
  - "다큐멘터리의 힘은 숨겨진 충격의 폭로가 아니라 기존 현실을 바라보는 관점의 수사학적 전환(리프레이밍)에 있다."
  - "넌픽션 서사에서 사실의 과장 없이도 공정한 증거의 대조만으로 강력한 지적 반전을 창출할 수 있다."
keywords:
  - documentary theory
  - rhetoric
  - non-fiction narrative
  - evidence arrangement
  - narrative reframing
