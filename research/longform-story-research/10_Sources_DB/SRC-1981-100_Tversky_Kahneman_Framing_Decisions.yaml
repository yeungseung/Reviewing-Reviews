claims_and_evidence:
  core_claim: "손실/이득 프레이밍(Loss vs Gain Framing)과 서사적 절박성의 차이: 인간의 인지 체계는 객관적으로 완전히 동일한 결과라 할지라도 그것이 '이득(Gains)'으로 제시되는지 혹은 '손실(Losses)'로 제시되는지에 따라 극단적으로 상반된 심리적 반응을 보인다. 이득 프레임('200명을 살린다')에서는 확실성을 선호하며 안전 위주의 보수적 태도를 취하지만, 손실 프레임('400명이 사망한다')에서는 그 손실을 피하기 위해 극단적인 도박과 위험(Risk-seeking)을 감수하며 격렬한 정서적 각성(Urgency)을 일으킨다. 이야기에서 인물의 목표가 '새로운 부나 명예의 획득'으로 프레이밍될 때보다 '소중한 생명, 자유, 가족의 파멸을 막기 위한 손실 방지'로 프레이밍될 때, 관객의 교감신경계 긴장과 서스펜스는 비선형적으로 증폭된다."
  verbatim_quotes:
    - original: "Choices involving gains are often risk averse and choices involving losses are often risk taking... The psychological response to losses is more extreme than the response to gains of the same magnitude, leading individuals to take extreme risks to avert a certain loss."
      translation: "이득을 수반하는 선택에서는 흔히 위험 회피적이지만, 손실을 수반하는 선택에서는 종종 위험 추구적이다... 손실에 대한 심리적 반응은 동일한 규모의 이득에 대한 반응보다 훨씬 극단적이며, 이는 사람들이 확실한 손실을 피하기 위해 극단적인 위험을 감수하게 만든다."
      citation_location: "pp. 453-455"

story_application:
  application_idea: "스테이크 질문의 손실 프레이밍 전환(Loss-Framed Stake Question): 스토리 1막에서 주인공의 목표를 '새로운 보물을 얻는 것(Gain)'으로만 제시하지 말고, '이 모험에 실패하면 고향과 가족이 영구히 파멸하는 상황(Loss)'을 즉각 배후에 장전함. 인물이 무모한 위험을 감수하는 행동이 관객의 눈에 '탐욕'이 아니라 '손실을 막기 위한 불가피한 사투'로 정당화되어 공감과 서스펜스가 2배 이상 치솟음."
  narrative_stage: "Act 1 Inciting Incident & Lock-in (Crossing the First Threshold)"
  emotional_mechanics:
    trigger: "가만히 있으면 반드시 모든 것을 잃게 되는 확실한 손실 위기 발생"
    build_up: "손실을 막기 위해 평소라면 절대 하지 않을 극단적 위험(도박)을 감수하는 인물"
    peak: "손실을 피하기 위한 필사의 결단과 그에 수반되는 아드레날린 긴장 폭발"
    release: "파멸을 아슬아슬하게 회피했을 때 밀려오는 거대한 안도감(Relief)"
  failure_modes: "인물이 이미 잘살고 있는데 단지 더 큰 부자가 되기 위해 위험을 무릅쓰는 이득 프레임 일변도로 연출하여 관객의 도덕적 반감이나 무관심을 초래하는 오류"

