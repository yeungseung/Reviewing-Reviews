bibliographic_info:
  title: 'Self-explanations: How students study and use examples in learning to solve problems'
  authors:
  - Chi, Michelene T. H. (University of Pittsburgh)
  - Bassok, Miriam (University of Pittsburgh)
  - Lewis, Matthew W. (University of Pittsburgh)
  - Reimann, Peter (University of Pittsburgh)
  - Glaser, Robert (University of Pittsburgh)
  institution: University of Pittsburgh, Learning Research and Development Center (LRDC)
  published_date: '1989-04-01'
  source_url: https://doi.org/10.1207/s15516709cog1302_1
  source_type: Peer-reviewed Journal (Cognitive Science, 13(2), 145-182)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Science & Learning Architecture Monument
  methodology:
    study_type: Verbal Protocol Cognitive Analysis & Problem-Solving Trajectory Tracking
    sample_size: 대학생 물리 문제 해결 발화 프로토콜 상세 인지 분석
    target_population: 예제와 텍스트를 통해 복합 개념과 인과 관계를 습득하는 학습자
    relationship_type: Mechanistic Causal Framework (Self-Generated Explanations Fill Inferential Gaps and Refine Mental Models)
    effect_size: 텍스트의 불완전한 틈새를 마주했을 때 스스로에게 '왜 그런가(Why)?'를 설명하는 '자기 설명(Self-Explanation)'을 많이 생성한 학습자 집단이 수동적으로 읽은 집단에 비해 문제 해결 성공률이 3배 이상 높았음을 규명 (4,000+ 피인용 세기적 논문)
    replicated: Universally Replicated across cognitive psychology, educational technology, and reading comprehension research
    limitations: 과학 문제 해결 도메인에서 정립되었으나 서사의 인과적 갭 메우기(Gap-Filling) 및 생략(Ellipsis) 처리에 직접 적용됨
claims_and_evidence:
  core_claim: 텍스트는 결코 모든 것을 다 적어둘 수 없다. 진정한 이해는 텍스트의 표면적 문장들 사이에 존재하는 '인과적 공백(Inferential Gaps)'을 독자 스스로 메우려 할 때 일어난다. 뛰어난 독자는 불완전한 예시나 장면을 볼 때 스스로에게 질문을 던지고 인과 관계를 추론하는 '자기 설명(Self-Explanation)'을 활발히 생성한다. 작가가 서사에서 씬과 씬 사이, 인물의 행동과 결과 사이에 의도적인 '생략(Ellipsis)'과 '미완의 단서'를 남겨둘 때, 관객의 뇌는 자기 설명 모드로 전환되어 인물의 심리와 사건의 인과를 자발적으로 정교화(Elaboration)하며 깊은 몰입감을 형성한다.
  verbatim_quotes:
  - original: Good students generate many self-explanations while studying worked-out examples... They monitor their own understanding, identify gaps in their mental models, and actively generate inferences to explain why certain actions are taken. Poor students rarely explain anything to themselves.
    translation: 우수한 학생들은 예제를 공부하는 동안 많은 자기 설명을 생성한다... 이들은 자신의 이해도를 모니터링하고, 멘탈 모델의 간극을 식별하며, 특정 행동이 취해진 이유를 설명하기 위해 능동적으로 추론을 생성한다. 반면 열등한 학생들은 자신에게 거의 아무것도 설명하지 않는다.
    citation_location: pp. 145-147
story_application:
  application_idea: 롱폼 스토리의 '인과적 공백과 자기 설명 유도 설계 (Inferential Gap & Self-Explanation Design)'. 작가는 인물의 행동 이유를 대사나 내레이션으로 100% 떠먹여 주지 말고, 인물의 눈빛, 손의 떨림, 그리고 직전 사건의 단서만을 남긴 채 다음 장면으로 넘어가야 함. 관객이 스스로 "저 인물이 왜 저러지? 아, 아까 그 전화 때문에 그렇구나!"라고 자기 설명을 수행하도록 유도함으로써, 관객을 서사 세계의 능동적 공동 창작자(Co-creator)로 끌어들임.
  narrative_stage: Subtextual Acting, Elliptical Editing, Show Don't Tell & Character Motivation
  emotional_mechanics:
    trigger: 인물의 예상치 못한 행동과 설명되지 않은 미세한 간극 직면
    build_up: 간극을 메우기 위해 과거 단서들을 되짚으며 전개되는 자기 설명 추론
    peak: 인물의 숨은 동기와 심리가 완벽히 설명되는 인지적 정합성의 발견
    release: 인물의 내면을 깊이 이해했다는 정서적 유대감과 지적 만족
  failure_modes: 모든 행동의 이유를 독백이나 해설로 100% 떠먹여 주어 관객의 자기 설명 엔진을 질식시키는 과잉 친절(Over-Explanatory Stagnation)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 영화 연출(쇼트 간 편집), 문학적 서브텍스트, 대사 행간, 웹툰 컷 분할 등 모든 고급 스토리텔링에 필수 적용
