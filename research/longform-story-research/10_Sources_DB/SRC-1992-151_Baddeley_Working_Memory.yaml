claims_and_evidence:
  core_claim: "작업 기억은 단순한 단기 저장소가 아니라 주의를 배분하고 다중 정보 흐름을 조율하는 '중앙 집행기(Central Executive)', 음운 루프, 시공간 메모장으로 구성된 다중 시스템이다. 복잡한 서사를 이해하기 위해서는 중앙 집행기가 상위 목표(Global Theme)를 유지하면서 하위 자극(Local Scene)을 지속적으로 통합·갱신해야 하며, 중앙 집행기의 처리 용량을 초과하면 서사 이해도가 급격히 붕괴한다."
  verbatim_quotes:
    - original: "Working memory is a multi-component system responsible for active maintenance and manipulation of information... The central executive coordinates attentional resources between multiple ongoing tasks."
      translation: "작업 기억은 정보의 능동적 유지 및 조작을 담당하는 다중 구성 요소 시스템이다... 중앙 집행기는 진행 중인 다중 과제 사이에서 주의 자원을 조율한다."
      citation_location: "Science, 255(5044), p. 556, 558"

story_application:
  application_idea: "롱폼 서사의 다층 오픈 루프 운영에서 중앙 집행기의 부하를 제어하는 핵심 원리. 관객이 '전역 메인 질문(Global Question)'을 잊지 않도록 시각적·청각적 앵커(Repetition, Motif)를 정기적으로 리마인드해주어야 하며, 하위 씬의 로컬 루프가 닫힐 때마다 상위 루프와의 인과적 연결을 재확인시켜 주어야 작업 기억의 붕괴를 방지할 수 있음."
  narrative_stage: "Macro-to-Micro Plot Transitions"
  emotional_mechanics:
    trigger: "새로운 하위 퀘스트 발생"
    build_up: "상위 목표를 잊지 않은 채 하위 과제를 해결하려는 중앙 집행기 집중"
    peak: "하위 과제의 해결이 상위 목표의 진전으로 직결되는 순간"
    release: "중앙 집행기 자원의 효율적 재배분 및 이해의 명쾌함"
  failure_modes: "지엽적인 하위 사건에 너무 오래 매몰되어 관객이 '내가 지금 이 영상을 왜 보고 있었지?'를 까먹는 목표 유실(Goal Amnesia)"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "상위 목표와 하위 목표 사이의 인과적 종속 관계가 명확해야 함"
