id: SRC-2004-252
title: "Processing fluency and aesthetic pleasure: Is beauty in the perceiver's processing experience?"
authors:
  - "Rolf Reber"
  - "Norbert Schwarz"
  - "Piotr Winkielman"
year: 2004
type: academic_primary
tier: 1
publication: "Personality and Social Psychology Review"
volume: "8"
issue: "4"
pages: "364-382"
doi: "10.1207/s15327957pspr0804_3"
citation_count: 3500
key_findings:
  - "심미적 쾌감(Aesthetic Pleasure)과 호감도는 자극의 객관적 속성이 아니라, 수용자가 그 자극을 인지적으로 얼마나 쉽게 처리할 수 있는가(Processing Fluency)에 좌우됨."
  - "스키마 일치(Schema Confirmation), 원형성(Prototypicality), 대칭성, 반복 노출은 인지 처리의 속도와 유창성을 급증시키며, 뇌는 이 유창성을 무의식적으로 긍정적 정서와 아름다움으로 평가함."
  - "서사에서 관객이 예상한 장르적 규칙과 전개가 부드럽게 적중할 때, 높은 처리 유창성이 유발되며 깊은 안도감과 심미적 만족을 느낌."
core_claims:
  - "인지적 처리 유창성은 즉각적인 심미적 쾌감과 긍정적 감정 반응을 유발한다."
  - "서사의 장르적 기대 충족과 스키마 확인은 유창성을 극대화하여 몰입감을 증폭시킨다."
keywords:
  - processing fluency
  - aesthetic pleasure
  - schema confirmation
  - prototypicality
  - cognitive ease
