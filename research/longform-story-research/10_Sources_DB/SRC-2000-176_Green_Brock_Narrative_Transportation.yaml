claims_and_evidence:
  core_claim: "서사적 이입(Narrative Transportation)은 주의 집중(Attentional Focus), 감정적 참여(Emotional Involvement), 생생한 심상(Mental Imagery)이 하나로 수렴되어 수용자가 실제 현실을 잊고 이야기 세계로 '이동'하는 통합적 심리 상태이다. 이러한 깊은 몰입은 서사의 '인과적 일관성(Causal Coherence)'에 전적으로 의존한다. 사건들이 인과적 필연성에 의해 매끄럽게 연결될 때 관객은 의심과 비판적 검증(Reality Monitoring / Counterarguing)을 중단하고 서사에 완전히 빠져든다. 반면 인과성이 깨진 작위적 우연이나 억지 전개가 등장하면, 관객은 즉시 이입 상태에서 튕겨 나와(Disportation) 냉소적 평가자로 전환된다."
  verbatim_quotes:
    - original: "Transportation is a convergent process, where all mental systems and capacities become focused on events occurring in the narrative... Loss of access to real-world facts and suspension of disbelief are consequences of transportation. A coherent causal progression is essential to maintain this integrated flow."
      translation: "이입(Transportation)은 모든 정신적 시스템과 역량이 서사 내에서 일어나는 사건들에 집중되는 수렴적 과정이다... 실제 세계의 사실에 대한 접근 상실과 불신의 유예는 이입의 결과이다. 일관된 인과적 전개는 이러한 통합된 흐름을 유지하는 데 필수적이다."
      citation_location: "Journal of Personality and Social Psychology, Vol. 79, No. 5, pp. 701-705"

story_application:
  application_idea: "수용자의 비판적 필터(Critical Filter)를 무력화하는 '인과적 불가피성(Causal Inevitability) 공식'. 관객이 '왜 저 인물이 저런 행동을 하지?', '왜 갑자기 이런 일이 벌어지지?'라는 의문을 품는 순간 Transportation은 파괴됨. 씬의 전개를 'A 때문에 B, B 때문에 C'라는 완벽한 인과적 사슬로 구축함으로써 관객의 인지적 반발을 사전에 100% 차단하고 이야기 속으로 끝없이 빨려 들어가게 만듦."
  narrative_stage: "Overall Narrative Immersion & Emotional Suspension"
  emotional_mechanics:
    trigger: "초반 인과적 닻(Causal Hook)을 통한 현실 주의 분리"
    build_up: "사건과 사건 간의 빈틈없는 인과 결속으로 비판적 반박 차단"
    peak: "현실 시공간 감각 상실 및 작중 인물과의 완전한 감정적 일체화 (Peak Transportation)"
    release: "인과 척추가 완성되며 현실로의 감동적 귀환"
  failure_modes: "개연성 없는 작위적 우연(Deus ex Machina)이나 억지 전개로 인해 관객이 차갑게 식어버리는 '불신의 재가동(Break in Disbelief)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "인과적 일관성이 너무 도식적이면 서사적 반전의 경이로움이 줄어들 수 있으므로 '필연적이지만 예상치 못한(Inevitably Surprising)' 인과 설계가 필요함"
