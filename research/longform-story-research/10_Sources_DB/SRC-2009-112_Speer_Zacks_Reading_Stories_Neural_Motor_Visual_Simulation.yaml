    - "Reynolds, Jeremy R. (University of Denver)"
    - "Swallow, Kaelon M. (Washington University in St. Louis)"
    - "Zacks, Jeffrey M. (Washington University in St. Louis)"
  institution: "Washington University in St. Louis, Department of Psychology"
