credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "fMRI Neuroimaging Experiment"
    sample_size: 28
    target_population: "Adult native English speakers reading naturalistic narratives"
    relationship_type: "Causal & Somatotopic Neural Mapping"
    replicated: "Highly Replicated & Influential (800+ citations, direct evidence of embodied cognition in story reading)"
    limitations: "기계적 fMRI 환경 내 텍스트 독해 실험이나, 자연스러운 일상적 이야기 텍스트를 사용하여 현실 타당도를 극대화함"

claims_and_evidence:
  core_claim: "독자가 이야기를 읽을 때 뇌는 단순한 언어적 부호 처리기에 머물지 않는다. 인물의 신체적 행동(손으로 잡기, 던지기 등)이나 시각적 공간 이동(걸어가기, 방향 전환), 사물 조작에 관한 구체적 서술을 읽을 때, 독자의 뇌에서는 실제 시각 운동(MT+/V5) 및 신체 운동(전운동 피질 및 일차 운동 피질)을 담당하는 신경 영역이 직접적이고 지형학적으로 활성화된다. 즉, 구체적 디테일은 서사를 '체화된 시뮬레이션(Embodied Simulation)'으로 전환한다."
  verbatim_quotes:
    - original: "Readers understand stories by simulating the events described... Reading about motor actions activates motor and premotor cortex, and reading about visual motion activates motion-sensitive visual areas (MT+). Story comprehension is grounded in perceptual and motor representations."
      translation: "독자들은 서술된 사건들을 시뮬레이션함으로써 이야기를 이해한다... 신체 운동 행동에 대해 읽는 것은 운동 및 전운동 피질을 활성화하고, 시각적 움직임에 대해 읽는 것은 움직임에 민감한 시각 영역(MT+)을 활성화한다. 이야기 이해는 지각 및 운동 표상에 뿌리를 두고 있다."
      citation_location: "pp. 989, 997"

story_application:
  application_idea: "등장인물의 감정이나 상황을 설명할 때 '비탄에 젖었다'는 추상적 심리 상태 기술보다 '떨리는 손끝으로 차갑게 식은 찻잔 손잡이를 쥐었다 놓기를 반복했다'는 구체적인 감각-운동 디테일(Sensory-Motor Detail)을 배치해야 함. 이는 관객의 운동 피질과 감각 피질을 직접 발화시켜 거울 신경망 수준의 즉각적인 공감과 신체적 몰입을 유도함."
  narrative_stage: "Scene-level Action Beats & Emotional Externalization"
  emotional_mechanics:
    trigger: "구체적 신체 동작(Grasping, moving) 및 감각적 사물 접촉 묘사"
    build_up: "수용자의 전운동 피질 및 감각 피질의 체화된 시뮬레이션 발화"
    peak: "등장인물의 신체적 고통이나 긴장감과 수용자의 신체 표지(Somatic Marker) 일체화"
    release: "행동의 완결 또는 사물 변화에 따른 신경학적 이완"
  failure_modes: "신체 행동이나 감각 단서 없이 등장인물의 내면 상태를 관념적 형용사로만 장황하게 설명하여 관객의 뇌를 지루한 언어 디코딩 모드에 방치하는 오류"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "인과적 맥락과 연결된 신체 행동일 때 시뮬레이션 효과가 극대화되며, 맥락 없는 단순 동작 나열은 피로를 유발함"
