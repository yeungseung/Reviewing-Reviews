claims_and_evidence:
  core_claim: "서사의 '의미론적 이동 경로(Semantic Path)'의 속도(Speed), 부피(Volume), 회전율(Circularity) 등 정량화된 형태가 영화 박스오피스 흥행, TV 시청률, 학술 논문 인용수를 통계적으로 유의미하게 예측함."
  verbatim_quotes:
    - original: "We find that story shape is linked to success... texts that move with greater speed and explore broader semantic space before returning to key themes achieve significantly higher commercial and cultural impact."
      translation: "우리는 이야기의 형태가 성공과 연결되어 있음을 발견했다... 더 빠른 속도로 움직이고 더 넓은 의미론적 공간을 탐색한 뒤 핵심 주제로 복귀하는 텍스트가 유의미하게 더 높은 상업적·문화적 파급력을 달성한다."
      citation_location: "p.1, Abstract & Discussion"

story_application:
  application_idea: "서사를 진행할 때 한자리에서 맴돌지 말고, 새로운 장소/단서/인물로 빠르게 의미 공간(Semantic Space)을 확장(Speed)한 뒤, 후반부에 원래의 질문/주제로 정밀하게 수렴(Circularity)시켜라."
  narrative_stage: "Plot Pacing & Semantic Movement"
  emotional_mechanics:
    trigger: "새로운 테마와 공간으로의 빠른 전개"
    build_up: "다양한 서사적 영역 탐색을 통한 인지적 풍성함"
    peak: "분산되었던 의미들이 하나의 결론으로 수렴되는 순간"
    release: "지적·정서적 완성감"
  failure_modes: "의미 공간만 넓히고 원래 질문으로 수렴하지 못하면 '산만함', 좁은 공간만 맴돌면 '답답함/늘어짐' 발생"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "상업 영화, 드라마, 교양 다큐멘터리 등 모든 롱폼 서사"
