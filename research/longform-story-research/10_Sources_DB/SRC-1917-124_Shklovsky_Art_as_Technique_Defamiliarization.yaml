claims_and_evidence:
  core_claim: "일상화된 삶은 인간의 지각을 자동화(Automatization)하여 사물을 보고도 느끼지 못하게 만든다. 예술의 본질은 사물을 친숙함의 안개에서 끄집어내어 낯설게 만드는 '낯설게 하기(Defamiliarization / Ostranenie)'에 있다. 강렬한 오프닝은 반드시 폭력이나 갈등을 필요로 하지 않는다. 평범한 일상이나 사물을 전혀 새로운 시각적·감각적 관점으로 '낯설게 지각(De-automatized Perception)'하도록 유도함으로써, 갈등 없이도 관객의 주의를 완벽히 장악하고 경이감(Awe)을 자아낼 수 있다."
  verbatim_quotes:
    - original: "Habitualization devours works, clothes, furniture, one's wife, and the fear of war... Art exists that one may recover the sensation of life; it exists to make one feel things, to make the stone stony. The technique of art is to make objects 'unfamiliar', to make forms difficult, to increase the difficulty and length of perception."
      translation: "습관화는 일, 옷, 가구, 아내, 그리고 전쟁에 대한 두려움마저 집어삼킨다... 예술이 존재하는 이유는 삶의 감각을 되찾기 위함이다. 예술은 돌을 돌답게 느끼도록 만들기 위해 존재한다. 예술의 기법은 사물을 '낯설게' 만들고, 형태를 어렵게 하여, 지각의 난이도와 길이를 증가시키는 것이다."
      citation_location: "pp. 12-14"

story_application:
  application_idea: "갈등 오프닝(총격, 격투)의 클리셰에 기대지 않고도 강력한 오프닝을 만드는 비결은 '낯설게 하기(Defamiliarization)'임. <업>(Up)의 대사 없는 4분 인생 파노라마, <2001 스페이스 오디세이>의 우주 정렬과 클래식 음악, <포레스트 검프>의 허공을 맴도는 깃털처럼, 친숙한 대상을 완전히 새로운 템포와 시각으로 재발견하게 만들 때 가장 품격 있는 몰입이 완성됨."
  narrative_stage: "Poetic Opening, Non-Conflict Wonder & Awe Architecture"
  emotional_mechanics:
    trigger: "자동화된 일상 감각을 깨부수는 낯선 시각적·청각적 프레이밍"
    build_up: "지각의 연장(Prolonged Perception)을 통한 숭고미와 경이감 흡수"
    peak: "사물의 본질과 인간 존재의 덧없음/찬란함에 대한 깊은 철학적 각성"
    release: "정서적 충만감과 함께 서사의 세계관에 대한 무조건적 신뢰 헌정"
  failure_modes: "지나치게 전위적이고 난해하여 관객이 '단순한 난해함'으로 치부하고 등을 돌리는 현학적 과오"

