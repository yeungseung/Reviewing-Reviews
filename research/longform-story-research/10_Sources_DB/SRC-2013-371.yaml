id: SRC-2013-371
author: K. Maja Krakowiak & Mina Tsay-Vogel
year: 2013
title: 'The dual role of morally ambiguous characters: Examining the effect of morality salience on narrative engagement and enjoyment'
venue: Human Communication Research
tier: 1
citation_count: 360
url: https://doi.org/10.1111/hcre.12003
key_contribution: 도덕적 모호성 인물(Morally Ambiguous Characters: MACs)이 수용자에게 미치는 영향을 실증. 완전무결한 영웅이나 평면적 악인보다 선악이 공존하는 회색 지대 인물이 수용자의 도덕적 숙고(Moral Reflection), 인지적 감상(Appreciation), 서사적 몰입(Narrative Engagement)을 훨씬 더 강력하게 견인함을 입증.
relevance: 입체적인 주인공과 설득력 있는 안티히어로를 설계하여 관객에게 단순 쾌락을 초월한 깊은 심리적 울림을 전달하는 도덕적 모호성 인물 설계(MAC-A)의 학술적 근거.
themes:
- '#41 Theme 2'
