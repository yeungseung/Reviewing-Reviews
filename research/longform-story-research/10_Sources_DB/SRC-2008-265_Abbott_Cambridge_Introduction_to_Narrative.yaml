id: SRC-2008-265
title: "The Cambridge Introduction to Narrative (Second Edition)"
authors:
  - "H. Porter Abbott"
year: 2008
type: academic_primary
tier: 1
publication: "Cambridge University Press"
pages: "1-260"
doi: "10.1017/CBO9780511816932"
citation_count: 3800
key_findings:
  - "서사학적 관점에서 플롯 트위스트(Plot Twist), 서사적 리프레이밍(Reframing), 서스펜스와 서프라이즈의 구조적 차이 체계화."
  - "플롯 트위스트는 단순한 사건 폭로가 아니라, 독자/관객이 지금까지 구축해 온 서사의 '해석 틀(Interpretive Frame)'을 전면적으로 재구성하도록 강제하는 장치임을 규명."
  - "단순한 기습적 서프라이즈(Shock without meaning)와 깊이 있는 서사적 반전(Transformation of meaning)을 엄격히 구분."
core_claims:
  - "플롯 트위스트의 본질은 정보의 추가가 아니라 기존 정보들의 의미와 관계를 재구성하는 서사적 리프레이밍이다."
  - "해석의 변화를 수반하지 않는 돌발 사건은 반전이 아니라 서사의 소음일 뿐이다."
keywords:
  - narrative twist
  - reframing
  - narrative theory
  - interpretation change
  - surprise vs reversal
