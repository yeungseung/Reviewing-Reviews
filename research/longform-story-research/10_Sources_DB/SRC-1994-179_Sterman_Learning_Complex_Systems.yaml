claims_and_evidence:
  core_claim: "현실의 거대한 사건들은 단일 원인이 아니라 다중 피드백 루프(Feedback Loops), 시간 지연(Time Delays), 비선형 상호작용으로 구성된 '시스템적 인과(Systemic Causality)'에 의해 발생한다. 그러나 인간의 뇌는 선형적 사건 중심(Event-oriented, A➔B) 사고에 갇혀 있어 복잡계를 직접 파악하지 못한다. 롱폼 서사가 복합적 사회 시스템(금융 위기, 팬데믹, 정치 부패 등)을 다룰 때, 현실의 무수한 원인을 여과 없이 나열하면 관객의 상황 모델이 과부하로 붕괴된다. 효과적인 서사는 시스템의 복잡한 피드백 루프를 **'주인공의 해결 시도(원인) ➔ 시스템의 지연된 반작용(결과) ➔ 더 악화된 새 문제(부메랑 효과)'**라는 명확한 단일 인과 척추(Causal Spine)로 변환해 전달해야 한다."
  verbatim_quotes:
    - original: "People have great difficulty in recognizing feedback loops, time delays, and non-linearities... We tend to see the world as a series of events, looking for a cause for every effect, rather than understanding the underlying systemic structure. Successful mental models must translate systemic feedback into understandable cause-and-effect chains."
      translation: "사람들은 피드백 루프, 시간 지연, 비선형성을 인식하는 데 큰 어려움을 겪는다... 우리는 근본적인 시스템 구조를 이해하기보다 모든 결과에 대한 단일 원인을 찾으며 세상을 일련의 사건들로 보는 경향이 있다. 성공적인 멘탈 모델은 시스템 피드백을 이해 가능한 원인-결과 사슬로 변환해야 한다."
      citation_location: "System Dynamics Review, Vol. 10, No. 2-3, pp. 291-298"

story_application:
  application_idea: "복합 위기 서사의 '피드백 부메랑 인과 척추(Feedback Boomerang Spine) 공식'. <빅쇼트>나 <체르노빌>처럼 시스템 전체의 붕괴를 다룰 때, 난해한 경제/공학 이론을 무작정 설명하지 않고, '위기를 덮으려는 단기적 처방 A가 ➔ 시간 지연(Delay)을 거쳐 ➔ 더 파괴적인 부작용 B를 촉발하는 인과적 역풍(Policy Resistance)'을 서사의 뼈대로 삼아 복잡계를 직관적으로 이해시킴."
  narrative_stage: "Systemic Drama, Investigative Journalism & Societal Tragedy"
  emotional_mechanics:
    trigger: "초기 문제 해결을 위한 시스템적 조치 감행"
    build_up: "시간 지연 동안의 불길한 평온과 은폐"
    peak: "처방이 오히려 독이 되어 돌아오는 거대한 시스템적 역풍(Unintended Consequences)"
    release: "개별 인물이 아닌 거대한 시스템의 필연적 모순을 목격하는 지적 전율"
  failure_modes: "시스템의 복잡성을 나열하다가 사건의 중심 축을 잃어버리는 '백과사전식 분산' 또는 한 명의 악당에게 모든 책임을 전가하는 '유치한 단선적 음모론'"

