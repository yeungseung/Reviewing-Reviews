id: SRC-2000-353
author: Philip E. Tetlock, Orie V. Kristel, S. Beth Elson, Melanie N. Green, & Jennifer
  S. Lerner
year: 2000
title: 'The psychology of the unthinkable: Taboo trade-offs, forbidden base rates,
  and sacred values'
venue: Journal of Personality and Social Psychology
tier: 1
citation_count: 1850
url: https://doi.org/10.1037/0022-3514.78.5.853
key_contribution: 신성한 가치 보호 모델(Sacred Value Protection Model, SVPM)을 정초하여, 세속적 이익과
  신성한 가치를 교환하는 행위(Taboo Trade-offs)가 인지될 때 즉각적인 도덕적 분노(Moral Outrage)와 인지적 정화 욕구가
  폭발함을 규명.
relevance: 문화권 및 집단별 신성 가치(Sacred Values)를 건드리는 금기 교환 설정을 사전에 식별·검증(CTV)하여 역풍 리스크를
  통제하는 거버넌스 체계의 핵심 근거.
