id: SRC-2005-507
author: Cynthia M. Hoffner & Kenneth J. Levine
year: 2005
title: "Too Scared to Enjoy It? Emotion Regulation and Enjoyment of Horror"
venue: "Media Psychology, 7(2), 207-237"
tier: 1
citation_count: 390
url: https://doi.org/10.1207/S1532785XMEP0702_3
key_contribution: "공포 및 서스펜스 미디어의 수용 심리와 엔딩 감정 역학 실증. 위협의 완벽한 종결(Threat Resolution)에 따른 안도감(Relief)과 잔존 공포(Residual Dread)가 관객의 즐거움과 사후 회상에 미치는 상반 효과를 메타 분석 및 실험으로 정립."
relevance: "공포·스릴러 장르에서 안도감으로 닫는 엔딩(Relief Closure)과 끝나지 않은 위협을 암시하는 엔딩(Lurking Threat)의 장르 적합성 및 관객 피로도 한계 설정의 핵심 근거."
themes:
  - "#52 Theme 3"
