  source_type: Peer-reviewed Journal (Nature Reviews Neuroscience, 11(2), 127-138)
credibility_assessment:
  credibility_tier: Tier 1 Theoretical Neuroscience Supreme Authority
  methodology:
    study_type: Unified Mathematical & Biophysical Theory of Brain Function (Free Energy Principle & Active Inference Formulation)
    sample_size: 통계물리학, 정보이론, 베이지안 신경생물학 수리 모델 및 실험 신경생리학 전반 통합
    target_population: 생체 신경망, 적응적 유기체 및 인지 에이전트 전반
    relationship_type: Foundational Computational Principle (Minimizing Variational Free Energy via Perceptual Inference and Active Epistemic Exploration)
    effect_size: 뇌의 지각(Perception), 행동(Action), 주의(Attention), 학습(Learning)을 '변분 자유 에너지(Variational Free Energy, 즉 놀라움 Surprise과 불확실성의 상한)의 최소화'라는 단일 수학적 제1원리로 통합 증명 (7,800+ 피인용 세기적 논문)
    replicated: Universally Replicated and established as the dominant theoretical framework in computational neuroscience and cognitive science
    limitations: 고도의 수리물리학적 정식화로 서사 분석 적용 시 정성적 해석과 계산적 유추의 정밀한 매핑 필요
claims_and_evidence:
  core_claim: 모든 지각 유기체는 생존을 위해 환경과의 상호작용에서 발생하는 '변분 자유 에너지(Variational Free Energy / 정보이론적 불확실성 및 놀라움 Surprise)'를 최소화하도록 진화했다. 이를 달성하는 방법은 두 가지다. 첫째, 감각 입력을 잘 설명하도록 내부 멘탈 모델의 신념을 수정하는 것(지각적 추론 Perceptual Inference). 둘째, 불확실성을 낮추기 위해 외부 세계를 능동적으로 탐색하고 샘플링하는 것(능동적 추론 Active Inference / 인식적 행동 Epistemic Action). 서사 수용에서 독자의 몰입(Engagement)은 바로 이 능동적 추론에 대한 인지적 드라이브다. 독자는 다음 장의 진실을 확인하고 자유 에너지를 해소하기 위해 자발적으로 주의를 집중하고 페이지를 넘기며, 뇌는 이 불확실성 감소 과정에서 강력한 도파민성 지적 보상을 경험한다.
  verbatim_quotes:
  - original: The free-energy principle states that any self-organizing system that is at equilibrium with its environment must minimize its free energy... Active inference optimizes beliefs through action: organisms actively sample the environment to minimize uncertainty and confirm their predictions, effectively seeking information that resolves ambiguity.
    translation: 자유 에너지 원리는 환경과 평형을 이루는 모든 자기조직화 시스템이 반드시 자유 에너지를 최소화해야 한다고 명시한다... 능동적 추론(Active Inference)은 행동을 통해 신념을 최적화한다. 즉, 유기체는 불확실성을 최소화하고 자신의 예측을 확인하기 위해 환경을 능동적으로 샘플링하며, 모호성을 해소하는 정보를 자발적으로 추구한다.
    citation_location: pp. 127-129
story_application:
  application_idea: 롱폼 스토리의 '인식적 자유 에너지 파동 설계 (Epistemic Free Energy Wave Design)'. 독자에게 지속적인 몰입감을 주기 위해, 스토리텔러는 인위적으로 적절한 크기의 불확실성(Variational Free Energy / Mystery)을 주입한 뒤, 독자가 서사를 능동적으로 탐색(책을 계속 읽거나 다음 화를 클릭)함으로써 그 불확실성을 단계적으로 해소하도록 만들어야 함. 불확실성의 발생 ➔ 능동적 탐색 유도 ➔ 예측 오차 해소 및 보상(Dopaminergic Epistemic Reward)의 파동 루프가 롱폼 서사의 끊김 없는 흡인력을 창출함.
  narrative_stage: Hook, Mystery Construction, Page-turner Velocity & Narrative Retention
  emotional_mechanics:
    trigger: 미해결된 미스터리, 숨겨진 동기, 암시된 위협에 의한 자유 에너지(불확실성) 상승
    build_up: 불확실성을 해소하기 위한 능동적 인지 탐색 및 집중도 고조
    peak: 핵심 정보(Clue) 획득 및 예측 오차 최소화 직전의 팽팽한 호기심
    release: 진실 발견과 자유 에너지의 급격한 강하로 얻는 지적 쾌감 및 멘탈 모델 안정화
  failure_modes: 아무런 미스터리나 불확실성이 없어 자유 에너지가 0에 머무는 지루함(Total Predictability), 혹은 단서도 없이 무한한 혼돈만 지속되어 자유 에너지가 발산하고 독자가 탐색을 포기해 버리는 단절(Incoherence Dropout)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 웹소설, 장편 소설, 연재 드라마, 시리즈 다큐멘터리, 팟캐스트 등 장기 체류(Long-term Retention)가 요구되는 모든 서사 매체에 보편 적용
