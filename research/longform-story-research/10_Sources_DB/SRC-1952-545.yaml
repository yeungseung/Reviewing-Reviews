key_contribution: "영화 미학과 시각적 침묵(Visual Silence) 및 클로즈업 미학의 고전 저작. 쉼 없는 시각적 움직임 뒤에 찾아오는 의도적인 시각적 휴지기(Visual Pause)와 정지된 프레임이 관객의 내면적 사유와 정서적 카타르시스를 증폭시키는 '시각적 여백의 미학' 체계화."
relevance: "영상에서 끊임없는 화면 전환을 멈추고 3~5초간 호흡을 고르는 시각적 쉼(Visual Pause)이 관객의 기억 응고화와 깊은 감정 여운을 형성하는 핵심 이론적 토대."
