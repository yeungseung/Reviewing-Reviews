claims_and_evidence:
  core_claim: "인간의 호기심과 주의 집중은 상충하는 인지적 자극 사이의 '개념적 갈등(Conceptual Conflict)'과 불일치(Incongruity)에서 발생하며, 이 갈등이 생리적 각성(Arousal)을 높여 불확실성을 해소하려는 탐색 행동을 촉발한다."
  verbatim_quotes:
    - original: "Conceptual conflict is the most powerful instigator of epistemic curiosity. When symbolic responses conflict, exploratory behavior is mobilized to acquire knowledge that relieves the collative arousal."
      translation: "개념적 갈등은 인식적 호기심을 유발하는 가장 강력한 촉발제이다. 상징적 반응들이 충돌할 때, 비교 각성을 해소하는 지식을 획득하기 위해 탐색적 행동이 동원된다."
      citation_location: "pp.240-245, Chapter 10"

story_application:
  application_idea: "비인물형(과학, 기술, 철학) 롱폼 오프닝에서는 인물의 욕망 대신 '상식과 충돌하는 두 가지 모순된 사실(Conceptual Conflict)'을 제시하여 수용자의 뇌에 강력한 인식적 각성을 즉각 점화해야 함."
  narrative_stage: "Opening Hook & Non-agentic Conflict Setup"
  emotional_mechanics:
    trigger: "기존 상식과 정면 배치되는 모순된 현상/데이터 제시"
    build_up: "두 사실이 양립할 수 없다는 개념적 갈등 심화"
    peak: "왜 그런 현상이 일어나는가에 대한 극단적인 지적 갈증"
    release: "새로운 패러다임/원리 발견을 통한 지적 불균형 해소"
  failure_modes: "모순이나 갈등 없이 단순히 나열된 지식 데이터는 관객의 주의 각성을 전혀 일으키지 못함"

