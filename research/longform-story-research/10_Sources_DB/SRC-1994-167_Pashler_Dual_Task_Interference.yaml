claims_and_evidence:
  core_claim: "인간의 인지 구조는 감각 입력(지각)이나 운동 출력(행동)은 부분적 병렬 처리가 가능할지라도, '의사결정 및 가설 선택'을 관장하는 중앙 집행 단계(Central Processing Stage)에서는 엄격한 **'단일 채널 병목(Single-Channel Central Bottleneck)'**을 겪는다. 서사에서 동시에 2개 이상의 복잡한 미스터리(Open Loops)에 대한 인과적 가설을 검증하려 할 때, 뇌는 병렬 처리를 하지 못하고 큐잉(Queuing) 상태에 빠져 처리 지연(PRP)과 인지적 혼란(Narrative Confusion)을 겪는다."
  verbatim_quotes:
    - original: "The central stage of response selection operates as a structural bottleneck... When multiple unresolved decisions compete for this mechanism, processing of subsequent events is delayed and subject to queuing errors."
      translation: "반응 선택의 중앙 단계는 구조적 병목으로 작동한다... 여러 미해결 결정들이 이 메커니즘을 두고 경쟁할 때, 후속 사건의 처리는 지연되고 큐잉 오류에 노출된다."
      citation_location: "Psychological Bulletin, Vol. 116, p. 220-224"

story_application:
  application_idea: "서사에서의 '중앙 집행 병목(Central Bottleneck) 회피' 원칙. 한 시퀀스 안에서 관객에게 동시에 2개 이상의 '고도의 추론을 요구하는 핵심 수수께끼(예: 범인의 알리바이 계산 + 배신자의 암호 해독)'를 한꺼번에 던지지 말 것. 추론의 초점(Central Stage)은 반드시 1개의 질문에 집중시키고, 다른 질문들은 배경의 보관 상태(Passive Storage)로 유지해야 관객의 인지적 큐잉 오류를 방지할 수 있음."
  narrative_stage: "Scene Climax & Multi-thread Mystery Pacing"
  emotional_mechanics:
    trigger: "중앙 추론 과제의 단일화"
    build_up: "병목 현상 없는 매끄러운 단서 검증 및 지적 몰입"
    peak: "단일 쟁점에 대한 명쾌한 가설 확증(Resolution)"
    release: "다음 추론 과제로의 저항 없는 중앙 자원 전환"
  failure_modes: "동일한 3분 동안 3명의 인물이 각자 다른 수수께끼를 동시에 떠들어 관객이 아무것도 이해하지 못하는 '서사적 병목 마비'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "질문 중 하나가 고도의 인지 추론을 요구할 때 다른 질문은 단순 배경 상태여야 함"
