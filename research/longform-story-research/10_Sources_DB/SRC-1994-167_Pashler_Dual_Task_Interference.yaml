  methodology:
    study_type: "Psychological Refractory Period (PRP) Paradigms & Meta-Review"
    sample_size: "Decades of dual-task reaction time experiments and structural bottleneck studies"
    target_population: "인간 중앙 집행 처리 및 다중 과제 처리 한계"
    relationship_type: "Causal and Structural Bottleneck"
    effect_size: "중앙 의사결정 병목 단계에서 복수 과제 처리 시 대기 시간(PRP Delay) 300~500ms 지연 발생"
