created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'Mood and judgment: The Affect Infusion Model (AIM)'
  authors:
  - Forgas, Joseph P. (University of New South Wales)
  institution: University of New South Wales
  published_date: '1995-01-01'
  source_url: https://doi.org/10.1037/0033-2909.117.1.39
  source_type: Peer-reviewed Journal (Psychological Bulletin, 117(1), 39-66)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive & Social Psychology Landmark
  methodology:
    study_type: Comprehensive Theoretical Synthesis & Experimental Integration of Mood-Congruency
    sample_size: 정서와 판단 관련 100여 편의 핵심 실험 연구 메타 종합
    target_population: 복합적 정보와 증거를 바탕으로 판단을 내리는 인간 정보 처리자
    relationship_type: Foundational Framework (Affect Infusion Model: Task Complexity & Processing Strategy -> Mood-Congruent Evidence Evaluation)
    effect_size: 복잡하고 새로운 상황을 실질적으로 처리(Substantive Processing)할 때 정서의 영향력(Affect Infusion)이 가장 극대화되며, 기분과 일치하는 증거(Mood-congruent evidence)에 대한 선택적 회상과 가중치 부여가 40~50% 증가함 (3,800+ 피인용 랜드마크)
    replicated: Universally Replicated in Emotion and Decision-making Literature
    limitations: 일상적 기분 조작 실험 중심이나 서사의 정서적 톤과 증거 독해의 동기화에 완벽하게 부합함
claims_and_evidence:
  core_claim: 정서(Affect)는 사람들의 판단 과정에 '주입(Infusion)'되어 인지적 계산의 방향을 근본적으로 바꾼다. 특히 독자가 복잡하고 낯선 증거를 깊이 있게 해석해야 하는 '실질적 처리(Substantive Processing)' 국면에서 정서 주입의 파괴력은 극대화된다. 서사의 분위기나 관객의 정서 상태가 슬픔이나 분노에 맞춰져 있을 때, 뇌는 그 감정과 부합하는 비극적·부당한 증거(Emotion-congruent Evidence)를 훨씬 더 신속하게 포착하고 더 무겁게 평가한다.
  verbatim_quotes:
  - original: Affect infusion refers to the process whereby affectively loaded information becomes incorporated into and exerts a coloring effect on personal judgment... The more constructive and substantive the processing strategy required by a judgment task, the more likely that affective states will infuse the outcome.
    translation: 정서 주입은 정서적으로 부하된 정보가 개인의 판단에 통합되고 채색 효과를 행사하는 과정을 의미한다... 판단 과제에 의해 요구되는 처리 전략이 더 건설적이고 실질적일수록, 정서 상태가 그 결과에 주입될 가능성은 더욱 커진다.
    citation_location: pp. 39-41
story_application:
  application_idea: 롱폼 스토리의 '정서-증거 조화(Atmospheric Mood-Congruence) 설계'. 복잡하고 건조할 수 있는 데이터나 정황 증거를 독자에게 전달할 때, 해당 증거가 가진 정서적 속성(음울함, 긴박함, 비장함)과 정확히 일치하는 서사적 분위기(Atmosphere)와 씬의 무드(Mood)를 선제적으로 깔아두어 독자의 '실질적 처리' 엔진에 증거가 완벽하게 주입되도록 유도함.
  narrative_stage: Deep Investigation, Context Building & Evidence Deliberation
  emotional_mechanics:
    trigger: 건조한 팩트가 요구되는 복잡한 국면에서의 인지적 피로 위험
    build_up: 씬의 분위기와 인물의 심리 상태가 증거의 어두운 진실과 1:1로 동기화
    peak: 증거가 서사의 정서적 분위기와 한 몸이 되어 완벽하게 스며드는 순간
    release: 지적 이해와 정서적 체감이 하나로 녹아들며 달성되는 완벽한 몰입
  failure_modes: 밝고 경박한 분위기에서 심각한 증거를 던져 정서적 불일치(Affective Incongruence)를 일으키고 증거의 무게를 흩어버리는 연출
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 르포, 탐사보도, 논픽션, 범죄 스릴러 등 복잡한 증거 분석이 요구되는 서사
