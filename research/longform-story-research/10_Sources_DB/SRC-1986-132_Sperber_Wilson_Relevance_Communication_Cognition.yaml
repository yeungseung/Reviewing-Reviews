claims_and_evidence:
  core_claim: "인간의 인지 시스템은 환경의 무수한 자극 중 '최소한의 인지적 노력(Processing Effort)으로 최대한의 긍정적 인지 효과(Positive Cognitive Effect: 기존 신념의 수정, 새로운 지식의 획득, 실존적 의미)'를 제공하는 자극에만 선택적으로 주의를 배분하는 '인지적 관련성 원리(Cognitive Principle of Relevance)'에 의해 지배된다. 서사 오프닝에서도 수용자는 첫 30~90초 동안 '이 이야기가 나에게 어떤 의미(Relevance)가 있는가, 주인공에게 어떤 결정적 판돈(Stakes)이 걸려 있는가'를 계산한다. 오프닝에서 개인적 의미와 판돈(Relevance/Stakes)이 조기에 암시되지 않으면, 아무리 화려한 사건이 벌어져도 관객의 뇌는 인지적 노력을 투입할 가치가 없다고 판단하여 즉각적인 시청 포기(Drop-off)를 단행한다."
  verbatim_quotes:
    - original: "Human cognition tends to be geared to the maximization of relevance... An input is relevant to an individual when it connects with background information to yield positive cognitive effects: a difference to the individual's representation of the world."
      translation: "인간의 인지는 관련성을 극대화하는 방향으로 맞춰지는 경향이 있다... 어떤 입력이 개인의 배경 정보와 연결되어 긍정적인 인지적 효과(개인의 세계 표상에 의미 있는 변화)를 산출할 때, 그 입력은 그 개인에게 관련성이 있는 것이다."
      citation_location: "pp. 124-125"

story_application:
  application_idea: "서사 오프닝 30~90초 내에 반드시 'Relevance Engine'을 가동하여 '이 사건이 인물의 삶에 왜 치명적인가, 그리고 관객 자신의 실존적 공포나 욕망과 어떻게 연결되는가'를 단 한 컷이나 단 한 줄의 대사로 암시해야 함. 판돈의 조기 암시가 없는 오프닝은 관객에게 '남의 집 불구경'에 불과하여 인지적 투자를 중단시킴."
  narrative_stage: "Opening Canonical Sequence, Early Relevance Signaling & Stakes Priming"
  emotional_mechanics:
    trigger: "인물의 생존, 존엄, 사랑에 걸린 절대적 판돈(Stakes)의 조기 신호 목격"
    build_up: "최소한의 인지 노력으로 깊은 인과적 의미(Relevance)를 감지하며 주의 집중"
    peak: "'이것은 결코 가볍게 넘길 수 없는 이야기다'라는 실존적 무게감 체감"
    release: "오프닝의 질문에 답을 얻기 위해 기꺼이 긴 서사의 러닝타임을 완주하겠다는 계약 체결"
    resonance: "관객 자신의 삶의 가치와 서사의 주제의식이 맞닿는 심오한 여운"
  failure_modes: "화려한 폭발만 보여주고 인물에게 어떤 판돈이 걸려 있는지 전혀 암시하지 않아 관객이 인지적 노력을 철회하고 꺼버리는 무의미 오류"

