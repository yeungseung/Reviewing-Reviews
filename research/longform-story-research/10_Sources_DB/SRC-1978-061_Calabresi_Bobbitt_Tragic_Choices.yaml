claims_and_evidence:
  core_claim: "사회와 국가는 희소한 필수 자원(생명 구조 장비, 군 징집, 인공신장기)을 배분할 때 어떠한 선택을 내리더라도 하나의 신성한 가치를 짓밟을 수밖에 없는 '비극적 선택(Tragic Choices)'에 필연적으로 직면한다. 시장 메커니즘, 관료제적 심사, 무작위 추첨 중 어느 방식을 택하든 도덕적 부채와 인지적 고통이 발생하며, 이는 사회·정책 서사에서 가장 높은 차원의 윤리적 긴장을 형성한다."
  verbatim_quotes:
    - original: "Tragic choices are those decisions that society must make when human life or fundamental values are at stake, and no solution can avoid violating a deeply cherished moral principle."
      translation: "비극적 선택이란 인간의 생명이나 근본적인 가치가 걸려 있어서, 어떤 해결책도 깊이 간직된 도덕적 원칙을 위반하지 않고는 내릴 수 없는 그러한 결정을 의미한다."
      citation_location: "pp. 17-24"

story_application:
  application_idea: "사회·정책·의료 롱폼 다큐나 드라마를 설계할 때 단순한 관료 비판(선 vs 악)을 넘어, 한정된 자원과 상충하는 공적 가치(공리주의적 다수의 이익 vs 인권/절차적 정의) 사이의 피할 수 없는 '비극적 선택'으로 프레이밍함으로써 시청자에게 최고조의 철학적 긴장을 선사함."
  narrative_stage: "Act 2 Dilemma Escalation & Policy Tension"
  emotional_mechanics:
    trigger: "자원의 치명적 한계와 공공의 위기 직면"
    build_up: "어떤 배분 방식을 택해도 무고한 피해자가 발생하는 도덕적 진퇴양난"
    peak: "국가나 책임자가 피를 묻히며 하나의 가치를 선택해야 하는 비극적 순간"
    release: "도덕적 상처(Moral Injury)와 사회적 제도의 불완전성에 대한 깊은 성찰"
  failure_modes: "문제를 악덕 관료의 탐욕으로만 단순화하여 정책 시스템의 구조적 비극성을 휘발시키는 실패"

