id: SRC-1991-272
title: "Is Anyone Responsible? How Television Frames Political Issues"
authors:
  - "Shanto Iyengar"
year: 1991
type: academic_primary
tier: 1
publication: "University of Chicago Press"
pages: "1-206"
isbn: "978-0226388564"
citation_count: 6200
key_findings:
  - "미디어 프레이밍의 두 가지 핵심 양식 규명: 구체적 개인과 사건에 초점을 맞추는 '에피소드형 프레임(Episodic Framing)' vs 사회적 맥락과 구조에 초점을 맞추는 '주제형 프레임(Thematic Framing)'."
  - "에피소드형 프레임은 관객으로 하여금 사건의 책임을 개인의 도덕적 결함으로 귀인(Attribution of Responsibility)하게 만들고, 주제형 프레임은 제도와 정책적 책임으로 귀인하게 만듦."
  - "정보형 서사에서 에피소드형 서술로 관객의 시선을 묶어둔 뒤, 결정적 순간에 주제형 프레임으로 전환함으로써 책임 주체를 뒤바꾸는 프레이밍 반전 메커니즘 실증."
core_claims:
  - "프레이밍 방식의 전환은 관객의 인과적 귀인과 도덕적 책임 판정을 180도 역전시킨다."
  - "정보형 콘텐츠의 반전은 개인의 일탈 서사에서 구조적 맥락 서사로의 프레임 전환을 통해 달성된다."
keywords:
  - framing theory
  - attribution of responsibility
  - episodic vs thematic
  - media effects
  - responsibility reappraisal
