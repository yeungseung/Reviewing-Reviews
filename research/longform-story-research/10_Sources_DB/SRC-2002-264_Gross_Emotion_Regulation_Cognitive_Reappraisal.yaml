id: SRC-2002-264
title: "Emotion regulation: affective, cognitive, and social consequences"
authors:
  - "James J. Gross"
year: 2002
type: academic_primary
tier: 1
publication: "Psychophysiology"
volume: "39"
issue: "3"
pages: "281-291"
doi: "10.1017/s0048577201393198"
citation_count: 11200
key_findings:
  - "감정 조절의 과정 모델(Process Model of Emotion Regulation)에서 '선행 중심(Antecedent-focused) 인지적 재평가(Cognitive Reappraisal)'의 메커니즘 규명."
  - "자극 자체가 아니라 자극에 부여하는 주관적 의미와 인지적 해석을 변화시킴으로써 감정 반응(정서가, 생리적 반응)을 근본적으로 재조정함."
  - "서사에서 반전이 발생했을 때 관객이 과거 사건의 의미와 인물의 행동을 인지적으로 재평가(Reappraisal)하여 정서적 카타르시스를 재구성하는 심리학적 근거 제공."
core_claims:
  - "인지적 재평가는 상황에 대한 해석을 바꿈으로써 감정적 궤적 전체를 변화시킨다."
  - "서사의 진정한 반전은 사건의 외형적 발생이 아니라 관객의 인지적 의미 재평가를 격발하는 전환이다."
keywords:
  - cognitive reappraisal
  - emotion regulation
  - interpretation change
  - appraisal theory
  - narrative affect
