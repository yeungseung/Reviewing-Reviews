bibliographic_info:
  title: "Sympathy and callousness: The impact of deliberative thought on donations to identifiable vs. statistical victims"
  authors:
    - "Small, Deborah A. (University of Pennsylvania)"
    - "Loewenstein, George (Carnegie Mellon University)"
    - "Slovic, Paul (University of Oregon / Decision Research)"
  institution: "Carnegie Mellon University & Decision Research"
  published_date: "2007-03-01"
  source_url: "https://doi.org/10.1016/j.obhdp.2006.01.005"
  source_type: "Peer-reviewed Journal (Organizational Behavior and Human Decision Processes)"

credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Behavioral Decision Making & Empathy Field Experiment"
    sample_size: "Multi-study laboratory and real-world charitable donation experiments (N=200+)"
    target_population: "Human decision makers, donors, and media audiences"
    relationship_type: "Causal (Individual Specificity vs Statistical Aggregates -> Empathic Arousal & Altruistic Action)"
    replicated: "Highly Replicated (The foundational experimental paper on the Identifiable Victim Effect and Psychic Numbing, 1,400+ citations)"
    limitations: "기부 및 공감 실험 중심이나 서사에서 1인의 구체적 디테일이 거대 통계보다 압도적으로 강한 이유를 실증"

claims_and_evidence:
  core_claim: "인간의 공감(Sympathy)과 정서적 몰입은 피해자의 규모가 아니라 '구체적 식별 가능성(Identifiability & Specificity)'에 의해 결정된다. '아프리카 3백만 명의 아사 위기'라는 거대 통계 데이터(Statistical Victims)는 심리적 마비(Psychic Numbing)와 분석적 숙고(Deliberative Thinking)를 유발해 감정을 차갑게 식히지만, '7세 소녀 로키아의 사진과 이름'이라는 단 1인의 구체적 디테일(Identifiable Victim)은 2배 이상의 자발적 공감과 정서적 행동을 촉발한다."
  verbatim_quotes:
    - original: "When an identifiable victim is presented, sympathy and donations are high, but when statistical information is provided, sympathy drops significantly... Deliberative thought dampens the emotional reaction to identifiable victims."
      translation: "식별 가능한 피해자가 제시될 때 동정심과 기부는 높지만, 통계적 정보가 제공될 때 동정심은 크게 떨어진다... 분석적이고 숙고적인 사고는 식별 가능한 피해자에 대한 정서적 반응을 억제한다."
      citation_location: "pp. 143-147"

story_application:
  application_idea: "거대한 역사적 비극이나 사회적 재난(기후변화, 전쟁, 경제위기)을 다룰 때, 거시적 수치나 집단 통계로 관객을 압도하려 들지 말고, 단 한 사람의 구체적인 일상 디테일(그의 낡은 시계, 가족과의 약속, 신발 사이즈)을 현미경처럼 조명하여 관객의 공감 회로를 100% 가동시켜야 함."
  narrative_stage: "Character Grounding & Empathy Ignition"
  emotional_mechanics:
    trigger: "1인의 구체적 식별 정보(이름, 얼굴, 사소한 습관)의 제시"
    build_up: "추상적 통계가 아닌 살아 숨 쉬는 한 인간으로서의 동일시"
    peak: "그 1인에게 닥쳐오는 비극에 대한 생생한 고통과 공감"
    release: "거대 비극의 무게를 그 1인을 통해 온몸으로 체감"
  failure_modes: "숫자와 거시 지표만 나열하여 관객에게 심리적 마비(Psychic Numbing)를 일으키는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "다큐멘터리, 탐사보도, 역사극, 재난 영화 등 거시 비극을 다루는 모든 롱폼 서사에 적용"
