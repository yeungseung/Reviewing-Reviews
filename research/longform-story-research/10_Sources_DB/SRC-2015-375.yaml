id: SRC-2015-375
author: Sander L. van der Linden, Anthony A. Leiserowitz, Geoffrey D. Feinberg, & Edward W. Maibach
year: 2015
title: 'The scientific consensus on climate change as a gateway belief: Experimental evidence'
venue: PLOS ONE
tier: 1
citation_count: 730
url: https://doi.org/10.1371/journal.pone.0118489
key_contribution: 관문 신념 모델(Gateway Belief Model)을 통해 과학적 합의(Expert Consensus: 97% 이상)에 대한 인식이 대중의 신념과 정책 지지를 견인하는 핵심 관문임을 실증. 압도적 합의가 존재하는 사안에서 비전문가의 반론을 50:50으로 동등하게 나열하는 가짜 균형(False Balance)이 대중의 합의 인식을 붕괴시키고 양극화를 조장함을 규명.
relevance: 과학·의학·환경 롱폼 콘텐츠에서 과학적 합의를 명확한 닻으로 제시하여 가짜 양비론을 차단하는 합의 관문 메커니즘(CGM)의 핵심 근거.
themes:
- '#41 Theme 3'
