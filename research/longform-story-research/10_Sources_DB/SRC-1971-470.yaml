key_contribution: 미학 심리생물학 및 각성 잠재력(Arousal Potential)과 역U자형 최적 각성 곡선(Wundt Curve) 정립. 지속적이거나 과도하게 높은 자극은 감각 기관의 자극 순응(Habituation)과 인지 피로를 초래하여 쾌락적 가치를 급감시킴을 실증. 서사에서의 피크 인플레이션(Peak Inflation)이 관객의 감정적 무감각과 이탈을 유발하는 신경심리학적 메커니즘 규명.
relevance: 큰 자극을 남발하는 피크 인플레이션의 위험성과 절제된 자극 배치의 인지심리학적 근거.
