  title: "Compassion fatigue: Communication and burnout toward social problems"
  authors:
    - "Kinnick, Katherine N. (Kennesaw State University)"
    - "Krugman, Dean M. (University of Georgia)"
    - "Cameron, Glen T. (University of Georgia)"
  institution: "Kennesaw State University / University of Georgia"
