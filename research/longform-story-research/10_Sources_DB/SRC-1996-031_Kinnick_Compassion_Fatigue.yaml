credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "Survey & Media Content Analysis"
    sample_size: 324
    target_population: "성인 미디어 수용자"
    relationship_type: "Causal & Correlational"
    replicated: "Replicated (Foundational study adapting compassion fatigue to mass media)"
    limitations: "사회 문제 뉴스 중심 연구이나 유튜브 등 현대 디지털 콘텐츠 수용에 직접 적용됨"

claims_and_evidence:
  core_claim: "미디어가 해결책이나 인과적 설명 없이 극단적인 고통과 비극, 자극적인 정서(분노, 동정)를 과도하게 반복 노출할 때, 수용자는 심리적 방어 기제로서 정서적 철회(Emotional Burnout)와 미디어 능동 회피(Media Avoidance)를 보인다."
  verbatim_quotes:
    - original: "Compassion fatigue in media is characterized by emotional exhaustion, apathy, and avoidance behavior resulting from relentless exposure to sensationalized social crises without constructive resolution."
      translation: "미디어에서의 동정 피로는 건설적 해결책 없이 선정적인 사회적 위기에 끊임없이 노출됨으로써 발생하는 정서적 탈진, 무감각, 회피 행동으로 특징지어진다."
      citation_location: "p.398, Abstract & Conceptualization"

story_application:
  application_idea: "감정 자극 중심의 콘텐츠(EMOTION 편중)를 만들 때, 관객의 감정적 연료를 소진시키지 않도록 인과적 맥락과 관객이 납득할 수 있는 서사적 결말을 함께 공급하여 정서적 피로를 차단함."
  narrative_stage: "Emotional Pacing & Climax Resolution"
  emotional_mechanics:
    trigger: "사회적 위기나 비극의 제시"
    build_up: "감정적 분노와 안타까움의 고조"
    peak: "사건의 인과적 규명과 대안 제시"
    release: "무력감 해소 및 건설적 효능감 형성"
  failure_modes: "해결 없는 분노와 자극만 쏟아붓는 레이지베이트(Ragebait)는 채널의 구독 취소와 장기 신뢰도 붕괴로 귀결됨"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "지속적인 자극에 장기 노출되는 디지털 콘텐츠 환경에서 매우 강력히 작동"
