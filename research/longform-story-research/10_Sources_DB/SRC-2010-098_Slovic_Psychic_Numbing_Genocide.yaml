claims_and_evidence:
  core_claim: "심리적 무감각(Psychic Numbing)과 거대 스케일 스테이크의 감정 마비: 인간의 인지 및 정서 시스템은 대규모 집단이나 추상적 통계(예: 수백만 명의 희생, 우주 멸망)를 마주할 때 감정적 반응이 비례하여 증가하지 않으며, 오히려 급격히 감쇄되어 무감각해지는 '심리적 무감각(Psychic Numbing)'과 '연민의 붕괴(Collapse of Compassion)'를 겪는다. 단 1명의 식별 가능한 개인에게는 폭발적인 공감과 기부 행동이 나타나지만, 피해자가 2명으로 늘어나는 순간부터 개별 피해자에 대한 감정적 가중치는 떨어지기 시작한다. 서사에서 갈등의 스케일을 우주적 파멸로 뻥튀기하는 '스테이크 인플레이션(Stake Inflation)'은 관객의 감정을 키우기는커녕 뇌의 정서 회로를 마비시키며, 거대한 사건일수록 오직 '단 한 명의 구체적 개인의 삶'으로 앵커링되어야만 감정이 생명력을 유지한다."
  verbatim_quotes:
    - original: "Most people are caring and will exert great effort to rescue 'individual' victims... But when value enters the domain of large numbers, our affective system fails us. We become numb to the tragedy of the mass... One death is a tragedy; a million deaths is a statistic."
      translation: "대부분의 사람들은 배려심이 깊으며 '개별' 희생자를 구하기 위해 큰 노력을 기울인다... 그러나 가치가 거대한 숫자의 영역에 들어서면 우리의 정서 시스템은 작동을 멈춘다. 우리는 대중의 비극에 무감각해진다... 한 사람의 죽음은 비극이지만, 백만 명의 죽음은 통계일 뿐이다."
      citation_location: "pp. 79-84"

story_application:
  application_idea: "미시적 앵커링을 통한 스케일 인플레이션 탈출(Micro-Anchor Rule): 국가 멸망, 기후 대재앙, 외계인 침공 같은 거대 스케일 서사를 다룰 때, 거시적 재난 화면을 나열하지 말고 '오직 한 아이의 인형', '한 가족의 식탁', '주인공의 깨진 안경' 같은 극단적 미시적 디테일에 카메라를 고정하여 관객 뇌의 심리적 무감각을 방지하고 원초적 연민을 자극함."
  narrative_stage: "Act 1 Macro Crisis Introduction, Act 2 Climax Micro Framing"
  emotional_mechanics:
    trigger: "거대한 시스템적 위기 발생"
    build_up: "추상적 통계에 질려 무감각해지려는 순간 구체적인 단 한 명의 결핍과 고통 제시"
    peak: "그 한 사람의 운명에 온 신경이 결속되며 거대한 사건의 비극성이 비로소 뇌에 각인"
    release: "미시적 생명/가치의 구원을 통해 거시적 세계의 희망을 상징적으로 회복"
  failure_modes: "지구 멸망 CG만 2시간 동안 쏟아붓고 관객이 아무런 슬픔도 느끼지 못한 채 팝콘만 씹게 만드는 블록버스터의 스케일 중독 오류"

