claims_and_evidence:
  core_claim: "인간의 뇌는 연속적인 시간 흐름을 그대로 받아들이지 않고, 예측 오류(Prediction Error)가 발생하는 지점에서 '사건 경계선(Event Boundary)'을 그어 작업 기억을 리셋하고 개별 챕터로 부호화함."
  verbatim_quotes:
    - original: "Perceivers segment continuous activity into discrete events... event boundaries are points of change where prediction error spikes, leading to an update of the internal mental model."
      translation: "지각자는 연속적인 활동을 개별 사건으로 분절한다... 사건 경계선은 예측 오류가 급증하는 변화의 지점이며, 내부 심리 모델의 업데이트를 이끈다."
      citation_location: "p.273, Abstract"

story_application:
  application_idea: "15분 이상 롱폼 영상에서는 7~10분 주기로 관객의 감정 상태와 사건적 맥락이 전환되는 '정서적 사건 경계선'을 의도적으로 배치하라. 경계선이 뚜렷할수록 관객은 방대한 지식과 사건을 뇌 속에서 챕터별로 명확히 정리하여 장기 기억에 보존한다."
  narrative_stage: "Long-form Chaptering & Sequencing"
  emotional_mechanics:
    trigger: "예측을 깨는 정서적/사건적 전환점"
    build_up: "이전 챕터의 기억 공고화 (Bifurcation)"
    peak: "사건 경계선 돌파"
    release: "새로운 챕터의 인지 모델 시작"
  failure_modes: "사건 경계선 없이 평탄하게 흘러가는 영상은 시청자가 볼 때는 편안할지 몰라도 시청 후 뇌에서 통째로 소멸됨"

