claims_and_evidence:
  core_claim: "대부분의 인간은 자신이 주변 세계(지퍼, 수세식 변기부터 경제, 정치, 자연 현상에 이르기까지)의 인과적 메커니즘을 실제보다 훨씬 더 깊이 이해하고 있다고 착각하는 '설명적 깊이의 착각(Illusion of Explanatory Depth; IOED)'에 빠져 있다. 그러나 '구체적인 작동 인과 사슬을 단계별로 설명해보라'는 불가능해 보이는 질문(Impossible Question)에 직면하는 순간, 자신의 극심한 무지를 깨닫고 거대한 '설명 공백(Explanation Gap)'을 자각하게 된다. 이 메타인지적 충격은 지적 오만을 분쇄하고 극단적인 호기심과 탐구 욕구를 촉발한다. 따라서 오프닝에서 친숙하다고 착각했던 대상에 대해 '답할 수 없는 본질적 질문'을 던지는 Impossible Question 엔진은 최고도의 지적 몰입을 만들어낸다."
  verbatim_quotes:
    - original: "Most people feel they understand the world with far greater detail, coherence, and depth than they really do... People rarely confront their lack of understanding and that only through attempting to generate detailed explanations are they forced to realize the shallowness of their own knowledge."
      translation: "대부분의 사람들은 자신이 실제 아는 것보다 훨씬 더 구체적이고, 일관되며, 깊이 있게 세상을 이해하고 있다고 느낀다... 사람들은 평소 자신의 이해 결핍과 마주치는 일이 거의 없으며, 상세한 설명을 생성하려 시도할 때에만 비로소 자신의 지식이 얼마나 얕은지 깨닫게 된다."
      citation_location: "p. 522"

story_application:
  application_idea: "서사 오프닝에서 'Impossible Question Engine'을 가동하여 관객이 잘 알고 있다고 믿는 일상적 대상이나 거대 사건에 대해 한 번도 생각해보지 못한 인과적 맹점을 찌르는 질문을 던짐 (예: '우리는 매일 비행기를 타지만, 왜 날개 위로 흐르는 공기가 비행기를 띄우는지 현대 물리학도 완전한 합의를 보지 못했는가?'). 관객의 설명적 깊이의 착각을 단 10초 만에 무너뜨림으로써 이야기 끝까지 정답을 추적하게 만드는 지적 락인 완성."
  narrative_stage: "Impossible Question Opening, Epistemic Shock Hook, IOED Shattering"
  emotional_mechanics:
    trigger: "너무나 친숙하다고 믿었던 대상에 대한 날카로운 불가해성 질문 투척"
    build_up: "자신의 지식으로 대답하려다 인과적 맹점을 발견하며 느끼는 메타인지적 충격"
    peak: "설명 공백(Explanation Gap)의 자각과 이를 메우려는 강박적 호기심 점화"
    release: "전문가·주인공의 탐사 과정을 따라 한 꺼풀씩 벗겨지는 인과 사슬의 명료한 목격"
    resonance: "세상의 숨겨진 경이로움과 지적 성찰에 대한 심오한 경외감 획득"
  failure_modes: "순수 말장난이나 선문답 같은 허무한 질문을 던져 관객의 지적 진정성을 농락하는 퀴즈쇼 함정"

