claims_and_evidence:
  core_claim: "서사의 주 인과 사슬(Main Causal Chain) 상에 위치한 사건은 인과망에서 벗어난 단독 사건 대비 단기 및 장기 기억 회상률이 유의미하게 높으며, 독자는 작동 기억 내에서 이전 사건의 인과적 선행 조건을 지속적으로 유지한다."
  verbatim_quotes:
    - original: "Events that lie on the causal chain connecting the opening of a story to its outcome are recalled significantly better than events that do not. Causal connectivity is the primary determinant of textual memorability."
      translation: "이야기의 시작과 결과를 연결하는 인과 사슬 상에 놓인 사건들은 그렇지 않은 사건들보다 유의미하게 훨씬 잘 회상된다. 인과적 연결성은 텍스트 기억 가능성의 가장 중요한 결정 요인이다."
      citation_location: "pp.235-238"

story_application:
  application_idea: "롱폼 콘텐츠의 핵심 메시지와 중요 플롯 포인트는 반드시 '오프닝에서 결말까지 이어지는 주 인과 사슬'의 필수 결절점(Node)으로 설계해야 하며, 인과와 무관한 주변부 곁가지 에피소드는 과감히 쳐내야 장기 기억에 남음."
  narrative_stage: "Macro Narrative Architecture & Plot Trimming"
  emotional_mechanics:
    trigger: "선행 사건의 필연적 결과로서의 후속 사건 전개"
    build_up: "사건 간의 인과적 필연성이 뇌의 작동 기억에 확고히 안착"
    peak: "누적된 인과 사슬이 폭발하는 결정적 결말"
    release: "전체 이야기의 논리적·감정적 완결감(Closure)"
  failure_modes: "주 인과 사슬과 무관한 볼거리나 에피소드를 남발하면 관객은 중심 줄거리를 망각하고 집중력을 잃음"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "인과적 응집성이 서사의 이해와 기억을 지탱하는 모든 서사물에 적용"
