id: SRC-2003-437
author: Dacher Keltner & Jonathan Haidt
year: 2003
title: 'Approaching awe, a moral, spiritual, and aesthetic emotion'
venue: Cognition & Emotion
tier: 1
citation_count: 3400
url: https://doi.org/10.1080/02699930302297
key_contribution: 지적 경이감(Awe)과 인지적 고양의 심리학적 구조를 정초. 경이감은 지각된 광대성(Perceived Vastness)과 기존 정신적 틀의 재조정(Need for Accommodation)이라는 두 가지 인지적 인과를 통해 촉발되며, 인간으로 하여금 자아를 초월한 깊은 겸허함과 지적 감탄을 경험하게 함을 규명.
relevance: 과학, 역사, 인문 비픽션 콘텐츠에서 인위적인 신파나 극적 왜곡 없이, 사실 그 자체의 웅장함과 통찰을 통해 관객의 감정/판단 변화(Emotional Turn)를 이끌어내는 방법론의 이론적 토대.
themes:
  - '#46 Theme 3'
