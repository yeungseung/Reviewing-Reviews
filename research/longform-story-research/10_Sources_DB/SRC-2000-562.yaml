id: SRC-2000-562
author: Annie Lang, Shuhua Zhou, Nancy Schwartz, Paul D. Bolls, & Robert F. Potter
year: 2000
title: 'The Effects of Edits on Arousal, Attention, and Memory for Television Messages:
  When an Edit is an Edit Can an Edit Be Too Much?'
venue: Journal of Broadcasting & Electronic Media, 44(1), pp. 94-109
tier: 1
citation_count: 520
url: https://doi.org/10.1207/s15506878jobem4401_7
key_contribution: 제한 용량 모델(LC4MP) 기반 생리신호(심박수 감속, 피부전도도) 및 기억 실험. 컷(Edit)은 자동적 지향
  반응(Orienting Response, OR)을 유발해 단기적 주의와 각성을 높이지만, 컷 빈도가 초당 0.5회 이상 지속되거나 인지 처리 요구량이
  가용한 작업 기억 용량을 초과할 때 인지 과부하(Cognitive Overload)가 발생하여 내용 기억과 회상률이 급격히 저하됨을 입증.
relevance: 빠른 편집 속도(Pacing)가 주의를 끌어올리는 긍정적 효과와 과자극(Overstimulation)으로 기억을 파괴하는 경계
  조건을 규명하는 핵심 이론적 근거.
