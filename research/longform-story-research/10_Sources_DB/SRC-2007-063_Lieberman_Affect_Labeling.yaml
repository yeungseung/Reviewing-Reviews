credibility_assessment:
  credibility_tier: "Tier 1"
  methodology:
    study_type: "fMRI Neuroimaging Experiment"
    sample_size: "30 healthy adult human subjects"
    target_population: "Human emotion processing and verbalization networks"
    relationship_type: "Causal (Affect Labeling -> Prefrontal Inhibition of Amygdala)"
    replicated: "Highly Replicated (Foundational neuroimaging paper on affect labeling and emotional regulation, 1,800+ citations)"
    limitations: "감정 조절 실험이나 서사 창작에서 감정 단어의 직접 사용이 정서 반응을 냉각시키는 기제 입증에 직결"

claims_and_evidence:
  core_claim: "감정을 명시적인 단어(예: '두려움', '분노')로 라벨링(Affect Labeling)할 때, 우측 복외측 전두엽(rvlPFC)이 활성화되며 편도체(Amygdala)의 자율신경계 반응과 정서적 고조가 억제된다. 즉, 감정 단어를 직접 제시하면 수용자는 그 감정을 생생하게 '느끼는(Feel)' 것이 아니라 이성적으로 '분류(Classify)'하게 되어 감정의 생생함이 즉각 식어버린다."
  verbatim_quotes:
    - original: "Affect labeling, compared with other emotion-processing tasks, produces diminished response in the amygdala and other emotional regions... Putting feelings into words activates prefrontal regions that dampen emotional reactivity."
      translation: "감정 라벨링은 다른 감정 처리 과제와 비교할 때 편도체 및 기타 감정 영역의 반응을 감소시킨다... 감정을 말로 표현하는 것은 정서적 반응성을 억제하는 전전두엽 영역을 활성화한다."
      citation_location: "pp. 421-424"

story_application:
  application_idea: "시청자에게 강렬한 감정을 느끼게 만들고 싶다면 감정 단어('너무나 슬펐다', '공포스러웠다')를 절대 직접 써서는 안 됨. 감정 단어를 쓰면 시청자의 뇌가 이성적 분류 모드로 전환되어 감정이 식어버림. 감정 단어는 오직 감정의 피크가 지나간 후 수용자의 마음을 진정시키고 정리하는 '하강 완충 구간'에서만 제한적으로 사용해야 함."
  narrative_stage: "Scene-level Subtext & Post-peak Resolution"
  emotional_mechanics:
    trigger: "감정 단어의 부재 및 신체적/공간적 정황의 제시"
    build_up: "편도체와 신체 표지가 억제 없이 자발적으로 발화"
    peak: "직접 느끼는 감정의 클라이맥스"
    release: "피크 후 절제된 언어화로 감정의 여운 정리"
  failure_modes: "클라이맥스에서 '슬프다/비참하다'라고 내레이션으로 떠먹여 주어 관객의 몰입을 순식간에 냉각시키는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "영화 대사, 내레이션, 문학적 묘사, 다큐멘터리 스크립트 등 모든 스토리텔링에 적용"
