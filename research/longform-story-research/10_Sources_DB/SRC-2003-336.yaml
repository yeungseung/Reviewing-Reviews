url: https://doi.org/10.1080/0363775032000133789
key_contribution: '이산 정서(Discrete Emotions: 분노, 두려움, 희망)가 단순한 결과물이 아니라 후속 정보 처리를 편향시키는
  인지적 프레임(Cognitive Frame)으로 작동함을 실증하여, 선행 감정이 다음 감정 전환을 준비시키는 감정 연쇄의 인과적 고리를 규명.'
