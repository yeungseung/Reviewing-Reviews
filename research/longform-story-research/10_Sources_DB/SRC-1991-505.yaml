id: SRC-1991-505
author: Jerome Bruner
year: 1991
title: "The Narrative Construction of Reality"
venue: "Critical Inquiry, 18(1), 1-21"
tier: 1
citation_count: 8350
url: https://doi.org/10.1086/448619
key_contribution: "인간이 현실을 구성하는 인지 서사적 기제 규명(해석학적 합성성, 서사적 통시성, 규범성). 서사적 일관성(Narrative Coherence)과 텔레올로지(Teleology)가 강박적으로 작동할 때 복합적인 객관적 사실을 기존 서사 틀에 억지로 끼워 맞추는 프로크루스테스식 사실 왜곡(Procrustean Narrative Distortion)의 위험을 통찰."
relevance: "탐사·다큐멘터리·역사 서사에서 사전 설계된 엔딩 감정에 맞추기 위해 사실을 왜곡하거나 양면성을 제거하는 부작용을 경고하고, 창발적·열린 엔딩(Emergent/Open Ending)의 필요성을 뒷받침하는 핵심 이론."
themes:
  - "#52 Theme 2"
