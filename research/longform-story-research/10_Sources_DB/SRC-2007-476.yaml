id: SRC-2007-476
author: Jonathan Haidt & Jesse Graham
year: 2007
title: 'When Morality Opposes Justice: Conservatives Have Moral Intuitions That Liberals May Not Recognize'
venue: Social Justice Research, 20(1), 98-116
tier: 1
citation_count: 4890
url: https://doi.org/10.1007/s11211-007-0034-z
key_contribution: '도덕적 기반 이론(Moral Foundations Theory) 중 공정성/부정(Fairness/Cheating) 및 도덕적 분노(Moral Outrage) 메커니즘 규명. 시스템이나 악역의 불공정(Unfairness)과 약자에 대한 착취가 지속적으로 누적될 때 인간의 도덕적 혐오와 분노가 지수함수적으로 축적되며, 가해자에 대한 정당한 응징(Justice Payoff)이 일어날 때 뇌의 도덕적 고양(Elevation)과 강렬한 통쾌함(Hedonic/Moral Relief)이 폭발함을 분석.'
relevance: 정의 구현의 통쾌함(사이다/Justice Payoff)이 폭발하기 위해 반드시 선행되어야 하는 부당함과 불공정의 체계적 축적 메커니즘 제공.
themes:
  - '#50 Theme 1'
