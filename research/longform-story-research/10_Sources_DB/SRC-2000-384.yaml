key_contribution: 자아-기억 체계(Self-Memory System: SMS) 모델을 정초하여, 자전적 기억(Autobiographical Memory)이 현재의 작동 자아(Working Self) 목표와 긴밀히 상호작용하며 재구성됨을 실증.
relevance: 서사 속 특정 단서(가족과의 불화, 과거의 결핍, 첫 직장의 좌절)가 관객의 잠재된 개인적 에피소드 기억을 강제 소환하여 강력한 감정적 동일시를 촉발하는 과거 경험 거울의 기전 규명.
