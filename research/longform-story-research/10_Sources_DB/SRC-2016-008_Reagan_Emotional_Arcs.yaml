claims_and_evidence:
  core_claim: "대다수 서사의 감정 궤적은 6대 기본 형태(Rags to Riches, Tragedy, Man in a Hole, Icarus, Cinderella, Oedipus)로 수렴하며, 복합 반전 파형(특히 Cinderella, Oedipus)이 단방향 파형보다 다운로드 수(인기도)에서 유의미하게 우세함."
  verbatim_quotes:
    - original: "We find that a story's emotional arc is dominated by six basic shapes... The most successful stories appear to be those that follow more complex trajectories involving multiple dips and rises, such as Cinderella or Oedipus."
      translation: "우리는 이야기의 감정 아크가 6가지 기본 형태에 의해 지배된다는 것을 발견했다... 가장 성공적인 이야기들은 신데렐라나 오이디푸스처럼 여러 번의 하강과 상승을 수반하는 더 복잡한 궤적을 따르는 것으로 나타났다."
      citation_location: "Abstract & Results"

story_application:
  application_idea: "롱폼 기획 시 단순 상승(성공담)이나 단순 하강(비극)으로 단조롭게 설계하지 말고, 최소 2번의 반전(하강 후 상승 → 재하강 → 최종 극복)을 거치는 신데렐라형 파형을 뼈대로 삼아라."
  narrative_stage: "Macro Narrative Architecture"
  emotional_mechanics:
    trigger: "연쇄적 시련과 극복의 교차"
    build_up: "1차 극복 후 안도감 → 2차 위기(더 깊은 절망)의 엄습"
    peak: "바닥에서 딛고 일어서는 궁극적 클라이맥스"
    release: "고난을 통과한 뒤 맞이하는 정당한 카타르시스"
  failure_modes: "중간 변곡점 없이 일직선으로만 상승하면 '진부함', 하강만 하면 '우울감'으로 이탈 발생"

