title: 'Causal Reasoning in the Comprehension of Simple Texts'
venue: Journal of Memory and Language, 27(3), 235-244
tier: 1
citation_count: 2450
url: https://doi.org/10.1016/0749-596X(88)90052-6
key_contribution: '현재-상태 인과 추론 전략(Current-State Strategy) 및 망각된 셋업의 잠재 기억 인출(Latent Memory Retrieval) 규명. 이야기 초반에 일상적 디테일로 심겨진 복선(Planting)이 장기 기억에 잠복했다가, 클라이맥스 순간에 결정적 해결책으로 소환(Recall)될 때 발생하는 소급적 인과 재구성(Retroactive Recontextualization)과 뇌의 통찰(Insight/Aha! Moment) 전율을 실험적으로 증명.'
relevance: 잊혀졌던 복선이 피크 순간에 회수될 때 터져 나오는 폭발적 카타르시스와 인지적 쾌락의 신경심리학적 토대.
