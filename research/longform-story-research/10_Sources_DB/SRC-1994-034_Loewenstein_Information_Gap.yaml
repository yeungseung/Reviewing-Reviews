claims_and_evidence:
  core_claim: "호기심은 자신이 알고 있는 것(Current Knowledge)과 알고 싶은 것(Desired Knowledge) 사이의 '정보 공백(Information Gap)'을 인지할 때 발생하는 고통스러운 결핍 충동이며, 이를 해소하려는 동기가 주의를 강력히 집중시킨다."
  verbatim_quotes:
    - original: "Curiosity arises when attention becomes focused on a gap in one's knowledge. Such information gaps produce the feeling of deprivation, labeled curiosity, which motivates the individual to obtain the missing information."
      translation: "호기심은 자신의 지식 공백에 주의가 집중될 때 발생한다. 이러한 정보 공백은 호기심이라 불리는 결핍감을 낳고, 개인으로 하여금 빠진 정보를 획득하도록 동기화한다."
      citation_location: "p.75, Abstract"

story_application:
  application_idea: "서사 오프닝에서 사건을 무작정 설명하지 말고, 통념을 깨는 역설적 질문이나 풀리지 않는 미스터리(Meaning-first 또는 Hook)를 제시하여 관객의 뇌에 즉각적인 '정보 공백'을 뚫어놓음으로써 시청 완주를 유도함."
  narrative_stage: "Act 1 Opening Hook & Premise Setup"
  emotional_mechanics:
    trigger: "지적 공백과 모순의 발견"
    build_up: "결핍감 해소를 향한 인지적 추적"
    peak: "누락된 정보가 제공되는 순간의 유레카 쾌감"
    release: "인지적 안정 및 깊은 만족감"
  failure_modes: "정보 공백이 너무 거대하여 관객이 아예 맥락을 잡지 못하면 호기심 대신 무력감과 좌절을 느끼고 이탈함"

