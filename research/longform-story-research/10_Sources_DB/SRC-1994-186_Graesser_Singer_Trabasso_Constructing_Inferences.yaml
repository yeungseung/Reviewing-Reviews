claims_and_evidence:
  core_claim: "수용자는 이야기를 접할 때 '구성주의자 이론(Constructivist Theory)'에 따라 왜 그 사건이 일어났는가(WHY), 그리고 그 결과 인물이 무엇을 하는가(THEREFORE)를 밝히려는 '설명 추론(Explanation-driven Inferences)'을 능동적으로 생성한다. 반면 정보를 단순히 나열한 '목록 구조(List / Additive Structure)'에서는 이러한 인과 추론 엔진이 즉시 꺼져버린다. 동일한 팩트와 정보량을 담고 있더라도, 'A가 일어났다. 그리고(And) B가 일어났다' 식의 단순 나열은 뇌의 깊은 상황 모델 구축을 중단시키지만, 'A 때문에 B가 일어났다'는 인과 전개는 뇌의 인과 추론을 극한으로 활성화하여 몰입을 낳는다."
  verbatim_quotes:
    - original: "Readers construct a coherent mental representation by attempting to explain why actions and events occur in the narrative... Causal inferences that explain actions are generated on-line, whereas simple additive lists fail to stimulate explanatory coherence."
      translation: "독자들은 서사 내에서 행동과 사건이 왜 일어나는지 설명하려 시도함으로써 일관된 멘탈 표상을 구성한다... 행동을 설명하는 인과 추론은 실시간으로 생성되지만, 단순 첨가형 목록은 설명적 결속성을 자극하는 데 실패한다."
      citation_location: "Psychological Review, Vol. 101, No. 3, pp. 371-375"

story_application:
  application_idea: "정보형 롱폼 콘텐츠의 '목록의 서사화(List-to-Narrative Conversion) 공식'. '역사적 사건 10가지', '기술 혁신의 5단계'처럼 자칫 지루한 목록(List)으로 흐르기 쉬운 정보형 콘텐츠를, '사건 A가 초래한 치명적 모순(WHY) ➔ 사건 B의 필연적 탄생(THEREFORE)'이라는 인과 사슬로 재배열함. 단순 정보 나열을 거부하고 관객의 뇌내 '설명 추론 엔진'을 끊임없이 돌려 지루함을 0으로 만듦."
  narrative_stage: "Information Architecture, Documentary & Educational Longform"
  emotional_mechanics:
    trigger: "흥미로운 현상의 제시"
    build_up: "단순 나열을 거부하고 사건의 숨겨진 원인(WHY) 추적"
    peak: "원인이 후속 사건을 필연적으로 격발하는 인과적 도미노 (THEREFORE)"
    release: "단편적 지식이 아닌 거대한 인과적 맥락의 완전한 이해"
  failure_modes: "지식과 정보를 불릿 포인트처럼 '그리고, 그리고' 나열하다 관객을 수면으로 몰아넣는 '백과사전식 나열 증후군'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "인과 추론이 너무 난해하면 관객이 포기하므로 인과 교량이 직관적으로 닿아야 함"
