    target_population: "서사적 텍스트 및 목록형 텍스트 독자 일반"
    relationship_type: "Causal Constructivist Model & Reader-Goal Driven Inference"
    effect_size: "인과 전개 서사는 단순 목록형(List) 텍스트 대비 글로벌 일관성 추론(WHY/HOW) 생성률 3.4배 증가, 장기 상황 모델 구축률 70% 향상"
