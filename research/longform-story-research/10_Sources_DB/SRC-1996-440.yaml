id: SRC-1996-440
author: Arie W. Kruglanski & Donna M. Webster
year: 1996
title: "Motivated closing of the mind: 'Seizing' and 'freezing'"
venue: Psychological Review
tier: 1
citation_count: 3600
url: https://doi.org/10.1037/0033-295X.103.2.263
key_contribution: 인지적 종결 욕구(Need for Cognitive Closure, NFCC) 이론을 정초. 인간은 불확실성과 모호성에 노출되었을 때 인지적 종결(Answer)을 빠르게 낚아채려는 '포착(Seizing)' 성향과, 일단 답을 얻은 뒤에는 새로운 모호성을 거부하고 그 판단을 굳히려는 '동결(Freezing)' 성향을 보임을 규명.
relevance: 탐구형 챕터에서 4단계 '해답 타이밍(Answer Timing)'이 너무 일찍 제시되면 탐구의 동력이 소멸하고, 너무 늦어지면 인지적 좌절을 일으키는 최적 종결 타이밍의 심리학적 기준.
themes:
  - '#47 Theme 1'
