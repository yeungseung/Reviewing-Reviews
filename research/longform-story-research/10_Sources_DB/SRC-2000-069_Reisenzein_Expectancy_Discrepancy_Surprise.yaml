claims_and_evidence:
  core_claim: "놀라움(Surprise)의 강도는 단순히 새로운 사건의 등장이 아니라, 사전에 형성된 사건의 '주관적 발생 확률(Subjective Probability / Expectancy)'과 실제 발생한 사건 간의 불일치(Discrepancy) 크기에 정비례한다. 놀라움은 즉각적으로 진행 중인 정보 처리를 중단시키고(Interruption), 뇌의 주의 자원을 강제로 징발하여 스키마를 업데이트하도록 요구하는 인지적 재구성 기제이다."
  verbatim_quotes:
    - original: "Surprise is an internal state caused by a schema discrepancy. The intensity of surprise is determined monotonically by the degree of unexpectedness (the subjective improbability of the event)."
      translation: "놀라움은 스키마 불일치에 의해 유발되는 내적 상태이다. 놀라움의 강도는 기대되지 않은 정도(사건의 주관적 불가능성)에 의해 단조 증가한다."
      citation_location: "pp. 1-6"

story_application:
  application_idea: "서프라이즈를 극대화하려면 사건 자체를 화려하게 만들기보다, 관객의 마음에 '이 사건이 일어날 확률은 0%에 가깝다'는 합리적 확신(사전 확률 셋업)을 먼저 심어놓아야 함. 사전 기대가 없으면 어떤 충격적 사건도 서프라이즈가 아닌 무감각한 혼란으로 끝남."
  narrative_stage: "Act 2 Midpoint Turning Point & Climax Twist"
  emotional_mechanics:
    trigger: "주관적 확률 0%에 가까운 사건의 돌출"
    build_up: "인지 처리의 전면 중단(Interruption) 및 동공 확장"
    peak: "기존 스키마의 붕괴와 충격"
    release: "새로운 맥락을 통한 스키마 업데이트 및 지적 전율"
  failure_modes: "사전 확률 셋업 없이 맥락 없는 반전을 던져 관객에게 당혹감과 배신감만 안겨주는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "반전 영화, 미스터리 수사물, 팩트체크 콘텐츠의 서프라이즈 설계에 적용"
