url: https://www.nebraskapress.unl.edu/nebraska/9780803273443/
key_contribution: 인지서사학(Cognitive Narratology)에서 서사성(Narrativity)과 사건성(Eventhood)의 관계를 규명. 단순 정보나 해답(Answer)의 제시는 상태의 기술(State Description)에 머물며, 이야기 세계의 시간적·인과적 질서와 존재론적 조건이 비가역적으로 뒤흔들리는 파급 효과(Consequence as World-disruption)가 수반되어야만 진정한 사건성과 스토리 몰입이 생성됨을 실증.
relevance: Answer-only 챕터가 왜 지루한 설명문이나 보고서로 전락하는지, Consequence가 어떻게 새로운 이해관계(New Stakes)와 인과적 연속성을 형성하는지 밝히는 결정적 이론.
themes:
