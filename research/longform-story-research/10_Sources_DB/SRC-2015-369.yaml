id: SRC-2015-369
author: Frenk van Harreveld, Florian U. Nohlen, & Iris K. Schneider
year: 2015
title: 'The ABC of ambivalence: Affective, behavioral, and cognitive consequences of attitudinal ambivalence'
venue: Advances in Experimental Social Psychology
tier: 1
citation_count: 420
url: https://doi.org/10.1016/bs.aesp.2015.01.002
key_contribution: 양가감정의 정서(Affect)·행동(Behavior)·인지(Cognition) 3차원 영향 통합. 양가감정이 정보 탐색을 확장하고 깊은 숙고를 촉발하는 긍정적 기전을 제공하지만, 모순이 해결 불가능하거나 인지 부하가 한계를 초과하면 회피(Avoidance), 반추(Rumination), 정서적 탈진 및 인지적 이탈(Disengagement)로 급격히 추락함을 실증.
relevance: 서사에서 양가감정을 과도하게 끌거나 해결책 없이 관객을 방치할 때 발생하는 몰입 붕괴 및 시청 이탈을 방어하는 결정 교착 방어 프레임워크(DDF)의 학술적 근거.
