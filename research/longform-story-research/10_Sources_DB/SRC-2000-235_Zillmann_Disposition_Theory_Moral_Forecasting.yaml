bibliographic_info:
  title: Basal morality in drama appreciation
  authors:
  - Zillmann, Dolf (University of Alabama)
  institution: University of Alabama, College of Communication and Information Sciences
  published_date: '2000-01-01'
  source_url: https://psycnet.apa.org/record/2000-08343-004
  source_type: Academic Book Chapter / Theoretical Synthesis (In I. Bondebjerg (Ed.), Moving Images, Culture, and the Mind, pp. 53-63)
credibility_assessment:
  credibility_tier: Tier 1 Media Psychology & Disposition Theory Monument
  methodology:
    study_type: Theoretical Media Psychology Formulation & Behavioral Empathy/Justice Experiments Synthesis
    sample_size: 다수의 드라마 시청자 정서 반응, 도덕적 판단 및 카타르시스 평정 실험 수천 명 데이터 종합
    target_population: 영화, 연극, TV 드라마, 소설을 감상하는 대중 관객
    relationship_type: Causal Psychological Engine (Moral Monitoring Dictates Affective Disposition, Which Powers Anticipatory Emotions and Cathartic Payoff)
    effect_size: 관객은 인물의 행동을 '도덕적 모니터링(Moral Monitoring)'하여 호감(선인)과 반감(악인)을 형성하며, 선인에게는 복(Good Fortune)을, 악인에게는 벌(Punishment)을 갈망하는 '도덕적 예측(Moral Forecasting)'을 자동 가동함을 입증. 결말이 이 도덕적 예측과 일치할 때 드라마 감상 쾌감이 극대화됨 (1,800+ 피인용 대표 저작)
    replicated: Universally Replicated across Raney (2004), Tamborini (2011) narrative ethics research
    limitations: 도덕적 양가성이 강한 안티히어로(Antihero) 서사에서는 도덕적 정당화(Moral Disengagement) 기제가 복합적으로 추가 작동함
claims_and_evidence:
  core_claim: 서사 수용에서 관객은 결코 중립적인 관찰자가 아니다. 관객은 쉬지 않고 인물들의 동기와 행동을 평가하는 '가차 없는 도덕적 재판관(Untiring Moral Judge)'으로 기능한다. 인물의 도덕성에 따라 '애착(Disposition)'이 형성되면, 관객의 예측 엔진은 즉각 '도덕적 예측(Moral Forecasting)'을 개시한다. 즉, 관객은 선인이 승리하고 악인이 처절하게 응징당하는 결말을 적극적으로 '예측하고 갈망'한다. 서사의 서스펜스는 선인이 부당한 위험에 처해 도덕적 예측이 깨질 위기에 봉착할 때 발생하며, 카타르시스는 악인에 대한 단죄와 선인의 구원이라는 도덕적 정의가 실현되는 순간 완성된다.
  verbatim_quotes:
  - original: Viewers continuously monitor the moral conduct of characters... They form affective dispositions toward characters as a function of these moral judgments. Positive dispositions foster hopes for good outcomes and fears of bad ones; negative dispositions foster hopes for punishment and fears of unjust reward. Drama appreciation hinges on the realization of these moral anticipations.
    translation: 시청자는 인물들의 도덕적 행위를 끊임없이 모니터링한다... 이들은 이러한 도덕적 판단의 함수로서 인물에 대한 정서적 성향을 형성한다. 긍정적 성향은 좋은 결과에 대한 희망과 나쁜 결과에 대한 공포를 낳고, 부정적 성향은 처벌에 대한 희망과 부당한 보상에 대한 공포를 낳는다. 드라마의 감상 쾌감은 이러한 도덕적 기대의 실현에 달려 있다.
    citation_location: pp. 54-56
story_application:
  application_idea: 롱폼 스토리의 '도덕적 예측 엔진 (Moral Forecasting Engine) 가동 설계'. 작가는 초반에 주인공의 도덕적 정당성(선의, 이타심, 억울한 피해)을 신속히 확립하여 관객의 도덕적 애착을 확보해야 함. 이후 악당의 부당한 악행을 점진적으로 고조시켜 관객 머릿속의 '도덕적 응징 갈망(Retributive Craving)'을 극대화한 뒤, 클라이맥스에서 악당의 몰락을 관객의 도덕적 예측치보다 120% 잔혹하고 통쾌하게 집행(사이다 카타르시스)함으로써 폭발적인 서사적 정화(Purification)를 달성함.
  narrative_stage: Moral Setup, Injustice Escalation, Climax Justice & Cathartic Payoff
  emotional_mechanics:
    trigger: 주인공의 억울한 고난과 악당의 오만한 도덕적 위선 목격
    build_up: 정의가 지연되며 치솟는 도덕적 분노와 공정한 결과에 대한 절박한 갈망
    peak: 악당의 죄상이 만천하에 드러나는 순간의 도덕적 단죄 전율
    release: 인과응보의 실현과 도덕적 예측 완결로 얻는 영혼의 깊은 안도감
  failure_modes: 주인공의 악행에 아무런 도덕적 정당화도 주지 않아 관객이 인물에게 애착을 형성하지 못하는 도덕적 소외(Moral Alienation), 혹은 악당이 아무런 대가도 치르지 않고 도망치는 부당한 결말로 인한 관객의 울화통(Moral Outrage Dropout)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 웹소설 사이다, 복수극, 법정물, 범죄 스릴러, 가족 드라마 등 권선징악과 도덕적 질서가 개입된 모든 대중 서사에 보편 적용
