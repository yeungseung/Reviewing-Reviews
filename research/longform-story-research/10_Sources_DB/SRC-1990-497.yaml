key_contribution: "에로테틱 서사 이론(Erotetic Narrative Theory) 정립. 대중 서사는 본질적으로 '질문을 제기하고(Posing questions), 답변을 정교하게 지연시키며(Delaying answers), 마침내 명쾌하게 답변을 전달하는(Delivering answers)' 인지적 문답 구조로 작동함을 규명."
