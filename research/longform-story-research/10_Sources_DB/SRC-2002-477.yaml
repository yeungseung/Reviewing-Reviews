id: SRC-2002-477
author: C. R. Snyder
year: 2002
title: 'Hope Theory: Rainbows in the Mind'
venue: Psychological Inquiry, 13(4), 249-275
tier: 1
citation_count: 5740
url: https://doi.org/10.1207/S15327965PLI1304_01
key_contribution: '희망 이론(Hope Theory) 정립. 희망은 단순한 소망이 아니라 주도성 사고(Agency thinking, 의지와 결단)와 경로 사고(Pathways thinking, 실행 전략)가 결합된 인지적 동기 상태임을 규명. 특히 목표가 장애물에 의해 반복적으로 가로막히는 막힘(Blocked Goals)과 심각한 좌절 상황에서 주체가 포기하지 않고 대체 경로를 발견해 돌파할 때 희망의 정서적 고양감과 감동이 극대화됨을 실증.'
relevance: 절망적 장애물과 막힘(Blocked Goals)의 축적이 선행될 때 비로소 진정한 희망의 빛과 감동적 피크가 탄생함을 입증하는 심리학적 근거.
themes:
  - '#50 Theme 1'
