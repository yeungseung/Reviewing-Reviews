claims_and_evidence:
  core_claim: "감정은 환경 자극이나 사건 그 자체에서 직접 발생하는 것이 아니라, 개인의 목표 및 안녕과 사건의 관계를 해석하는 '인지적 평가(Cognitive Appraisal: 1차 평가=목표 관련성/일치성, 2차 평가=책임 귀인/대처 잠재력/미래 기대)'를 통해 결정된다. 각 이산 감정(Discrete Emotion)은 특정한 '핵심 관계 테마(Core Relational Theme)'와 1:1로 매핑된다 (예: 분노 = '나나 내 사람들에 대한 모욕적 침해', 슬픔 = '돌이킬 수 없는 영구적 상실', 불안 = '불확실하고 실존적인 위협 직면')."
  verbatim_quotes:
    - original: "Each emotion is defined by a unique core relational theme, which summarizes the personal harm or benefit residing in an encounter... Emotions are not provoked by external events alone, but by our cognitive appraisals of what those events mean for our well-being."
      translation: "각각의 감정은 고유한 핵심 관계 테마로 정의되며, 이는 만남 속에 내재된 개인적 피해나 이익을 요약한다... 감정은 외부 사건 자체로 촉발되는 것이 아니라, 그 사건이 우리의 안녕에 무엇을 의미하는지에 대한 인지적 평가에 의해 유발된다."
      citation_location: "pp. 121-125"

story_application:
  application_idea: "창작자가 관객에게 특정 감정(분노, 슬픔, 불안, 카타르시스)을 느끼게 하고 싶다면, 감정을 직접 묘사할 필요 없이 그 감정의 '인지적 평가 변수(목표 중요도, 침해의 의도성, 대처 가능성, 비가역성)'를 상황 속에 정밀하게 세팅하기만 하면 관객의 뇌는 라자루스의 공식에 따라 100% 해당 감정을 자발적으로 생성함."
  narrative_stage: "Scene-level Situation Architecture & Emotional Engineering"
  emotional_mechanics:
    trigger: "상황 속 핵심 관계 테마(Core Relational Theme)의 물리적 정황 제시"
    build_up: "1차 평가(목표 위협 인지) 및 2차 평가(책임 소재 및 대처 불능 확인)"
    peak: "인지적 평가가 특정 감정으로 결정화되는 순간"
    release: "행동(Action Tendency: 공격, 회피, 체념)을 통한 감정의 표출"
  failure_modes: "평가 변수를 불완전하게 제시하여 관객이 분노해야 할 장면에 슬퍼하거나 무덤덤해지는 정서적 불발"

