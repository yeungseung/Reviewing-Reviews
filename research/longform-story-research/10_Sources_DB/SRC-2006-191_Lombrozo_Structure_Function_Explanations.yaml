claims_and_evidence:
  core_claim: '인간의 인지 체계는 사건의 단순 기술(Description: 무엇이 일어났는가)과 인과 설명(Explanation: 왜
    일어났는가)을 근본적으로 다르게 처리한다. 설명 정보(EXPLAIN)는 배후의 인과 메커니즘(Underlying Causal Mechanism)을
    밝혀줌으로써 지각적 일관성을 부여하고, 미래 사건에 대한 예측 능력을 부여하며, 강력한 인지적 만족감(Epistemic Satisfaction)을
    제공한다. 단순 사실 나열은 기억에서 급속히 탈락하지만, 인과 메커니즘을 설명하는 정보는 장기 기억 구조에 견고하게 통합된다.'
  verbatim_quotes:
  - original: Explanations do not merely describe phenomena; they integrate observations
      into underlying causal frameworks, highlighting unobserved mechanisms and constraining
      future predictions.
    translation: 설명은 현상을 단순히 기술하는 것에 그치지 않는다. 설명은 관찰을 배후의 인과 프레임워크로 통합하고, 관찰되지 않은
      메커니즘을 부각하며, 미래의 예측을 제약한다.
    citation_location: Trends in Cognitive Sciences, Vol. 10, No. 10, pp. 464-470
story_application:
  application_idea: 롱폼 서사의 EXPLAIN(인과 설명) 기능 엔진. 독자가 사건의 경과를 보며 "왜 저 인물은 저런 극단적 선택을
    했는가?" 혹은 "왜 이 시스템은 붕괴했는가?"라는 인지적 의문을 품을 때, 사건의 배후 기제(인센티브 구조, 심리적 트라우마, 구조적 결함)를
    정확히 드러내는 정보의 배치. 단순 팩트가 아니라 사건을 관통하는 메커니즘을 드러내는 정보만이 EXPLAIN의 역할을 완수함.
  narrative_stage: Midpoint Deep Dive, Character Motivation Reveal & Structural Analysis
  emotional_mechanics:
    trigger: 사건 발생 후 남겨진 불완전한 멘탈 모델 및 인지적 갈증
    build_up: 표면적 현상 이면의 인과 메커니즘과 숨은 변수 폭로
    peak: 아하 모멘트(Aha-Moment)와 심층 이해의 완결
    release: 서사 세계에 대한 완전한 인과적 장악감
  failure_modes: 결과만 통보하고 왜 그런 일이 벌어졌는지 설명 메커니즘을 생략하여 독자를 납득시키지 못하는 피상적 서술의 결함
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 설명이 과도하게 이론화되면 서사적 추진력을 갉아먹으므로 행동 및 구체적 사건과 결합되어야 함
