claims_and_evidence:
  core_claim: "인간은 생생하고 구체적인 단일 사례(Anecdote)에 노출될 때, 그 사례가 전체 모집단을 대표하지 않는 지극히 예외적인 편향 표본(Atypical/Biased Sample)이라는 명시적인 통계적 경고를 사전에 제공받더라도, 단일 사례의 특성을 전체 집단으로 무차별 일반화한다. 수용자는 표본의 편향성에 대해 완전히 둔감(Insensitive)하며, 구체적 디테일의 생생함이 통계적 가드레일을 완전히 무력화한다."
  verbatim_quotes:
    - original: "Subjects who read a vivid description of an atypical case generalized their impressions to the population as a whole. Strikingly, telling subjects that the target was atypical did not reduce generalization... People are remarkably insensitive to sample bias when presented with vivid, concrete case data."
      translation: "비전형적인 사례에 대한 생생한 묘사를 읽은 피험자들은 자신들의 인상을 모집단 전체로 일반화했다. 놀랍게도, 피험자들에게 그 대상이 비전형적(극단적 예외)이라고 말해주었음에도 일반화는 줄어들지 않았다... 사람들은 생생하고 구체적인 사례 데이터가 주어질 때 표본 편향에 대해 현저할 정도로 둔감하다."
      citation_location: "pp. 578, 584"

story_application:
  application_idea: "서사에서 자극적이거나 극단적인 단 한 명의 인물 디테일을 연출할 때, '이 사람은 특이한 예외일 뿐입니다'라는 자막이나 나레이션 한 줄로는 관객의 일반화 오류(예: 특정 집단, 직업군, 질병에 대한 낙인)를 막을 수 없음. 창작자는 단일 사례의 생생함이 필연적으로 전체에 대한 편견을 낳는다는 점을 인식하고, 서사 내부에서 구조적 대조군(Typical Cases)을 함께 배치해야 함."
  narrative_stage: "Character Design, Ethical Framing & Documentary Nonfiction"
  emotional_mechanics:
    trigger: "극단적이고 생생한 단일 인물의 구체적 기행/비극 목격"
    build_up: "표본 편향 불감증에 의한 즉각적인 집단 전체로의 특성 전이"
    peak: "해당 집단 전체에 대한 강한 고정관념이나 혐오/동정심 형성"
    release: "단순 경고문구가 아닌, 다층적 대조군 제시를 통한 인지적 균형 회복"
  failure_modes: "극단적 악당이나 기행을 일삼는 1인을 흥미 위주로 생생하게 묘사하여 해당 소수자 집단 전체를 악마화하거나 왜곡하는 '일화적 일반화의 죄악'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
