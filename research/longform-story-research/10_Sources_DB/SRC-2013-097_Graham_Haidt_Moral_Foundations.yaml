claims_and_evidence:
  core_claim: "도덕 기반 이론(Moral Foundations Theory)의 6대 모듈과 다원적 가치 충돌: 인간의 도덕적 직관은 단일한 공리주의나 의무론으로 환원되지 않으며, 진화적으로 형성된 6대 독립적 도덕 모듈 [배려/피해(Care/Harm), 공정성/부정행위(Fairness/Cheating), 충성심/배신(Loyalty/Betrayal), 권위/전복(Authority/Subversion), 고결함/타락(Sanctity/Degradation), 자유/억압(Liberty/Oppression)]에 의해 추진된다. 서사에서 가장 첨예한 감정적 충돌(Mixed Stakes)은 이 6대 도덕 모듈 간의 충돌에서 발생한다. 예를 들어 '내 가족/동료를 향한 충성(Loyalty)'과 '사회 전체를 향한 공정성과 정의(Fairness)', 혹은 '질서와 안정을 위한 권위(Authority)'와 '개인의 존엄을 위한 자유(Liberty)'가 정면 대립할 때, 관객은 뇌의 도덕적 신경망 전반이 동시 활성화되며 심오한 윤리적 서스펜스를 겪게 된다."
  verbatim_quotes:
    - original: "Moral Foundations Theory proposes that human morality is composed of at least six intuitive modules... Pluralistic moral conflicts occur when different moral foundations demand contradictory courses of action, producing acute cognitive friction and deep emotional ambivalence."
      translation: "도덕 기반 이론은 인간의 도덕성이 최소 6개의 직관적 모듈로 구성되어 있다고 제안한다... 다원적 도덕 갈등은 서로 다른 도덕 기반들이 모순되는 행동 경로를 요구할 때 발생하며, 이는 극심한 인지적 마찰과 깊은 정서적 양가감정을 낳는다."
      citation_location: "pp. 55-62, 105-112"

story_application:
  application_idea: "도덕 기반 충돌 엔진(Moral Foundations Collision Engine): 복합 스테이크(Mixed Stakes)를 설계할 때 악당과의 대립뿐 아니라 주인공 내부 혹은 아군 집단 내부에서 서로 다른 도덕 기반(예: 부모를 구하기 위해 법을 위반해야 하는 '배려 vs 공정성', 국가 안보를 위해 개인의 자유를 침해해야 하는 '권위 vs 자유')을 충돌시킴으로써, 단순 흑백논리를 초월하는 고품격 드라마를 완성함."
  narrative_stage: "Act 2 Dilemma Escalation, Act 3 Climax Choice"
  emotional_mechanics:
    trigger: "두 가지 정당한 도덕적 의무가 상충하는 불가피한 상황 직면"
    build_up: "어느 한쪽을 지키려 할 때마다 반대쪽 도덕 모듈의 강력한 죄책감과 양심의 가책이 뇌를 압박"
    peak: "자신의 도덕적 우선순위를 결정하고 그에 따른 사회적·내적 처벌을 감수하는 결단의 순간"
    release: "완벽한 정답은 없으나 자신의 신념에 충실했던 인물의 고결함에 대한 관객의 존경과 카타르시스"
  failure_modes: "모든 갈등을 유치한 '착한 놈 vs 나쁜 놈'의 이분법으로 단순화하여 관객의 지적·도덕적 판단 욕구를 무시하는 평면적 연출"

