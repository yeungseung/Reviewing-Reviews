claims_and_evidence:
  core_claim: "서사의 시간적 재배치는 인간의 마인드에서 세 가지 근본적인 인지적 정서(Narrative Universals)를 생성한다: (1) 호기심(Curiosity: 과거에 대한 무지에서 비롯된 탐구), (2) 서스펜스(Suspense: 미래의 불확실성에 대한 긴장), (3) 놀람(Surprise: 현재의 기대 위반). 사건의 한가운데서 시작하는 '인 메디아스 레스(In Medias Res)' 오프닝은 지루한 설명적 배경(Exposition)을 우회하고, 수용자에게 '어쩌다 이 끔찍한 갈등에 도달했는가?'라는 강력한 '과거 지향적 호기심(Curiosity)'을 강제 점화하여 뒤이어 등장하는 과거 설명(Exposition)을 스스로 간절히 원하게 만든다."
  verbatim_quotes:
    - original: "Curiosity is produced by a lack of information about the past; suspense is produced by an uncertainty about the future; surprise is produced by a twisting of the present... In medias res plunges the reader into a climax of conflict, generating intense curiosity about the preceding events and transforming what would be dull exposition into desperately sought answers."
      translation: "호기심은 과거에 대한 정보의 결핍에 의해 생성되고, 서스펜스는 미래에 대한 불확실성에 의해 생성되며, 놀람은 현재의 비틀림에 의해 생성된다... 인 메디아스 레스(In medias res)는 독자를 갈등의 절정 속으로 밀어 넣어 선행 사건들에 대한 강렬한 호기심을 유발하며, 자칫 지루할 수 있는 배경 설명을 간절히 갈구하는 해답으로 변모시킨다."
      citation_location: "Chapter 2: The Dynamics of Narrative Interest, pp. 45-52"

story_application:
  application_idea: "지루한 세계관 설명이나 인물의 평화로운 일상으로 시작할 때 발생하는 '도입부 이탈(Drop-off)'을 방지하는 최강의 도구가 갈등 오프닝임. 이야기의 2막 중간이나 3막 클라이맥스의 절체절명 대결 씬(In Medias Res)을 0초에 던져놓고 '3일 전'으로 돌아가는 구조는, 관객이 앞으로 펼쳐질 지루할 수 있는 서사 빌드업을 '저 파멸적 결말에 도달하기 위한 필수 단서'로 적극 탐색하게 만듦."
  narrative_stage: "Opening Framing, In Medias Res Structure & Exposition Pacing"
  emotional_mechanics:
    trigger: "사건의 극단적 충돌 한가운데로 무단 침입 (In Medias Res)"
    build_up: "과거 인과에 대한 극심한 호기심(Curiosity) 점화"
    peak: "주인공의 파멸 직전 순간에서 정지 또는 화면 암전 (The Freeze-frame / Time Jump)"
    release: "시간을 거슬러 올라가 평온한 일상에서부터 파멸의 징조를 추적하는 긴장감 넘치는 관찰 모드 돌입"
  failure_modes: "갈등 오프닝 이후 과거로 돌아갔을 때 과거 이야기의 긴장감이 너무 떨어져 관객이 속았다고 느끼는 '미끼와 전환(Bait-and-Switch) 피로'"

