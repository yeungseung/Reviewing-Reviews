claims_and_evidence:
  core_claim: "인간이 위협(Threat)이나 갈등에 노출될 때 인지 처리는 '위험 통제(Danger Control)'와 '공포 통제(Fear Control)'라는 두 가지 상반된 경로로 분기한다. 위협의 심각성이 높더라도 이를 해결할 수 있는 효능감(Efficacy)이나 희망, 인과적 이해 가능성이 존재하면 관객은 '위험 통제' 경로로 진입하여 주의 집중과 정보 탐색(Information Seeking)을 극대화한다. 그러나 위협과 갈등이 과도하여 해결 불가능하거나 혐오스럽다고 지각되면 '공포 통제' 경로로 전환되어 방어적 회피(Defensive Avoidance, 채널 돌리기, 시청 중단)가 발생한다."
  verbatim_quotes:
    - original: "When perceived threat is high and perceived efficacy is high, danger control processes are elicited, leading to message acceptance and proactive information processing... When perceived threat is high but perceived efficacy is low, fear control processes dominate, resulting in defensive avoidance, reactance, and message rejection."
      translation: "지각된 위협이 높고 지각된 효능감이 높을 때 위험 통제 과정이 유발되어 메시지 수용과 적극적인 정보 처리가 일어난다... 지각된 위협은 높지만 지각된 효능감이 낮을 때 공포 통제 과정이 지배하여 방어적 회피, 심리적 저항, 메시지 거부(시청 중단)로 이어진다."
      citation_location: "pp. 329, 337-338"

story_application:
  application_idea: "갈등 오프닝(Conflict Opening)에서 첫 장면부터 극단적인 폭력, 피비린내 나는 참상, 불쾌한 언어 폭력을 무자비하게 퍼붓는 것은 관객을 '방어적 회피(이탈)'로 몰아넣는 자살골임. 갈등의 위협 강도를 높이되, 주인공의 필사적인 저항, 탈출 가능성, 또는 명확한 대립 축(Efficacy Cue)을 함께 보여주어야만 관객의 뇌가 '정보 탐색(몰입)' 모드로 락인(Lock-in)됨."
  narrative_stage: "Opening Scene Design & Threat-Efficacy Balance"
  emotional_mechanics:
    trigger: "첫 3초 내 급박한 위협 및 갈등 상황 돌입"
    build_up: "위협의 심각성 인식과 동시에 대처 가능성(탈출로, 반격) 포착"
    peak: "위험 통제 모드 활성화를 통한 폭발적인 정보 탐색 및 시청 지속"
    release: "오프닝 갈등의 일차적 모면 또는 거대한 미스터리로의 전환"
  failure_modes: "해결 희망이나 맥락 없는 잔혹한 갈등만 나열하여 관객이 불쾌감과 피로를 느껴 이탈하는 '공포 통제 회피' 유발"

