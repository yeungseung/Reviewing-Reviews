claims_and_evidence:
  core_claim: "전달자의 객관적 전문성과 증거 신뢰도(Source Credibility)가 높을 때 수용자의 인지적 방어 기제가 해제되고 즉각적인 태도 변화가 발생하며, 감정적 호소보다 논리적 데이터가 선행할 때 신뢰가 유지된다."
  verbatim_quotes:
    - original: "Messages attributed to sources of high credibility produced significantly greater immediate change in opinion than did identical communications attributed to low-credibility sources."
      translation: "높은 신뢰성을 지닌 출처의 메시지는 동일한 내용이라도 낮은 신뢰성의 출처보다 유의미하게 더 큰 즉각적인 의견 변화를 만들어냈다."
      citation_location: "p.635, Abstract"

story_application:
  application_idea: "시사, 탐사보도, 과학 및 금융 등 지식 기반 롱폼 서사에서는 감정적 호소에 앞서 신뢰할 수 있는 데이터와 인과적 증거(Evidence-first)를 먼저 배치하여 관객의 신뢰를 확보한 후 정서적 몰입으로 진입함."
  narrative_stage: "Act 1 Setup & Source Verification"
  emotional_mechanics:
    trigger: "신뢰할 수 있는 데이터와 팩트의 제시"
    build_up: "창작자의 전문성에 대한 무의식적 신뢰 형성"
    peak: "팩트가 지닌 충격적 함의의 발견"
    release: "의혹 해소 및 메시지의 온전한 수용"
  failure_modes: "객관적 증거 없이 감정만 앞세우면 관객은 이를 '선동' 또는 '가짜 뉴스'로 인식하여 거부함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "수용자의 비판적 사고 능력이 작동하는 전문 지식 영역에서 결정적"
