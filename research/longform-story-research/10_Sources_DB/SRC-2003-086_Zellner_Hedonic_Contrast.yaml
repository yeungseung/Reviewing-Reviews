claims_and_evidence:
  core_claim: "쾌락 및 정서 대비 효과(Hedonic Contrast Effect): 인간의 정서적 경험과 만족도 평가는 자극의 절대적 강도가 아니라 '직전 기준선과의 대비(Contrast)'에 의해 결정된다. 저강도/부정적 상태(Valley)를 경험한 직후에 제시되는 긍정적 자극(Peak)은 기저선과의 낙차(Delta)로 인해 그 가치와 강도가 극적으로 증폭(Contrast Magnification)된다. 반면 유사한 고강도 자극이 연속되면 동화(Assimilation)되어 무감각해진다."
  verbatim_quotes:
    - original: "Hedonic contrast occurs when the value of an outcome is shifted away from the value of a preceding context... exposure to a less pleasant context significantly enhances the perceived pleasantness of a subsequent positive experience."
      translation: "쾌락 대비는 결과의 가치가 선행 맥락의 가치로부터 멀어지는 방향으로 이동할 때 발생한다... 덜 쾌적한 맥락에 노출되는 것은 후속 긍정 경험의 지각된 쾌락성을 유의미하게 증대시킨다."
      citation_location: "pp. 646-650"

story_application:
  application_idea: "피크의 낙차 공학: 클라이맥스나 카타르시스의 감동을 2배로 증폭시키려면, 사건 자체의 스케일을 키우려 하지 말고 직전 시퀀스에서 '가장 깊은 절망과 고요한 결핍(Valley)'을 파내야 함. 바닥이 깊을수록 솟아오르는 피크의 체감 고도는 기하급수적으로 높아짐."
  narrative_stage: "All Hope is Lost (Dark Night of the Soul) -> Climax Peak"
  emotional_mechanics:
    trigger: "직전 저점(Valley)의 결핍과 절망 상태 형성"
    build_up: "낮아진 기준선(Baseline Shift)"
    peak: "극적인 반전과 구원 피크 투입"
    release: "거대한 대비 낙차(Delta)에 의한 폭발적 희열과 카타르시스"
  failure_modes: "저점 없이 어중간한 상태에서 피크를 터뜨려 미지근한 반응을 얻거나, 저점만 계속되어 관객을 침체에 빠뜨리는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "드라마, 스릴러, 로맨스, 스포츠 등 감정의 고저가 핵심인 모든 서사"
