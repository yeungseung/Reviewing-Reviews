claims_and_evidence:
  core_claim: "탐사형 서사(Investigative Narrative: 탐정, 의학, 과학적 발견, 기업 범죄 수사)는 거대한 진실을 한 번에 파악할 수 없기 때문에, 사소하고 간과하기 쉬운 '미세한 징표(Clues, Traces, Symptoms)'를 해독하는 '증거 패러다임(Evidential Paradigm)'으로 작동한다. 하나의 단서를 해독한 결과(Answer)는 결코 사건의 종결이 아니라, 다음 배후 인물이나 더 깊은 은폐 조작을 가리키는 '새로운 징표(New Clue/Question)'로 필연적으로 전환된다. 이 증거 연쇄(Chain of Clues)가 탐사 서사의 무한한 지적 추진력을 제공한다."
  verbatim_quotes:
    - original: "The evidential paradigm is based on deciphering minute, marginal signs... A clue resolved does not close the inquiry; it reveals an unsuspected trace leading to a deeper level of hidden reality."
      translation: "증거 패러다임은 미세하고 주변적인 징표들을 해독하는 것에 기반한다... 해결된 단서는 조사를 끝내는 것이 아니라, 숨겨진 현실의 더 깊은 차원으로 이어지는 예상치 못한 흔적을 드러낸다."
      citation_location: "Johns Hopkins University Press, p. 96-104"

story_application:
  application_idea: "탐사 다큐멘터리, 탐정 추리물, 기업 몰락 스토리를 위한 '증거 패러다임 3단계 연쇄 공식'. 1) 미세한 흔적 발견(회계 장부의 1센트 오차) ➔ 2) 국소적 해독(유령 회사로의 송금 확인 / Answer) ➔ 3) 거대 질문 점화('이 회사의 진짜 소유주는 왜 현직 장관인가?' / New Question)의 연쇄를 촘촘히 엮어 관객을 탐정의 시선으로 끌어들임."
  narrative_stage: "Investigative Plot Structuring & Clue Chaining"
  emotional_mechanics:
    trigger: "일상의 균열을 알리는 사소한 징표(Clue)의 포착"
    build_up: "징표를 분석하여 감춰진 사실(Answer)을 도출하는 지적 쾌감"
    peak: "도출된 사실이 더 거대한 은폐 구조의 빙산의 일각임을 깨닫는 전율"
    release: "다음 배후를 추적하겠다는 확고한 서사적 동기 획득"
  failure_modes: "단서가 하늘에서 뚝 떨어지거나 우연에 의해 해결되는 '데우스 엑스 마키나식 단서 남발'"

