claims_and_evidence:
  core_claim: "정서의 법칙(The Laws of Emotion): 감정은 법칙에 의해 지배된다. ① '상황적 의미의 법칙(Law of Situational Meaning)'에 따라 감정은 사건의 의미가 인지적으로 규정될 때 발생하며, ② '관심사의 법칙(Law of Concern)'에 따라 인물의 핵심 가치/목표와 결부될 때만 촉발된다. ③ 특히 '변화의 법칙(Law of Change)'과 '습관화의 법칙(Law of Habituation)'에 따르면 감정은 일정한 자극 수준이 아니라 '기존 상태와의 대비 및 변화'에 반응하며, 동일한 자극이 지속되면 감정은 급속히 마비된다. 따라서 감정의 지속과 증폭을 위해서는 점진적인 조건의 에스컬레이션(Build-up)과 극적인 상태 전이(Peak-Release)가 필수적이다."
  verbatim_quotes:
    - original: "Emotions arise in response to the meaning structures of given situations; different emotions arise in response to different meaning structures... Continued pleasures wear off; continued hardships lose their poignancy... Emotions are elicited not by conditions themselves, but by changes in conditions."
      translation: "감정은 주어진 상황의 의미 구조에 반응하여 발생한다. 서로 다른 감정은 서로 다른 의미 구조에 반응하여 발생한다... 지속되는 쾌락은 무뎌지고, 지속되는 고난은 날카로움을 잃는다... 감정은 조건 그 자체가 아니라 조건의 '변화'에 의해 촉발된다."
      citation_location: "pp. 349-354"

story_application:
  application_idea: "습관화의 법칙에 따라 관객은 동일한 수위의 위협이나 고통에 빠르게 둔감해짐. 따라서 서사는 고통의 강도를 단순히 높이는 것이 아니라, 인물의 관심사(Law of Concern)를 인질로 잡고 상황의 의미 구조(Law of Situational Meaning)를 계속 변화시켜야 함. 빌드업 단계에서 조건의 변화율(Rate of Change)을 점진적으로 가속해야 피크에서 최대 정서 반응을 끌어낼 수 있음."
  narrative_stage: "Entire Narrative Arc (Build-up Escalation & Contrast Dynamics)"
  emotional_mechanics:
    trigger: "관심사의 침해 및 상태 변화의 감지"
    build_up: "습관화를 방지하는 단계적 조건 악화 및 의미 구조의 심화"
    peak: "극단적 변화가 발생하는 불연속점(Discontinuity Point)"
    release: "새로운 균형 상태로의 전이 및 인지적 수용"
  failure_modes: "변화 없는 동일 수위의 갈등을 반복하여 관객을 습관화(지루함)시키는 플랫라인 실패"

