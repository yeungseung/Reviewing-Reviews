claims_and_evidence:
  core_claim: "서사는 비전문가 대중의 이해와 몰입을 높이는 강력한 도구이지만, 과학/비인물형 콘텐츠에 의인화(Anthropomorphism)나 목적론적 목표 구조(Teleological Framing)를 억지로 적용하면 사실을 왜곡하고 과학적 본질을 훼손하는 심각한 한계를 낳는다."
  verbatim_quotes:
    - original: "Narratives offer increased comprehension, interest, and engagement. However, narratives also present ethical challenges and potential misrepresentations when forced onto non-agentic, probabilistic scientific phenomena."
      translation: "서사는 향상된 이해, 흥미, 몰입을 제공한다. 그러나 서사를 행위 주체성이 없는 확률론적 과학 현상에 강제로 투사할 때 윤리적 도전과 심각한 사실 왜곡을 야기한다."
      citation_location: "pp.13614-13615"

story_application:
  application_idea: "비인물형(과학, 기술, 시스템, 자연 다큐) 롱폼에서는 무리한 의인화(바이러스의 '의도', 전자의 '선택') 대신, '질문(Question)과 정보 공백', '변화의 메커니즘', '시스템 역학'을 중심으로 긴장 구조를 설계해야 함."
  narrative_stage: "Science, Tech, & Knowledge-based Narrative Architecture"
  emotional_mechanics:
    trigger: "설명되지 않는 자연/기술 현상의 모순과 질문 제시"
    build_up: "기존 가설의 붕괴 및 새로운 메커니즘의 탐색"
    peak: "숨겨진 법칙과 시스템 구조의 명쾌한 규명"
    release: "지적 경이감(Awe)과 세상에 대한 이해 확장"
  failure_modes: "자연 현상에 인간의 욕망과 도덕적 서사를 억지로 덮어씌우면 지적 수용자의 신뢰를 잃고 과학적 오류를 양산함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "과학, 기술, 수학, 철학 등 인간 주체성이 결여된 비인물형 지식 서사에 적용"
