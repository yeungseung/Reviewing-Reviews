claims_and_evidence:
  core_claim: "구조 사상 이론(Structure-Mapping Theory)과 비유를 통한 거대 스케일의 인지적 정복: 인간의 뇌는 완전히 낯설고 거대한 추상적 시스템(타겟 영역: 예: 양자역학, 서브프라임 모기지, 우주적 팽창)을 단독으로는 이해하지 못한다. 뇌가 거대 시스템을 이해하는 유일한 길은, 이미 잘 알고 있는 친숙한 일상적 도메인(베이스 영역: 예: 수도관의 물 흐름, 썩은 생선 폭탄 돌리기, 풍선 표면의 점들)의 '관계 구조(System of Relations)'를 타겟으로 1:1 투사(Mapping)하는 것이다. 이 과정에서 피상적인 속성(Color, Size)은 버려지고 핵심적인 인과 관계(Causal Structure)만 보존되어 전이된다. 롱폼 서사에서 복잡한 금융 음모나 과학적 위기를 설명할 때 일상적 사물과 인간적 행위로 비유(Analogy)를 드는 순간, 관객의 뇌에서는 전전두엽의 인지 과부하가 급격히 해소되며 '아하!(Aha!)' 모먼트와 깊은 직관적 이해가 완성된다."
  verbatim_quotes:
    - original: "Analogy is a mapping of knowledge from one domain (the base) into another (the target) which conveys that a system of relations that holds among the base objects also holds among the target objects... The central idea is that an analogy conveys an overlap in relations among objects, but not in the attributes of objects."
      translation: "유추(Analogy)란 한 영역(베이스)의 지식을 다른 영역(타겟)으로 사상하는 것으로, 베이스 대상들 사이에 성립하는 관계들의 시스템이 타겟 대상들 사이에서도 성립함을 전달한다... 핵심 아이디어는 유추가 대상들의 속성이 아니라 대상들 사이의 '관계의 중첩'을 전달한다는 점이다."
      citation_location: "pp. 155-157, 162-164"

story_application:
  application_idea: "거대 시스템의 일상적 객체 사상(Everyday Object Mapping): <빅 쇼트>에서 복잡한 합성 CDO를 셰프 앤서니 보 Bourdain이 '팔리지 않은 3일 된 생선을 버리지 않고 끓여 파는 해산물 스튜'로 설명하거나, 셀레나 고메즈가 카지노 블랙잭 판에 비유하는 것처럼, 난해한 추상적 경제·과학 원리를 관객의 식탁과 주머니 단위의 인과 구조로 완벽히 치환하여 인지적 장벽을 박살냄."
  narrative_stage: "Act 1 Exposition, Act 2 Complications & Investigative Discoveries"
  emotional_mechanics:
    trigger: "이해 불가능해 보이는 거대한 추상 시스템의 등장 (인지적 혼란)"
    build_up: "일상적이고 친숙한 베이스 도메인과의 1:1 인과 관계 사상"
    peak: "관계 구조의 완벽한 일치를 목격하는 순간의 인지적 쾌감과 소름 (Aha! Moment)"
    release: "거대 시스템의 취약점과 본질을 꿰뚫어 보고 다음 행동으로 직진"
  failure_modes: "핵심 관계 구조가 불일치하는 엉뚱한 비유를 들어 오히려 관객에게 심각한 오개념(False Analogy)을 심거나 유치함을 느끼게 만드는 오류"

