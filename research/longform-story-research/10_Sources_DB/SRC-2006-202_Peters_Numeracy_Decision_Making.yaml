credibility_assessment:
  credibility_tier: Tier 1 Cognitive & Decision Psychology
  methodology:
    study_type: Factorial Experimental Decision Science Study (Four Experiments)
    sample_size: 379 (Adult general population and university students)
    target_population: 수치 정보 및 확률에 기반한 의사결정을 내리는 일반 대중
    relationship_type: Causal & Individual Difference Moderation (Numeracy x Benchmark Framing -> Affective Meaning Derivation)
    effect_size: 비교 기준점(Benchmark)이나 정서적 맥락이 결여되었을 때, 수치 문해력이 낮은 수용자는 수치 간 차이를 지각하지 못하고 프레이밍 왜곡에 2배 이상 취약함 (1,800+ 피인용 랜드마크 논문)
    replicated: Universally Replicated (수치 문해력 및 판단 의사결정 연구의 정초 고전)
    limitations: 금융 및 건강 의사결정 시나리오 기반이나 롱폼 서사의 데이터 커뮤니케이션에 1:1 완벽 대응됨
claims_and_evidence:
  core_claim: 대다수의 일반 수용자는 '단독으로 제시된 숫자(Raw Absolute Number)'로부터는 어떠한 직관적 의미나 감정적 무게(Affective Meaning)도 도출해내지 못한다. 수치 문해력(Numeracy)이 고도로 훈련된 소수만이 숫자를 자체 해석할 수 있으며, 대다수 독자에게 숫자는 반드시 '비교 기준점(Benchmark)'과 '인간적 의미(Meaning)'가 결합되어야만 비로소 지각되고 기억된다. 기준점 없는 숫자는 인지적 불감증(Psychic Numbing)만을 유발한다.
  verbatim_quotes:
  - original: Numbers do not speak for themselves. Highly numerate individuals draw affective meaning directly from numbers, but the less numerate are insensitive to bare numbers and depend heavily on external comparative benchmarks to understand magnitude and risk.
    translation: 숫자는 스스로 말하지 않는다. 수치 문해력이 높은 개인은 숫자로부터 직접 정서적 의미를 도출하지만, 수치 문해력이 낮은 대다수는 순수한 숫자에 무감각하며 규모와 위험을 이해하기 위해 외부의 비교 기준점에 전적으로 의존한다.
    citation_location: pp. 407-410
story_application:
  application_idea: 롱폼 스토리의 'Number-Benchmark-Meaning 3단계 규칙'. 팩트 다큐멘터리, 비즈니스 서사, 사회 고발 르포에서 통계나 숫자를 던질 때 절대 숫자만 단독으로 제시하지 않고, "숫자(Number) ➔ 비교 기준점(Benchmark) ➔ 인간적 의미(Meaning)"의 3단계 파이프라인을 의무화하여 관객의 직관적 감정 반응을 격발함.
  narrative_stage: Data Exposition, Scale Perception & Emotional Stake Engineering
  emotional_mechanics:
    trigger: 거대한 통계 수치(예: 수천억 원, 수만 명)의 단독 노출로 인한 관객의 멍함
    build_up: 친숙한 비교 기준점(전년도 대비, 한 가구당 연봉 대비)을 제시
    peak: 숫자가 의미하는 구체적 삶의 변화(이 돈이면 모든 아이에게 백신을 줄 수 있다) 폭로
    release: 숫자의 실체적 규모 체감 및 강렬한 도덕적/정서적 각성
  failure_modes: 조 단위 예산이나 복잡한 퍼센트를 쏟아부어 관객을 숫자의 홍수에 빠뜨리고 서사적 몰입을 중단시키는 통계 덤프의 오류
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 통계, 예산, 희생자 수, 과학적 측정치 등 정량적 데이터가 등장하는 모든 롱폼 콘텐츠에 보편 적용됨
