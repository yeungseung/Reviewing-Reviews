id: SRC-2000-500
author: Barbara L. Fredrickson
year: 2000
title: "Extracting meaning from past affective experiences: The end-and-peak rule"
venue: "Review of General Psychology, 4(4), 577-606"
tier: 1
citation_count: 1140
url: https://doi.org/10.1037/1089-2680.4.4.577
key_contribution: "엔드-앤-피크 법칙(End-and-Peak Rule)의 기억 부호화 메커니즘 정립. 인간 뇌가 과거 정서적 사건에서 삶의 의미를 추출할 때, 최종 감정 상태(Ending State)를 전체 서사의 대표 스냅샷(Representative Gestalt)으로 압축 저장함을 규명."
relevance: "서사 기획에서 엔딩 감정을 사전 설계(Backward Design)하여 전체 러닝타임의 감정선을 최종 지향점으로 수렴시켜야 하는 인지적·심리학적 이유."
