id: SRC-1986-358
author: Philip E. Tetlock
year: 1986
title: A value pluralism model of ideological reasoning
venue: Journal of Personality and Social Psychology
tier: 1
citation_count: 850
url: https://doi.org/10.1037/0022-3514.50.4.819
key_contribution: '가치 다원주의 모델(Value Pluralism Model)을 정초하여, 두 개의 정당한 핵심 가치(예: 자유 vs
  평등, 의리 vs 법치)가 충돌할 때 인간은 심각한 정서적 긴장과 인지적 갈등(Value Conflict)을 겪으며 사고의 통합적 복잡성이 극대화됨을
  실증.'
relevance: 서사에서 단순 권선징악을 탈피하고 '가치와 가치의 비극적 충돌(VCE)'을 설계하여 관객에게 깊은 복합 감정을 격발하는 핵심 이론적
  기초.
themes:
- '#40 Theme 2'
