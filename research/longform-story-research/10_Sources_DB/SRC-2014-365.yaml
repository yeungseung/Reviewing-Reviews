key_contribution: 부정적 정서가 어떻게 긍정적 서사 경험의 필수 촉매가 되는지 규명. 비통함과 상실이 스며들지 않은 승리는 가볍고 휘발성이
  강함을 입증하며, 비터스위트와 도덕적 양가성이 수용자의 심리적 성숙과 초월적 카타르시스를 완성함을 실증.
relevance: 롱폼 서사에서 부정 정서를 단순한 장애물이 아니라 복합 감정의 깊이를 완성하는 필수 대위법(Counterpoint)으로 다루는
  서사 공학의 준거.
