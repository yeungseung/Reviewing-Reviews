title: 'Lost in a Book: The Psychology of Reading for Pleasure'
venue: Yale University Press
tier: 1
citation_count: 1900
url: https://yalebooks.yale.edu/book/9780300049060/lost-in-a-book/
key_contribution: 루딕 몰입(Ludic Absorption)과 순수 미적 감상 이론을 정립. 독자/관객은 개인적 자아 관련성이 전혀 개입되지 않더라도, 순수한 서사적 스펙터클, 탐미적 아름다움, 경이로움(Awe)만으로 최고 수준의 심리적 몰입 상태에 도달할 수 있음을 실험적으로 증명.
relevance: 모든 콘텐츠가 억지로 개인적 교훈이나 생활 밀착을 강요할 필요가 없으며, 순수 스펙터클과 미적 탐미만으로 완성되는 예외적 서사(Relevance-Free Spectacle)의 학술적 근거.
themes:
