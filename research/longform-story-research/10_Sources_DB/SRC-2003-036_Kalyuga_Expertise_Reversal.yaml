claims_and_evidence:
  core_claim: "초심자(Novice)에게 필수적인 구조화된 배경 설명과 맥락 안내(Instructional Guidance)가, 이미 스키마를 갖춘 숙련자(Expert)에게는 불필요한 외재적 인지 부하(Extraneous Load)로 작용하여 오히려 몰입과 수행을 저해한다."
  verbatim_quotes:
    - original: "Instructional techniques that are very effective with inexperienced learners can lose their effectiveness and even have negative consequences for more experienced learners."
      translation: "경험이 부족한 학습자에게 매우 효과적인 교수 기법이라도, 더 경험이 많은 학습자에게는 그 효과를 잃고 심지어 부정적인 결과를 초래할 수 있다."
      citation_location: "p.23, Abstract"

story_application:
  application_idea: "복잡계 서사나 장르 콘텐츠에서 초심자 타깃일 때는 규칙과 맥락(Context-first)을 친절하게 설명하고, 장르 마니아 타깃일 때는 군더더기 설명을 과감히 생략하고 사건 속으로 직행(In media res)하는 타깃 맞춤형 페이싱 전략 수립."
  narrative_stage: "Act 1 Exposition & Rule Setup"
  emotional_mechanics:
    trigger: "타깃의 사전 스키마 수준 진단"
    build_up: "불필요한 설명 배제로 지루함 방지"
    peak: "수용자 수준에 최적화된 서사 몰입"
    release: "빠른 전개에 따른 쾌감"
  failure_modes: "장르 마니아들에게 뻔한 장르 규칙을 10분간 설명하고 앉아있으면 극심한 지루함으로 즉각 이탈함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "수용자의 사전 지식 및 장르 친숙도에 따라 가변적 적용"
