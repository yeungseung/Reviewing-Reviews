claims_and_evidence:
  core_claim: "확장된 자아 이론(Extended Self Theory)과 상징적 스테이크의 파괴력: 인간은 자신의 신체적 경계를 넘어 자신이 아끼는 소유물, 반려동물, 소중한 타인, 고향의 장소를 '자아의 일부(Extended Self)'로 통합하여 인식한다. 따라서 사소한 유품, 낡은 집, 사랑하는 반려견을 빼앗기거나 훼손당하는 것은 단순한 재산 손실이 아니라 '신체 일부가 절단당하고 영혼이 찢겨나가는 실존적 외상(Psychic Mutilation)'으로 경험된다. 서사에서 객관적으로 거대한 100억 원의 손실보다, 주인공의 정체성이 깃든 작은 유품이나 고향의 파괴가 관객에게 10배 더 처절하고 지워지지 않는 감정적 상흔을 남기는 이유가 바로 여기에 있다."
  verbatim_quotes:
    - original: "We cannot hope to understand consumer behavior without first understanding the meanings that consumers attach to possessions... We regard our possessions as parts of ourselves. We are what we have... The unintentional loss of possessions brings about a shrinkage of our being, a sense of personal mutilation."
      translation: "우리는 소비자가 소유물에 부여하는 의미를 먼저 이해하지 않고서는 인간 행동을 이해할 수 없다... 우리는 우리의 소유물을 우리 자신의 일부로 간주한다. 우리는 우리가 가진 것이다... 의도치 않은 소유물의 상실은 우리 존재의 축소, 즉 인격적 절단감을 가져온다."
      citation_location: "pp. 139-143, 159-161"

story_application:
  application_idea: "확장된 자아의 훼손을 통한 분노와 복수의 점화(Extended Self Violation): 주인공을 행동하게 만드는 가장 강력한 도화선은 그의 '확장된 자아'를 악당이 유린하는 것이다. 주인공의 과거 상처와 사랑이 응축된 작은 상징물(예: <존 윅>의 강아지와 69년식 머스탱, <글래디에이터>의 아내와 아들의 흙인형)을 악당이 짓밟는 순간, 관객은 인물과 일체화되어 살인적인 분노와 정의 실현의 갈망을 공유하게 됨."
  narrative_stage: "Act 1 Inciting Catalyst, Act 2 Low Point Desecration, Act 3 Catharsis"
  emotional_mechanics:
    trigger: "인물의 확장된 자아로 기능하는 상징적 대상의 잔혹한 침탈"
    build_up: "자아의 일부가 잘려 나간 고통과 슬픔을 딛고 일어서는 인물의 복수/수호 의지"
    peak: "사소해 보이지만 자신에게는 전부인 가치를 지키기 위한 극한의 결투"
    release: "파괴된 외적 형태를 넘어 상징적 의미의 내면적 영구 보존"
  failure_modes: "물건이나 대상에 인물의 자아가 깃드는 서사적 축적(축복/기억의 역사) 없이 단순히 비싼 물건이 부서졌다고 슬퍼하라는 얄팍한 연출"

