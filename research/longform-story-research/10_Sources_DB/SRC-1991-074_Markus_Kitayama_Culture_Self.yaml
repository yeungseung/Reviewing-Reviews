claims_and_evidence:
  core_claim: "문화적 자기 구성(Self-Construal)과 정서 평가의 차이: 서구의 '독립적 자기(Independent Self)'는 개인의 권리, 자율성, 목표 성취를 자아의 핵으로 보므로, 개인의 권리 침해에 즉각 분노(Ego-focused emotion: Anger, Frustration, Pride)를 표출한다. 반면 동양 및 비서구의 '상호의존적 자기(Interdependent Self)'는 집단 내 조화, 타인과의 관계, 역할 의무를 자아의 핵으로 보므로, 관계의 균열이나 사회적 체면 훼손에 수치심과 공감적 슬픔(Other-focused emotion: Shame, Guilt, Empathy, Omoiyari)을 민감하게 생성한다. 따라서 동일한 상황 자극이라도 수용자의 문화적 자기 모델에 따라 활성화되는 감정 공식의 가중치가 달라진다."
  verbatim_quotes:
    - original: "The self is not a universal entity... In independent cultures, emotions often serve to express internal states and personal agency (e.g., anger). In interdependent cultures, emotions are more relational, aimed at maintaining social harmony (e.g., shame, empathy)."
      translation: "자아는 보편적 단일체가 아니다... 독립적 문화에서 감정은 종종 내적 상태와 개인적 주체성을 표현하는 데 기여한다(예: 분노). 상호의존적 문화에서 감정은 더욱 관계적이며 사회적 조화를 유지하는 데 목적을 둔다(예: 수치심, 공감)."
      citation_location: "pp. 224-230"

story_application:
  application_idea: "글로벌 콘텐츠를 기획할 때 감정 연출의 '2계층 아키텍처(Two-layer Architecture)' 도입: ① 기저 코어(Layer 1)는 인류 보편의 생리인지 불변자(위협에 대한 공포, 불공정에 대한 분노, 영구 상실의 슬픔)를 사용하고, ② 상위 맥락(Layer 2)에서는 서구 타깃은 '개인의 자율성과 권리 쟁취'를, 동양 타깃은 '가족의 희생과 사회적 체면, 관계적 조화'를 인과 매개체로 설정하여 정서 몰입을 극대화함."
  narrative_stage: "Character Moral Framing & Global Audience Adaptation"
  emotional_mechanics:
    trigger: "자아 개념(독립 vs 상호의존)에 따른 핵심 가치 위반 사건"
    build_up: "문화적 규범 필터를 통한 정서적 귀인 해석"
    peak: "개인적 권리 쟁취(서구) vs 관계적 조화 회복(동양)의 감정 폭발"
    release: "문화적 세계관에 부합하는 도덕적 안도감"
  failure_modes: "서구식 극단적 개인주의 동기를 동양적 정서 맥락에 무비판적으로 이식하여 '싸가지 없는 주인공'으로 전락시키거나, 반대로 집단주의적 순응을 서구 관객에게 강요하여 답답함을 유발하는 문화적 단절 실패"

