claims_and_evidence:
  core_claim: 저널리즘 및 서사 텍스트의 모든 정보 단위는 독립적으로 존재하지 않고, 담화 스키마(News Schema) 내의 특정 기능적
    범주(Category)를 채우기 위해 복무한다. van Dijk은 정보를 ① 핵심 사건(Main Event), ② 맥락 및 규모(Context
    / Scale), ③ 역사 및 배경(History / Background), ④ 원인 및 인과(Cause / Explanation), ⑤ 결과
    및 예측(Consequences / Expectations / Prediction), ⑥ 평가 및 재해석(Evaluation / Reframe)으로
    분류했다. 이 기능적 스키마에 속하지 않는 고립된 정보(Non-functional Detail)는 수용자의 거시구조(Macrostructure)
    요약 및 이해 과정에서 즉시 탈락(Deletion Rule)한다.
  verbatim_quotes:
  - original: News discourse is organized by a conventional news schema, whose categories—such
      as Headline, Lead, Main Event, Context, History, Consequences, and Evaluation—assign
      distinct communicative functions to information. Information that fulfills no
      category function is systematically eliminated during cognitive macro-processing.
    translation: 뉴스 담화는 관습적인 뉴스 스키마에 의해 조직되며, 헤드라인, 리드, 주요 사건, 맥락, 역사, 결과, 평가와 같은
      범주들은 정보에 고유한 소통적 기능을 부여한다. 범주 기능을 수행하지 못하는 정보는 인지적 거시 처리 과정에서 체계적으로 제거된다.
    citation_location: 'Chapter 3: The Structures of News, pp. 52-59'
story_application:
  application_idea: 롱폼 서사의 정보 기능 스키마 및 SCALE / REFRAME / PREDICT / TRANSITION 엔진.
    정보가 스토리 내에서 독자의 거시적 시야를 넓히거나(SCALE), 관점을 전환하거나(REFRAME), 후속 파국을 예고하거나(PREDICT),
    다음 국면으로 넘어가게 하는(TRANSITION) 기능적 역할을 명확히 규정. van Dijk의 스키마 이론을 통해 정보 7종 분류의 이론적
    완전성(Completeness)을 입증함.
  narrative_stage: Macrostructural Exposition, Context Setting & Scene Transition
  emotional_mechanics:
    trigger: 국소적 사건의 좁은 시야에 갇힌 독자 상태
    build_up: 맥락(Context/Scale)과 평가(Evaluation/Reframe) 정보의 투입
    peak: 거시적 스키마의 완성 및 다음 국면(Prediction/Transition)으로의 도약
    release: 서사 전체의 조망권 확보 및 인지적 안정
  failure_modes: 어떤 스키마적 기능도 하지 못하는 맹목적 정보의 범람으로 독자의 텍스트 거시 구조 파악을 방해하는 인지 과부하
verification_status:
