    target_population: 저널리즘 및 대중 담화 수용자의 정보 처리 및 텍스트 스키마 구조
    relationship_type: Functional News Schema (Main Event, Context, History, Consequence,
      Evaluation)
    effect_size: 뉴스 및 정보 텍스트의 정보를 6대 기능적 계층 범주로 체계화하여, 정보가 스키마 내에서 기능(Scale, Context,
