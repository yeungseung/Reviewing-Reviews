id: "SRC-2002-021"
title: "Multimedia learning"
authors:
  - "Richard E. Mayer"
year: 2002
publication: "Psychology of Learning and Motivation, Vol. 41, 85-139"
doi_or_url: "https://doi.org/10.1016/S0079-7421(02)80005-6"
tier: "Tier 1 (Academic Landmark)"
credibility_score: 97

summary: |
  인지과학 기반 멀티미디어 학습 이론(Cognitive Theory of Multimedia Learning)의 핵심 저작.
  학습자의 작동 기억 용량(Working Memory Capacity)의 한계를 실증하고, 불필요한 서사적 드라마나 감정적 자극(Seductive Details)이 본질적인 인지적 스키마 형성을 방해함을 규명함.
  정보·교육·How-to 콘텐츠에서 왜 스토리와 감정 트랙을 '절제되고 정제된 형태'로 유지해야 하는지 과학적 근거를 제공함.

key_findings:
  - 인지적 과부하 원리(Cognitive Overload Principle): 인간의 작업 기억은 시각/청각 채널 모두에서 정보 처리 한계가 있음.
  - 유혹적 세부사항 효과(Seductive Details Effect): 교육용 콘텐츠에 흥미를 돋우기 위해 삽입한 극적인 감정 연출이나 불필요한 스토리텔링은 학습자의 핵심 개념 이해(Meaning/Utility)를 심각하게 저해함.
  - 지식/정보 전달 장르에서는 스토리(STORY)와 감정(EMOTION)이 군더더기 없이 핵심 정보의 인과적 구조화(Coherence Principle)만을 보조해야 함.

