source_id: SRC-1994-228
created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: Readers as problem-solvers in the experience of suspense
  authors:
  - Gerrig, Richard J. (Stony Brook University)
  - Bernardo, David N. (Yale University)
  institution: Yale University & Stony Brook University
  published_date: '1994-10-01'
  source_url: https://doi.org/10.1080/02699939408408955
  source_type: Peer-reviewed Journal (Cognition & Emotion, 8(5), 459-472)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Narrative Theory & Suspense Psychology Benchmark
  methodology:
    study_type: Controlled Behavioral Laboratory Experiment (Reading Time, Path Generation, Suspense Ratings)
    sample_size: 48명 대학생 참가자 (제임스 본드 서사 변형 텍스트 자극군 및 통제군)
    target_population: 곤경에 처한 주인공 서사를 읽는 성인 독자층
    relationship_type: Causal Mechanism (Cognitive Path Pruning and Solution Searching Directly Modulates Experienced Suspense)
    effect_size: 주인공의 생존/탈출 가능한 대안 경로가 독자의 인지 공간에서 하나씩 제거(Pruned)될수록 주관적 서스펜스 평정치가 선형적으로 급상승하며(p < .01), 독자는 텍스트 결말을 알고 있는 재독(Re-reading) 상황에서도 동일한 문제 해결 시뮬레이션을 재가동함을 입증 (Anomalous Suspense 규명)
    replicated: High (Replicated across Gerrig's subsequent narrative cognition studies and film suspense models)
    limitations: 스릴러/액션 서사 중심 실험 설계이나 지적 퍼즐과 드라마적 난제 해결에도 광범위하게 일반화됨
claims_and_evidence:
  core_claim: 서스펜스(Suspense)의 본질은 단순히 '결과가 불확실하다'는 추상적 확률에 머무는 것이 아니다. 독자는 서사를 읽는 동안 주인공의 목표를 달성하기 위해 가능한 논리적 탈출로를 전방향으로 시뮬레이션하는 '능동적 문제 해결자(Readers as Problem-Solvers)'로 기능한다. 서스펜스는 독자가 떠올릴 수 있는 주인공의 유효한 해결 경로(Solution Paths)가 작가에 의해 차례차례 차단되거나 극소수로 좁혀질 때(Path Narrowing & Pruning) 극대화된다. 즉, 관객의 뇌 안에서 예측 경로가 차단될 때 뇌는 위기 해결을 위한 인지적 시뮬레이션을 전력으로 가동하며 이것이 강렬한 긴장감과 몰입감으로 체감된다.
  verbatim_quotes:
  - original: We propose that readers experience suspense when they are active problem-solvers on behalf of characters. Suspense arises when the range of solutions available to a character becomes severely restricted... Even when readers know the historical outcome, the cognitive processes that generate suspense remain operative because readers engage in prospective problem-solving.
    translation: 우리는 독자가 인물을 대신하여 능동적인 문제 해결자로 기능할 때 서스펜스를 경험한다고 제안한다. 서스펜스는 인물이 취할 수 있는 해결책의 범위가 극도로 제한될 때 발생한다... 독자가 결말을 이미 알고 있는 경우조차, 전방향 문제 해결 시뮬레이션을 수행하기 때문에 서스펜스를 생성하는 인지 과정은 여전히 작동한다.
    citation_location: pp. 459-461
story_application:
  application_idea: 롱폼 스토리의 '인지적 탈출로 차단 공식 (Cognitive Path Pruning Formula)'. 관객에게 서스펜스를 부여하려면 단순히 악당을 무섭게 묘사하는 것이 아니라, 주인공이 취할 수 있는 현실적 대안(예: 경찰에 전화하기, 뒷문으로 도망치기, 동료에게 도움 청하기)을 하나씩 설득력 있게 봉쇄해야 함. 관객 머릿속의 '예측 가능한 안전 경로'가 0으로 수렴하고 단 하나의 위험천만한 길만 남았을 때, 관객의 전방향 예측 엔진은 100% 풀가동되며 숨이 멎는 긴장감을 유발함.
  narrative_stage: Climax Build-up, Suspense Engineering, Crisis & Pinch Point
  emotional_mechanics:
    trigger: 주인공의 절대적 위기 직면 및 탈출 대안 탐색 가동
    build_up: 작가에 의한 대안 경로의 순차적 격파와 인지적 선택지 축소(Narrowing)
    peak: 남은 경로가 단 하나이거나 전무한 절체절명의 교착 상태(Checkmate Threat)
    release: 예상치 못한 제3의 기발한 해결 경로 발견 또는 희생을 통한 돌파
  failure_modes: 주인공에게 손쉬운 대안(휴대폰 연락, 도주 등)이 여전히 뻔히 보이는데 억지로 위험에 뛰어들게 하여 관객의 문제 해결 엔진을 바보 취급하는 서사적 작위성(Idiotic Plot Trap)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 스릴러, 미스터리, 어드벤처, 생존기, 비즈니스 협상, 법정 공방 등 위기 해결이 중심이 되는 모든 서사에 필수 적용
