key_contribution: 적합성 이론(Relevance Theory)을 정초. 인간 인지는 최소 인지 노력(Cognitive Effort)으로 최대 인지 효과(Cognitive Effects)를 획득하도록 진화했으며, 불필요하거나 억지스러운 관련성 주입(Irrelevant Callout)은 인지 노력만 낭비시켜 커뮤니케이션을 붕괴시킴을 실증.
relevance: 무리한 로컬라이징이나 맥락 없는 자아 호출이 시청자의 인지적 불쾌감을 유발하고 이탈을 가속하는 메커니즘을 설명하는 기념비적 원전.
