key_contribution: I-SKE(의도·감각·지식·감정) 프레임워크를 기반으로 영상 편집 속도와 샷 지속 시간이 관객의 자율신경계 각성 대 성찰적 인지를 변조하는 인지신경영화학적 메커니즘 규명. 고속 편집은 전두엽의 사색을 억제하고 편도체-교감신경계를 직격하여 즉각적 각성과 긴장을 유발하는 반면, 지연된 컷과 긴 지속 시간은 디폴트 모드 네트워크(DMN)와 연합 피질을 활성화하여 사색적·유다이모니아적 의미 형성을 촉진함을 실증.
relevance: 편집 속도가 감정 유형(흥분/긴장 vs 성찰/의미)에 따라 인지신경학적으로 완전히 다르게 작동함을 입증하는 핵심 근거.
