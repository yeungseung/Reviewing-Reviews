claims_and_evidence:
  core_claim: "해소되지 않은 정서적 충격이나 사건(Unresolved Emotional Episodes)은 개인의 내면에 억제되지 않는 반복적 침투적 사고(Cognitive Rumination)를 유발하며, 인간은 그 정서적 모순과 상처가 인지적으로 재구성되고 치유(Integration/Closure)될 때까지 지속적으로 의미 탐색(Sense-making)에 매달린다."
  verbatim_quotes:
    - original: "Emotional events leave behind unintegrated memories and disrupted cognitive models... Such unresolved emotional episodes trigger repetitive mental rumination and an urgent need to make sense of the experience until emotional recovery is attained."
      translation: "정서적 사건은 통합되지 않은 기억과 붕괴된 인지 모델을 남긴다... 이러한 미해결된 정서 에피소드는 반복적인 심적 반추(rumination)를 촉발하며, 정서적 회복에 도달할 때까지 그 경험의 의미를 구성하려는 긴급한 욕구를 낳는다."
      citation_location: "Emotion Review, 1(1), p. 60, 64"

story_application:
  application_idea: "서사 오프닝의 '감정 미해결 훅(Emotional Unresolved Hook)' 기법. 주인공의 깊은 상실, 해결되지 않은 죄책감, 납득할 수 없는 배신의 정서적 상처를 오프닝에 노출시킴으로써 관객으로 하여금 강렬한 대리 공감과 인지적 반추(Rumination)를 일으켜, 그 감정이 회복되고 치유되는 카타르시스를 향해 롱폼 서사를 끝까지 완주하게 만듦."
  narrative_stage: "Act 1 Hook & Protagonist's Emotional Wound (Ghost/Wound)"
  emotional_mechanics:
    trigger: "치유되지 않은 부당한 비극이나 억울한 상실의 목격"
    build_up: "정서적 반추와 주인공의 내적 고통에 대한 지속적 공감"
    peak: "감정적 상처의 근원과 마주하는 정면 대결"
    release: "진정한 화해, 용서, 혹은 정의 구현을 통한 정서적 종결(Catharsis)"
  failure_modes: "감정의 실체나 원인을 전혀 설명하지 않고 비명과 눈물만 쥐어짜는 신파적 감정 과잉(Melodramatic Sentimentality)은 관객에게 피로와 조소를 유발함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "상처받은 인물의 감정이 관객이 도덕적·인간적으로 수용할 만한 정당성을 지녀야 함"
