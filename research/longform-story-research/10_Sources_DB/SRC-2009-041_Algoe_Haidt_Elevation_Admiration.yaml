  title: "Witnessing excellence in an other: The psychology of elevation, gratitude, and admiration"
  authors:
    - "Algoe, Sara B. (University of North Carolina at Chapel Hill)"
    - "Haidt, Jonathan (University of Virginia)"
  institution: "University of North Carolina / University of Virginia"
  published_date: "2009-04-01"
  source_url: "https://doi.org/10.1080/17439760802650519"
