id: SRC-1970-293
author: Philip M. Groves & Richard F. Thompson
year: 1970
title: 'Habituation: A Dual-Process Theory'
venue: Psychological Review
tier: 1
citation_count: 2900
url: https://doi.org/10.1037/h0029810
key_contribution: 반복되는 자극에 대한 신경 반응의 점진적 감쇠를 설명하는 습관화(Habituation)와 배경 각성에 따른 감작(Sensitization)의
  신경학적 이중 과정 모델을 제시하여, 실질적 상태 변화 없는 단순 자극 강화(Empty Escalation)가 왜 필연적으로 신경 둔마와 흥미
  상실로 귀결되는지를 규명.
relevance: 목소리 톤이나 BGM만 키우고 내용 변화가 없는 가짜 에스컬레이션이 시청자를 피로하게 만드는 신경생리학적 원리 설명.
