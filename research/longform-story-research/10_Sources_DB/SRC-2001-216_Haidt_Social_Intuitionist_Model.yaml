bibliographic_info:
  title: 'The emotional dog and its rational tail: A social intuitionist approach to moral judgment'
  authors:
  - Haidt, Jonathan (University of Virginia)
  institution: University of Virginia
  published_date: '2001-10-01'
  source_url: https://doi.org/10.1037/0033-295X.108.4.814
  source_type: Peer-reviewed Journal (Psychological Review, 108(4), 814-834)
credibility_assessment:
  credibility_tier: Tier 1 Moral Psychology & Cognitive Science Monument
  methodology:
    study_type: Theoretical Paradigm Formulation & Cross-disciplinary Behavioral Evaluation
    sample_size: 다중 도덕적 딜레마(Moral Dumbfounding) 실험 및 인류학/신경과학 데이터 종합
    target_population: 옳고 그름, 정의와 불의를 평가하는 인간 판단 주체
    relationship_type: Foundational Model of Moral Cognition (Social Intuitionist Model: Moral Intuition -> Moral Judgment -> Post-hoc Reasoning & Evidence Search)
    effect_size: 도덕적 판단은 직관적 정서(Moral Intuition: 'Emotional Dog')에 의해 즉각적으로 내려지며, 의식적인 이성 추론과 증거 수집('Rational Tail')은 이미 형성된 감정적 결론을 사후 변호(Post-hoc Justification)하기 위해 복무함 (12,000+ 피인용 기념비적 고전)
    replicated: Universally Replicated across moral psychology and neuroscience
    limitations: 일상적·도덕적 판단 중심이나 청중의 도덕적 정서와 팩트 수용 메커니즘을 설명하는 결정적 틀을 제공함
claims_and_evidence:
  core_claim: 인간은 증거를 논리적으로 검토한 뒤 냉정하게 감정을 결정하는 것이 아니다. 반대로, 직관적인 도덕적 정서(분노, 혐오, 연민)가 먼저 불꽃처럼 번지며 판단을 끝마치고, 이후에 등장하는 논리와 증거는 이미 내려진 감정적 판결을 뒷받침하기 위해 동원되는 사후 변호인에 불과하다("정서가 개이고, 이성은 그 꼬리다"). 따라서 관객에게 불의나 정의의 증거를 수용시키려면, 먼저 도덕적 정서의 직관을 점화해야만 그 증거가 독자의 내면에 온전히 닻을 내릴 수 있다.
  verbatim_quotes:
  - original: Moral intuition can be defined as the sudden appearance in consciousness of a moral judgment, including an affective valence... without any conscious awareness of having gone through steps of searching, weighing evidence, or inferring a conclusion. Moral reasoning is usually a post hoc process in which we search for evidence to support our initial intuitive reaction.
    translation: 도덕적 직관은 증거를 탐색하거나 가중치를 달거나 결론을 도출하는 의식적 단계를 거쳤다는 어떠한 자각도 없이, 정서적 부호를 포함하는 도덕적 판단이 의식에 갑작스럽게 출현하는 것으로 정의될 수 있다. 도덕적 추론은 대개 우리의 초기 직관적 반응을 뒷받침하기 위해 증거를 찾는 사후 과정(Post-hoc process)이다.
    citation_location: pp. 814-818
story_application:
  application_idea: 롱폼 스토리의 '도덕적 직관 선점 (Moral Intuition Priming) 서사 기법'. 부패 기업이나 악인을 단죄하는 팩트 폭로 장면에서, 복잡한 횡령 계좌나 법률 조항(증거)을 먼저 들이밀지 않고, 먼저 약자를 짓밟는 악인의 오만함이나 파렴치한 행동을 보여주어 관객의 '도덕적 분노(Moral Outrage)'를 폭발시킴. 관객의 도덕적 직관이 '저 자는 유죄다'라고 판결을 내린 그 순간, 법적 증거를 제공하면 관객은 증거를 의심 없이 맹렬하게 흡수함.
  narrative_stage: Antagonist Revelation, Moral Conflict & Injustice Framing
  emotional_mechanics:
    trigger: 명백한 불의나 약자에 대한 억압을 목격할 때 터져 나오는 본능적 도덕적 분노
    build_up: 분노와 연민이 결합되며 형성되는 즉각적인 내면의 도덕적 판결
    peak: 도덕적 직관을 완벽하게 입증해 주는 반박 불가능한 증거의 공개
    release: '내 직관이 정확했다'는 쾌감과 함께 증거에 절대적 정당성을 부여
  failure_modes: 도덕적 정서의 직관적 점화 없이 메마른 법적·통계적 증거만 나열하여 관객을 제3자의 방관자로 남겨두는 실패
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 사회 고발 르포, 탐사보도, 범죄 실화, 역사적 비극 등 가치 판단이 요구되는 모든 롱폼 장르
