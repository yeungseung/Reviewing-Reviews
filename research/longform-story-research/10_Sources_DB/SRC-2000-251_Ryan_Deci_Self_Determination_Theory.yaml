id: SRC-2000-251
title: "Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being"
authors:
  - "Richard M. Ryan"
  - "Edward L. Deci"
year: 2000
type: academic_primary
tier: 1
publication: "American Psychologist"
volume: "55"
issue: "1"
pages: "68-78"
doi: "10.1037/0003-066X.55.1.68"
citation_count: 62000
key_findings:
  - "인간의 내재적 동기(Intrinsic Motivation)를 촉진하는 3대 기본 심리적 욕구인 자율성(Autonomy), 유능감(Competence), 관계성(Relatedness) 규명."
  - "유능감(Competence/Mastery): 개인이 자신의 행동과 지적 인출을 통해 환경을 성공적으로 예측하고 제어하고 있다는 느낌은 가장 강력한 내재적 쾌락과 지속적 몰입(Engagement)을 생성함."
  - "외부적 물질 보상 없이도, '자신의 예측이 옳았음'을 확인하는 순수한 인지적 숙달감(Mastery Feeling)만으로 인간은 해당 활동을 자발적으로 지속함."
core_claims:
  - "유능감 충족은 인간의 내재적 동기와 심리적 만족의 핵심 기둥이다."
  - "서사에서 관객이 자신의 추론 적중을 확인할 때 강력한 유능감과 자율적 지적 쾌감이 발생한다."
keywords:
  - self-determination theory
  - intrinsic motivation
  - competence
  - mastery feeling
  - psychological well-being
