  source_type: "Peer-reviewed Journal"

credibility_assessment:
  credibility_tier: "Tier 1 Behavioral Influence & Meta-analysis"
  methodology:
    study_type: "Meta-analytic & Theoretical Review"
    sample_size: "Dozens of field experiments and lab studies spanning 30+ years"
    target_population: "소비자, 유권자, 일반 대중 피험자"
    relationship_type: "Causal"
    effect_size: "단순 질문 노출 시 목표 행동 수행률 20~40% 통계적 유의미 상승 (d = 0.25~0.45)"
    replicated: "Replicated (마케팅, 공공정책, 행동경제학 분야에서 강력한 재현성 확증)"
    limitations: "질문 대상 행동에 대한 기존 태도가 지나치게 부정적일 경우 역효과(행동 회피 강화) 발생 가능"

claims_and_evidence:
  core_claim: "미래의 행동이나 신념에 대해 단순히 질문(Question)을 던지는 것만으로도 수용자의 뇌에서는 해당 개념에 대한 인지적 접근성(Accessibility)이 급증하고 정신적 시뮬레이션(Mental Simulation)이 유발되어, 평서문 명령이나 서술보다 훨씬 더 강력하게 후속 주의와 행동을 유도한다."
  verbatim_quotes:
    - original: "Asking questions about a behavior can alter the performance of that behavior... The act of answering a question activates cognitions related to the behavior, creating cognitive dissonance or priming representations that influence actual conduct."
      translation: "행동에 대해 질문하는 것 자체가 그 행동의 수행을 변화시킬 수 있다... 질문에 답하려는 행위는 그 행동과 관련된 인지를 활성화하여 인지 부조화를 생성하거나 실제 행동에 영향을 미치는 표상을 프라이밍한다."
      citation_location: "Social Influence, 1(2), p. 128, 131"

story_application:
  application_idea: "서사 오프닝의 Hook에서 단순 서술형 단언('그는 거대한 배신을 저질렀다') 대신 도발적 질문형 Hook('만약 당신이 그의 자리에 있었다면, 그 제안을 거절할 수 있었을까?')을 던짐으로써 관객의 뇌에서 자동적 정신 시뮬레이션을 가동시켜 즉각적인 자기 관여(Self-involvement)와 완주를 이끌어냄."
  narrative_stage: "Act 1 Hook & Thematic Proposition"
  emotional_mechanics:
    trigger: "관객의 양심이나 상식을 흔드는 도발적 질문 노출"
    build_up: "자신의 답변을 무의식적으로 탐색하는 뇌내 시뮬레이션"
    peak: "작품 속 인물의 선택과 자신의 답변이 정면 충돌하는 순간"
    release: "질문에 대한 통찰과 서사적 해답 획득"
  failure_modes: "지나치게 진부하거나(수사적 클리셰) 답이 뻔한 질문은 시뮬레이션을 유발하지 못하고 유치하게 느껴짐"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "질문이 관객 자신의 가치관이나 본능적 호기심과 직결되어야 함"
