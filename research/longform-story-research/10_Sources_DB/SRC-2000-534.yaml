id: SRC-2000-534
author: Annie Lang, Shuhua Zhou, Nancy Schwartz, Paul Bolls & Robert F. Potter
year: 2000
title: "The effects of edit frequency and complexity on television message processing"
venue: "Media Psychology, 2(1), 17-42"
tier: 1
citation_count: 520
url: https://doi.org/10.1207/S1532785XMEP0201_2
key_contribution: "영상 편집 빈도와 복잡성이 인지 처리에 미치는 생체 신경학적 영향 실증. 카메라 앵글 컷 전환이 심박수 감속(Heart Rate Deceleration)을 통한 정향 반응(Orienting Response)을 유도하지만, 서사적 맥락과 무관한 컷(Unrelated cuts)이 지나치게 빈번하면 인지 자원 과부하(Cognitive Overload)가 발생하여 내용 기억 회상률이 급락함을 규명."
relevance: "단순 컷 빈도(Cut Frequency) 중심의 현란한 편집이 오히려 관객의 주의 집중과 정보 인코딩을 파괴함을 입증하고, 의미 갱신이 수반된 시각 전환의 필요성을 제공하는 결정적 학술 근거."
themes:
  - "#55 Theme 1"
