claims_and_evidence:
  core_claim: "경험의 구체적인 사실(Fact) 기억은 시간 경과에 따라 망각되지만, 그 경험과 연합되었던 생리적 정서 반응인 '신체 표지(Somatic Marker)'는 복내측 전전두엽에 영구 보존되어 사후 판단과 태도를 지배함."
  verbatim_quotes:
    - original: "Somatic markers are a special instance of feelings generated from secondary emotions... they act as an automated alarm system to guide decision-making and evaluation long after factual details fade."
      translation: "신체 표지는 2차 정서에서 생성된 느낌의 특별한 사례이다... 이들은 사실적 세부 사항이 희미해진 후에도 의사결정과 평가를 안내하는 자동화된 경보 시스템 역할을 한다."
      citation_location: "p.1413, Introduction & Discussion"

story_application:
  application_idea: "시청자에게 지식과 통계를 주입하려 애쓰지 마라. 1년 뒤 시청자는 수치(Fact)는 100% 잊지만, 그 콘텐츠를 볼 때 느꼈던 '오싹함, 통쾌함, 숭고함'이라는 신체 표지(Somatic Marker)는 평생 기억한다. 따라서 모든 팩트는 강력한 신체 표지와 결합되어야 한다."
  narrative_stage: "Theme Encoding and Long-term Resonance"
  emotional_mechanics:
    trigger: "팩트와 결합된 강력한 정서적 충격"
    build_up: "신체 반응(자율신경계 반응)의 각인"
    peak: "신체 표지(Somatic Marker)의 영구 부호화"
    release: "장기적인 태도 및 신념 형성"
  failure_modes: "정서적 신체 표지 없이 건조한 팩트만 나열된 콘텐츠는 시청 후 24시간 내에 뇌에서 완전 소멸됨"

