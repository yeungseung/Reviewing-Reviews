id: SRC-2006-250
title: "Sweet Anticipation: Music and the Psychology of Expectation"
authors:
  - "David Huron"
year: 2006
type: academic_primary
tier: 1
publication: "The MIT Press"
volume: "Book"
issue: "Monograph"
pages: "1-462"
isbn: "978-0262083454"
citation_count: 2900
key_findings:
  - "예측과 기대의 심리학을 설명하는 포괄적 인지신경생물학적 모델인 ITPRA 이론 정립."
  - "ITPRA 5단계 반응 시스템: 상상(Imagination) ➔ 긴장(Tension) ➔ 예측(Prediction) ➔ 반응(Reaction) ➔ 평가(Appraisal)."
  - "예측 반응(Prediction Response): 자신의 예측이 맞았을 때 뇌는 미래 사건을 성공적으로 시뮬레이션했다는 진화적 적응 보상으로 즉각적인 도파민 분비와 긍정적 쾌락(Hedonic Reward)을 부여함."
  - "예측 적중은 결과 자체의 좋고 나쁨과 무관하게, '내가 맞혔다'는 인지적 유능감 자체만으로 독립적인 신경학적 보상을 생성함."
core_claims:
  - "예측 적중은 인간의 뇌에서 강력한 신경생물학적 쾌락 반응을 격발한다."
  - "서사적 서스펜스와 극적 아이러니는 예측-긴장-확인의 ITPRA 루프를 정밀하게 조작하여 극대화된다."
keywords:
  - musical expectation
  - ITPRA theory
  - prediction response
  - anticipatory tension
  - hedonic reward
