key_contribution: 실용 논증 모델(Toulmin Model of Argument)을 창시. 논증은 단순 연역이 아니라 주장(Claim), 자료/증거(Data/Evidence), 정당화 기전(Warrant/Meaning), 뒷받침(Backing), 반박 조건(Rebuttal)의 유기적 결합으로 완성됨을 체계화.
