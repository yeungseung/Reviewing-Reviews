  title: "The misunderstood limits of folk science: An illusion of explanatory depth"
  authors:
    - "Rozenblit, Leonid (Yale University)"
    - "Keil, Frank (Yale University)"
  institution: "Yale University"
  published_date: "2002-09-01"
  source_url: "https://doi.org/10.1207/s15516709cog2605_1"
  source_type: "Peer-Reviewed Journal Article (Cognitive Science)"

credibility_assessment:
  credibility_tier: "Tier 1 Cognitive Science & Epistemic Psychology"
  methodology:
    study_type: "Controlled Multi-Phase Laboratory Experiments on Causal Understanding"
    sample_size: "Multiple adult cohorts (Total N=300+ across 6 experiments)"
    target_population: "복잡한 자연물 및 인공물의 인과 메커니즘을 이해하려는 성인 일반"
    relationship_type: "Epistemic Bias & Step-by-Step Causal Mechanism Learning"
    effect_size: "단계별 인과 메커니즘(Step-by-step Causal Mechanism)을 서술하도록 요구받았을 때 자신의 이해도에 대한 과신이 40% 이상 교정되며, 단계적 인과 사슬이 제시될 때 객관적 이해력 및 지적 만족도 2.5배 급증"
    replicated: "Highly Replicated (설명적 깊이의 착각 IOED 대표 원전, 2,100+ 피인용)"
    limitations: "기계 및 자연 현상 장치 실험 중심이나 과학/기술 롱폼 정보 전달 및 플롯 장치 설계에 완벽 적용"

claims_and_evidence:
  core_claim: "대부분의 사람들은 복잡한 시스템이나 기계(지퍼, 자물쇠, 원자로, 헬리콥터 등)의 작동 원리를 실제보다 훨씬 잘 알고 있다고 믿는 '설명적 깊이의 착각(The Illusion of Explanatory Depth: IOED)'에 빠져 있다. 그러나 'A가 움직여서 B를 누르고, 그로 인해 C가 열린다'는 단계적 인과 메커니즘(Step-by-step Causal Mechanism)을 직접 설명하게 하면 자신이 아무것도 모른다는 사실을 직면한다. 롱폼 스토리에서 과학, 기술, 범죄 트릭, 수사 기법을 다룰 때 피상적인 전문 용어(Jargon)를 나열하는 것은 관객을 소외시키지만, **'물리적/논리적 인과 메커니즘을 도미노처럼 1단계씩 시각화하여 보여주는 메커니즘 사슬(Mechanism Chain)'**을 구축하면 관객은 설명적 착각을 넘어선 진정한 지적 카타르시스를 경험한다."
  verbatim_quotes:
    - original: "Most people feel they understand the world with far greater detail, coherence, and depth than they really do... When asked to produce a detailed, step-by-step causal explanation, their illusion of explanatory depth is dramatically revealed and dismantled. True comprehension requires explicit causal chains that connect function to mechanism."
      translation: "대부분의 사람들은 자신이 실제보다 훨씬 더 큰 디테일, 일관성, 깊이로 세상을 이해하고 있다고 느낀다... 상세한 단계별 인과 설명을 제시하도록 요구받았을 때 그들의 설명적 깊이의 착각은 극적으로 드러나고 해체된다. 진정한 이해는 기능과 메커니즘을 연결하는 명시적인 인과 사슬을 필요로 한다."
      citation_location: "Cognitive Science, Vol. 26, Issue 5, pp. 521-525"

story_application:
  application_idea: "과학·기술·수사 롱폼의 '도미노 메커니즘 체인(Domino Mechanism Chain) 공식'. 원자로 폭발, 해킹, 첨단 바이러스 감염, 밀실 트릭을 설명할 때 '전문 용어의 숲'을 제거하고, '중성자 감속 실패 ➔ 증기 압력 폭증 ➔ 제어봉 파손 ➔ 노심 용융'처럼 중학생도 이해할 수 있는 단계적 인과 도미노 척추를 세워 관객에게 '내가 진짜로 이 엄청난 메커니즘을 완벽히 이해했다'는 극상의 지적 희열을 선물함."
  narrative_stage: "Science/Tech Exposition, Heist Engineering & Murder Mystery Reveal"
  emotional_mechanics:
    trigger: "경이롭고 불가해한 현상/위기의 등장"
    build_up: "설명적 착각을 깨부수는 단계별 인과 부품의 분해"
    peak: "부품 1이 부품 2를 건드려 대재앙/성공으로 이어지는 명쾌한 도미노 격발"
    release: "복잡한 진실이 손에 잡힐 듯 투명해지는 지적 유레카 카타르시스"
  failure_modes: "전문 용어를 쏟아부어 관객의 기를 죽이는 '오만한 난해함' 또는 디테일이 생략되어 납득되지 않는 '마법 같은 억지 기술'"

