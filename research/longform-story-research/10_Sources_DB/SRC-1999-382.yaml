key_contribution: 심적 회계(Mental Accounting) 이론을 종합 체계화. 인간이 돈을 객관적 총액이 아니라 출처, 용도, 주관적 계정에 따라 범주화하며 매몰 비용(Sunk Cost)과 손실 회피에 격렬하게 반응함을 실증.
relevance: 서사에서 거창한 거시 경제 수치가 아닌 시청자가 일상에서 겪는 체감 금전 단위와 기회비용을 배치하여 경제적 공감대를 폭발시키는 심적회계 공명 아키텍처(MRA)의 이론적 토대.
