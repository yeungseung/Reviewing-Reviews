source_id: SRC-1989-194
created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'Brittle teeth and life in the tropics: Seductive details and learning from text'
  authors:
  - Garner, Ruth (Washington State University)
  - Gillingham, Richard (Washington State University)
  - White, C. Stephen (University of Georgia)
  institution: Washington State University & University of Georgia
  published_date: '1989-03-01'
  source_url: https://doi.org/10.1080/10862968909547653
  source_type: Peer-reviewed Journal (Journal of Reading Behavior / Journal of Literacy Research, 21(1), 41-57)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive & Literacy Psychology
  methodology:
    study_type: Experimental Reading Comprehension & Recall Study
    sample_size: 72 (Undergraduate & Upper-elementary readers)
    target_population: 설명 및 서사 텍스트를 읽는 독자층
    relationship_type: Causal (Seductive Details -> Macrostructure Recall Deficit)
    effect_size: 흥미롭지만 구조적으로 무관한 세부정보(Seductive Details)가 삽입된 텍스트를 읽은 집단은 핵심 논지 회상률이 35~45% 급감
    replicated: Highly Replicated (매혹적 세부사항 효과의 원조 창시 논문, 1,200+ 피인용)
    limitations: 인쇄 텍스트 기반 실험으로 시각/영상 멀티미디어 서사에서는 감각적 연출과 결합 시 파급력이 배가됨
claims_and_evidence:
  core_claim: 텍스트의 중심 인과 척추나 거시 구조(Macrostructure)와 무관하지만 피상적 흥미(Emotional Interest)를 끄는 사소한 일화나 세부사항(Seductive Details)은 독자의 제한된 주의 자원을 강탈한다. 독자는 이 자극적이고 쓸데없는 세부는 선명히 회상하지만, 전체 텍스트의 핵심 주제와 논증적 결론은 망각하게 된다.
  verbatim_quotes:
  - original: Seductive details are remembered very well, but they interfere with the recall of important, macro-level text ideas. The interestingness of the detail diverts the reader's attention from the central structural propositions.
    translation: 매혹적 세부사항은 매우 잘 기억되지만, 텍스트의 중요하고 거시적인 핵심 아이디어의 회상을 방해한다. 그 세부의 흥미로움이 독자의 주의를 중심 구조적 명제로부터 딴 데로 돌려버린다.
    citation_location: pp. 41-45
story_application:
  application_idea: 롱폼 스토리의 무기능 세부(Inert/Seductive Details) 박멸 및 씬 정제 엔진. 작가가 재미있다고 생각하여 집어넣은 잡다한 신변잡기(예: 주인공의 기이한 습관, 배경의 엽기적 에피소드 등)가 메인 인과 척추를 어떻게 마비시키는지 진단하고 삭제하는 준거로 활용.
  narrative_stage: Script Editing, Information Pruning & Macro-Narrative Alignment
  emotional_mechanics:
    trigger: 재미있지만 중심 플롯과 무관한 흥미성 일화 노출
    build_up: 독자의 인지 자원이 곁가지 정보에 분산
    peak: 핵심 인과 사슬 및 거시 의미 구축 실패
    release: 지적 공허감 및 이야기의 핵심 메시지 실종
  failure_modes: 재미를 위해 넣은 TMI가 작품 전체의 테마와 질문을 잠식하여 용두사미로 전락하는 현상
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 사실 전달, 인과적 깨달음, 메시지 전달이 핵심인 모든 롱폼 서사 및 다큐멘터리에 엄격히 적용됨
