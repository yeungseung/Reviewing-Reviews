bibliographic_info:
  title: 'Whatever next? Predictive brains, situated agents, and the future of cognitive science'
  authors:
  - Clark, Andy (University of Edinburgh)
  institution: University of Edinburgh
  published_date: '2013-06-01'
  source_url: https://doi.org/10.1017/S0140525X12000477
  source_type: Peer-reviewed Journal (Behavioral and Brain Sciences, 36(3), 181-204)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Science & Philosophy of Mind Monument
  methodology:
    study_type: Theoretical Neurocognitive Paradigm Synthesis & Hierarchical Predictive Coding Review
    sample_size: 신경과학, 인지심리학, 컴퓨터 신경망 모델 수백 편 종합 분석
    target_population: 감각 입력을 처리하고 행동을 생성하는 인간 뇌 인지 시스템
    relationship_type: Foundational Computational Architecture (Hierarchical Predictive Processing: Top-down Generative Predictions vs Bottom-up Prediction Errors)
    effect_size: 인간 뇌는 수동적 감각 수용기가 아니라 끊임없이 '다음 입력(Whatever next)'을 사전 시뮬레이션하는 예측 기계(Prediction Machine)이며, 주의(Attention)는 예측 오차의 정밀도 가중치(Precision Weighting)를 조절하는 메커니즘임을 정립 (4,500+ 피인용 기념비적 고전)
    replicated: Universally Replicated across cognitive neuroscience, AI, and perception psychology
    limitations: 인지신경과학 계산 모델 중심이나 서사 수용 시 관객의 능동적 다음 사건 예측 메커니즘을 설명하는 궁극의 이론적 기초 제공
claims_and_evidence:
  core_claim: 인간의 뇌는 외부 세계의 정보를 단순히 수동적으로 받아들여 처리하는 백지(Tabula Rasa)가 아니다. 뇌는 과거 경험과 멘탈 모델을 바탕으로 매 순간 "다음에 무슨 일이 일어날 것인가?(Whatever next?)"를 끊임없이 하향식(Top-down)으로 시뮬레이션하는 '예측 처리 기계(Predictive Processing Engine)'다. 독자가 스토리를 읽거나 볼 때, 뇌는 결코 가만히 있지 않고 주인공의 다음 행동, 대사, 사건의 결말을 0.1초 단위로 앞서 예측한다. 서사적 몰입의 본질은 이 하향식 예측과 상향식 서사 정보 사이의 정밀한 줄다리기(Prediction-Error Dynamic)에 있다.
  verbatim_quotes:
  - original: Brains are not passive consumers of sensory inputs; they are proactive prediction machines that constantly generate top-down hypotheses about the causes of incoming signals... Perception, cognition, and action are unified under the single imperative of minimizing prediction error.
    translation: 뇌는 감각 입력의 수동적 소비자가 아니다. 뇌는 유입되는 신호의 원인에 대해 하향식 가설을 끊임없이 생성하는 선제적 예측 기계(Prediction Machine)다... 지각, 인지, 행동은 예측 오차를 최소화한다는 단일한 명령 하에 통합된다.
    citation_location: pp. 181-183
story_application:
  application_idea: 롱폼 스토리의 '관객 예측 엔진 (Audience Predictive Engine) 가동 설계'. 스토리텔러는 관객에게 수동적으로 이야기를 들려주는 것이 아니라, 관객의 뇌 안에서 끊임없이 "다음에 무슨 일이 벌어질까?"라는 전방향 예측(Forward Prediction)이 회전하도록 인과적 단서와 떡밥을 배치해야 함. 관객의 예측이 맞았을 때의 확인 쾌감(Validation)과, 예측이 살짝 빗나갔을 때의 놀람(Prediction Error Dopamine)을 교차 설계하여 뇌를 서사에 완벽히 종속시킴.
  narrative_stage: Plot Pacing, Foreshadowing & Narrative Drive Engine
  emotional_mechanics:
    trigger: 미완의 사건이나 인물의 선택 앞에서 가동되는 본능적 하향식 예측
    build_up: 예측의 불확실성이 커지며 전두엽의 주의 집중 및 긴장감 상승
    peak: 예측과 실제 사건이 충돌하거나 절묘하게 맞아떨어지는 인지적 순간
    release: 예측 오차가 해소되며 분비되는 지적 만족감과 카타르시스
  failure_modes: 관객이 아무것도 예측할 수 없게 무작위(Random) 사건만 나열하거나, 너무 뻔해서 0.1초 만에 예측이 끝나 뇌가 꺼져버리는(Boredom) 서사적 나태
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 롱폼 서사, 영화, 드라마, 추리물, 탐사보도 및 인터랙티브 스토리텔링에 보편 적용
