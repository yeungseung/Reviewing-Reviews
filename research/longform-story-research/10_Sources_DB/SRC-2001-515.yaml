id: SRC-2001-515
author: Barbara L. Fredrickson
year: 2001
title: "The role of positive emotions in positive psychology: The broaden-and-build theory of positive emotions"
venue: "American Psychologist, 56(3), 218-226"
tier: 1
citation_count: 14800
url: https://doi.org/10.1037/0003-066X.56.3.218
key_contribution: "확장-구축 이론(Broaden-and-Build Theory)과 중화 가설(Undoing Hypothesis) 제창. 부정 정서가 수용자의 인지적 주의를 투쟁-도피 생존 반응으로 협착(Narrowing)시키는 반면, 긍정 정서(희망, 안도, 기쁨)는 사고-행동 레퍼토리를 확장하고 장기적 심리 자원을 구축함. 특히 긍정 정서가 부정 정서로 유발된 자율신경계·심혈관계 각성을 정상 기저선으로 신속히 복귀시키는 '중화 효과(Undoing Effect)'를 실증."
relevance: "내러티브 후반부의 포지티브 리프레임이 단순한 낙관론 전달을 넘어, 전반부의 부정적 서사 갈등으로 인해 고조된 수용자의 생리적·인지적 피로를 회복시키고 장기 기억 및 재방문 의도를 강화하는 신경심리학적 메커니즘 제공."
themes:
  - "#53 Theme 2"
