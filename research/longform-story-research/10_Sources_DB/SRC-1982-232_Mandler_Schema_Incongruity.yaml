bibliographic_info:
  title: 'The structure of value: Accounting for taste'
  authors:
  - Mandler, George (University of California, San Diego)
  institution: University of California, San Diego (UCSD)
  published_date: '1982-01-01'
  source_url: https://psycnet.apa.org/record/1983-02484-001
  source_type: Book Chapter / Academic Synthesis (In M. S. Clark & S. T. Fiske (Eds.), Affect and Cognition: The 17th Annual Carnegie Symposium on Cognition, pp. 3-36)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Emotion Theory & Schema Incongruity Benchmark
  methodology:
    study_type: Theoretical Cognitive Affect Model Formulation & Schema Resolution Experiments Synthesis
    sample_size: 인지 스키마, 지각적 불일치 해소 및 정서 평정 실험 다수 종합
    target_population: 자극을 기존 스키마와 대조하여 미적/정서적 가치를 평가하는 인간 관객
    relationship_type: Non-linear Affective Valuation (Schema Congruity produces Mild Familiarity, Extreme Incongruity produces Frustration, Moderate Incongruity produces High Positive Affect)
    effect_size: 스키마와의 일치도(Congruity)가 완전할 때는 지루함/단순 선호(Mild Liking)에 그치고, 극단적 불일치(Extreme Incongruity)는 인지적 실패로 부정적 정서를 낳지만, '해결 가능한 적당한 불일치(Resolvable Moderate Incongruity)'는 인지적 조절(Accommodation)을 통해 가장 강렬하고 긍정적인 미적 쾌감을 유발함을 증명 (1,500+ 피인용 고전)
    replicated: Universally Replicated in consumer psychology, advertising, narrative structure, and art appreciation
    limitations: 정적 인지 자극에서 발전하였으나 동적 서사 플롯의 반전과 서사적 기대 이론의 기본 골격 제공
claims_and_evidence:
  core_claim: 인간의 미적·정서적 평가는 자극이 기존의 인지적 '스키마(Schema)'와 어떻게 상호작용하느냐에 의해 결정된다(Schema Incongruity Theory). 스키마와 완벽히 일치하는 서사는 처리하기는 편하지만(Cognitive Ease) '진부함(Boredom/Cliché)'을 느껴 깊은 감흥을 주지 못한다. 반대로 스키마와 너무 심하게 동떨어져 관객의 멘탈 모델로 도저히 수습할 수 없는 극단적 불일치는 '인지적 좌절(Frustration)'과 거부감을 유발한다. 가장 탁월한 서사적 쾌감은 '기존 스키마를 약간 위반하지만, 약간의 지적 노력으로 새로운 논리로 통합(Accommodation)할 수 있는 적당한 불일치(Moderate Incongruity)'에서 발생한다.
  verbatim_quotes:
  - original: Congruity is generally preferred over incongruity, but it leads to mild positive affect. Severe incongruities that cannot be resolved produce negative affect and distress. However, moderate incongruities that can be successfully resolved through cognitive elaboration result in intense positive affect and a sense of mastery.
    translation: 일치성은 일반적으로 불일치보다 선호되지만, 이는 미지근한 긍정적 정동만을 낳는다. 해결될 수 없는 심각한 불일치는 부정적 정동과 고통을 초래한다. 그러나 인지적 정교화를 통해 성공적으로 해결될 수 있는 '적당한 불일치'는 강렬한 긍정적 정동과 숙달의 쾌감을 가져온다.
    citation_location: pp. 21-23
story_application:
  application_idea: 롱폼 스토리의 '적당한 스키마 불일치 (Moderate Schema Incongruity) 플롯 설계'. 장르적 클리셰(예: 형사물, 로맨스, 무협)의 80% 골격은 관객의 기본 스키마를 만족시켜 친숙함을 확보하되, 결정적 인물의 동기나 사건 해결 방식 20%에서 '신선하지만 논리적으로 납득 가능한 비틀기'를 주어야 함. 관객이 처음에는 "어? 저게 왜 저러지?" 하다가 30초 뒤 "아! 저렇게 풀 수도 있구나!"라며 스키마를 스스로 갱신(Accommodation)할 때 최고의 서사적 찬사가 나옴.
  narrative_stage: Plotting, Character Arc Subversion, Cliché Twisting & Climactic Resolution
  emotional_mechanics:
    trigger: 기존 장르 스키마를 살짝 비트는 뜻밖의 인물 선택이나 상황 전개
    build_up: 스키마 불일치를 해결하기 위한 독자의 능동적 멘탈 모델 탐색과 정교화
    peak: 숨겨진 연결고리를 발견하며 불일치가 완벽하게 봉합(Resolution)되는 순간
    release: 지적 숙달감(Sense of Mastery)과 함께 터져 나오는 감탄과 심미적 쾌감
  failure_modes: 전형적 클리셰만 답습하여 하품을 유발하는 완전 일치(Total Congruity), 혹은 세계관의 물리법칙과 개연성을 파괴하여 관객을 멘붕에 빠뜨리는 극단적 불일치(Extreme Irresolvable Incongruity)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 장르 문학, 대중 상업 영화, OTT 시리즈, 만화/웹툰 등 스키마 기반 대중 서사에 보편 적용
