id: SRC-2012-377
author: Stephan Lewandowsky, Ullrich K. H. Ecker, Colleen M. Seifert, Norbert Schwarz, & John Cook
year: 2012
title: 'Misinformation and its correction: Continued influence and successful debiasing'
venue: Psychological Science in the Public Interest
tier: 1
citation_count: 2540
url: https://doi.org/10.1177/1529100612451018
key_contribution: 오정보의 지속 영향 효과(Continued Influence Effect)와 올바른 디바이아싱(Debiasing) 메커니즘 종합. 허위 주장과 과학적 진실을 동등하게 나열하는 허위 동등성(False Equivalence)을 비판하고, 대중의 마음속 빈 공간을 채워주는 '대체 인과 서사(Alternative Causal Narrative)'를 제공해야만 오정보를 성공적으로 퇴출하고 신뢰를 구축할 수 있음을 규명.
relevance: 팩추얼 및 다큐멘터리 서사에서 단순 반박을 넘어 설득력 있는 대체 인과 서사를 완비하여 수용자의 인지적 공백과 편향을 해소하는 서사 공학의 핵심 준거.
themes:
- '#41 Theme 3'
