claims_and_evidence:
  core_claim: "인간의 인지 및 동기 시스템은 '위계적 피드백 루프(Hierarchical Feedback Loops)'로 조직화되어 있다. 최상위 시스템 개념(System Concepts / Big Question) 아래 원리(Principles / Chapter Subgoals), 최하위 프로그램(Programs / Micro Actions)이 존재하며, 상위 루프가 열려 있는 상태에서 하위 루프의 연속적 완수(Micro-Closure)가 발생할 때 도파민 피드백이 발생하여 거대한 상위 목표를 향한 인지적 끈기(Tenacity)가 유지된다."
  verbatim_quotes:
    - original: "Behavior is a continuous process of feedback control, organized hierarchically... Superordinate goals provide meaning and direction, while subordinate goals provide manageable actionable steps. Progress on lower loops fuels persistence on higher loops."
      translation: "행동은 피드백 제어의 연속적인 과정이며, 위계적으로 조직화되어 있다... 상위 목표는 의미와 방향을 제공하고, 하위 목표는 관리 가능한 실행 단계를 제공한다. 하위 루프에서의 진전은 상위 루프에 대한 지속성을 불태운다."
      citation_location: "Cambridge University Press, p. 12-15, 120"

story_application:
  application_idea: "롱폼 스토리의 '3계층 위계적 오픈 루프(Hierarchical 3-Tier Open Loop)' 구조의 이론적 토대. 2시간짜리 영화나 30분짜리 다큐멘터리에서 거대한 질문(Big Question: '그는 살인범인가?') 하나만 열어두면 관객은 15분 만에 지치지만, 그 아래 5분짜리 챕터 서브골('알리바이 확인')과 1분짜리 마이크로 퀘스트('비밀번호 해독')를 순차적으로 열고 닫아줄 때 하위 피드백이 상위 몰입을 완벽하게 견인함."
  narrative_stage: "Overall Story Architecture (Macro / Meso / Micro Loops)"
  emotional_mechanics:
    trigger: "상위 거대 목표(Big Loop) 설정"
    build_up: "하위 목표들의 분투와 단계적 해결(Subgoal Resolution)"
    peak: "하위 루프들의 성과가 모여 최상위 거대 루프를 타격하는 순간"
    release: "전체 위계 시스템의 완전한 종결 및 극적인 성취감"
  failure_modes: "하위 루프가 상위 루프에 기여하지 못하고 겉돌 때 발생하는 '서사적 산포(Narrative Dissipation)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "하위 루프의 결과가 상위 루프의 해결 가능성에 실질적인 영향(Feedback)을 미쳐야 함"
