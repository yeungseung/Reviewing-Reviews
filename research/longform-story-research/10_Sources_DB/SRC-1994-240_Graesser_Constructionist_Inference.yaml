source_id: SRC-1994-240
created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: Constructing inferences during narrative text comprehension
  authors:
  - Graesser, Arthur C. (University of Memphis)
  - Singer, Murray (University of Manitoba)
  - Trabasso, Tom (University of Chicago)
  institution: University of Memphis & University of Chicago
  published_date: '1994-07-01'
  source_url: https://doi.org/10.1037/0033-295X.101.3.371
  source_type: Peer-reviewed Journal (Psychological Review, 101(3), 371-395)
credibility_assessment:
  credibility_tier: Tier 1 Narrative Cognition & Discourse Comprehension Monument
  methodology:
    study_type: Theoretical Formulation of Constructionist Model & Multi-method Reading Time / Probe-Word Verification Experiments
    sample_size: 다수의 서사 독해 실험 수백 명 피험자 반응 시간 및 인과 추론 발화 데이터
    target_population: 서사 텍스트를 읽고 멘탈 모델(상황 모델, Situation Model)을 구축하는 인간 독자
    relationship_type: Foundational Theoretical Framework (The Constructionist Theory: Search-after-Meaning Principle)
    effect_size: 독자는 텍스트를 수동적으로 수용하지 않고 의미를 적극적으로 탐색하는 '의미 추구 원칙(Search-after-Meaning Principle)'에 따라 작동함을 규명. 1) 인물의 상위 목표, 2) 사건의 인과적 선행 조건, 3) 텍스트의 국소적·거시적 일관성을 확립하기 위한 추론을 온톨로지적으로 '스스로 구성(Construct)'함을 입증 (2,200+ 피인용 기념비적 고전)
    replicated: Universally Replicated across discourse processing, psycholinguistics, and cognitive literary theory
    limitations: 문자 텍스트 중심 연구이나 영화 및 영상 서사의 시각적 몽타주 추론 이해에도 동일하게 적용됨
claims_and_evidence:
  core_claim: 서사 이해의 본질은 '구성(Construction)'이다. 텍스트의 표면 문장(Surface Code)은 빙산의 일각에 불과하며, 독자는 텍스트가 제공하는 인과적 단서들을 재료 삼아 뇌 속에서 완전한 '상황 모델(Situation Model)'을 능동적으로 구축한다(Constructionist Theory). 독자는 텍스트의 인과적 일관성을 유지하기 위해 끊임없이 세 가지 핵심 질문을 던진다: "인물의 목표는 무엇인가?", "왜 이 사건이 일어났는가?", "이 사건의 원인은 무엇인가?". 작가가 결론을 완성형으로 주지 않고 단서의 원자재(Raw Clues)만을 제공할 때, 독자의 뇌는 이 세 가지 추론 엔진을 100% 풀가동하여 텍스트의 인과적 빈틈을 메우며 깊은 서사적 몰입을 경험한다.
  verbatim_quotes:
  - original: Comprehension is a search after meaning... Readers construct inferences to address three critical prongs: the reader's goals, local and global narrative coherence, and explanatory causes of events. Readers do not merely encode the explicit text; they actively construct a coherent mental world.
    translation: 이해는 의미의 추구다... 독자는 세 가지 핵심 갈래, 즉 독자의 목표, 국소적 및 거시적 서사 일관성, 그리고 사건의 설명적 원인을 다루기 위해 추론을 구성한다. 독자는 명시적 텍스트를 단순히 부호화하는 것이 아니라, 일관된 멘탈 세계를 능동적으로 구성한다.
    citation_location: pp. 371-373
story_application:
  application_idea: 롱폼 스토리의 '단서 원자재 공급 및 상황 모델 구성 공식 (Clue Ingredients & Situation Model Construction)'. 작가는 완성된 요리(설명과 결론)를 관객의 입에 쑤셔 넣지 말고, 신선한 식재료(단서, 알리바이, 인물의 숨은 목표)만을 씬 곳곳에 던져두어야 함. 관객의 뇌가 '의미 추구 원칙'에 따라 스스로 인과 사슬을 엮어 하나의 완결된 상황 모델을 구축하도록 판을 깔아줄 때, 관객은 이야기에 완벽히 동화됨.
  narrative_stage: Plot Architecture, Clue Placement, Exposition Management & Pacing
  emotional_mechanics:
    trigger: 명시적으로 설명되지 않은 인과적 의문점(왜 저 사건이 발생했는가?) 직면
    build_up: 텍스트의 파편적 단서들을 엮어 일관된 상황 모델을 구성하려는 인지적 추론 가동
    peak: 인물의 숨은 목표와 사건의 원인이 하나의 단단한 인과 사슬로 연결되는 순간
    release: 분절된 정보들이 완벽한 하나의 세계관으로 통합되며 얻는 지적 카타르시스
  failure_modes: 인과적 단서를 전혀 주지 않고 무작위로 사건을 전개하여 독자의 상황 모델 구성을 원천 차단하는 인과 단절의 죄악
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 장르의 소설, 각본, 영화 연출, 웹소설 플롯 직조에 보편 적용
