key_contribution: 인지적 평가 이론(Cognitive Appraisal Theory)을 정초. 감정은 사건 자체가 아니라 사건에 대한 '의미 평가(Meaning Appraisal: 1차 평가인 목표 관련성/일치성과 2차 평가인 대처 가능성)'를 거쳐 비로소 촉발됨을 신경인지심리학적으로 규명.
relevance: 마이크로 스토리 블록에서 단순한 '증거/행동' 뒤에 왜 '의미(Meaning)' 평가 단계가 반드시 존재해야만 관객의 감정/판단 변화(Emotional Turn)가 유발되는지 설명하는 이론적 초석.
