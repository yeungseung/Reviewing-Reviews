bibliographic_info:
  title: 'On the psychology of prediction'
  authors:
  - Kahneman, Daniel (Hebrew University of Jerusalem)
  - Tversky, Amos (Hebrew University of Jerusalem)
  institution: Hebrew University of Jerusalem
  published_date: '1973-07-01'
  source_url: https://doi.org/10.1037/h0034747
  source_type: Peer-reviewed Journal (Psychological Review, 80(4), 237-251)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Psychology & Behavioral Economics Monument
  methodology:
    study_type: Controlled Experimental Decision Studies (Tom W. & Lawyer-Engineer Problems)
    sample_size: 400+ (Graduate students and high-level professionals)
    target_population: 확률적 예측 및 인물/사건 평가를 수행하는 인간 의사결정자
    relationship_type: Causal Cognitive Bias (Vivid Descriptive Narrative -> Base-Rate Neglect & Overconfidence)
    effect_size: 피험자들은 생생한 개별 인격 묘사(일화)가 주어졌을 때, 객관적인 사전 확률(기저율, Prior Base Rate)을 거의 100% 무시하고 오직 일화의 전형성(Representativeness)에만 의존하여 극단적인 예측 오류를 저지름 (6,500+ 피인용 기념비적 연구)
    replicated: Universally Replicated across hundreds of cross-cultural studies
    limitations: 실험실 예측 과제 기반이나 롱폼 스토리에서 일화와 통계 데이터의 균형 메커니즘을 규명하는 핵심 근거
claims_and_evidence:
  core_claim: 인간의 직관은 생생한 개별 일화(Anecdote)나 인물 묘사를 접하면, 대상 집단의 객관적 기저율(Base Rate, 전체 통계)을 완전히 망각하거나 무시한다(Base-Rate Neglect). 일화만으로 서사를 끌고 가면 독자는 단 하나의 극단적 사례를 전체 현상인 양 착각하여 왜곡된 확신에 빠지며, 반대로 기저율 통계만 제시하면 독자는 이를 기억하지 못한다. 진정한 서사의 신뢰는 '개별 일화가 전체 기저율의 몇 퍼센트를 대표하는가'를 투명하게 결합할 때에만 성립한다.
  verbatim_quotes:
  - original: In making predictions and judgments under uncertainty, people do not appear to follow the calculus of chance or the statistical theory of prediction. Instead, they rely on a limited number of heuristics which sometimes yield reasonable judgments and sometimes lead to severe and systematic errors... prior probabilities are completely effectively ignored when descriptive information is given.
    translation: 불확실성 하에서 예측과 판단을 내릴 때 사람들은 확률 계산이나 예측의 통계 이론을 따르지 않는 것으로 보인다. 대신 때로는 합리적이지만 때로는 심각하고 체계적인 오류를 낳는 제한된 수의 휴리스틱에 의존한다... 묘사적 정보(구체적 이야기)가 주어지면 사전 확률(기저율)은 완전히 무시된다.
    citation_location: pp. 237-241
story_application:
  application_idea: 롱폼 스토리의 '기저율 앵커링(Base-Rate Anchoring) 결합 공식'. 극적인 주인공의 개별 일화(예: 로또 당첨자, 극단적 의료 사고 피해자)를 서사적으로 풀어나가되, 관객이 착시(Base Rate Neglect)에 빠져 팩트의 객관성을 잃지 않도록 "이 주인공의 비극은 전체 환자의 0.02%에 불과한 희귀 사례인가, 아니면 침묵하는 40%의 보편적 재앙인가?"라는 기저율 앵커를 인과적으로 통합함.
  narrative_stage: Exposition Calibration & Perspective Framing
  emotional_mechanics:
    trigger: 강렬한 개별 인물의 일화에 대한 충격과 과잉 일반화의 위험
    build_up: 그 일화가 전체 시스템에서 차지하는 객관적 통계(기저율) 데이터의 조명
    peak: 일화의 특수성과 기저율의 보편성이 입체적으로 충돌하며 생기는 지적 각성
    release: 감정적 카타르시스와 지적 객관성이 동시에 확보되는 완전한 신뢰감 형성
  failure_modes: 일화 하나만 자극적으로 부각시켜 전체를 왜곡하는 황색 선동 서사, 혹은 통계만 읊조려 아무런 인간적 전형성을 보여주지 못하는 지루한 학술 논문
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 탐사보도, 논픽션 전기, 의학/법정 서사, 비즈니스 케이스 스터디 등 사실에 기반한 모든 롱폼 장르
