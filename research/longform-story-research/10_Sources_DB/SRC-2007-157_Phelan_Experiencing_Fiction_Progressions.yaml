claims_and_evidence:
  core_claim: "서사의 전개(Narrative Progression)는 이야기 차원의 사건적 '불안정성(Instabilities: 인물 간의 갈등, 미해결 사건)'과 담론/수사 차원의 '긴장(Tensions: 서술자와 관객 간의 지식 격차, 윤리적 불안)'이라는 이중 동력으로 구동된다. 특히 관객은 대사나 명시적 질문 없이도 인물의 수상한 시선, 숨겨진 사물, 불길한 침묵 등 미장센의 수사학적 불일치로부터 '암묵적 오픈 루프(Implicit Open Loops)'를 직관적으로 감지하며, 국소적 사건의 종결(Local Resolution)이 오히려 전역적 판돈(Global Stakes)을 극대화하는 역설적 추진력을 형성한다."
  verbatim_quotes:
    - original: "Narrative progression is generated by instabilities between characters and tensions between tellers and audiences... Local completions often generate new, deeper instabilities at the global level. Silence and visual discordance act as powerful implicit progression-prompts."
      translation: "서사의 전개는 인물들 간의 불안정성과 화자와 관객 간의 긴장에 의해 생성된다... 국소적인 완결은 종종 전역적인 차원에서 새롭고 더 깊은 불안정성을 만들어낸다. 침묵과 시각적 불일치는 강력한 암묵적 전개 촉진제로 작동한다."
      citation_location: "Ohio State University Press, p. 1-22, 115"

story_application:
  application_idea: "명시적 대사 없는 '암묵적 오픈 루프(Implicit Loop)' 및 '국소 해결을 통한 전역 긴장 고조' 테크닉. 인물이 서랍 속에 무언가를 황급히 숨기는 1초짜리 씬 하나만으로 대사 없이 거대한 암묵적 루프를 점화하고, 중간 시퀀스 악당을 체포하는 국소 해결이 오히려 '더 거대한 흑막의 함정에 빠졌음'을 드러내는 다층 전개 공식."
  narrative_stage: "Narrative Progression & Implicit Scene Staging"
  emotional_mechanics:
    trigger: "화면 내 시각적/윤리적 불일치 발견(Implicit Instability)"
    build_up: "대사 없는 침묵 속에서 증폭되는 관객의 직관적 의문"
    peak: "국소적 위기가 해결되는 순간 터져 나오는 더 큰 전역적 위기의 폭로"
    release: "표면적 안도와 동시에 심층적 긴장이 교차하는 이중 감정선"
  failure_modes: "암묵적 단서가 너무 모호하여 관객이 아예 눈치채지 못하고 지나치는 '인지적 비가시성(Cognitive Invisibility)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "암묵적 단서는 관객의 시지각적 주의 초점(Visual Saliency) 내에 명확히 포착되어야 함"
