  methodology:
    study_type: "Rhetorical Formalism & Reader-Response Narrative Analysis"
    sample_size: "Extensive corpus of classic and contemporary narrative fiction"
    target_population: "서사 수용자의 정서적·인지적·윤리적 판단 및 서사 전개(Progression) 경험"
    relationship_type: "Structural and Rhetorical-Dynamic"
    effect_size: "불안정성(Instabilities)과 긴장(Tensions)의 이중 축이 서사 추진력(Progression)에 미치는 영향 규명"
    replicated: "Highly Replicated (수사학적 서사학의 현대 정준, 1,500+ 피인용)"
