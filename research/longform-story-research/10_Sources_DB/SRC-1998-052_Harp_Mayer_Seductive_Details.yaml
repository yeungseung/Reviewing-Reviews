  title: "How seductive details do their damage: A theory of cognitive interest in science learning"
  authors:
    - "Harp, Shannon F. (University of California, Santa Barbara)"
    - "Mayer, Richard E. (University of California, Santa Barbara)"
  institution: "University of California, Santa Barbara (UCSB)"
  published_date: "1998-09-01"
