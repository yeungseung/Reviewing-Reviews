claims_and_evidence:
  core_claim: "도덕적 분노 피로(Outrage Fatigue)와 공감의 고갈: 도덕적 분노(Moral Outrage)는 원래 값비싼 처벌 비용을 수반하는 희귀한 사회적 신호였으나, 미디어 환경에서 무차별적으로 반복 소비될 때 신경계는 '분노 피로(Outrage Fatigue)'와 '공감 피로(Compassion Fatigue)'에 도달한다. 끊임없이 자극되는 분노는 뇌의 보상계와 편도체를 과부하 상태로 몰아넣어, 결국 수용자는 타인의 고통과 불공정에 대해 무감각해지고 냉소적 방어(Cynical Detachment)를 취하게 된다."
  verbatim_quotes:
    - original: "Constant exposure to outrage-inducing stimuli can lead to outrage fatigue, where individuals become desensitized to moral transgressions, diminishing their capacity for genuine empathy and collective action."
      translation: "격분을 유발하는 자극에 끊임없이 노출되면 분노 피로가 유발될 수 있으며, 여기서 개인은 도덕적 위반에 대해 둔감해져 진정한 공감과 집단적 행동을 위한 역량이 감퇴된다."
      citation_location: "pp. 769-771"

story_application:
  application_idea: "사이다 복수극이나 사회 비판 드라마에서 악인의 만행(도덕적 분노 트리거)을 쉼 없이 퍼부으면, 관객은 억울함에 분노하기보다 '분노 피로'를 느껴 채널을 돌림. 수용자의 공감 자원을 보호하려면 악행의 강도를 높이지 말고, 분노 자극 사이에 인물의 일상적 온기와 지적 유머를 배치하여 공감 배터리를 재충전시켜야 함."
  narrative_stage: "Act 2 Escalation Control & Compassion Resource Management"
  emotional_mechanics:
    trigger: "과도한 빈도의 도덕적 위반 및 잔혹 자극 노출"
    build_up: "공감 자원의 고갈과 신경계 피로 누적"
    peak: "분노 피로 도달 및 정서적 냉소화(Cynical Detachment)"
    release: "공감 요구 중단 및 안정 구간을 통한 정서 회복"
  failure_modes: "끝없는 피해자 학대와 가해자의 악행만을 나열하여 관객을 지치게 만드는 '고통 포르노(Trauma Porn)' 실패"

