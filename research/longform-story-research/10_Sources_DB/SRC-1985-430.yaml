id: SRC-1985-430
author: Tom Trabasso & Paul van den Broek
year: 1985
title: 'Causal thinking and the representation of narrative events'
venue: Journal of Memory and Language
tier: 1
citation_count: 1850
url: https://doi.org/10.1016/0749-596X(85)90049-X
key_contribution: 서사 이해에서의 인과 사슬 및 국소 목표망(Causal Network & Local Goals)의 심리적 표상을 규명. 주인공의 즉각적이고 구체적인 국소 목표(Local Goal)가 설정되고 인과적으로 연결될 때 독자의 작업 기억 유지율과 텍스트 정보 회상률이 2.5배 급증함을 실증.
relevance: 마이크로 스토리 블록이 국소 목표 구조(Local Goal Structure)를 통해 관객의 순간순간 주의(Moment-to-moment Attention)를 붙잡아두는 핵심 인지 메커니즘 근거.
themes:
