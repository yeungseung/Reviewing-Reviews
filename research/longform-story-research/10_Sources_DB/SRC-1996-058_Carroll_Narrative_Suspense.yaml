claims_and_evidence:
  core_claim: "서스펜스 긴장은 질문-답변의 수사학적 구조(Erotetic Narration)에서 발생하며, 구체적으로 두 가지 상반된 결과 중 도덕적으로 바람직한 결과는 일어날 확률이 낮고(morally correct but unlikely), 도덕적으로 끔찍한 결과는 일어날 확률이 높을 때(evil/catastrophic but highly likely) 서사적 긴장이 극대화된다."
  verbatim_quotes:
    - original: "Suspense is generated when the narrative frames an erotetic situation with two mutually exclusive outcomes: one morally desirable but improbable, and the other morally undesirable but probable."
      translation: "서스펜스는 서사가 상호 배타적인 두 가지 결과를 지닌 질문 상황을 구성할 때 발생한다. 즉 하나는 도덕적으로 바람직하지만 일어날 것 같지 않고, 다른 하나는 도덕적으로 끔찍하지만 일어날 가능성이 매우 높을 때이다."
      citation_location: "pp. 75-81"

story_application:
  application_idea: "Desire vs Obstacle 및 Question 엔진을 서스펜스로 승화시키려면, 단순히 주인공이 목표를 이루는가가 아니라 악조건의 확률을 극대화(주인공 성공 확률 10%, 파멸 확률 90%)하여 도덕적 절박감과 시간 제한(Ticking Clock)을 결합해야 함."
  narrative_stage: "Act 2 Crisis to Act 3 Climax"
  emotional_mechanics:
    trigger: "두 가지 상반된 미래 결과(파멸 vs 구원)의 명확한 가시화"
    build_up: "파멸의 확률이 점점 압도적으로 높아지는 악화 시퀀스"
    peak: "기적이 일어나지 않으면 끝장나는 최후의 순간"
    release: "극적 모면 또는 비극적 수용을 통한 긴장 방출"
  failure_modes: "결과에 대한 도덕적 편향(관객이 어느 쪽이든 상관없다고 느낌)이 없거나, 양쪽 확률이 50:50으로 평이하면 서스펜스가 죽음"

