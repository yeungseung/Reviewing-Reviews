created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: Counterfactual thinking
  authors:
  - Roese, Neal J. (Northwestern University)
  institution: Northwestern University, Department of Psychology
  published_date: '1997-01-01'
  source_url: https://doi.org/10.1037/0033-2909.121.1.133
  source_type: Peer-reviewed Journal (Psychological Bulletin, 121(1), 133-148)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive & Social Psychology Benchmark
  methodology:
    study_type: Theoretical Psychological Synthesis & Meta-Analysis of Behavioral Decision-Making Experiments
    sample_size: 사후가정적 사고, 감정적 후회, 안도감 실험 수십 편 수천 명 데이터 종합
    target_population: 과거의 결과에 직면하여 대안적 시나리오를 시뮬레이션하는 인간 인지 시스템
    relationship_type: Causal Functional Mechanism (Counterfactual Comparison Modulates Emotional Intensity: Upward drives Regret/Tragedy, Downward drives Relief)
    effect_size: 인간은 부정적 결과에 직면했을 때 "만약 ~했더라면(What if...)"이라는 대안을 자동적으로 멘탈 시뮬레이션함을 규명. 1) 상향적 사후가정(Upward Counterfactual: 더 나은 대안 상상)은 후회, 슬픔, 비극적 파토스를 증폭시키고, 2) 하향적 사후가정(Downward Counterfactual: 더 나쁜 대안 상상)은 안도감과 감사를 촉발함을 체계화 (2,200+ 피인용 대표 논문)
    replicated: Universally Replicated across narrative emotion, decision making, and clinical psychology
    limitations: 일상적 의사결정 연구에서 정립되었으나 비극 문학 및 드라마의 파토스(Pathos) 분석에 핵심 이론으로 차용됨
claims_and_evidence:
  core_claim: 인간의 감정은 현실에서 일어난 사실 자체에만 반응하지 않는다. 감정의 진폭은 '일어날 수도 있었던 가상의 대안적 결과(Counterfactual Alternatives)'와의 인지적 비교에서 비롯된다. 특히 결과가 약간의 우연이나 사소한 선택 차이로 뒤바뀔 수 있었던 '아슬아슬한 근접성(Near-Miss Condition)'이 존재할 때 사후가정적 사고는 폭발적으로 점화된다. 서사에서 관객의 눈물을 쥐어짜는 비극의 파토스(Tragic Pathos)는 "그때 주인공이 기차를 놓치지만 않았더라면", "그 편지가 제시간에 도착했더라면"이라는 상향적 사후가정을 관객 머릿속에서 끊임없이 재생시키는 '근접 실패(Near-Miss Failure)' 연출에 의해 완성된다.
  verbatim_quotes:
  - original: Counterfactual thinking focuses on how the past might have been different. Upward counterfactuals, which imagine better alternative outcomes, intensify negative affect (regret, grief) but prepare future adaptive action. Downward counterfactuals, imagining worse outcomes, elicit positive affect (relief, gratitude). Emotional intensity is directly proportional to how easily the alternative outcome can be mentally mutated.
    translation: 사후가정적 사고는 과거가 어떻게 달라질 수 있었는지에 초점을 맞춘다. 더 나은 대안적 결과를 상상하는 상향적 사후가정은 부정적 정동(후회, 비탄)을 강화하지만 미래 적응적 행동을 준비시킨다. 더 나쁜 결과를 상상하는 하향적 사후가정은 긍정적 정동(안도, 감사)을 유도한다. 감정적 강도는 대안적 결과가 얼마나 쉽게 머릿속에서 변형될 수 있는가에 정비례한다.
    citation_location: pp. 133-135
story_application:
  application_idea: 롱폼 스토리의 '사후가정적 비극 파토스 증폭 공식 (Counterfactual Pathos Amplification Formula)'. 관객에게 깊은 슬픔과 여운을 남기려면, 주인공이 불가항력의 거대한 운명에 의해 무력하게 당하는 것보다, '단 1초의 오차'나 '사소한 엇갈림'으로 인해 구원의 기회를 아슬아슬하게 놓치는 '근접 비극(Near-Miss Tragedy)'을 연출해야 함. 관객 스스로 머릿속에서 "아, 제발 그때 뒤돌아봤어야 했는데!"라는 상향적 사후가정을 수백 번 굴리게 만듦으로써 가슴을 쥐어뜯는 비극적 몰입을 창출함.
  narrative_stage: Tragedy Climax, Missed Opportunity, Heartbreaking Twist & Epilogue
  emotional_mechanics:
    trigger: 눈앞에서 1초 차이로 어긋나는 운명의 갈림길(Near-Miss) 목격
    build_up: "만약 저러지 않았더라면 살았을 텐데"라는 상향적 가상 시뮬레이션의 폭주
    peak: 돌이킬 수 없는 결과의 확정과 함께 터져 나오는 처절한 후회와 비탄
    release: 비극적 필연성을 수용하며 발생하는 숭고한 미적 애도(Sublime Mourning)
  failure_modes: 처음부터 완전히 패배가 예정되어 있어 어떤 대안도 상상할 수 없는 건조한 파멸(Dry Doom), 혹은 관객이 사후가정을 굴릴 여지도 없이 허무하게 소모되는 죽음
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 멜로, 비극, 전쟁물, 성장통 서사, 역사 르포 등 인간적 후회와 운명의 엇갈림을 다루는 모든 롱폼 서사에 100% 적용
