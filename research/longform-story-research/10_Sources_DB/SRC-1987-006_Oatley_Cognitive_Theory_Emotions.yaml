claims_and_evidence:
  core_claim: "인간의 기본 감정(기쁨, 슬픔, 분노, 공포, 혐오)은 목표 추구 과정에서 발생하는 인지적 평가 신호이며, 서사(Story)의 본질은 이러한 목표-장애물 관리 시퀀스의 인지적 시뮬레이션임."
  verbatim_quotes:
    - original: "Each basic emotion is a communicative signal that resets the system to manage goal progress: happiness signals goal achievement, sadness signals goal loss, anger signals obstacle frustration, and fear signals threat to self-preservation."
      translation: "각 기본 감정은 목표 진행을 관리하기 위해 시스템을 재설정하는 의사소통 신호이다. 행복은 목표 달성을, 슬픔은 목표 상실을, 분노는 장애물로 인한 좌절을, 공포는 자기 보존에 대한 위협을 알린다."
      citation_location: "p.35"

story_application:
  application_idea: "등장인물의 감정을 바꾸려면 억지 감정 연출을 하지 말고, 주인공의 목표 진행 상태(Goal Progress)를 급변시키는 사건을 던져라. 하위 목표가 달성되면 관객은 기쁨을, 목표가 영구히 차단되면 즉각 슬픔을 느낀다."
  narrative_stage: "Plot Turning Points & Sequences"
  emotional_mechanics:
    trigger: "목표의 진행률 변동 (달성, 좌절, 상실)"
    build_up: "목표 달성에 대한 시청자의 열망"
    peak: "목표 상태의 결정적 전환"
    release: "다음 목표로의 시스템 재설정 (Reset)"
  failure_modes: "주인공의 목표가 불분명하거나 시청자가 동의하지 못하면 아무리 사건이 터져도 감정 반응이 발화하지 않음"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "목표 지향적 서사 구조를 갖는 모든 콘텐츠"
