claims_and_evidence:
  core_claim: "보유 효과(Endowment Effect)와 객관적 규모를 압도하는 주관적 가치: 인간은 어떤 대상을 일단 소유(Endow)하거나 정서적 유대를 맺는 순간, 그 대상에 객관적 시장 가격이나 물리적 규모를 2~3배 이상 초과하는 주관적 가치를 부여하며 그것을 빼앗기지 않으려 극심하게 저항한다(WTA > 2 * WTP). 이야기에서 관객과 주인공을 움직이는 것은 '100억 원'이라는 객관적 액수의 거대함이 아니라, 인물의 손때가 묻고 추억이 깃든 '낡은 시계, 작은 목걸이, 어머니의 편지'처럼 이미 인물의 자아와 결합된 대상(Endowed Asset)을 빼앗길 위기다. 스테이크의 힘은 물리적 크기(Objective Magnitude)가 아니라 개인적 의미와 애착의 깊이(Subjective Value)에서 나온다."
  verbatim_quotes:
    - original: "The endowment effect—the finding that people demand much more to give up an object than they would be willing to pay to acquire it—is a manifestation of loss aversion... Once an item enters a person's endowment, losing it is perceived as a painful loss rather than a forgone gain."
      translation: "보유 효과—사람들이 어떤 물건을 포기하는 대가로 지불 용의액보다 훨씬 더 많은 보상을 요구한다는 발견—는 손실 회피의 발현이다... 물건이 일단 개인의 보유 영역에 들어오면, 그것을 잃는 것은 포기된 이득이 아니라 고통스러운 손실로 인식된다."
      citation_location: "pp. 1326-1328, 1342-1345"

story_application:
  application_idea: "상징적 앵커를 통한 보유 효과 점화(Endowed Symbol Priming): 주인공에게 1막 초반에 세상 사람들에게는 100원의 가치도 없지만 그에게는 목숨과 바꿀 수 없는 작은 소품(예: <인셉션>의 토템, <존 윅>의 강아지, <시민 케인>의 로즈버드 썰매)을 쥐여주고, 악당이 그것을 모욕하거나 파괴하려 할 때 관객의 뇌에 맹렬한 수호 본능과 분노를 점화함."
  narrative_stage: "Act 1 Value Anchoring, Midpoint Vulnerability, Climax Symbolic Rebirth"
  emotional_mechanics:
    trigger: "인물의 역사와 영혼이 깃든 사소한 애착 대상 제시"
    build_up: "외부의 적이나 사건이 그 대상을 짓밟거나 빼앗으려 위협"
    peak: "사소한 물건을 지키기 위해 자신의 모든 것을 던지는 인물의 결단"
    release: "물질의 파괴를 넘어 그 안에 깃든 인간적 의미와 사랑의 영원한 보존"
  failure_modes: "객관적 가치(100억)만 강조하고 인물의 주관적 애착 서사를 생략하여 관객이 '그 돈 뺏기든 말든 내 알 바 아니다'라며 무관심해지는 오류"

