created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'The psychology of curiosity: A review and reinterpretation'
  authors:
  - Loewenstein, George (Carnegie Mellon University)
  institution: Carnegie Mellon University
  published_date: '1994-07-01'
  source_url: https://doi.org/10.1037/0033-2909.116.1.75
  source_type: Peer-reviewed Journal (Psychological Bulletin, 116(1), 75-98)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Psychology Landmark
  methodology:
    study_type: Theoretical Paradigm Formulation & Comprehensive Literature Synthesis of Curiosity and Epistemic Motivation
    sample_size: 지적 호기심, 불확실성, 정보 탐색 관련 80여 편의 핵심 연구 종합
    target_population: 지적 결핍을 인식하고 정보를 탐색하는 인간 인지 주체
    relationship_type: Foundational Model (Information Gap Theory: Awareness of Gap -> Aversive Epistemic Deprivation -> Evidence Influx -> Emotional Resolution & Awe)
    effect_size: 개인이 '알고 있는 것'과 '알고 싶은 것' 사이의 정보 격차(Information Gap)를 의식할 때 강력한 긴장과 정서적 결핍이 발생하며, 결정적 증거가 유입되어 불확실성이 해소(Uncertainty Reduction)되는 순간 도파민 분비와 결합된 극적인 정서적 카타르시스(Aha Moment)가 발생함 (3,400+ 피인용 랜드마크)
    replicated: Universally Replicated in Educational and Cognitive Psychology
    limitations: 인지적 호기심 일반 이론이나 롱폼 스토리의 복선 회수, 미스터리 해소 및 증거 폭로의 감정 역학에 완벽히 적용됨
claims_and_evidence:
  core_claim: 증거(Evidence)는 단순히 지적인 답안지가 아니다. 증거는 '불확실성의 고통스러운 결핍'을 해소하는 가장 강력한 정서적 기폭제다. 독자가 서사의 의혹과 미스터리 앞에서 "도대체 진실이 무엇인가?"라는 정보 격차(Information Gap)의 고통을 겪고 있을 때, 그 격차를 정확히 봉합하는 단 하나의 결정적 증거가 투입되면, 뇌는 단순한 사실 인지를 넘어 전율적인 감탄(Awe), 안도감(Relief), 혹은 비통한 충격이라는 극도의 정서적 카타르시스를 분출한다.
  verbatim_quotes:
  - original: Curiosity arises when attention becomes focused on a gap in one's knowledge. Such information gaps produce the feeling of deprivation, labeled curiosity. The curious individual is motivated to obtain the missing information to reduce or eliminate the feeling of deprivation... When the gap is closed, the relief and aesthetic pleasure are profound.
    translation: 호기심은 주의가 자신의 지식에 존재하는 격차에 집중될 때 발생한다. 그러한 정보 격차는 호기심이라 명명되는 결핍의 느낌을 낳는다. 호기심을 느끼는 개인은 그 결핍감을 줄이거나 없애기 위해 누락된 정보를 얻고자 동기화된다... 그 격차가 메워질 때, 안도감과 미학적 쾌감은 심오하다.
    citation_location: pp. 75-77
story_application:
  application_idea: 롱폼 스토리의 '정보 격차-증거 해갈 시퀀싱 (Information Gap Closure Mechanics)'. 결정적 증거를 그냥 설명조로 던지지 않고, 먼저 관객의 지식에 커다란 균열(정보 격차: "완벽했던 알리바이가 도대체 어디서 무너졌는가?")을 내어 인지적 갈증을 극대화한 뒤, 그 갈증의 정점에 증거를 투입하여 관객에게 폭발적인 지적·정서적 쾌감을 선사하는 연출 기법.
  narrative_stage: Climax Revelation, Plot Twist & Mystery Resolution
  emotional_mechanics:
    trigger: 풀리지 않는 의혹으로 인한 관객의 지적 긴장감과 답답함(결핍감)
    build_up: 정보 격차의 모순이 한계점에 도달하며 치솟는 진실에 대한 갈망
    peak: 결정적 증거가 퍼즐의 마지막 조각처럼 맞춰지는 순간의 경탄(Aha)
    release: 지적 결핍이 완전히 해소되며 터지는 압도적인 정서적 안도감과 전율
  failure_modes: 아무런 질문이나 정보 격차도 조성하지 않은 채 뜬금없이 복잡한 증거를 들이밀어 관객을 어리둥절하게 만드는 서사적 실패
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 추리, 스릴러, 탐사 르포, 역사적 비밀 폭로, 과학 발견 서사에 보편 적용됨
