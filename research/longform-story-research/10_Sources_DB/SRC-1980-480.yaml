key_contribution: '서스펜스의 해부학과 긴장의 생리적 감쇠 곡선(Physiological Decay Curve) 규명. 교감신경계의 각성은 무한정 지속될 수 없으며, 질적 에스컬레이션 없는 동일 자극의 반복은 15~20분 내에 생리적 순응과 각성 감쇠를 유발함을 실증. 시간 연장(Repetition)과 질적 강화(Escalation)를 엄밀히 구분하고, 긴장을 유지하기 위해서는 위험의 위계와 판돈의 계단식 격상이 필수적임을 증명.'
relevance: 서스펜스 축적의 시간적 한계와 단순 반복의 실패 및 계단식 강도 에스컬레이션의 필수성을 뒷받침하는 핵심 실증 이론.
