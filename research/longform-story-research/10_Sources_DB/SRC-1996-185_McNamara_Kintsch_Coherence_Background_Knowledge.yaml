bibliographic_info:
  title: "Are good texts always better? Interactions of text coherence, background knowledge, and levels of understanding in learning from text"
  authors:
    - "McNamara, Danielle S. (University of Colorado Boulder / Arizona State University)"
    - "Kintsch, Eileen (University of Colorado Boulder)"
    - "Songer, Nancy B. (University of Colorado Boulder)"
    - "Kintsch, Walter (University of Colorado Boulder)"
  institution: "University of Colorado Boulder"
  published_date: "1996-03-01"
  source_url: "https://doi.org/10.1207/s1532690xci1401_1"
  source_type: "Peer-Reviewed Journal Article (Cognition and Instruction)"

credibility_assessment:
  credibility_tier: "Tier 1 Cognitive Psychology & Educational Science"
  methodology:
    study_type: "Controlled Empirical Learning & Text Coherence Experiments"
    sample_size: "Multiple experimental cohorts (N=112 middle school and college students)"
    target_population: "텍스트로부터 고차원 상황 모델을 구축하는 수용자 일반"
    relationship_type: "Nonlinear Interaction & The Reverse Coherence Effect"
    effect_size: "배경지식이 있는 수용자에게 과도하게 명시적인 연결어와 설명을 제공할 경우 고차원 상황 모델 이해도 35% 저하 (Reverse Coherence Effect 확인)"
    replicated: "Extremely Replicated (담화 처리 및 상황 모델 분야 최고의 기념비적 명저, 2,800+ 피인용)"
    limitations: "교과 학습 텍스트 실험 중심이나 스토리텔링의 설명조(Exposition) 문제 및 서사적 여백 설계에 완벽 적용"

claims_and_evidence:
  core_claim: "텍스트에 모든 인과 관계와 연결어를 100% 명시적으로 쏟아붓는 것이 언제나 최선은 아니다('역 결속 효과: Reverse Coherence Effect'). 수용자가 일정 수준의 지적 역량이나 장르적 배경지식을 가지고 있을 때, 지나치게 친절한 명시적 연결어와 설명체(Exposition)는 수용자의 '능동적 인과 추론(Active Inferential Processing)'을 가로막아 수동적이고 지루한 상태로 전락시킨다. 진정으로 강력한 서사는 표면적 연결어를 남발하여 말로 설명하는 것이 아니라, 관객이 씬과 사건 사이의 인과적 틈(Inferential Gap)을 스스로 뛰어넘어 '머릿속에서 WHY와 THEREFORE를 직접 완성하도록' 설계하는 절제된 인과 구조를 취해야 한다."
  verbatim_quotes:
    - original: "Readers who have adequate background knowledge learn better from a less coherent text that forces them to engage in active compensatory processing... Overly explicit coherence markers can hinder the construction of a deep situation model by reducing active cognitive effort."
      translation: "적절한 배경지식을 가진 독자들은 능동적인 보상적 처리에 참여하도록 강제하는 덜 명시적인 텍스트로부터 더 잘 학습한다... 지나치게 명시적인 결속 표지는 능동적인 인지적 노력을 줄임으로써 깊은 상황 모델의 구축을 방해할 수 있다."
      citation_location: "Cognition and Instruction, Vol. 14, No. 1, pp. 1-6"

story_application:
  application_idea: "대본 집필의 '말하지 말고 보여주는 인과적 여백(Show, Don't Tell Inference) 공식'. 인물의 대사로 '내가 왜냐하면(Because) 이러이러해서 그러므로(Therefore) 이렇게 한다'고 구구절절 설명하는 삼류 설명조(Exposition Overwrite)를 금지함. 연결어(WHY/THEREFORE/BUT)는 대본의 '내적 골격(Skeleton)'으로만 작동하게 숨겨두고, 표면적으로는 인물의 행동과 표정, 상황적 단서만을 제시하여 관객이 자신의 뇌 속에서 인과적 결속을 능동적으로 완성하도록 유도함."
  narrative_stage: "Dialogue Polishing & Subtextual Causality"
  emotional_mechanics:
    trigger: "명시적 설명 없는 상황적 단서의 제시"
    build_up: "관객의 뇌에서 작동하는 능동적 인과 추론 (Inferential Gap Crossing)"
    peak: "관객 스스로 '아, 저래서 저 행동을 하는구나!'를 깨닫는 유레카 순간"
    release: "지적 자율성과 인물에 대한 깊은 공감 형성"
  failure_modes: "모든 인과를 대사로 떠먹여 주어 관객을 바보 취급하고 서사를 촌스럽게 만드는 '설명체 과잉(Exposition Overdose)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "인과적 틈(Gap)이 너무 넓으면 관객이 이해를 포기하므로 관객의 지적 배경에 맞춘 정교한 튜닝 필요"
