key_contribution: "인지 부하 이론(CLT) 기반 분할 주의 원칙(Split-Attention Principle)의 정립. 물리적·시간적으로 분리되거나 상호 이질적인 시청각 정보가 주어질 때 작업 기억(Working Memory)의 인지 자원이 통합 연산에 낭비되어 고차원적 이해와 장기 기억 저장이 파괴됨을 규명."
relevance: "화면 B-roll과 내레이션이 겉돌거나 시각적 정보와 음성 정보의 시점이 불일치할 때 발생하는 관객의 서사 이탈을 방지하는 이론적 토대."
