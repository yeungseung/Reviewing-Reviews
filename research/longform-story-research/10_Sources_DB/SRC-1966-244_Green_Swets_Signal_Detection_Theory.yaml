claims_and_evidence:
  core_claim: 어떤 정보를 '알아차린다'는 것은 단순히 자극이 존재하느냐의 문제가 아니다. 신호(Signal)는 항상 주변의 배경 소음(Noise)과 함께 유입된다(신호 탐지 이론, SDT). 서사에서 복선(Clue)은 신호이고, 일상적 묘사, 부차적 대화, 감정적 사건은 노이즈다. 만약 단서의 신호 대 잡음비(Signal-to-Noise Ratio, SNR)가 너무 높으면($d' \gg 3$) 관객은 씬이 시작하자마자 "저게 복선이네!"라고 즉각 적중(Hit)시켜 예측 난이도가 붕괴(스포일러화)된다. 반대로 SNR이 너무 낮으면($d' \to 0$) 단서가 소음에 완전히 파묻혀 누락(Miss)되어 반전 시 불공정한 억지가 된다. 최적의 서사적 단서는 $d' \approx 1.0 \sim 1.5$ 수준의 중간 민감도 지대에서 노이즈와 절묘하게 섞여 있을 때 달성된다.
  verbatim_quotes:
  - original: Detection is not a passive sensory threshold; it is a statistical decision process in the presence of noise. The detectability index (d') reflects the separation between signal and noise distributions. When d' is too large, detection is trivially certain; when d' is too small, the signal is hopelessly lost in the background noise.
    translation: 탐지는 수동적인 감각 역치가 아니다. 그것은 노이즈가 존재하는 상황에서의 통계적 결정 과정이다. 탐지 지표(d')는 신호와 노이즈 분포 사이의 분리를 반영한다. d'가 너무 크면 탐지는 사소할 정도로 확실해지며, d'가 너무 작으면 신호는 배경 노이즈 속에서 절망적으로 유실된다.
    citation_location: pp. 11-15
story_application:
  application_idea: 롱폼 스토리의 'SDT 복선 신호 대 잡음비(SNR) 조율 공식'. 작가는 결정적 단서(Signal)를 던질 때, 그 단서와 동일한 비중을 가진 2~3개의 맥락적 소음(Contextual Noise / Red Herrings)을 나란히 배치해야 함. 예를 들어, 범인이 남긴 특이한 라이터(Signal)를 노출할 때, 다른 인물들의 담배, 잃어버린 만년필, 떨어진 동전(Noise)을 자연스러운 일상 소품으로 함께 노출시켜 관객의 탐지 민감도($d'$)를 1.2 수준으로 조율함. 이를 통해 관객은 무의식적으로 단서를 목격하되, 의식적인 즉각 간파를 완벽히 지연시킴.
  narrative_stage: Foreshadowing Seeding, Red Herring Design, Prop Placement & Script Polishing
  emotional_mechanics:
    trigger: 풍부한 일상적 디테일과 소품이 어우러진 자연스러운 장면 관람
    build_up: 신호와 소음이 섞여 있어 단서의 존재를 무의식적으로만 흡수
    peak: 반전 폭로 순간, 배경 소음 속에서 진짜 신호가 번개처럼 분리되는 인지적 각성
    release: "진짜 신호가 노이즈 속에 완벽히 녹아있었구나"라는 지적 탄복
  failure_modes: 카메라가 단서만 3초 동안 클로즈업하여 신호비를 100%로 만들어버리는 연출의 나태(Over-signaled Spoiling), 혹은 돋보기를 들고 와도 못 찾을 정도로 소음에 묻어버리는 불공정한 은폐(Zero-signal Unfairness)
