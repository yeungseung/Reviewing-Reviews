source_id: SRC-2000-222
created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'The role of transportation in narrative persuasion'
  authors:
  - Green, Melanie C. (Ohio State University)
  - Brock, Timothy C. (Ohio State University)
  institution: Ohio State University
  published_date: '2000-11-01'
  source_url: https://doi.org/10.1037/0022-3514.79.5.701
  source_type: Peer-reviewed Journal (Journal of Personality and Social Psychology, 79(5), 701-721)
credibility_assessment:
  credibility_tier: Tier 1 Social Psychology & Narrative Persuasion Monument
  methodology:
    study_type: Factorial Laboratory Experiments on Narrative Transportation and Belief Change (Four Experiments)
    sample_size: 400+ (Undergraduate participants across multiple narrative conditions)
    target_population: 텍스트 서사를 읽고 신념 및 태도 변화를 겪는 대중 수용자
    relationship_type: Causal Mechanism (Narrative Transportation -> Empathy + Mental Imagery -> Reduced Counter-arguing & Increased Belief Change)
    effect_size: 서사적 전이(Transportation)가 높은 독자는 수사적 반박(Counter-arguing)이 현저히 감소하고, 서사 내 등장인물에 대한 감정적 일체감과 서사적 사실에 부합하는 신념 변화가 통제 집단 대비 2배 이상 높음 (7,000+ 피인용 기념비적 고전)
    replicated: Universally Replicated in Communication, Psychology, and Media Studies
    limitations: 단편 서사 실험 중심이나 롱폼 스토리의 감정 우선 시퀀싱과 설득 메커니즘에 완벽하게 부합함
claims_and_evidence:
  core_claim: 관객이 서사의 세계 속으로 정신적으로 완전히 몰입하는 '서사적 전이(Narrative Transportation)'를 경험할 때, 비판적 의심과 반박(Counter-arguing)은 능동적으로 차단된다. 감정 우선 시퀀싱(Emotion-First: 인물의 갈등과 감정에 먼저 전이시킴)은 관객의 심리적 방어벽을 무력화하여 뒤이어 투입되는 객관적 증거를 비판 없이 수용하도록 유도한다. 즉, 서사적 전이는 증거가 저항 없이 독자의 신념 체계로 침투하도록 통로를 열어주는 핵심 엔진이다.
  verbatim_quotes:
  - original: Transportation into a narrative world is a distinct mental process involving an integrative melding of attention, imagery, and feelings... Transported readers show less critical evaluation, reduced counterarguing, and greater acceptance of story-consistent beliefs.
    translation: 서사 세계로의 전이는 주의, 심상, 감정이 통합적으로 융합되는 독특한 정신적 과정이다... 서사에 전이된 독자들은 덜 비판적인 평가를 내리고, 반박을 현저히 줄이며, 서사와 일치하는 신념을 훨씬 더 크게 수용한다.
    citation_location: pp. 701-703
story_application:
  application_idea: 롱폼 스토리의 'Emotion-First 서사 전이 프로토콜'. 사회적 옹호(Advocacy), 인권 고발, 도덕적 캠페인 서사에서 먼저 인물의 결핍과 감정에 독자를 완전히 전이(Transportation)시킨 후, 그 몰입 상태에서 핵심 증거를 제시하여 관객의 비판적 반박을 원천 차단하고 완전한 정서적·신념적 동기화를 완성함.
  narrative_stage: Hook Exposition & Narrative Persuasion Influx
  emotional_mechanics:
    trigger: 인물의 강렬한 결핍과 감정적 위기로 인한 현실 세계로부터의 인지적 이탈
    build_up: 심상과 감정이 하나로 융합되며 형성되는 서사적 전이의 절정
    peak: 비판적 반박이 차단된 무방비 상태에서 투입되는 결정적 팩트 증거의 일격
    release: '이야기가 말하는 진실이 곧 나의 신념'이라는 완전한 태도 변화의 완성
  failure_modes: 감정적 전이를 일으키지 못한 채 논리적 반박거리만 가득한 증거를 먼저 들이밀어 관객의 방어적 토론 모드를 촉발하는 실패
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 모든 옹호형 르포, 다큐멘터리, 사회적 내러티브 및 설득 목적의 롱폼 콘텐츠
