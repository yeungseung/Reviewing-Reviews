key_contribution: '설명과 통찰(Reframe/Insight)이 뇌에 주는 진화신경생물학적 보상 메커니즘 규명. 인간이 흩어진 사건들 속에서 숨겨진 인과적 패턴을 발견하고 세계를 재구성(Reframe)할 때, 뇌는 신체적 쾌락(오르가즘)에 필적하는 강렬한 도파민 보상(Explanation as Orgasm)을 부여함을 실증.'
