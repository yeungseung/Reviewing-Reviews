key_contribution: 구조 매핑 이론(Structure-Mapping Theory)을 제창. 친숙한 기저 영역(Base Domain)의 관계 구조를 낯선 표적 영역(Target Domain)에 사상(Mapping)하여 고차원적 인지 번역과 통찰을 유도하는 메커니즘 규명.
relevance: 생소하거나 난해한 스토리 소재를 시청자의 일상적 경험 및 자아 관련성으로 브릿징(Bridging)하는 유추 서사의 핵심 인지 이론.
