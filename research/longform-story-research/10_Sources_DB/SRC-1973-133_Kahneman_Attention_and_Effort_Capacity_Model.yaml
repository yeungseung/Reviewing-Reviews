claims_and_evidence:
  core_claim: "인간의 주의(Attention)는 무한하지 않으며, 단일한 중앙 풀에서 인출되는 엄격히 '제한된 인지 용량(Limited Capacity)'을 가진다. 자극이 유입될 때 뇌의 평가 메커니즘(Evaluation of Demands)은 첫 수십 초 동안 이 자극이 자신의 생존이나 목표와 관련이 있는지, 그리고 투입할 가치가 있는지를 지속적으로 감시한다. 특히 새로운 서사 환경에 진입할 때 뇌는 상황을 정향(Orientation)하고 위험/보상을 계산하는 데 약 30~90초의 인지적 유예 시간(Orientation Grace Period)을 배정한다. 이 30~90초 내에 '최소한의 이해(Comprehension)'와 '적절한 각성/긴장(Tension)'이 결합되지 않거나 정보 과부하(Overload)가 발생하면, 뇌는 즉각 노력을 철회하고 주의 자원을 차단(Disengagement)한다."
  verbatim_quotes:
    - original: "Attention is a limited resource that can be allocated to various activities in different ways... The allocation of capacity is governed by enduring dispositions and by momentary intentions. When the demands of a task exceed the available capacity, performance falters and the system withdraws effort."
      translation: "주의는 다양한 활동에 서로 다른 방식으로 할당될 수 있는 제한된 자원이다... 용량의 할당은 지속적인 성향과 순간적인 의도에 의해 지배된다. 과제의 요구가 가용 용량을 초과할 때 수행은 실패하며 인지 시스템은 노력을 철회한다."
      citation_location: "pp. 8-12"

story_application:
  application_idea: "서사 오프닝의 30~90초 룰의 인지과학적 근거. 관객의 뇌는 첫 30~90초 동안 인지 용량을 임시 대여해준 상태(Cognitive Loan)임. 작가는 이 골든 타임 내에 ① 시공간 상황 정향(Orientation), ② 인지 평형을 깨는 갈등/이상현상(Tension), ③ 개인적 판돈의 암시(Relevance)를 완성하고, 정작 가장 알고 싶어 하는 최종 답은 유보(Answer Withholding)해야만, 관객의 뇌가 러닝타임 전체에 인지 자원을 지속 투자하도록 강제할 수 있음."
  narrative_stage: "Opening 30-90s Window, Capacity Model of Attention, Cognitive Loan Payoff"
  emotional_mechanics:
    trigger: "첫 10초 내 명확한 시청각 자극과 정향 단서 포착"
    build_up: "30초 지점에서 이상함/갈등이 폭발하며 뇌의 동공 확장 및 자원 할당량 급증"
    peak: "60~90초 지점에서 판돈(Stakes)의 무게를 감지하고 핵심 답이 유보되며 형성되는 강력한 시청 락인"
    release: "오프닝 시퀀스 종료와 함께 본문 서사로 부드럽게 인지 자원 인계"
    resonance: "제한된 인지 노력을 투자한 대가로 얻는 지속적 서스펜스와 지적 만족"
  failure_modes: "첫 30초 내에 너무 많은 설정과 인물 이름을 쏟아부어 관객의 가용 인지 용량을 초과(Cognitive Bankruptcy)시켜 이탈하게 만드는 오류"

