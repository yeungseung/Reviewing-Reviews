id: SRC-1991-275
title: "The Rhetoric of Reaction: Perversity, Futility, Jeopardy"
authors:
  - "Albert O. Hirschman"
year: 1991
type: academic_primary
tier: 1
publication: "Belknap Press / Harvard University Press"
pages: "1-208"
isbn: "978-0674768680"
citation_count: 5600
key_findings:
  - "정치, 경제, 사회 개혁에 대한 반론 및 역사적 역전 담론의 3대 핵심 수사학 체계화."
  - "1) 역효과 명제(The Perversity Thesis): 상태를 개선하려는 행동이 오히려 사태를 정확히 정반대로 악화시킴 (Result & Benefit Reversal)."
  - "2) 무용성 명제(The Futility Thesis): 아무리 거대한 자원을 투입해도 시스템의 심층 법칙 때문에 실질적 변화는 전혀 없음 (Scale & Cost Reversal)."
  - "3) 위험 명제(The Jeopardy Thesis): 새로운 이익을 얻으려는 시도가 이미 확보된 더 소중하고 오래된 성취를 파괴함 (Value & Cost Reversal)."
core_claims:
  - "모든 사회적·역사적 반전 서사는 역효과(Perversity), 무용성(Futility), 위험(Jeopardy)의 세 가지 보편적 수사 구조로 환원된다."
  - "반전의 힘은 단순한 사실 나열이 아니라, 행위자의 의도와 구조적 결과 사이의 모순을 드러내는 수사적 정밀성에 있다."
keywords:
  - perversity thesis
  - futility thesis
  - jeopardy thesis
  - rhetoric of reaction
  - unintended consequences
  - narrative reversal
