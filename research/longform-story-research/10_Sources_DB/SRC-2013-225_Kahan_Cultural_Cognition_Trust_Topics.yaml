created_at: '2026-09-17'
verified_by: Gemini Deep Research
bibliographic_info:
  title: 'Ideology, motivated reasoning, and cognitive reflection'
  authors:
  - Kahan, Dan M. (Yale Law School)
  institution: Yale Law School & Cultural Cognition Project
  published_date: '2013-07-01'
  source_url: https://doi.org/10.1017/S193029750000525X
  source_type: Peer-reviewed Journal (Judgment and Decision Making, 8(4), 407-424)
credibility_assessment:
  credibility_tier: Tier 1 Cultural Cognition & Political Psychology Landmark
  methodology:
    study_type: Factorial Experimental Cognitive Psychology & Political Ideology Studies
    sample_size: 1,750 (Nationally representative US adult sample)
    target_population: 정치적·이념적 신뢰 민감 주제(Trust-sensitive topics)에 직면한 대중
    relationship_type: Causal Cognitive Moderation (Identity-protective Cognition: Cognitive Capacity x Ideological Framing -> Polarization)
    effect_size: 신뢰 민감 주제에서 순수 증거(Evidence)만을 먼저 제시할 경우, 인지 역량(Cognitive Reflection Test)이 높은 사람일수록 자신의 정치적 정체성을 지키기 위해 증거를 더욱 편향되게 반박하여 극단적 양극화(Polarization)가 2배 이상 심화됨 (1,200+ 피인용 랜드마크)
    replicated: Universally Replicated in Political Psychology and Science Communication
    limitations: 정치적 갈등 이슈 중심이나 모든 신뢰 민감 주제에서 서사 시퀀싱 전략의 절대적 분기 기준을 제공함
claims_and_evidence:
  core_claim: 이념, 도덕, 정치, 종교 등 '신뢰 민감 주제(Trust-Sensitive Topics)'에서는 증거를 먼저 들이미는 방식(Evidence-First)이 치명적인 역풍을 부른다. 똑똑한 독자일수록 증거를 분석적으로 해체하여 자신의 기존 신념을 방어하는 '정체성 보호 인지(Identity-Protective Cognition)'를 가동한다. 따라서 신뢰 민감 주제에서는 결코 증거를 선제 공격용으로 쓰지 말고, 공통의 인간적 가치와 감정적 연대(Emotion-First)로 심리적 안전지대를 먼저 확보한 후 증거를 점진적으로 소개해야만 설득이 성립한다.
  verbatim_quotes:
  - original: More information and higher cognitive capacity do not heal political divisions over facts; they exacerbate them. When evidence threatens identity, individuals use their reasoning abilities to resist the evidence. To communicate effectively on trust-sensitive issues, communicators must affirm the audience's values and shared emotional identity before introducing technical evidence.
    translation: 더 많은 정보와 더 높은 인지 능력은 사실에 대한 정치적 분열을 치유하지 않으며, 오히려 악화시킨다. 증거가 정체성을 위협할 때 개인은 자신의 추론 능력을 증거에 저항하는 데 사용한다. 신뢰 민감 이슈에서 효과적으로 소통하려면, 소통자는 기술적 증거를 도입하기 전에 청중의 가치와 공유된 정서적 정체성을 먼저 긍정해야 한다.
    citation_location: pp. 407-409
story_application:
  application_idea: 롱폼 스토리의 '신뢰 민감 주제 우회 시퀀싱 (Trust-Sensitive Safe Sequencing)'. 의료 비리, 환경 갈등, 역사적 재평가 등 독자의 진영 논리나 가치관이 첨예하게 부딪히는 주제를 다룰 때, 'Evidence-First'로 팩트 폭격을 가하지 않고, 'Emotion/Value ➔ Human Consequence ➔ Evidence ➔ Meaning'의 우회 시퀀싱을 가동하여 독자의 방어 기제를 완전히 해제한 후 진실을 수용시킴.
  narrative_stage: Polarized Topic Exposition & Value-affirming Bridge
  emotional_mechanics:
    trigger: 민감한 이념적 주제에 직면했을 때 독자가 본능적으로 세우는 방어적 경계심
    build_up: 보편적 인간애, 부모의 사랑, 공정한 삶 등 양 진영이 모두 동의하는 공통 가치와 감정에 대한 공감대 형성
    peak: 방어벽이 완전히 무장 해제된 안전한 상태에서 제시되는 객관적 팩트 증거
    release: '나의 정체성을 부정한 것이 아니라 진실을 함께 본 것'이라는 깊은 안도와 신념 재조정
  failure_modes: 찬반이 갈리는 민감한 사안에서 증거와 통계로 상대를 짓누르려다 극단적 반발(Backfire)과 독자 이탈을 초래하는 오만함
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 정치, 경제, 사회적 논쟁, 과학적 불확실성 등 이념적·문화적 저항이 존재하는 모든 롱폼 서사
