title: 'Film Structure and the Emotion System'
venue: Cambridge University Press, Cambridge, pp. 40-98
tier: 1
citation_count: 850
url: https://doi.org/10.1017/CBO9780511497742
key_contribution: 영화의 정서 시스템과 무드-단서 접근법(Mood-Cue Approach) 정립. 영화적 감정은 짧은 순간의 감정 폭발(Burst of Emotion)과 장기적인 기분/분위기(Mood)의 상호작용으로 작동하며, 강렬한 감정 장면은 사전 시각적 단서의 지속적 축적과 감정 준비성(Emotional Readiness)이 갖추어져야 성공함. 특히 편집 템포와 샷 길이가 표현하려는 감정의 결(Emotional Texture)과 어긋날 때 발생하는 감정적 부조화(Affective Dissonance)와 감정 단절 메커니즘을 규명.
relevance: 서스펜스 템포 조절, 안도감의 시간적 방출, 감정과 맞지 않는 페이싱의 부작용을 방어하는 서사 구조 설계의 이론적 근거.
themes:
