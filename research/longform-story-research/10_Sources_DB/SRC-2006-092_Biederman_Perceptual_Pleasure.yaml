claims_and_evidence:
  core_claim: "인지적 새로움(Novelty)의 신경 쾌감과 공식 피로(Formula Fatigue)의 기제: 인간 뇌의 배측 시각 경로 및 연합 피질은 풍부한 새로운 연상과 해석을 제공하는 자극을 만났을 때 뮤-오피오이드(mu-opioid, 엔도르핀 계열) 수용체와 도파민 회로를 활성화하여 강렬한 지각적·인지적 쾌감(Click of Comprehension / Aha!)을 생성한다. 반대로, 이미 완전히 예측 가능하고 학습된 익숙한 패턴(Formula/Cliché)이 반복되면 신경 발화가 급격히 감쇄(Neural Adaptation/Habituation)되어 쾌감이 0으로 소거되고 극심한 인지적 피로(Formula Fatigue)와 권태가 발생한다."
  verbatim_quotes:
    - original: "The brain is rewarded with a burst of endogenous morphinelike neurotransmitters when it interprets a novel, richly interpretable stimulus... When a pattern becomes fully predictable and repetitive, this neural reward signal rapidly habituates, resulting in cognitive fatigue and disengagement."
      translation: "뇌는 새롭고 풍부하게 해석 가능한 자극을 해석할 때 내인성 모르핀 유사 신경전달물질의 분출로 보상을 받는다... 패턴이 완전히 예측 가능해지고 반복되면, 이 신경 보상 신호는 빠르게 습관화되어 인지적 피로와 몰입 이탈을 초래한다."
      citation_location: "pp. 247-251"

story_application:
  application_idea: "공식 피로의 도파민적 탈출(Formula Fatigue Prevention): 서사에서 고정된 감정 순서나 뻔한 클리셰를 반복하면 관객의 뇌는 엔도르핀/도파민 보상을 완전히 중단함. 창작자는 관객이 다음 전개를 90% 확신하고 나태해지는 순간, 새로운 해석을 요구하는 지적 변수(Richly interpretable novel twist)를 투입하여 뇌의 신경망을 재활성화하고 '이해의 클릭(Click of Comprehension)' 쾌감을 선사해야 함."
  narrative_stage: "Midpoint Cliché Disruption & Re-interpretable Twist"
  emotional_mechanics:
    trigger: "관객이 뻔한 장르 공식으로 인식하여 주의력이 저하되는 구간 감지"
    build_up: "예측을 깨뜨리며 새로운 퍼즐적 해석을 요구하는 신선한 정보 투입"
    peak: "두뇌의 연합 피질에서 새로운 맥락이 연결되며 뮤-오피오이드 분출(인지적 아하!)"
    release: "공식의 지루함에서 탈출하여 새로운 긴장감과 몰입감으로 재진입"
  failure_modes: "클리셰를 그대로 답습하여 관객 뇌를 인지적 가사 상태(Mental sleep)로 빠뜨리는 획일적 작법, 또는 새로운 정보가 맥락 없이 뜬금없어 뇌가 해석 자체를 포기하게 만드는 난해함"

