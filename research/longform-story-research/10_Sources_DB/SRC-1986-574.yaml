key_contribution: 에드워드 홀(Edward T. Hall)의 공간 근접학(Proxemics) 이론을 영상 카메라 샷 크기에 매핑. 클로즈업(Close-up)은 친밀한 거리(Intimate Distance)를 모사하여 관객에게 깊은 정서적 친밀감과 공감을 유발하는 반면, 롱샷(Long Shot)은 공적 거리(Public Distance)를 모사하여 정서적 거리를 두고 객관적 상황을 관조하게 만듦을 실증. 샷 크기의 전환이 단순한 구도 변화가 아니라 관객의 심리적 대인 거리감을 재조정하는 핵심 서사 기제임을 규명.
relevance: 샷 크기(클로즈업 vs 롱샷)와 시각적 거리감이 관객의 공감 및 심리적 거리에 미치는 효과를 설명하는 공간 심리학적 토대.
themes:
