claims_and_evidence:
  core_claim: "인간은 비극적 결과나 극적인 승리를 마주할 때 '만약 그때 다른 선택을 했더라면 어땠을까?(What if / If only)'라는 대안적 현실을 시뮬레이션하는 '반사실적 사고(Counterfactual Thinking)'를 가동한다. 서사에서 인물의 행동이 '외부 환경에 의한 무기력한 표류'가 아니라 **'명확한 선택(Choice) ➔ 그에 따른 가혹한 결과(Consequence) ➔ 그 결과가 낳은 새로운 딜레마'**라는 엄격한 인과 척추로 결속될 때, 관객은 인물에게 깊은 인과적 책임과 공감을 부여하며 강렬한 카타르시스를 느낀다. 반면 선택 없는 우연의 연속은 반사실적 사고를 차단하여 인물을 수동적인 꼭두각시로 전락시킨다."
  verbatim_quotes:
    - original: "Counterfactual thinking is an essential component of causal reasoning... Altering a salient mutated antecedent in imagination amplifies affective reactions such as regret, triumph, and moral responsibility. Causal chains anchored in human choice provoke the deepest narrative resonance."
      translation: "반사실적 사고는 인과 추론의 본질적인 구성 요소이다... 상상 속에서 두드러진 선행 조건을 변경해보는 것은 후회, 승리감, 도덕적 책임과 같은 정서적 반응을 증폭시킨다. 인간의 선택에 닻을 내린 인과 사슬은 가장 깊은 서사적 울림을 유발한다."
      citation_location: "Psychological Bulletin, Vol. 121, No. 1, pp. 133-138"

story_application:
  application_idea: "인물·스포츠·전기 서사의 '선택-결과 도미노 척추(Choice-Consequence Spine) 공식'. 주인공이 맞닥뜨리는 모든 위기를 단순 재난이 아니라 '자신의 과거 선택(Choice)이 불러온 필연적 업보(Consequence)'로 설계함. '만약 그때 패스를 하지 않고 슛을 쐈더라면?', '만약 그때 그 계약서에 서명하지 않았더라면?'이라는 관객의 반사실적 시뮬레이션을 폭발시켜 비극의 숭고함과 승리의 벅찬 감동을 극대화함."
  narrative_stage: "Character Tragedy, Sports Climax & Biographical Pivot Points"
  emotional_mechanics:
    trigger: "피할 수 없는 치명적 딜레마와 인물의 결단"
    build_up: "선택의 결과가 눈덩이처럼 불어나며 인물을 압박하는 인과적 도미노"
    peak: "선택의 대가를 온몸으로 치르는 운명적 클라이맥스"
    release: "선택과 결과의 필연성에 대한 뼈아픈 수용과 반사실적 여운"
  failure_modes: "주인공이 아무런 능동적 선택도 하지 않고 외부 상황에 이리저리 휘둘리기만 하는 '무기력한 피해자 서사의 무미건조함'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "선택지가 실질적으로 대등한 가치를 지닌 진정한 딜레마여야 하며, 한쪽이 뻔한 쉬운 선택은 긴장감을 주지 못함"
