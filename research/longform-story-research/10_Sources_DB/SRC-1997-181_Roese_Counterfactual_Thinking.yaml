    sample_size: "Systematic synthesis of over 100 empirical experiments on decision attribution"
    target_population: "인간의 후회, 책임 귀인, 서사적 시뮬레이션을 수행하는 수용자 일반"
    relationship_type: "Causal Attribution & Narrative Emotional Impact"
    effect_size: "선택의 분기점이 명확한 인과 사슬(Choice-Consequence Spine)에 노출될 때 인과적 귀인(Causal Attribution) 및 정서적 반응(Empathy/Regret) 강도 3배 증폭"
