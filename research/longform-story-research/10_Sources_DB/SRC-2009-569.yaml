key_contribution: 영화의 정서적 인지 이론 및 얼굴 표정 클로즈업의 감정 체류(Affective Dwell Time) 메커니즘 규명.
  극적 사건 직후 인물의 미세 표정 클로즈업이나 침묵의 공간을 5~8초 이상 유지하는 롱테이크는 거울 신경망(Mirror Neurons)을 통한
  감정 전이(Affective Contagion)와 복합 정서의 인지적 응고화(Emotional Consolidation)를 완성하는 필수적 정서
  챔버임을 실증.
relevance: 정보 자료 제시 후 감정 장면이나 인물 반응 샷에서 왜 긴 체류 시간(Affective Pause)이 필수적인지 규명하는 서사
  심리학적 근거.
themes:
