bibliographic_info:
  title: 'Event perception: A mind-brain perspective'
  authors:
  - Zacks, Jeffrey M. (Washington University in Saint Louis)
  - Speer, Nicole K. (The Children's Hospital, Denver)
  - Swallow, Khena M. (Washington University in Saint Louis)
  - Braver, Todd S. (Washington University in Saint Louis)
  - Reynolds, Jeremy R. (University of Denver)
  institution: Washington University in Saint Louis
  published_date: '2007-03-01'
  source_url: https://doi.org/10.1037/0033-2909.133.2.273
  source_type: Peer-reviewed Journal (Psychological Bulletin, 133(2), 273-293)
credibility_assessment:
  credibility_tier: Tier 1 Cognitive Psychology & Neuroimaging Milestone
  methodology:
    study_type: Theoretical Framework Formulation & Meta-analysis of Behavioral/fMRI Experiments (Event Segmentation Theory, EST)
    sample_size: 다수의 fMRI 뇌영상 실험 및 행동 분할 실험 수백 명 데이터 종합
    target_population: 동적 사건(일상 행동, 영화 클립, 서사 텍스트)을 지각하고 기억하는 인간 피험자
    relationship_type: Mechanistic Explanatory Framework (Prediction Error Spikes Drive Event Horizon Updating and Boundary Perception)
    effect_size: 인간은 연속적인 감각 흐름을 '사건(Event)'이라는 이산적 청크로 자동 분할하며, 사건 경계(Event Boundary)는 예측 오차의 급격한 상승(Prediction Error Spike)에 의해 격발됨을 규명 (1,800+ 피인용 대표 논문)
    replicated: Universally Replicated across narrative comprehension, film cutting studies, and memory consolidation research
    limitations: 일상 행동 지각에서 시작되었으나 이후 영화 및 문학 텍스트의 씬/챕터 전환 분석에 표준 이론으로 확장됨
claims_and_evidence:
  core_claim: 인간의 지각 시스템은 연속적인 시간의 흐름 속에서 현재 진행 중인 상황을 이해하기 위해 '사건 모델(Event Model)'이라는 일시적인 하향식 멘탈 모델을 활성화한다. 사건 모델이 유지되는 동안에는 다음 행동에 대한 예측 오차가 낮게 유지된다. 그러나 환경에서 인물의 목표 변경, 공간 이동, 원인-결과 불일치 등 유의미한 변화가 발생하면 예측 오차가 급증(Prediction Error Spike)한다. 이 순간 뇌는 기존 사건 모델을 리셋하고 새로운 사건 경계(Event Boundary)를 등록하며 새로운 멘탈 모델을 수립한다. 스토리에서 장면 전환, 시점 변화, 충격적 반전은 바로 이 예측 오차 스파이크를 촉발하여 장기 기억 인코딩을 극대화하는 인지 공학적 장치다.
  verbatim_quotes:
  - original: According to event segmentation theory, perceptual systems maintain a representation of the current event to predict upcoming sensory changes. When predicting becomes difficult—which typically occurs when the situation changes—a prediction error signal is produced. This signal triggers the updating of the event model and is perceived as an event boundary.
    translation: 사건 분할 이론(EST)에 따르면, 지각 시스템은 다가올 감각적 변화를 예측하기 위해 현재 사건에 대한 표상을 유지한다. 예측이 어려워질 때—이는 대개 상황이 바뀔 때 발생한다—예측 오차 신호가 생성된다. 이 신호는 사건 모델의 갱신을 촉발하며, 이는 '사건 경계'로 지각된다.
    citation_location: p. 274
story_application:
  application_idea: 롱폼 스토리의 '사건 경계 및 예측 오차 스파이크 조율 (Event Boundary & Prediction Error Orchestration)'. 작가는 독자의 뇌가 지루해지지 않도록 적절한 주기마다 예측 오차를 발생시켜 사건 모델을 갱신시켜야 함. 씬(Scene)의 마무리에 미세한 예측 오차(Cliffhanger, Unresolved Goal)를 남겨 새로운 사건 모델을 수립하려는 인지적 동기를 유지시키고, 챕터 전환 시에는 명확한 사건 경계를 주어 기억 정착(Consolidation)을 유도함.
  narrative_stage: Scene Transition, Pacing, Chapter Climax & Boundary Engineering
  emotional_mechanics:
    trigger: 상황의 급변, 인물의 돌발 선택, 공간 이동으로 인한 예측 오차 스파이크
    build_up: 기존 사건 모델 붕괴와 새로운 멘탈 모델 구축을 위한 전두엽 정보 수집 가속
    peak: 사건 경계(Event Boundary) 인식 순간의 인지적 각성 및 주의 집중
    release: 새로운 사건 모델이 안정화되며 얻는 서사적 상황 파악과 안도감
  failure_modes: 아무런 변화 없이 동일한 사건 모델이 무한 연장되어 뇌가 수면 모드에 빠지는 정체(Stagnation), 혹은 예측 모델을 세울 틈도 없이 초 단위로 무작위 자극만 쏟아져 뇌가 과부하로 포기하는 혼란(Cognitive Overload)
verification_status:
  status: Strong Support
  confidence_level: High
  boundary_conditions: 영화 연출(편집 커팅), 소설의 장/절 구분, 웹소설 회차 분할, 다큐멘터리 시퀀스 전환 등 모든 시간 기반 서사에 100% 적용
