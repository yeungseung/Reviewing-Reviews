claims_and_evidence:
  core_claim: "수용자가 서사 세계로 빨려 들어가는 '이입(Transportation)'의 핵심 원동력은 바로 '인과적 모멘텀(Causal Momentum)'이다. 사건들이 인과적 필연성에 의해 굴러가는 추진력을 얻으면, 관객은 현실의 물리적 시간 감각을 잃어버리고 이야기 세계의 시간 속에 갇힌다. 심지어 결말을 이미 알고 있는 역사극이나 재시청 상황에서도 인과적 모멘텀이 견고하면 손에 땀을 쥐는 '이상 서스펜스(Anomalous Suspense)'가 격발된다. 반면 인과관계 없는 '그리고(And then)' 나열 서사는 모멘텀을 전혀 형성하지 못하므로, 관객은 1분마다 현실의 시계를 확인하며 극도의 피로를 느낀다."
  verbatim_quotes:
    - original: "Readers are transported to narrative worlds through a momentum driven by causal progression... In the grip of narrative momentum, readers experience anomalous suspense, unable to disengage their psychological participation even when outcomes are known."
      translation: "독자들은 인과적 전개에 의해 추동되는 모멘텀을 통해 서사 세계로 이동된다... 서사적 모멘텀에 사로잡혔을 때 독자들은 결과를 알고 있는 경우조차 자신의 심리적 참여를 해제하지 못하는 이상 서스펜스를 경험한다."
      citation_location: "Experiencing Narrative Worlds, Chapter 1 & 5, pp. 15-22, 156-165"

story_application:
  application_idea: "롱폼 스토리의 '인과적 모멘텀 가속 공식'. 씬과 씬 사이의 마찰력(Friction)을 0으로 만들기 위해, 씬 A의 종결이 낳은 충격량이 씬 B의 시작 에너지로 100% 전이되도록 설계함. 마치 굴러떨어지는 바위처럼 전진하는 인과적 모멘텀을 구축하여, 관객이 스마트폰을 확인할 틈을 단 1초도 주지 않고 결말까지 한 호흡으로 끌고 감."
  narrative_stage: "Act 2 Momentum Acceleration & Climax Drive"
  emotional_mechanics:
    trigger: "돌이킬 수 없는 최초의 인과적 결단 투하"
    build_up: "사건들이 꼬리를 물고 가속되는 인과적 도미노 (Causal Momentum 형성)"
    peak: "결말을 예측할 수 있음에도 심장이 터질 듯 조여오는 '이상 서스펜스(Anomalous Suspense)'"
    release: "거대한 모멘텀이 최종 종착지에 도달하며 터져 나오는 압도적 카타르시스"
  failure_modes: "씬마다 인과가 뚝뚝 끊겨 관객이 매번 몰입에서 빠져나와 딴짓을 하게 만드는 '모멘텀 정체(Momentum Stagnation)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "모멘텀이 너무 빠르기만 하면 인물의 내면을 느낄 시간이 없으므로 완충 쉼표와의 조율이 필요함"
