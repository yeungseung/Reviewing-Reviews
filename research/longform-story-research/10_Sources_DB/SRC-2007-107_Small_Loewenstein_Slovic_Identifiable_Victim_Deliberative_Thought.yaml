claims_and_evidence:
  core_claim: "통계와 분석적 사고의 정서적 냉담화(Analytical Callousness): 개별 희생자의 생생한 이야기(예: 말라위의 7세 소녀 로키아)는 대중의 강력한 동정심과 행동을 이끌어내지만, 그 이야기 옆에 '아프리카 수백만 명의 굶주림'이라는 통계적 수치를 함께 덧붙이는 순간, 공감과 기부액은 오히려 절반 가까이 급감한다. 통계적 데이터를 인지하는 뇌의 분석적 모드(Deliberative mindset, 계산 및 수학적 사고)가 활성화되면 직관적·감정적 공감 모드(Affective mindset)가 억제되기 때문이다. 즉, '통계는 서사에 힘을 보태는 것이 아니라, 오히려 캐릭터를 향한 순수한 감정 이입을 오염시키고 죽인다'. 관객이 인물과 함께 울고 분노하게 만들려면 감정 시퀀스 중에 통계나 분석적 설명을 절대로 끼워 넣어서는 안 된다."
  verbatim_quotes:
    - original: "When people are presented with statistical information alongside an identifiable victim, donations decrease compared to when the victim is presented alone... Deliberative, calculative thinking inhibits emotional processing, rendering people more callous... Teaching people about this bias or priming calculation reduces generosity toward individual victims."
      translation: "식별된 희생자와 함께 통계 정보를 제시하면, 희생자만 단독으로 제시했을 때에 비해 기부금이 감소한다... 숙고적이고 계산적인 사고는 정서적 처리를 억제하여 사람들을 더 냉담하게 만든다... 이 편향을 가르치거나 계산을 점화하는 것만으로도 개별 희생자에 대한 관대함이 줄어든다."
      citation_location: "pp. 143-146, 150-152"

story_application:
  application_idea: "감정선 내 통계 침투 금지 원칙(No-Stats in Affective Climaxes): 비극이나 슬픔, 서스펜스의 클라이맥스 씬에서는 어떠한 거시적 통계나 숫자 자막, 도표를 화면에 띄우지 않는다. 통계가 들어오는 순간 관객의 뇌는 '감정 모드(우뇌/변연계)'에서 '계산 모드(좌뇌 전전두엽)'로 전환되어 눈물이 메마르고 비판적 방관자로 탈바꿈하기 때문임. 통계는 1막의 차가운 오프닝 브리핑에서만 배경으로 짧게 쓰고, 감정이 폭발하는 구간에서는 오직 한 인물의 체온과 눈물에만 100% 집중시켜야 함."
  narrative_stage: "Act 2 Low Point, Climax Catharsis, Tragic Climax"
  emotional_mechanics:
    trigger: "순수한 한 인물의 처절한 고통과 투쟁의 단독 조명 (분석적 간섭 배제)"
    build_up: "계산과 이성을 마비시키는 원초적 공감의 증폭"
    peak: "관객이 인물의 아픔을 자신의 육체적 고통으로 동기화하는 순간"
    release: "거대한 카타르시스와 눈물의 배출"
  failure_modes: "주인공이 슬퍼하는 와중에 옆에서 다른 인물이 '전국에 이런 사람이 30만 명이야'라며 교훈적인 통계를 읊어 관객의 몰입을 순식간에 깨뜨리는 오류"

