key_contribution: 등장인물 동일시(Character Identification) 개념을 체계화. 단순한 호감(Liking), 외형적 유사성(Similarity), 준사회적 상호작용(Parasocial Interaction)과 구별하여, 수용자가 자아 경계를 일시적으로 허물고 인물의 시점, 목표, 감정을 내면화하는 심층 인지적 전이 과정을 규명.
relevance: 관객이 주인공의 결핍과 절박한 동기에 자신의 영혼을 일치시키도록 설계하는 심층 동일시 프로토콜(DIP)의 이론적 토대.
