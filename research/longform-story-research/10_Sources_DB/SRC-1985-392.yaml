key_contribution: 개인 관여도 척도(Personal Involvement Inventory: PII)를 개발. 대상이 개인의 내재적 욕구, 가치, 실질적 이해관계에 결부되는 다차원 관여도 구조를 실증 검증.
relevance: 서사의 사건이 관객 개인의 생활에 미치는 파급 효과(Consequence)와 실질적 선택(Choice)에 직결되어 인지적 관여도가 심화되는 Level 3~4 단계의 측정 기반.
