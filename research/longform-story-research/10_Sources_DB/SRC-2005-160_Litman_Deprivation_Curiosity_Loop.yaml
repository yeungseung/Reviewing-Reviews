claims_and_evidence:
  core_claim: "호기심은 단순한 흥미(Interest-type, I-type)에 그치지 않고, 지식의 부재로 인한 심리적 고통과 결핍을 해소하려는 강력한 '결핍형 호기심(Deprivation-type, D-type Curiosity)'으로 진화한다. 특히 어떤 질문에 대한 해답(Answer)이 주어질 때, 그 해답이 기존 지식 체계를 완전히 닫아버리기보다 새로운 미지의 영역을 가시화하면, 뇌는 일시적 안도 후 즉시 더 날카롭고 고통스러운 새로운 결핍 상태(Deprivation State)로 재진입한다. 이것이 바로 '해답 유발 호기심(Answer-Induced Curiosity)'의 신경학적 메커니즘이다."
  verbatim_quotes:
    - original: "Deprivation-type curiosity is motivated by a painful feeling of a knowledge gap... When a partial answer reveals that the gap is actually wider and more critical than previously thought, the wanting for information intensifies rather than diminishes."
      translation: "결핍형 호기심은 지식 공백이 주는 고통스러운 느낌에 의해 동기부여된다... 부분적인 해답이 그 공백이 이전에 생각했던 것보다 훨씬 더 넓고 치명적임을 드러낼 때, 정보에 대한 갈망(Wanting)은 줄어들기는커녕 오히려 더 격렬해진다."
      citation_location: "Cognition and Emotion, Vol. 19, p. 793-798"

story_application:
  application_idea: "롱폼 스토리의 '해답 유발 결핍 호기심(Answer-Induced Deprivation Loop)' 메커니즘. 관객에게 답을 줄 때 '완전한 종결' 대신 '더 큰 미지의 문'을 열어주는 방식으로 답을 설계함. 예: 살인 현장의 암호를 풀었더니(Answer), '다음 타깃은 바로 형사 당신의 가족'이라는 새로운 좌표가 나오는 순간(새로운 D-type 결핍 점화)."
  narrative_stage: "Subgoal Resolution & Tension Escalation"
  emotional_mechanics:
    trigger: "기존 의문에 대한 부분적 해답 획득"
    build_up: "해답이 내포한 충격적 진실과 새로운 지식 결핍(D-type) 인식"
    peak: "해답 이전보다 훨씬 더 절박해진 새로운 미스터리에 직면하는 순간"
    release: "새로운 갈망(Wanting)과 함께 다음 행동으로 돌진하는 몰입"
  failure_modes: "해답이 너무 완전무결하여 관객이 '아, 다 끝났네'라고 느끼고 퇴장해버리는 '조기 인지적 포만감(Premature Satiation)'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "새로 열리는 질문의 판돈(Stakes)이 이전 질문보다 크거나 최소 동등해야 함"
