credibility_assessment:
  credibility_tier: "Tier 1 Personality, Emotion & Curiosity Neuropsychology"
  methodology:
    study_type: "Psychometric Validation & Experimental Cognitive Testing"
    sample_size: "Large multi-sample psychometric studies across thousands of participants"
    target_population: "인간 호기심의 다차원적 신경 인지 및 동기 체계"
    relationship_type: "Causal and Motivational"
    effect_size: "결핍 호기심(D-type Curiosity) 상태에서 정보 획득 시 동기적 갈망(Wanting) 및 재점화 효과 d = 0.85~1.10"
