claims_and_evidence:
  core_claim: "인간의 뇌는 수동적인 감각 수용기가 아니라 끊임없이 다음 순간의 감각 입력과 사건을 예측하는 '예측 기계(Prediction Machine)'이며, 예측과 실제 입력 간의 불일치인 '예측 오차(Prediction Error)'가 발생할 때 최우선적으로 집행 주의(Executive Attention)를 투입하여 예측 모델을 갱신한다."
  verbatim_quotes:
    - original: "Brains are prediction machines... They constantly use top-down models to predict upcoming sensory inputs, minimizing prediction error. An unexpected input forces the brain to allocate attention and revise its generative model."
      translation: "뇌는 예측 기계이다... 뇌는 예측 오차를 최소화하기 위해 하향식 모델을 끊임없이 사용하여 다가올 감각 입력을 예측한다. 예상치 못한 입력은 뇌로 하여금 주의를 강제 할당하고 생성 모델을 수정하도록 강요한다."
      citation_location: "Behavioral and Brain Sciences, 36(3), p. 181, 184"

story_application:
  application_idea: "서사 오프닝의 '예측 훅(Prediction Hook)' 설계에 직결됨. 관객으로 하여금 상식에 기반해 자연스러운 미래를 예측(Top-down Expectation)하게 만든 직후, 그 예측을 뒤흔드는 미세한 모순이나 불일치(Prediction Error)를 암시함으로써 뇌의 집행 주의를 강제 점유하고 생성 모델을 갱신하기 위해 영상을 끝까지 시청하게 만듦."
  narrative_stage: "Act 1 Hook & Expectation Subversion"
  emotional_mechanics:
    trigger: "관객의 자동적 인지 예측을 촉발하는 상황 제시"
    build_up: "예측 오차(Prediction Error)의 발생 및 신경학적 긴장 고조"
    peak: "기존 예측 모델이 붕괴하고 새로운 진실이 드러나는 순간"
    release: "정확한 상위 인과 모델로의 통합 및 인지적 유창성 회복"
  failure_modes: "예측 오차가 너무 크거나 무작위적이면 뇌는 이를 학습 가능한 정보가 아닌 노이즈로 간주하고 주의를 거둠"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "예측 오차가 기존 도식과 완전히 단절된 허무맹랑한 것이 아니라, 인과적으로 설명 가능한 단서를 포함해야 함"
