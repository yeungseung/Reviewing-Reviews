    relationship_type: "Causal and Functional"
    effect_size: "예측 오류(Prediction Error) 발생 시 상위 피질 재계산 및 주의 재할당 유의미"
    replicated: "Replicated (Karl Friston의 자유 에너지 원리와 함께 현대 인지신경과학의 주류 패러다임)"
