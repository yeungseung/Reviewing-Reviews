id: SRC-1999-552
author: Carl Plantinga
year: 1999
title: The Scene of Empathy and the Human Face on Film
venue: 'Passionate Views: Film, Cognition, and Emotion, Johns Hopkins University Press,
  pp. 239-255'
tier: 1
citation_count: 480
url: https://jhupbooks.press.jhu.edu/title/passionate-views
key_contribution: 영화 서사에서 인물 얼굴 클로즈업이 만드는 '공감의 장면(Scene of Empathy)' 분석. 관객은 얼굴 표정을
  보며 무의식적 안면 피드백과 정서 전염(Emotional Contagion)을 경험하지만, 서사적 맥락과 인과적 축적 없이 눈물이나 신파적 표정만
  쥐어짜는 감정 착취(Emotional Extortion)는 관객의 방어적 냉소와 심리적 반발(Psychological Reactance)을 유발함을
  입증.
relevance: 인간 반응 샷(HUMAN)과 감정 샷(EMOTION)의 과포화 및 신파적 오용이 채널 신뢰도를 붕괴시키는 실패 모드의 핵심 근거.
themes:
- '#56 Theme 2'
