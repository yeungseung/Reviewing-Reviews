claims_and_evidence:
  core_claim: "저널리즘의 역피라미드(Inverted Pyramid) 원칙은 가장 핵심적인 결론(리드문: Who, What, When, Where, Why)을 오프닝 첫 문장에 배치한다. 이는 관객의 인지 부하를 최소화하고 정보의 가치를 즉각 전달하는 최적의 정보성 서사 구조이다. 중요한 것은 결론을 먼저 제시한다고 해서 호기심이 사라지는 것이 아니라는 점이다. 결론을 알게 된 순간 관객의 뇌는 '무엇이 일어났는가(What happened)'의 호기심에서 '도대체 왜, 어떻게 그런 일이 가능했는가(Why and How)'라는 '설명적 호기심 공백(Explanatory Curiosity Gap)'으로 전환된다. 따라서 결론 선행 콘텐츠가 지속적인 완독을 유지하기 위해서는, 결론 직후 그 결과를 낳은 인과 사슬의 미스터리를 즉각 오픈해야 한다."
  verbatim_quotes:
    - original: "Journalists are taught to start with the lead... to give the most important information first. But you don't close the curiosity gap by giving the punchline; you open a deeper gap. When you reveal the outcome first, the audience immediately wants to know: 'How could that possibly happen?'"
      translation: "기자들은 리드(Lead)로 시작하라고 배운다... 즉 가장 중요한 정보를 맨 처음에 주는 것이다. 그러나 결정적 결론을 준다고 해서 호기심 공백이 닫히는 것은 아니며, 오히려 더 깊은 공백이 열린다. 결과를 먼저 공개할 때, 청중은 즉시 묻게 된다: '도대체 어떻게 그런 일이 일어날 수 있었는가?'"
      citation_location: "pp. 84-88"

story_application:
  application_idea: "설명형 영상, 지식 다큐멘터리, 탐사 보도 콘텐츠에서는 '결론을 감추는 신비주의'를 버리고 'Inverted Pyramid + Why Gap' 공식을 적용함. 첫 30초에 '결국 회사가 파산했다'는 결론을 투명하게 던져 신뢰도를 확보한 뒤, '하지만 그들이 가진 기술은 당대 최고였다. 그렇다면 왜 망했는가?'라는 Why 공백을 열어젖힘으로써 30분의 본문 시청을 완벽히 유도함."
  narrative_stage: "Inverted Pyramid Lead, Explanatory Narrative, Why/How Curiosity Transition"
  emotional_mechanics:
    trigger: "핵심 결론과 결과의 투명한 조기 공개로 인한 신뢰 형성"
    build_up: "결론을 듣고 나서 발생하는 '왜?'라는 더 깊은 인과적 의문 점화"
    peak: "상식적으로 이해되지 않는 결과의 숨겨진 이면을 향한 호기심 폭발"
    release: "본문의 체계적인 단계별 분석을 통해 의문이 논리적으로 해소되는 지적 쾌감"
    resonance: "복잡한 세상을 꿰뚫어 보는 인과적 통찰력 획득"
  failure_modes: "결론만 던져놓고 '왜/어떻게'에 대한 인과적 미스터리를 열지 않아, 관객이 결론만 듣고 영상을 즉시 꺼버리는 조기 이탈 참사"

