claims_and_evidence:
  core_claim: "수용자는 서사를 경험할 때 인과(Causality), 의도/목표(Intentionality), 시간(Time), 공간(Space), 인물(Protagonist)의 5개 핵심 차원을 실시간으로 인덱싱하며, 선택과 결과의 인과적 단절은 상황 모델 업데이트 부하를 유발해 이해도를 떨어뜨린다."
  verbatim_quotes:
    - original: "Readers track at least five situational dimensions: time, space, causation, intentionality, and protagonist. Shifts along these dimensions systematically increase processing load."
      translation: "독자는 최소 5개의 상황 차원(시간, 공간, 인과, 의도성, 인물)을 추적한다. 이러한 차원에 따른 단절이나 전이는 처리 부하를 체계적으로 증가시킨다."
      citation_location: "p.162, Abstract"

story_application:
  application_idea: "사건의 결과(Consequence)는 반드시 이전의 인과(Causality) 및 인물의 의도(Intentionality)와 직결되어야 하며, 인과적 근거 없는 우연적 결과는 관객의 상황 모델을 붕괴시켜 몰입을 저해함."
  narrative_stage: "Micro/Macro Causal Architecture & Scene Transition"
  emotional_mechanics:
    trigger: "인물의 의도적 선택과 그로 인한 명확한 결과 발생"
    build_up: "5개 차원의 안정적 갱신을 통한 서사 세계의 현실감 구축"
    peak: "선택의 누적된 결과가 폭발하는 인과적 정점"
    release: "인과적 필연성에 대한 인지적 납득과 안정"
  failure_modes: "선택 없이 결과만 주어지거나, 원인과 결과의 연결고리가 끊어지면 관객은 혼란과 인지 피로를 겪음"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "스토리의 논리적 연속성과 인과적 필연성이 전제되는 모든 서사 양식에 적용"
