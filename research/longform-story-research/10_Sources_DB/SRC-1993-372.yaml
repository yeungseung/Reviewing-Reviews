id: SRC-1993-372
author: Eldar Shafir, Itamar Simonson, & Amos Tversky
year: 1993
title: 'Reason-based choice'
venue: Cognition
tier: 1
citation_count: 3250
url: https://doi.org/10.1016/0010-0277(93)90034-S
key_contribution: 이유 기반 선택 이론(Reason-Based Choice)을 정초하여, 인간의 의사결정이 단순한 효용 계산이 아니라 자신과 타인에게 정당화할 수 있는 '이유(Reasons)'를 찾는 과정임을 규명. 특히 혜택과 비용이 동시에 발생하는 트레이드오프 프레이밍(Trade-Off Framing) 하에서 대립되는 이유 간의 갈등이 선택의 고통과 서스펜스를 극대화함을 실증.
relevance: 서사에서 주인공이 어떤 선택을 하든 막대한 대가와 정당한 이유가 상충하는 외통수 딜레마를 구축하여 관객의 숨을 멎게 만드는 트레이드오프 설계의 이론적 토대.
themes:
- '#41 Theme 2'
