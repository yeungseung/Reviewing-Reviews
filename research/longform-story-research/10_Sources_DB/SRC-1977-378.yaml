url: https://doi.org/10.1037/0022-3514.35.9.677
key_contribution: 자기 참조 효과(Self-Reference Effect: SRE)를 최초로 입증. 정보를 자신의 자아 도식(Self-Schema)과 결부시켜 처리할 때, 구조적·음운론적·단순 의미론적 처리 대비 기억 부호화의 깊이와 회상률(Recall)이 비약적으로 상승함을 실증.
relevance: 관객이 이야기 속 사건과 인물의 처지를 자신의 현실(돈, 직장, 가족, 실수)에 투영하게 만들어 몰입과 장기 기억을 극대화하는 자기 참조 부호화 엔진(SRE-E)의 학술적 토대.
