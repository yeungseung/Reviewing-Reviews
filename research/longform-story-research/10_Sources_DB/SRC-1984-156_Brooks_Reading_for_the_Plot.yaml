claims_and_evidence:
  core_claim: "플롯(Plot)은 정적인 기하학적 구조가 아니라, 종말(End/Resolution)을 향해 돌진하면서도 동시에 그 완전한 종말을 필사적으로 지연(Delay, Retardation, Detour)시키는 '서사적 욕망(Narrative Desire)'의 역동적인 엔진이다. 만약 서사가 상위 질문(Big Loop)에 즉각 답해버리면 서사는 조기 사망(Premature Death)한다. 따라서 롱폼 서사는 중간부(The Middle)에서 수많은 우회로(Deviance)와 국소적 오픈 루프들을 열고 닫는 반복(Repetition) 과정을 통해 생명력을 유지해야 한다."
  verbatim_quotes:
    - original: "Plot is the internal logic of the discourse of desire... The desire of the narrative is for its own end, but that end must be reached through detour, postponement, and repetition. Without the delay of the middle, narrative collapses."
      translation: "플롯은 욕망의 담론이 지닌 내적 논리이다... 서사의 욕망은 자신의 종말을 향하지만, 그 종말은 우회, 지연, 반복을 거쳐 도달해야 한다. 중간부의 지연이 없다면 서사는 붕괴한다."
      citation_location: "Knopf / Harvard University Press, p. 103-108"

story_application:
  application_idea: "롱폼 서사 중간부(The Middle)의 '의도적 우회와 지연(Constructive Detours)' 설계. 결말을 너무 일찍 드러내지 않으면서도 관객이 지루해하지 않도록, 중간부에서 새로운 챕터 루프(돌발 변수, 장애물, 위장된 가짜 단서)를 열어 메인 플롯의 해결을 유예시키는 서사적 서스펜스 유지 공식."
  narrative_stage: "The Narrative Middle (Act 2) & Structural Detours"
  emotional_mechanics:
    trigger: "종말(해결)에 대한 원초적 갈망 형성"
    build_up: "중간부의 장애물과 예기치 않은 우회로(Detour)를 통한 긴장의 연장"
    peak: "우회로 끝에서 마침내 진정한 종말(Ultimate Closure)의 징후를 마주하는 순간"
    release: "오랜 지연 끝에 찾아오는 궁극의 결말과 카타르시스"
  failure_modes: "우회로가 단순 시간 끌기(Filler)로 변질되어 서사의 종말 욕망을 식혀버리는 '임의적 공회전'"

verification_status:
