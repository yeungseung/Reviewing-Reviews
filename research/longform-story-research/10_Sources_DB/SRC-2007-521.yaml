id: SRC-2007-521
author: Wendy Wood & David T. Neal
year: 2007
title: "A new look at habits and the habit-goal interface"
venue: "Psychological Review, 114(4), 843-863"
tier: 1
citation_count: 2200
url: https://doi.org/10.1037/0033-295X.114.4.843
key_contribution: "습관과 목표의 상호작용 메커니즘 규명. 인간 행동의 약 45%가 일상적 맥락 단서(Context Cue)에 의해 자동으로 촉발되는 습관(Habit)으로 작동하며, 초기 행동을 습관 루프로 안정화시키기 위해서는 예측 가능하고 신뢰할 수 있는 보상(Reward) 경험이 필수적임을 실증."
relevance: "유튜브, OTT, 웹툰 등 반복 소비 플랫폼에서 수용자가 특정 채널을 정기적으로 재방문하는 '습관적 시청(Habitual Viewing)'을 형성하기 위해 결말에서 일관된 정서 보상이 주어져야 함을 입증."
themes:
  - "#53 Theme 3"
