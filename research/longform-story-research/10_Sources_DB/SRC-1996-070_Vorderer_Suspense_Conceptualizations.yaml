claims_and_evidence:
  core_claim: "서스펜스(Suspense)는 4가지 심리적 요건이 동시에 충족될 때만 점화된다: ① 호감 가는 주인공에 대한 도덕적 애착(Affective Disposition: 선한 인물이 구원받아야 한다는 열망), ② 파멸적이고 돌이킬 수 없는 결과의 중요도(High Stakes: 생명, 명예, 파멸), ③ 부정적 결과의 높은 발생 확률(Negative outcome highly probable), ④ 결과가 확정되기 전까지의 시간적 지연(Temporal Delay / Ticking Clock). 관객이 결과를 모르는 상태에서 지연될수록 서스펜스는 기하급수적으로 폭발한다."
  verbatim_quotes:
    - original: "Suspense is an acute emotional state experienced when an outcome is both uncertain and of supreme consequence, characterized by an acute fear for a liked protagonist facing a probable catastrophe."
      translation: "서스펜스는 결과가 불확실하면서도 극도로 중대할 때 경험하는 급성 정서 상태이며, 파멸의 가능성에 직면한 호감 가는 주인공에 대한 극심한 두려움으로 특징지어진다."
      citation_location: "pp. 233-238"

story_application:
  application_idea: "서스펜스 트리거 공식: '호감 가는 주인공(애착) + 시한폭탄(시간 지연) + 10%의 희망 vs 90%의 절망(불확실성 편향) + 실패 시 즉사(극단적 판돈)'. 이 4가지 요건 중 하나라도 빠지면 서스펜스는 단순한 지루한 대기로 전락함."
  narrative_stage: "Act 2 Crisis & Ticking Clock Climax"
  emotional_mechanics:
    trigger: "파멸적 위협과 시간 제한의 동시 제시"
    build_up: "탈출 가능성이 10% 미만으로 좁혀지는 악화 시퀀스"
    peak: "시계가 마지막 3초를 가리키는 숨 막히는 정점"
    release: "극적 회피를 통한 거대한 안도감(Relief)"
  failure_modes: "주인공에 대한 애착이 없거나, 판돈이 시시하여 관객이 결과에 무관심한 실패"

verification_status:
  status: "Strong Support"
