title: 'The psychology of curiosity: A review and reinterpretation'
venue: Psychological Bulletin
tier: 1
citation_count: 3450
url: https://doi.org/10.1037/0033-2909.116.1.75
key_contribution: 정보 공백 이론(Information-Gap Theory of Curiosity)을 정초. 호기심은 '현재 알고 있는 것'과 '알아야 하는 것' 사이의 간극을 인식할 때 유발되는 인지적 박탈감(Aversive Deprivation)이며, 이 간극을 메우기 위해 인간은 자발적이고 강력한 정보 탐색 행동을 지속함을 규명.
relevance: 탐구형 챕터(Investigative Chapter)의 1단계인 '질문 프레이밍(Question Framing)'이 어떻게 관객의 지적 결핍을 자극하고 챕터 전체의 시청 동력을 형성하는지 설명하는 심리학적 근거.
themes:
  - '#47 Theme 1'
