key_contribution: 사회정서적 선택성 이론(SST)을 바탕으로, 시간의 유한성과 삶의 취약성이 자각될 때 기쁨과 슬픔이 융합된 포이그넌시(Poignancy)
  감정이 촉발되며, 이것이 삶의 깊은 의미 형성(Meaning Making)과 인지적 고착을 촉진함을 실증.
relevance: 롱폼 서사의 클라이맥스와 엔딩에서 유한성과 희생의 가치를 조명하여 시청자에게 삶의 깊은 의미 닻(EMA)을 내리는 설계 원리.
