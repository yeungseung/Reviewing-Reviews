key_contribution: 영상 미디어 미학의 5대 차원(공간, 시간, 빛, 색채, 사운드) 체계화. 샷 크기(ECU~ELS)와 프레임 내 음의 공간(Negative Space), 화면 벡터(지표·모션 벡터), 카메라 앵글(앙각 vs 부각)이 관객의 정서적 평가와 심리적 완결(Psychological Closure)에 미치는 시각 문법 규명. 인물을 프레임 구석에 배치하고 거대한 여백을 남기는 구도가 고독(Isolation)과 취약성을 극대화함을 시각 미학적으로 정립.
relevance: 샷 구도, 네거티브 스페이스(여백), 앙각/부각 앵글을 활용하여 감정적 고립감, 위압감, 경외감을 설계하는 미학적·심리학적 기준.
