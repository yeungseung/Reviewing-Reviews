claims_and_evidence:
  core_claim: "인간의 작업 기억(Working Memory) 용량은 극도로 제한되어 있으며, 정보 처리 과정에서 발생하는 인지 부하(외재적·내재적 부하)가 임계치를 초과하면 정보의 이해와 장기 기억 저장이 전면 마비된다."
  verbatim_quotes:
    - original: "Cognitive load theory suggests that learning happens best under conditions that are aligned with human cognitive architecture... excessive cognitive load impedes the acquisition of schemas."
      translation: "인지 부하 이론은 학습이 인간의 인지 구조와 부합하는 조건에서 가장 잘 일어난다고 제안한다... 과도한 인지 부하는 스키마 획득을 방해한다."
      citation_location: "p.257, Introduction"

story_application:
  application_idea: "롱폼 서사에서 복잡한 규칙이나 급격한 가치 반전을 쏟아부을 때 관객의 작업 기억이 포화되지 않도록, 피크 직후 30~60초의 저강도 완충 구간(Cognitive Valley)을 설계하여 인지 과부하로 인한 이탈을 방지함."
  narrative_stage: "Pacing & Post-Climax Valley"
  emotional_mechanics:
    trigger: "긴장 해소 및 호흡 정리"
    build_up: "앞선 정보의 내면적 정리(Consolidation)"
    peak: "다음 사이클을 위한 인지 자원 회복"
    release: "새로운 갈등에 대한 수용 준비 완료"
  failure_modes: "완충 없이 고난도 복선과 반전, 규칙을 연속 난사하면 관객은 '이해 포기(Cognitive Surrender)' 선언"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "15분 이상 지속되는 복잡한 정보형/스릴러 롱폼에서 결정적 변수로 작용"
