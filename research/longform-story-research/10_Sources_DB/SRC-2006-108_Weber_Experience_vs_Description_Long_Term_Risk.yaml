claims_and_evidence:
  core_claim: "경험 기반 위험 지각(Experience-based Perception)과 휴먼 스케일의 필연성: 인간의 뇌는 통계적 그래프, 기후 보고서, 경제 수치와 같은 '기술 기반 정보(Description-based)'를 처리할 때 원초적 공포나 긴장 반응을 일으키지 못한다. 인간 뇌의 위험 평가 시스템은 수백만 년간 '직접적인 감각적 경험(Experience-based: 타는 듯한 폭염, 말라비틀어진 우물, 폭우로 물에 잠긴 내 거실)'을 통해서만 작동하도록 진화했기 때문이다. 지구 온난화나 국가 부도 같은 거대한 장기적 위기가 대중을 두렵게 만들지 못하는 이유는 그것이 '기술(Description)'의 형태로 전달되기 때문이다. 서사에서 거대 위험을 관객에게 실존적 공포로 각인시키려면, 거시 통계를 집어던지고 인물이 매일 마주하는 '체온, 식탁의 결핍, 당장 내일 겪는 생생한 일상적 파괴'라는 경험 기반 휴먼 스케일로 번역해야만 한다."
  verbatim_quotes:
    - original: "Statistical descriptions of risk lack the punch of direct personal experience. Personal experience with a risk event produces much more memorable and emotionally charged impressions... If climate change is only described through abstract global averages, the affective visceral system remains unengaged, leading to widespread apathy."
      translation: "위험에 대한 통계적 기술은 직접적인 개인적 경험이 지닌 강력한 타격을 결여하고 있다. 위험 사건에 대한 개인적 경험은 훨씬 더 기억에 남고 정서적으로 충전된 인상을 만들어낸다... 기후 변화가 추상적인 전 지구적 평균으로만 기술된다면, 정서적·본능적 시스템은 전혀 가동되지 않아 광범위한 무관심으로 이어진다."
      citation_location: "pp. 103-107, 114-118"

story_application:
  application_idea: "기술에서 경험으로의 감각적 렌더링(Sensory Experience Rendering): 기후 변화를 다룰 때 '지구 평균 기온 1.5도 상승'이라는 자막 대신, '너무 뜨거워진 아스팔트에 밑창이 녹아 달라붙는 주인공의 낡은 운동화'와 '가뭄으로 말라붙은 수도꼭지에서 쉭쉭거리는 헛바람 소리'로 관객의 촉각과 청각을 직접 타격함."
  narrative_stage: "Act 1 Inciting Incident, Act 2 Complications, Midpoint Reality Shock"
  emotional_mechanics:
    trigger: "거대한 추상적 재난의 서막"
    build_up: "일상적인 공간(집, 직장, 학교)으로 침투하는 감각적 결핍의 경험"
    peak: "직접적인 육체적 위협과 통제 불능의 감각적 공포 폭발"
    release: "경험적 위기를 돌파하기 위한 생존 행동의 개시"
  failure_modes: "전문가 캐릭터가 나와서 모니터 그래프만 가리키며 '이대로 가면 2050년에 큰일 납니다'라고 설명하여 관객을 하품하게 만드는 서사"

