id: SRC-2008-352
author: Fiery Cushman
year: 2008
title: 'Crime and punishment: A two-process model of moral judgment'
venue: Cognition
tier: 1
citation_count: 980
url: https://doi.org/10.1016/j.cognition.2008.01.006
key_contribution: 도덕적 비난과 처벌의 2프로세스 모델을 수립하여, 주관적 의도(Intent)는 도덕적 잘못(Wrongness) 평가를
  지배하고 객관적 피해 결과(Outcome Harm)는 처벌 수위(Punishment) 평가를 지배하며, 문화와 편향에 따라 이 둘의 가중치가 교란됨을
  증명.
relevance: 서사에서 인물의 의도와 행동 결과를 분리(Decoupling)하여 제시함으로써 시청자가 즉각적 감정 마녀사냥에 빠지지 않고 입체적
  도덕 딜레마에 몰입하게 만드는 설계의 기초.
themes:
- '#39 Theme 3'
