claims_and_evidence:
  core_claim: "인간의 에피소드 기억(Episodic Memory) 시스템은 과거 사건을 그대로 재생하는 비디오테이프가 아니라, 미래를 상상하고 가상 시나리오를 시뮬레이션하기 위해 과거의 감각·공간·행동 세부 요소들을 유연하게 재조합하는 '구성적 에피소드 시뮬레이션(Constructive Episodic Simulation)' 시스템이다. 뇌의 핵심 네트워크(내측 측두엽, 해마, 내측 전전두엽, 후대상피질)는 구체적 디테일 파편들을 재료로 삼아 허구적 사건을 생생한 대리 경험으로 구축한다."
  verbatim_quotes:
    - original: "We propose the constructive episodic simulation hypothesis, which holds that simulation of future episodes requires a system that can draw on elements of past experience in a flexible manner. Episodic memory supports the construction of future events by providing details from which simulations can be built."
      translation: "우리는 구성적 에피소드 시뮬레이션 가설을 제안한다. 이 가설은 미래 에피소드의 시뮬레이션이 과거 경험의 요소들을 유연한 방식으로 끌어올 수 있는 시스템을 필요로 한다고 본다. 에피소드 기억은 시뮬레이션이 구축될 수 있는 세부사항들을 제공함으로써 미래 사건의 구성을 지원한다."
      citation_location: "p. 773"

story_application:
  application_idea: "독자나 관객이 서사 속 인물의 세계에 몰입하는 것은 '추상적 주제' 때문이 아니라, 서사가 제공하는 '구체적인 감각·공간·행동 디테일'이 관객 자신의 에피소드 기억 파편을 점화하여 뇌 속에서 자율적인 시뮬레이션 엔진을 가동하기 때문임. 창작자는 관객이 머릿속에서 시뮬레이션을 돌릴 수 있도록 정밀하고 물리적인 에피소드 앵커(Episodic Anchors)를 배치해야 함."
  narrative_stage: "Worldbuilding, Scene Simulation & Suspense Architecture"
  emotional_mechanics:
    trigger: "구체적 시공간·사물·행동 단서의 제시"
    build_up: "관객의 해마 및 내측 전전두엽 망 활성화를 통한 가상 시나리오 시뮬레이션 구동"
    peak: "등장인물의 물리적 위험이나 선택에 대한 대리적 감각-운동 체험"
    release: "시뮬레이션된 결과의 확인을 통한 인지적 해소 및 정서적 카타르시스"
  failure_modes: "추상적인 개념어('그는 절망에 빠졌다')만 나열하여 관객의 뇌에 시뮬레이션을 가동할 재료(에피소드 디테일)를 주지 못하는 건조한 서사"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "디테일이 관객의 인지적 기억 스키마와 최소한의 감각적 접점을 지닐 때 시뮬레이션이 원활히 촉발됨"
