title: "Gorillas in our midst: Sustained inattentional blindness for dynamic events"
venue: "Perception, 28(9), 1059-1074"
tier: 1
citation_count: 5100
url: https://doi.org/10.1068/p281059
key_contribution: "부주의 맹(Inattentional Blindness) 및 변화 맹(Change Blindness) 패러다임 정립. 인간의 시지각은 화면 속 물리적 자극의 단순 변화가 아니라, 관객이 활성화하고 있는 인지적 과제 및 의미론적 관심사(Attentional Set & Meaningful Gist)에 종속되어 있음을 실증."
relevance: "화면에서 물리적으로 컷을 백 번 바꿔도 의미적·서사적 갱신이 없으면 관객의 뇌는 이를 지각하지 못하거나 잡음으로 흘려버린다는 'Semantic Visual Refresh'의 인지심리학적 기초 제공."
