claims_and_evidence:
  core_claim: "인간은 서로 양립할 수 없는 두 개 이상의 인지 요소(신념, 사실, 지각)가 동시에 주어질 때 극심한 심리적 불편감인 '인지 부조화(Cognitive Dissonance)'를 경험한다. 이 부조화는 단순한 불쾌감이 아니라 배고픔이나 갈증과 같은 강력한 추동(Drive) 상태를 형성하여, 모순을 설명하고 조화로운 새로운 이해 체계를 재구축할 때까지 지속적인 정보 탐색과 주의 집중을 강제한다. 따라서 오프닝에서 기존 상식과 충돌하는 모순(Contradiction Engine)을 던지는 것은 관객의 뇌를 즉각적 인지 조화 추구 모드로 락인시키는 가장 강력한 지적 동기화 수단이다."
  verbatim_quotes:
    - original: "The existence of dissonance, being psychologically uncomfortable, will motivate the person to try to reduce the dissonance and achieve consonance... When dissonance is present, in addition to trying to reduce it, the person will actively avoid situations and information which would likely increase the dissonance."
      translation: "부조화의 존재는 심리적으로 불편하기 때문에, 개인으로 하여금 그 부조화를 줄이고 조화를 달성하도록 동기화한다... 부조화가 존재할 때, 개인은 그것을 줄이려 노력할 뿐만 아니라 그 부조화를 더욱 증가시킬 만한 상황과 정보를 적극적으로 피하려 한다."
      citation_location: "pp. 3-4"

story_application:
  application_idea: "서사 오프닝에서 'Contradiction Engine'을 가동하여 관객이 상식적으로 믿고 있던 명제와 정면 충돌하는 기괴한 사실이나 상충되는 두 인과를 1초 만에 제시함 (예: '세계에서 가장 청렴하고 부유한 국가가 어떻게 국민의 40%를 감옥에 가두었는가?'). 관객의 뇌는 인지 부조화로 인한 긴장을 해소하기 위해 서사 본문이 제공하는 설명을 간절히 갈구하게 됨."
  narrative_stage: "Contradiction Opening, Prediction Error Hook, Epistemic Drive Induction"
  emotional_mechanics:
    trigger: "상식과 정면으로 모순되는 충격적 팩트나 인과적 역설 목격"
    build_up: "기존 신념 체계와 신규 사실 간의 인지 부조화 및 지적 불편감 폭증"
    peak: "'도대체 이 모순이 어떻게 가능한가?'라는 인지 조화 복구의 극단적 추동"
    release: "이야기의 전개를 통해 모순의 숨겨진 구조적 원인을 파악하며 얻는 지적 쾌감"
    resonance: "기존 상식을 뛰어넘는 심오한 현실 인식과 패러다임 전환 경험"
  failure_modes: "모순을 던져놓고 서사 후반부까지 논리적 해명을 제공하지 못하여 관객에게 배신감과 허탈감을 주는 사기극 오류"

