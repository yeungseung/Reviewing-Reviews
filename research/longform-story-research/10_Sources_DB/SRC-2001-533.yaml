key_contribution: "서사 저널리즘(Narrative Journalism)의 신화적·서사적 원형 분석. 뉴스와 탐사 보도가 단순한 사실 나열을 넘어 인간적 비극과 영웅적 투쟁의 서사 구조(Mythological Archetype)를 취할 때 대중적 의미 형성과 공공 참여를 격발함을 체계화."
relevance: "저널리즘 및 시사 다큐멘터리에서 사실성(Facticity)의 엄격한 통제하에 인간적 감정 서사를 어떻게 조화시켜야 하는지 규명하고, 70:30의 증거 우위 역피라미드 서사 시퀀싱의 이론적 토대를 제공."
