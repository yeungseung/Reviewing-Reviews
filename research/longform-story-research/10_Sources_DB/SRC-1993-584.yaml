id: SRC-1993-584
author: Marcia K. Johnson, Shahin Hashtroudi, & D. Stephen Lindsay
year: 1993
title: 'Source Monitoring'
venue: Psychological Bulletin, 114(1), pp. 3-28
tier: 1
citation_count: 6100
url: https://doi.org/10.1037/0033-2909.114.1.3
key_contribution: 출처 감시 프레임워크(Source Monitoring Framework, SMF)의 정립. 인간의 뇌는 기억 내용 자체와 기억의 기원(실제 사건 vs 상상 vs 제3자의 이야기 vs 연출된 재연)을 판별하는 과정에서 빈번히 착오를 일으킴. 특히 생생하고 구체적인 시각적 단서(재연 화면, 가짜 뉴스 그래픽)는 뇌에서 실제 경험이나 공적 사료로 잘못 태깅되는 외부 출처 감시 오류(External Source Monitoring Error)를 40% 이상 유발함을 실증.
relevance: 재연 씬, 역사 사료, 스톡 B-roll의 시각적 경계가 모호할 때 관객의 기억이 영구적으로 왜곡되므로 시각적 출처 메타데이터(VPA-M)가 필수적임을 뒷받침하는 핵심 원전.
themes:
- '#59 Theme 1'
