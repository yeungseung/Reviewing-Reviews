claims_and_evidence:
  core_claim: "인간의 뇌는 정보를 처리할 때 제한된 인지 용량(Limited Capacity)을 세 가지 하위 시스템(부호화/Encoding, 저장/Storage, 인출/Retrieval)에 분배한다. 격렬한 갈등, 고함, 빠른 화면 전환, 폭력 등 강렬한 위협 자극은 '부호화(Encoding)' 시스템에 인지 자원을 100% 강제 집중시킨다. 그 결과, 맥락과 주제를 장기 기억에 정착시키는 '저장(Storage)' 및 인과적 복잡성을 이해하는 데 필요한 인지 자원이 완전히 고갈되는 '인지 자원 과부하(Cognitive Resource Overload)'가 발생한다."
  verbatim_quotes:
    - original: "People are limited-capacity information processors. When a media message is extremely arousing and structurally complex—such as intense conflict and fast-paced action—automatic resource allocation to encoding robs resources from storage, resulting in cognitive overload and impoverished long-term comprehension."
      translation: "인간은 제한된 용량의 정보 처리자이다. 미디어 메시지가 극도로 각성적이고 구조적으로 복잡할 때(예: 격렬한 갈등과 빠른 속도의 액션), 부호화 과정으로의 자동적 자원 할당이 저장 과정으로부터 자원을 빼앗아 인지 과부하와 빈약한 장기 이해도를 낳는다."
      citation_location: "pp. 46-49, 58-61"

story_application:
  application_idea: "갈등 오프닝(Conflict Opening)을 배치할 때 인물의 복잡한 대사, 복선, 세계관 설정을 함께 쑤셔 넣으면 관객은 폭력/충돌 장면에 자원을 다 쓰느라 중요한 설정을 전혀 기억하지 못함. 복잡한 맥락이나 세계관 규칙을 전달해야 할 때는 자극적인 갈등 대신 인지적 여유가 있는 휴먼 모먼트(Human Moment) 오프닝을 선택해야 수용자의 뇌에 온전히 저장됨."
  narrative_stage: "Opening Framing, Resource Allocation & Pacing Engineering"
  emotional_mechanics:
    trigger: "자극 강도에 따른 인지 자원의 자동적 편중 할당"
    build_up: "갈등 씬에서의 부호화 집중 vs 휴먼 모먼트에서의 저장/맥락 통합 여유"
    peak: "인지 과부하 방지를 통한 핵심 갈등과 인과 맥락의 완벽한 뇌 내 장착"
    release: "자원 배분의 안정화를 통한 지속 가능한 장기 몰입 확보"
  failure_modes: "오프닝에서 총격전을 벌이면서 동시에 복잡한 정치적 음모를 대사로 읊어 관객의 인지 시스템을 과부하 폭발로 몰고 가는 오류"

