key_contribution: "통찰(Insight / Aha! moment) 순간 뇌 신경 활성화의 fMRI 및 EEG 실증. 문제 해결 통찰 직전 우측 전상측두회(aSTG)에서 급증하는 감마파(Gamma band burst, ~40Hz) 신경 활성화와 도파민 보상 메커니즘 규명."
relevance: "서사 결말의 통찰 보상(Insight Reward)과 관점 전환(Reframe)이 관객 뇌에 방출하는 즉각적인 신경학적 쾌락과 강렬한 서사적 만족도의 생물학적 기제."
