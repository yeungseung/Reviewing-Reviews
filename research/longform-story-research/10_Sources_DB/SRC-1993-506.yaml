id: SRC-1993-506
author: Mary Beth Oliver
year: 1993
title: "Exploring the Paradox of the Enjoyment of Sad Films"
venue: "Human Communication Research, 19(3), 315-342"
tier: 1
citation_count: 720
url: https://doi.org/10.1111/j.1468-2958.1993.tb00304.x
key_contribution: "비극과 슬픈 영화를 즐기는 '슬픔의 역설(Paradox of Sad Films)' 실증 규명. 슬픈 결말이 단순한 불쾌감이 아니라 인간적 유대감, 공감(Empathy), 삶의 숭고한 의미를 반추하는 고차원적 메타 정서(Meta-emotion)와 에우다이모닉 만족을 창출함을 입증."
relevance: "드라마·비극 서사에서 해피엔딩 대신 비터스위트 및 카타르시스적 애도(Poignant Mourning) 엔딩을 설계할 때 관객 만족도를 극대화하는 이론적 준거."
themes:
  - "#52 Theme 3"
