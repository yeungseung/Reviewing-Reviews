id: SRC-1936-274
title: "The Unanticipated Consequences of Purposive Social Action"
authors:
  - "Robert K. Merton"
year: 1936
type: academic_primary
tier: 1
publication: "American Sociological Review"
volume: "1"
issue: "6"
pages: "894-904"
doi: "10.2307/2084615"
citation_count: 10500
key_findings:
  - "의도적 사회적 행동이 야기하는 예측 불가능한 결과 체계화: 무지(Ignorance), 오류(Error), 즉각적 이익에 대한 집착(Imperious Immediacy of Interest), 기본적 가치(Basic Values), 자기실현적/자기파괴적 예언."
  - "특정 목적을 달성하기 위한 합리적 행동이 오히려 원래 목표와 정반대의 파멸적 결과를 낳는 '역설적 결과(Result Reversal)' 및 예상치 못한 대가(Cost Reversal)의 사회학적 메커니즘 규명."
  - "정책, 비즈니스, 역사 서사에서 '의도와 결과의 역전'을 설명하는 가장 본질적인 사회과학적 정초 제공."
core_claims:
  - "인간의 합리적이고 의도적인 행동은 복잡계 내에서 필연적으로 원래 의도와 상충하거나 정반대의 결과를 낳는다."
  - "결과 반전(Result Reversal), 비용 반전(Cost Reversal), 수혜 반전(Benefit Reversal)은 의도치 않은 결과의 3대 핵심 발현 양식이다."
keywords:
  - unanticipated consequences
  - purposive social action
  - result reversal
  - perverse effect
  - sociological ambivalence
