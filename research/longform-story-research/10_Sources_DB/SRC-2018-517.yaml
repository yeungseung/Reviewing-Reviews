id: SRC-2018-517
author: Brett Q. Ford, Phoebe C. Lam, Oliver P. John, & Iris B. Mauss
year: 2018
title: "The psychological health benefits of accepting negative emotions and thoughts: Laboratory, diary, and longitudinal evidence"
venue: "Journal of Personality and Social Psychology, 115(6), 1075-1092"
tier: 1
citation_count: 590
url: https://doi.org/10.1037/pspp0000157
key_contribution: "부정적 정서에 대한 무조건적 억압이나 피상적 긍정 강요(Toxic Positivity)의 역설적 폐해를 규명. 부정적 감정과 사고를 있는 그대로 인정하고 수용(Acceptance)하지 않고 성급하게 긍정으로 재해석(Premature Reappraisal)하려 할 때, 오히려 부정적 정서 반응성과 심리적 디스트레스가 증폭됨을 실험 및 종단 연구로 입증."
relevance: "포지티브 리프레임의 치명적 실패 모드인 '독성 긍정'과 현실 축소 오류를 방지하기 위해, 내러티브에서 고통과 비극을 충분히 인정·타당화(Validation)하는 단계를 거친 뒤에만 건설적 리프레임이 유효하다는 절대적 경계 조건을 제공."
themes:
  - "#53 Theme 2"
