claims_and_evidence:
  core_claim: "정서 반응(Affect)은 인지적 추론(Cognitive Inference)보다 신경생물학적으로 먼저 일어나며, 인지적 인식 없이도 대상에 대한 호불호와 주의 집중이 선행적으로 결정된다 (Affective Primacy)."
  verbatim_quotes:
    - original: "Affect and cognition are separate and partially independent systems... affect can be generated without a prior cognitive process and often precedes cognitive appraisal."
      translation: "정서와 인지는 분리되어 있으며 부분적으로 독립적인 시스템이다... 정서는 선행하는 인지 과정 없이도 생성될 수 있으며 종종 인지적 평가보다 앞선다."
      citation_location: "p.151, Abstract"

story_application:
  application_idea: "서사 오프닝에서 논리적 설명(Story/Exposition)을 길게 늘어놓기 전에, 원초적인 호기심·불안·경이감 등의 정서 자극(Emotion Hook)을 먼저 배치하여 관객의 주의를 순식간에 포착함 (Emotion-First Opening)."
  narrative_stage: "Act 1 Opening Hook (0~60s)"
  emotional_mechanics:
    trigger: "본능적 정서 자극(위협, 기이함, 아름다움)"
    build_up: "인지적 해석에 앞선 생리적 각성"
    peak: "주의의 즉각적 고정"
    release: "호기심을 해소하기 위한 본편 서사 진입"
  failure_modes: "정서적 충격 후 인과적 맥락(Story)이 빠르게 공급되지 않으면 관객은 당혹감과 조작감을 느끼고 이탈함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "오프닝 훅의 정서가 본편 사건의 핵심 동력과 연결되어야 함"
