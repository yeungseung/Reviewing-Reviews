id: SRC-1988-381
author: Claude M. Steele
year: 1988
title: 'The psychology of self-affirmation: Sustaining the integrity of the self'
venue: Advances in Experimental Social Psychology
tier: 1
citation_count: 5540
url: https://doi.org/10.1016/S0065-2601(08)60229-4
key_contribution: 자기 긍정 이론(Self-Affirmation Theory)을 정초. 자신의 핵심 가치나 도덕적 완전성에 위협을 느끼는 메시지에 직면할 때 인간은 방어적 합리화, 부정, 회피를 발동함을 실증. 자아 가치를 사전에 긍정(Self-Affirmation)해 줄 때 비로소 방어 기제가 해제되고 위협적인 진실과 자신의 실수를 수용함을 규명.
relevance: 서사에서 시청자의 치명적인 약점이나 실수를 거울처럼 비출 때, 관객의 방어적 저항(Defensiveness)을 누그러뜨리고 치유적 성찰로 이끄는 자기 긍정 방어 필터(SAD-F)의 학술적 근거.
themes:
- '#42 Theme 1'
