key_contribution: 시나리오 구조론의 표준인 '비트 이론(Beat Theory)'을 정립. 비트를 서사 행동의 가장 작은 요소이자 '인간 관계와 상황 속의 행동/반응을 통해 가치 전하(Value Charge)가 긍정에서 부정으로, 또는 부정에서 긍정으로 바뀌는 최소 단위'로 정의.
relevance: 마이크로 스토리 블록이 관객의 몰입을 유지하기 위해 반드시 인물의 감정 및 가치 상태 전이(Emotional/Judgmental Shift)를 포함해야 함을 증명하는 핵심 서사 이론.
