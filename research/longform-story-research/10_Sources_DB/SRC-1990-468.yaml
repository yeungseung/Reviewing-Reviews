id: SRC-1990-468
author: Mihaly Csikszentmihalyi
year: 1990
title: 'Flow: The Psychology of Optimal Experience'
venue: Harper & Row
tier: 1
citation_count: 48900
url: https://www.harpercollins.com/products/flow-mihaly-csikszentmihalyi
key_contribution: 몰입(Flow) 심리학과 최적 경험 모델. 도전과 기술이 극한으로 교차하는 상황에서 자아의식이 소거되고 활동과 의식이 하나가 되는 초집중 상태 규명. 스포츠 서사에서 승부처(Clutch situation)의 피크가 단순한 점수 획득이 아니라, 신체적 고통, 부상 위험(Risk), 팀을 위한 자기희생(Sacrifice) 속에서 자아를 던지는 몰입의 정점에서 폭발함을 실증.
relevance: 스포츠 및 액션/도전 서사에서 피크가 리스크 감수 및 자기희생(Risk/Sacrifice)으로 작동하는 심리학적 근거.
themes:
  - '#49 Theme 2'
