id: SRC-2012-563
author: Robert F. Potter & Paul D. Bolls
year: 2012
title: 'Psychophysiological Measurement and Meaning: Cognitive and Emotional Processing
  of Media'
venue: Routledge, New York, pp. 88-142
tier: 1
citation_count: 610
url: https://doi.org/10.4324/9780203874318
key_contribution: 미디어 수용자의 정신생리학적 반응(뇌파 알파파 억제, 피부 전도 반응, 근전도) 분석. MTV 스타일의 고속 컷 편집은
  초기 15~30초간 강력한 각성(Arousal)을 유도하지만, 60초 이상 지속될 경우 신경학적 습관화(Habituation) 및 시각 피로(Visual
  Fatigue)를 촉발하여 주의 몰입이 급격히 냉각됨을 입증.
relevance: 고속 편집 시퀀스의 지속 시간 상한선(Fatigue Ceiling) 및 템포 완급 조절(Pacing Oscillation)의 생리적
  필요성을 입증하는 핵심 근거.
themes:
- '#57 Theme 2'
