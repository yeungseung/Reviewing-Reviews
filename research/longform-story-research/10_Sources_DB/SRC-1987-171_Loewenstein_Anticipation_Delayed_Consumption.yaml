credibility_assessment:
  credibility_tier: "Tier 1 Behavioral Economics & Intertemporal Choice"
  methodology:
    study_type: "Mathematical Economic Modeling & Empirical Preference Experiments"
    sample_size: "Multiple experimental choice protocols on delayed positive and negative outcomes"
    target_population: "시간 간 선택 및 미래 사건에 대한 인간의 정서적 기대 체계"
    relationship_type: "Causal and Intertemporal Dynamic"
    effect_size: "기대 기간(Anticipation Time)이 적정할 때 맛보기(Savoring) 가치 극대화, 과도한 지연 시 고통(Dread/Frustration)으로 반전"
    replicated: "Highly Replicated (시간 간 선택 및 기대 효용 이론의 최고 고전, 1,800+ 피인용)"
    limitations: "경제적 보상 실험 중심이나 서사 내 약속된 해답(Payoff)의 지연 시간에 보편 적용됨"

claims_and_evidence:
  core_claim: "인간은 미래의 보상을 기다리는 동안 그 결과를 미리 맛보는 '기대 효용(Savoring / Anticipation Utility)'을 경험한다. 그러나 이 보상 지연이 임계 시간을 초과하거나, 지연에 대한 신뢰할 수 있는 진행 단서 없이 약올리기(Endless Teasing)만 반복되면, 기대 효용은 즉시 '두려움과 좌절(Dread & Frustration)'로 반전된다. 따라서 롱폼 서사에서 거대 해답을 유예할 때는 관객이 기대를 즐길 수 있는 '적정 지연 허용치(Delay Tolerance Window)'를 지켜야 한다."
  verbatim_quotes:
    - original: "Anticipation allows people to savor future consumption, generating positive utility before the event... However, when delayed indefinitely without intermediate resolution, anticipation curdles into frustration and cognitive dread."
      translation: "기대감은 사람들로 하여금 미래의 소비를 음미할 수 있게 하여 사건 전에 긍정적 효용을 창출한다... 그러나 중간 단계의 해결 없이 무기한 지연되면 기대감은 좌절감과 인지적 고통으로 변질된다."
      citation_location: "The Economic Journal, Vol. 97, p. 666-670"

story_application:
  application_idea: "끝없는 티징(Endless Teasing)과 클릭베이트 피로 방지 공식. '답을 알려줄 듯 말 듯' 애태우는 티징 기법은 최대 1~2회, 5분 이내로 제한해야 함. 3회 이상 답을 질질 끌며 말을 돌리면 관객의 기대감은 '희롱당했다'는 불쾌감과 클릭베이트 피로(Clickbait Fatigue)로 반전되어 이탈하므로, 티징 후에는 반드시 실질적인 부분 해답을 지급해야 함."
  narrative_stage: "Teaser-Payoff Balancing & Anti-Clickbait Pacing"
  emotional_mechanics:
    trigger: "보상 예고를 통한 긍정적 기대감(Savoring) 점화"
    build_up: "적정 지연 시간 동안 증폭되는 궁금증과 설렘"
    peak: "임계 도달 직전 약속된 해답의 정직한 지급(Payoff Delivery)"
    release: "기대 충족과 함께 형성되는 작가에 대한 높은 신뢰도"
  failure_modes: "답을 줄 것처럼 10분 내내 바람만 잡다가 결국 아무것도 알려주지 않는 '악성 클릭베이트 티징'"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "티징 기간 동안 관객에게 실질적인 인과적 단서가 지속적으로 공급되어야 함"
