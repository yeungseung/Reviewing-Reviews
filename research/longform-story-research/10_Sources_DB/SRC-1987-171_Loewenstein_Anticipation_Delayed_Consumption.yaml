  title: "Anticipation and the valuation of delayed consumption"
  authors:
    - "Loewenstein, George F. (Carnegie Mellon University)"
  institution: "Carnegie Mellon University"
  published_date: "1987-09-01"
  source_url: "https://doi.org/10.2307/2232929"
