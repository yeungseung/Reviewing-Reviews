claims_and_evidence:
  core_claim: "인간적 흥미 프레임(Human Interest Frame)은 복잡한 제도나 시스템 문제를 개인의 사적 감정과 일화로 환원하여 수용자의 즉각적인 감정 반응을 유발하지만, 거시적이고 구조적인 원인에 대한 인과적 이해를 심각하게 가리고 왜곡한다."
  verbatim_quotes:
    - original: "The human interest frame brings a human face or an emotional angle to the presentation of an event, issue, or problem. While it personalizes and dramatizes information, it often obscures broader systemic issues and institutional responsibility."
      translation: "인간적 흥미 프레임은 사건, 이슈, 문제의 제시에 인간의 얼굴이나 감정적 각도를 부여한다. 정보를 개인화하고 드라마화하지만, 종종 더 광범위한 시스템적 이슈와 제도적 책임을 은폐한다."
      citation_location: "pp.95-96"

story_application:
  application_idea: "거시경제, 환경, 기술, 제도 등 시스템 문제를 다룰 때 특정 개인의 불행이나 영웅담에만 매몰되면 시스템의 본질적 인과 구조를 놓치므로, 개인 일화는 시스템의 증상으로만 짧게 제시하고 본체인 '구조적 메커니즘'으로 빠르게 전환해야 함."
  narrative_stage: "Systemic Problem Framing & Investigative Structure"
  emotional_mechanics:
    trigger: "개인적 일화(인간적 얼굴)를 통한 초기 공감 확보"
    build_up: "그 문제가 개인의 일탈이 아닌 거대한 시스템의 필연적 결과임을 폭로"
    peak: "시스템의 결함과 제도적 인과 사슬의 명쾌한 규명"
    release: "단순한 동정을 넘어선 사회적·구조적 각성"
  failure_modes: "시스템 문제를 개인의 악행이나 불운으로만 환원하면 본질적인 해결책과 구조적 인과성을 완전히 상실함"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "사회, 경제, 과학, 정책 등 거시적 시스템을 다루는 모든 롱폼 다큐 및 탐사보도에 적용"
