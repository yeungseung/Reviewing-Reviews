claims_and_evidence:
  core_claim: "적응 수준 이론(Adaptation-Level Theory): 유기체는 자신이 노출된 자극들의 가중 평균치로 내적인 중립 기준선(Adaptation Level, AL)을 형성한다. 자극의 주관적으로 지각된 강도(Perceived Intensity)는 자극의 절대적 물리량이 아니라, 이 기준선과의 상대적 편차(Discrepancy from AL)에 의해 결정된다. 선행하는 저점(Valley)을 통해 기준선을 의도적으로 낮추어 놓으면(Baseline Shift), 후속 피크는 실제 크기보다 훨씬 거대하게 증폭 지각된다."
  verbatim_quotes:
    - original: "The organism pool all incoming stimulation to establish an internal standard or adaptation level... perceived magnitude of any stimulus is proportional to its distance from this neutral adaptation point."
      translation: "유기체는 모든 유입 자극을 통합하여 내적 기준 또는 적응 수준을 수립한다... 어떤 자극의 지각된 크기는 이 중립적 적응점으로부터의 거리에 비례한다."
      citation_location: "pp. 58-65"

story_application:
  application_idea: "기준선 강하를 통한 피크 증폭: 클라이맥스 피크를 화려하게 만들기 전에, 주인공의 환경을 극단적으로 침묵시키고 결핍 상태로 몰아넣어 관객의 기준선(AL)을 바닥으로 떨어뜨려야 함. 낮아진 기준선 덕분에 작은 반전이나 소리 하나만으로도 관객의 뇌리는 폭발적 충격을 받음."
  narrative_stage: "Pre-Climax Valley & All Hope is Lost Beat"
  emotional_mechanics:
    trigger: "자원 박탈 및 침묵 연출을 통한 자극량 급감"
    build_up: "낮아진 내적 적응 기준선(Negative Baseline Shift)"
    peak: "새로운 탈출 단서나 반격 개시(극단적 상대 편차 발생)"
    release: "거대한 주관적 낙차에 의한 카타르시스 폭발"
  failure_modes: "기준선을 낮추지 않은 채 고각성 상태에서 피크를 터뜨려 '자극 동화(Assimilation)'와 무감각을 부르는 실패"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "스릴러, 공포, 드라마, 액션 등 감정의 낙차를 활용하는 모든 서사"
