id: SRC-2009-367
author: Frenk van Harreveld, Joop van der Pligt, & Nanne K. de Vries
year: 2009
title: 'The ambivalence-induced discomfort model'
venue: Advances in Experimental Social Psychology (or British Journal of Social Psychology)
tier: 1
citation_count: 580
url: https://doi.org/10.1111/j.2044-8309.2009.tb00005.x
key_contribution: 양가감정 유발 불편감 모델(Ambivalence-Induced Discomfort Model)을 통해 양가감정이 단순 인지를 넘어 신체적 각성(Arousal)과 심리적 불쾌(Discomfort)를 유발함을 입증. 특히 결정을 내려야 하는 선택 상황(Choice Context)에 직면할 때 내적 긴장이 극대화되어 이를 해소하기 위한 심층적 인지 정교화(Deliberation)와 균형 잡힌 양면 정보 탐색(Systematic Information Seeking)을 강제함을 규명.
relevance: 인물이 갈등 상황에서 편향을 버리고 심층적 탐색 퀘스트에 뛰어들도록 만드는 내적 동기 유발 및 균형 정보탐색 프로토콜(BIP)의 이론적 근거.
themes:
- '#41 Theme 1'
