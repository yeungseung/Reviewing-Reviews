key_contribution: 사회 정체성 이론(Social Identity Theory)을 정초. 인간은 내집단 범주화와 외집단 비교를 통해 자존감을 유지하려 하며, 정체성이 인위적으로 조작될 때 극심한 갈등과 배타성이 발생함을 규명.
relevance: 서사에서 특정 세대나 집단의 정체성을 자극하여 억지 가치 일체화(Identity Manipulation)를 시도할 때 초래되는 집단 양극화와 도덕적 거부감의 학술 토대.
