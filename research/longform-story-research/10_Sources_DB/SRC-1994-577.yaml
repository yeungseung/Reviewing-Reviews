key_contribution: 원초적 감정 전염(Primitive Emotional Contagion) 이론 정립. 인간은 타인의 표정, 음성, 몸짓을 지각할 때 자동적·무의식적으로 신체적 모방(Afferent Facial Mimicry)을 일으키며, 이 안면 피드백(Facial Feedback)을 통해 타인의 감정을 자신의 뇌 내면에서 동일하게 경험함을 규명. 영상에서 등장인물의 얼굴 반응(Facial Reaction) 샷이 관객의 감정적 수렴과 공감의 직접적 촉매제로 작동함을 신경생리학적으로 실증.
relevance: 팩트나 사건 자체보다 인물의 얼굴 반응(Facial Reaction) 클로즈업 샷이 관객의 감정적 동기화를 격발하는 핵심 서사 기제임을 입증하는 근거.
themes:
