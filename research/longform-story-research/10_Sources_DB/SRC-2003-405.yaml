id: SRC-2003-405
author: Yaacov Trope & Nira Liberman
year: 2003
title: 'Temporal Construal'
venue: Psychological Review
tier: 1
citation_count: 4900
url: https://doi.org/10.1037/0033-295X.110.3.403
key_contribution: 해석 수준 이론(Construal Level Theory, CLT)을 집대성. 심리적 거리감(시간·공간·사회적 거리)이 멀수록 추상적이고 본질적인 고차 해석(High-level Construal)을 활성화하며, 가까울수록 구체적이고 맥락 의존적인 저차 해석(Low-level Construal)이 작동함을 실증.
relevance: 낯선 이국적 소재(Exotic Distance)가 자극하는 거시적 매력과 경외감을 살리면서도, 구체적 디테일과의 교차(CLT Toggle)를 통해 관객의 지속적 자아 몰입을 유도하는 기전의 핵심 근거.
themes:
  - '#44 Theme 1'
