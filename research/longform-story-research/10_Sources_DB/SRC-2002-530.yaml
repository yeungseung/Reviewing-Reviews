key_contribution: "확장 정교화 가능성 모델(Extended Elaboration Likelihood Model, E-ELM) 정립. 엔터테인먼트-교육(E-E) 및 서사 설득에서 관객이 감정적으로 서사에 몰입(Absorption/Transportation)될 때 반박 논증(Counterarguing)이 억제되고 정보 수용성이 극대화됨을 실증."
relevance: "옹호(Advocacy), 브랜드 스토리, 에듀테인먼트 장르에서 감정 우선(Emotion-first)과 60:40의 감정 우위 비율이 왜 저항을 낮추고 설득 효과를 극대화하는지 설명하는 핵심 이론."
