key_contribution: 단순 노출 효과(Mere Exposure Effect)를 최초로 체계화. 자극에 대한 반복 노출만으로도 인지적 판단 없이 친숙함(Familiarity)과 긍정적 호감이 형성됨을 실증.
relevance: 서사 도입부에서 시청자에게 익숙한 환경이나 사물을 제시하여 주의 진입 장벽을 낮추고 Level 1 친숙성 관여도를 점화하는 이론적 토대.
