id: SRC-2012-583
author: Eryn J. Newman, Maryanne Garry, Daniel M. Bernstein, & D. Stephen Lindsay
year: 2012
title: 'Nonprobative Photographs (or Words) Inflame Truthiness'
venue: Psychonomic Bulletin & Review, 19(5), pp. 969-974
tier: 1
citation_count: 520
url: https://doi.org/10.3758/s13423-012-0292-0
key_contribution: 비입증성 사진(Nonprobative Photo)과 시각적 B-roll이 유발하는 트루시니스(Truthiness) 편향의 신경인지적 실증. 주장과 논리적 증거 관계가 없는 관련 스톡 사진이 함께 제시되는 것만으로도 관객의 뇌는 인지적 처리 유창성(Cognitive Fluency)을 느끼며 거짓 진술을 사실로 믿는 확률이 +28% 증가함. 반대로 시각 자료의 사실적 결함이 발각되는 순간 배신감과 불신이 폭증함을 규명.
relevance: 무분별한 스톡 B-roll 사용의 위험성을 경고하고 실제 사료와 장식용 B-roll의 명확한 출처 라벨링(VPA-M)을 요구하는 학술적 근거.
themes:
- '#59 Theme 1'
