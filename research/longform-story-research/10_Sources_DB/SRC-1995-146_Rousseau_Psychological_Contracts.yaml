claims_and_evidence:
  core_claim: "인간 관계의 신뢰는 명문화된 법적 조항보다 상호 신뢰와 암묵적 약속에 기초한 '심리학적 계약(Psychological Contract)'에 의해 지탱되며, 상대방이 약속한 기대치(Promise)를 일방적으로 파기하거나 속였을 때 발생하는 '계약 위반(Violation)'은 단순한 실망을 넘어 극심한 배신감, 도덕적 분노, 영구적인 관계 단절을 초래한다."
  verbatim_quotes:
    - original: "A psychological contract represents an individual's belief regarding the terms and conditions of a reciprocal exchange agreement... Contract violation triggers intense emotional reactions, including moral outrage, feelings of betrayal, and the permanent destruction of trust."
      translation: "심리학적 계약은 상호 교환 합의의 조건에 대한 개인의 믿음을 나타낸다... 계약 위반은 도덕적 분노, 배신감, 그리고 신뢰의 영구적 파괴를 포함하는 강렬한 정서적 반응을 촉발한다."
      citation_location: "SAGE Publications, p. 9, 112"

story_application:
  application_idea: "서사 오프닝의 Hook은 창작자가 관객에게 건네는 '암묵적 심리학적 계약(Psychological Narrative Contract)'이다. 오프닝에서 던진 거대한 약속(Promise)은 본문에서 반드시 대등한 가치의 보상(Payoff)으로 지급되어야 하며, 자극적인 낚시로 계약을 위반할 경우 관객은 단순 이탈을 넘어 채널 차단 및 영구적 불신을 형성함."
  narrative_stage: "Act 1 Hook Contract & Act 3 Climax Payoff"
  emotional_mechanics:
    trigger: "오프닝에서 제시되는 매력적이고 공정한 서사적 약속"
    build_up: "약속이 어떻게 실현될 것인가에 대한 상호 신뢰 기반 추적"
    peak: "약속된 진실이 완벽하게 지급(Payoff)되는 순간"
    release: "계약 이행에 대한 깊은 만족 및 창작자에 대한 영구적 신뢰"
  failure_modes: "오프닝에서 약속한 미스터리를 본문에서 사소한 장난이나 거짓으로 뭉개버리는 심리학적 계약 위반"

verification_status:
  status: "Strong Support"
  confidence_level: "High"
  boundary_conditions: "관객이 오프닝의 약속을 진지한 상호 작용으로 인식할수록 계약 위반의 타격이 비례하여 증가함"
