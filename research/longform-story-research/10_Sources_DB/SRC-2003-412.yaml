key_contribution: 확률 무시(Probability Neglect) 이론을 정립. 미디어가 극단적인 최악의 시나리오(Worst Case)를 자극할 때 대중은 객관적 확률을 무시하고 과도한 공포에 빠지지만, 반복된 과장은 결국 피로와 냉소(Cynicism)로 귀결됨을 실증.
relevance: 관련성을 조작하기 위해 발생 가능성이 희박한 개인적 파멸이나 위협을 부풀리는 공포 기반 결과 과장(Fear-based Consequence Inflation)의 역효과 규명.
