key_contribution: 신형식주의(Neoformalism) 영화 분석과 서사적 잉여(Narrative Excess) 개념 정립. 서사적 동기화(Narrative Motivation)와 인과적 필연성이 결여된 채 시각적 볼거리와 거대 폭발만을 나열하는 스펙터클은 이야기의 의미를 파괴하고 관객의 능동적 서사 해석을 마비시키는 '과잉 잉여'로 전락함을 영화학적으로 규명.
relevance: 의미 없는 시각적 스펙터클(Spectacle vs Significance) 남발로 인한 서사적 피크 붕괴를 방어하는 이론적 토대.
