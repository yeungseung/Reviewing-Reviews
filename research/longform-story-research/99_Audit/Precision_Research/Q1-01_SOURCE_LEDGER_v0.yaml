negative_or_boundary_findings:
  - "No source located supports a universal one-dimensional truth score across scientific, journalistic, legal, qualitative, review, and forecast evidence."
  - "Primary/secondary terminology is domain-dependent and should not be used alone as a strength rating."
  - "Legal admissibility concepts are useful comparisons but are not direct scientific evidence-quality rules."
  - "GRADE/CERQual are domain-specific confidence systems, not universal Story Engine scoring formulas."
  - "Online reviews/comments may be valid evidence of individual experience or discourse but do not automatically support population prevalence."
